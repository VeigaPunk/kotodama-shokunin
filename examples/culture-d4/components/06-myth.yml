component: 06-myth
culture: D4
canon: not canonized (D4 design drill)
title: "06-myth — the powers of the kept fire: five powers, one ancestor, and three narratives"
status: "round-17 component write, 2026-10-18; supersede-by-new-file only"
packet_keys: [pantheon, roles, motifs, narratives]
scope: >
  Five powers (PAN-01..PAN-05), one human ancestor figure (PAN-06), six
  functional roles, four motifs, and three narratives. Coverage is functional
  (the kept fire, the household hearth, the messenger, the seam, the residue,
  the first work) with deliberate blank slots, not archetype completion.
  Attributed sayings and oath formulas belong to the register component and are
  not written here.
spine_coupling: "fire — every power is a state or agent of the furnace: the kept fire, the hearth, the seam's heat, the residue after the quench; the narratives turn on heat states (the first cast, the cold hearth). mark — the powers attest rather than command: the mold-mark is the truth-mark, and the false stamp is the culture's cardinal sin"
spine_check: "no D1 or D2 imagery is imported. No wind-law, storm institution, or breath-soul carriage (D2B-02): smoke rises and carries news, but it is not a law and not a soul-carrier. No river, no binding, no knot. No ascent/descent cosmology: the powers live in the furnace, the seam, and the ash, not on a world-axis."

follows:
  - {id: F-1, path: "corpus/knowledge/myth-symbol/pantheon-archetypes.md", section: "§1 functional map, §7 build protocol", use: "roles are covered functionally; no archetype is completed for its own sake"}
  - {id: F-2, path: "corpus/knowledge/verification/myth-consistency-gate.md", section: "§2 minimum review packet, §3 role coverage", use: "record shapes for pantheon, role, and narrative records; role coverage, not archetype completion"}
  - {id: F-3, path: "corpus/knowledge/myth-symbol/myth-ritual-theories.md", section: "§2 the myth-ritual relationship is not a law", use: "narratives and rites are coupled by declared edges, not by a claimed necessity"}
  - {id: F-4, path: "corpus/knowledge/myth-symbol/creation-myths-taxonomy.md", section: "§2 origin types are a toolkit", use: "the first-cast narrative is an origin of a technique, not of the world"}
  - {id: F-5, path: "corpus/knowledge/myth-symbol/motif-index-usage.md", section: "§1 motif as an index, not a meaning key", use: "motifs are indexed by id and used across narratives; no motif carries a fixed meaning"}

pantheon:
  - {id: PAN-01, name: haitir, role: "the kept fire", domain: "the furnace and the charge; the fire that is tended, not the fire that spreads", era: E0, axis: fire, evidence: design-choice, follows: [F-1]}
  - {id: PAN-02, name: kalmam, role: "the hearth-mother", domain: "the household hearth and the lineage's continuity; the fire that is inherited", era: E0, axis: fire, evidence: design-choice, follows: [F-1]}
  - {id: PAN-03, name: humwer, role: "the messenger", domain: "smoke and news of the work; what the furnace sends up is read at the ridge", era: E0, axis: both, evidence: design-choice, follows: [F-1]}
  - {id: PAN-04, name: rektir, role: "the seam's power", domain: "the ore seam and the underground heat; what is taken, not given", era: E0, axis: fire, evidence: design-choice, follows: [F-1]}
  - {id: PAN-05, name: sumten, role: "the shade-keeper", domain: "the residue after the quench and the dead of the lineage; the shade rite", era: E0, axis: fire, evidence: design-choice, follows: [F-1]}
  - {id: PAN-06, name: kaltum, role: "the first smith (human ancestor figure)", domain: "the first cast and the first mark; a remembered craft ancestor, not a power", era: E0, axis: mark, evidence: design-choice, follows: [F-4]}

roles:
  - {id: ROL-01, role: "the kept fire", holder: PAN-01, covers: "tending, the charge, the furnace's continuity", era: E0, axis: fire, evidence: design-choice}
  - {id: ROL-02, role: "the inherited hearth", holder: PAN-02, covers: "household fire, lineage continuity, the hearth-mother's turn", era: E0, axis: fire, evidence: design-choice}
  - {id: ROL-03, role: "the reading of smoke", holder: PAN-03, covers: "news of the work, the ridge reading, the messenger's ambiguity", era: E0, axis: both, evidence: design-choice}
  - {id: ROL-04, role: "the taking of ore", holder: PAN-04, covers: "the seam, the underground, the debt of what is taken", era: E0, axis: fire, evidence: design-choice}
  - {id: ROL-05, role: "the residue and the dead", holder: PAN-05, covers: "ash, the quench's end, the lineage's dead", era: E0, axis: fire, evidence: design-choice}
  - {id: ROL-06, role: "the first work", holder: PAN-06, covers: "the first cast, the first mark, the craft's origin story", era: E0, axis: mark, evidence: design-choice}

motifs:
  - {id: MOT-01, motif: "the unquenched mark", gloss: "a work finished without its mark; the record cannot attest it", narratives: [MYTH-02], axis: mark, evidence: design-choice}
  - {id: MOT-02, motif: "the reworked charge", gloss: "scrap returns to the furnace; the same metal is cast twice", narratives: [MYTH-01], axis: fire, evidence: design-choice}
  - {id: MOT-03, motif: "the cold hearth", gloss: "the fallow season and the dead; the fire is banked, not extinguished", narratives: [MYTH-03], axis: fire, evidence: design-choice}
  - {id: MOT-04, motif: "the false stamp", gloss: "a mark that attests what was not made; the cardinal fraud", narratives: [MYTH-02], axis: mark, evidence: design-choice}

narratives:
  - id: MYTH-01
    title: "The First Cast"
    era: E0
    axis: fire
    evidence: design-choice
    summary: >
      The ancestor Kaltum (PAN-06) is remembered as the first to hold a charge
      in a clay cup at the kept fire and to pour it into a mold. The narrative
      does not explain where fire came from: the kept fire is assumed, tended by
      Haitir (PAN-01). What the story establishes is the technique's origin and
      the first mark: Kaltum stamped the cooled ingot so the work would be
      known as his, and the mark has meant attestation since.
    roles: [ROL-01, ROL-06]
    motifs: [MOT-02]
    follows: [F-4]
  - id: MYTH-02
    title: "The Mark That Lied"
    era: E0
    axis: mark
    evidence: design-choice
    summary: >
      A caster stamps an ingot he did not pour. The false mark is discovered at
      the weigh-stone when the metal's grain does not match the stamp-holder's
      work, and the council's fine follows; but the narrative's end is not the
      fine: the ingot is returned to the furnace (MOT-02) and recast, and the
      caster's own hand stamps the second cast. The story's institution is the
      refusal: the stamp-house will not mark what it cannot attest.
    roles: [ROL-03, ROL-06]
    motifs: [MOT-01, MOT-04]
    follows: [F-5]
  - id: MYTH-03
    title: "The Fallow"
    era: E0
    axis: fire
    evidence: design-choice
    summary: >
      In the cold season the fire is banked, not put out. The narrative follows
      the shade-keeper Sumten (PAN-05) through the fallow: the ash of the year's
      casts is gathered, the lineage's dead are named at the banked hearth, and
      the first turn of the new season relights from the banked coals. The story
      states the culture's continuity claim — the fire is inherited, not
      reinvented — and gives the ash its double sense (waste and residue of the
      dead).
    roles: [ROL-02, ROL-05]
    motifs: [MOT-03]
    follows: [F-3]

deliberate_blanks:
  - {id: BL-01, blank: "no power of the salt road or the foreign trade", reason: "the loan layers are institutions of exchange, not divine agents; deifying them would import a donor religion (CP-08)"}
  - {id: BL-02, blank: "no cosmological world-axis and no creation of the world", reason: "the powers are agents of the furnace and the seam; a world-origin narrative would import a cosmology the spine does not carry"}
  - {id: BL-03, blank: "no pantheon genealogy", reason: "the powers are not a family; lineage belongs to the hearth (PAN-02), not to the divine"}

open_questions:
  - {id: OQ-M1, text: "Whether the messenger's ambiguity (true news vs misread smoke) is institutionalized in a divination practice is left open (to-verify)."}
  - {id: OQ-M2, text: "The ancestor Kaltum's era is E0 by convention; no dated record of the first cast exists (to-verify)."}

calibration:
  - {id: CAL-M1, status: design-choice, note: "the powers are invented agents of an invented craft cosmology; no real religion, deity, or practice is described or compared"}
  - {id: CAL-M2, status: to-verify, note: "no comparative religion claim is made; corpus entries are used as design toolkits only"}

