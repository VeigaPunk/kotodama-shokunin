component: 07-symbolism
culture: D4
canon: not canonized (D4 design drill)
title: "07-symbolism — the mark and the heat: eight signs with medium, audience, holder, and era"
status: "round-17 component write, 2026-10-18; supersede-by-new-file only"
packet_keys: [symbols]
scope: >
  Eight delivered signs (SYM-01..SYM-08): the mold-mark, the kept flame, the
  smoke column, the quench steam, the ash heap, the ingot stack, the bellows,
  and the furnace gate. Every sign carries its medium, audience, authorized
  holder, era, and register, so the myth-consistency gate can read the full key.
spine_coupling: "mark — the mold-mark is the culture's master sign, and the stamp-belt, shoulder stamp and maker's mark are its licensed carriers. fire — the heat signs (flame, smoke, steam, ash, gate) are states of the furnace, read at different distances and by different audiences"
spine_check: "no D1 or D2 imagery is imported. No knot, cord, or tally-cord appears as a sign (RG-01); no river, no wind-law, no ascent/descent sign. The smoke column is a messenger sign, never a law and never a soul-carrier."

follows:
  - {id: F-1, path: "corpus/knowledge/synthesis/symbolism-consistency-rules.md", section: "§3 lookup key, §4 invariants, §5 licensed transformations, §7 drift", use: "each sign names medium, audience, authorized holder and date; era drift is a dated reinterpretation record"}
  - {id: F-2, path: "corpus/knowledge/verification/myth-consistency-gate.md", section: "§2 minimum review packet", use: "form + medium + era + register + audience keys on every symbol record"}
  - {id: F-3, path: "corpus/knowledge/myth-symbol/symbolism-synthesis-method.md", section: "§2 context key, not universal dictionary", use: "no sign carries a fixed meaning independent of its medium and audience"}
  - {id: F-4, path: "corpus/knowledge/culture-material/craft-artisan-lexicon.md", section: "§6 signatures and maker's marks", use: "the maker's-mark register is distinct from the text register (03's WR-07)"}

symbols:
  - {id: SYM-01, sign: "the mold-mark", form: "a stamped impression from the mold's own geometry, one per cast", medium: "stamped into the mold face; transferred to the cooled metal", audience: "the stamp-house, the weigh-stone, the council", holder: "the licensed stamp-holder of the furnace", era: E0, register: "craft and law", axis: mark, evidence: design-choice, follows: [F-1, F-4]}
  - {id: SYM-02, sign: "the kept flame", form: "the banked fire's visible flame at the furnace mouth", medium: "live fire, visible at night from the ridge", audience: "the town and any traveler", holder: "the furnace-master on duty", era: E0, register: "public", axis: fire, evidence: design-choice, follows: [F-1]}
  - {id: SYM-03, sign: "the smoke column", form: "the direction and density of the column above the furnace", medium: "smoke, read at distance", audience: "herders and travelers on the ridge; the messenger reading", holder: "the furnace-master (the column is read, not sent)", era: E0, register: "public, ambiguous", axis: both, evidence: design-choice, follows: [F-1, F-3]}
  - {id: SYM-04, sign: "the quench steam", form: "the burst of steam when a hot cast enters the trough", medium: "steam at the quench trough", audience: "the forge crew", holder: "the smith at the quench", era: E0, register: "craft, in-ward", axis: fire, evidence: design-choice, follows: [F-1]}
  - {id: SYM-05, sign: "the ash heap", form: "the year's ash gathered at the yard's edge", medium: "ash, kept and later spread on the terraces", audience: "the household and the lineage's dead (the fallow rite)", holder: "the shade-keeper (PAN-05's rite)", era: E0, register: "ritual", axis: fire, evidence: design-choice, follows: [F-1]}
  - {id: SYM-06, sign: "the ingot stack", form: "counted stacks of ingots at the weigh-stone", medium: "stacked metal, counted in fives", audience: "the weigh-stone and the road traders", holder: "the weigh-master", era: E0, register: "trade", axis: mark, evidence: design-choice, follows: [F-1]}
  - {id: SYM-07, sign: "the bellows", form: "the paired bellows and their rhythm", medium: "the bellows themselves; the rhythm is heard before the furnace is seen", audience: "the forge crew; the town at work-hours", holder: "the bellows-tender", era: E0, register: "craft", axis: fire, evidence: design-choice, follows: [F-1]}
  - {id: SYM-08, sign: "the furnace gate", form: "the furnace mouth and its stone lintel", medium: "the built furnace mouth; its shape is the town's stamp ancestor", audience: "the town; the gate is a public mark at the yard's center", holder: "the furnace-master", era: E0, register: "public", axis: fire, evidence: design-choice, follows: [F-1]}

partition:
  - {id: PART-01, note: "signs partition by medium: impressed (SYM-01), live (SYM-02, 04, 07, 08), read-at-distance (SYM-03), kept (SYM-05), counted (SYM-06). No sign crosses two media.", axis: mark, evidence: design-choice}

drift_records:
  - {id: DR-01, sign: SYM-03, era_from: E0, era_to: E2, change: "the smoke column's reading shifts from a work-news convention to a public weather warning; dated to the league charter, not to natural evolution", axis: both, evidence: design-choice, follows: [F-1]}

compositional_rule:
  - {id: CR-S1, rule: "Signs compose only with their own medium: a stamped mark may be added to a stamped mark (the belt's two stamps), and a counted stack may be added to a counted stack; no sign composes with a knot or a cord (RG-01).", axis: mark, evidence: design-choice}

collision_log:
  - {id: CL-S1, check: "no D2 symbol sign is reused (D2's ten signs are storm-slate, wind-rider, gate-of-the-axis and others)", status: pass, check_evidence: "self-sweep of the eight sign names against the D2 symbol list; the furnace gate is not D2's world-axis gate", axis: mark, evidence: design-choice}

open_questions:
  - {id: OQ-S1, text: "Whether the smoke column ever carries an intentional code (a sent message) is left open; the delivered record has it read, not sent (to-verify)."}
  - {id: OQ-S2, text: "No sign is dated before E0; the first-mark tradition's origin is narrative (MYTH-01), not documentary (to-verify)."}

calibration:
