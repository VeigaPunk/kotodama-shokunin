# reports/round-17/d4/components/04-lexicon.yml
# D4 design drill — component 04 of the round-17 registry.
# NON-CANON: this file proposes a design; it records nothing about any world.
#
# Write seat: R17-D08 (D-components, seat 4 of 12). Round 17, 2026-10-18.
# The `lexicon`, `constructions` and `layers` blocks below are the packet
# blocks the assembler extracts. All delivered forms are lowercase ASCII,
# inventory-legal under 02-phonology.yml, and free of diacritics.
component: 04-lexicon
culture: D4
canon: not canonized (D4 design drill)
title: "04-lexicon — the seven-field lexicon, the craft core, and the two loan layers"
status: "round-17 component write, 2026-10-18; supersede-by-new-file only"
packet_keys: [lexicon, constructions, layers, morphology, registers]
scope: >
  One declared language-stage set: the D4 basin speech across the contract's tag
  space E0-E2 (E3 unoccupied). Dialect and register variation is out of scope.
  The lexicon carries 44 underived roots, four derived or compound records, and
  six borrowed records in two declared layers; garment form slots (LEX-GAR-01..06)
  are deliberately left unfilled by 09-costumes and are NOT lexemes here.
spine_coupling: "fire — the craft core is the densest field: kal, rek, mol, sam, kur, wik, mes, hai, hum and their derived families carry the furnace; the quench, the charge and the slag are named processes, and the calendar's terms are heat terms. mark — tik and its family (tikmes, tiksam) carry the attestation institution; measures (gul), prices (wad) and oaths (gis) are mark-domain words, and the loan layers enter exactly through trade and craft registers"
spine_check: "no D1 or D2 imagery is imported. No river/bank/flood word, no tying/binding/knot word, no vertical-axis or wind-law word appears in any record. D2B-03 sweep: no delivered form equals a D2 fixture form (bel, tol, su, hur, wal, ban, las, mir, kol, sin, sara, nel, hursu, sunel, banwal, sulas, mirlas, kolsin, tolmir, belwal are absent)."
era_usage: "records use contract tags E0-E2 only; E3 is not touched. Era names and dates are 08-eras's and are not asserted here."

follows:
  - id: F-1
    path: corpus/knowledge/linguistics/semantic-fields-lexicon-building.md
    section: "§3 field engineering, §4 the seven field briefs"
    decision_followed: "the seven-field matrix is filled at or above the counting floor; the craft and trade extensions are declared, and the densest fields are the ones the spine names (craft, religion, trade, landscape)"
  - id: F-2
    path: corpus/knowledge/verification/lexicon-coverage-audit.md
    section: "§2 required inputs and counting units, §4 derivational consistency, §6 loan-layer coherence, §7 era staging"
    decision_followed: "every record carries term, gloss, field, route, layer and stage; derived and compound records expose bases and construction so the form replays; borrowed records carry the full borrow ledger"
  - id: F-3
    path: corpus/knowledge/linguistics/language-contact.md
    section: "§4 borrowability, §6 loanword adaptation, §10 stratigraphy"
    decision_followed: "two strata with different donors and different adaptation filters; both are confined to declared registers and domains; no donor religion, costume, or second complete culture enters"
  - id: F-4
    path: corpus/knowledge/synthesis/loanword-material-dating.md
    section: "§2-§4 build loanword strata; date the sense-referent pairing"
    decision_followed: "each loan separates entry_stage from referent_available_from and names its channel; no loan is exotic for texture"
  - id: F-5
    path: corpus/knowledge/culture-material/craft-artisan-lexicon.md
    section: "§2 tool names and their literal senses"
    decision_followed: "craft terms carry literal senses (kur is the anvil block, wik is the bellows pair, mol is the cast form) and the agent construction names the worker from the material, not from an office"
  - id: F-6
    path: corpus/knowledge/culture-material/trade-economy-lexicon.md
    section: "§2 weights and measures, §7 contract and debt vocabulary"
    decision_followed: "measure and price vocabulary is thin and borrowed where the trade is borrowed; the native measure words are the count-stamps of 03-orthography"
  - id: F-7
    path: corpus/knowledge/linguistics/phonetics-phonology.md
    section: "§3 phonotactics, §5 allophony"
    decision_followed: "every form respects (C)V(V)(C), the coda set {n m s k}, and the no-cluster rule; no form contains intervocalic h (SC-2) or intervocalic p (SC-1)"

constructions:
  - id: CX-01
    name: STACK-COMPOUND
    pattern: "B1-B2"
    base_classes: [noun]
    output_class: noun
    description: "modifier root before head root, concatenated without deletion; the script writes the seam mark, the romanization does not"
    productivity: "open; the compound is legal only if its seam creates no consonant cluster"
    base_eligibility: native-only
    available_from: E0
    axis: mark
    evidence: design-choice
    follows: [F-2]
  - id: CX-02
    name: CRAFT-AGENT
    pattern: "B1-ar"
    base_classes: [noun]
    output_class: noun
    description: "worker named from the material or tool: mes → mesar (metal-worker), kal → kalar (hearth-keeper)"
    productivity: "semi-productive; the league's guild ladder names only the licensed trades"
    base_eligibility: native-only
    available_from: E0
    axis: fire
    evidence: design-choice
    follows: [F-5]
  - id: CX-03
    name: ATTRIBUTIVE
    pattern: "B1-en"
    base_classes: [noun]
    output_class: "noun (attributive)"
    description: "of-the-X: kal → kalen (of the hearth); used in epithets and place compounds"
    productivity: "productive in naming and epithets only"
    base_eligibility: native-only
    available_from: E0
    axis: fire
    evidence: design-choice
    follows: [F-2]
  # The two register constructions (R26-D03 rules.md RU-4: new ids, no CX rule
  # overloaded). They carry `operation:` and NO `pattern`: the register
  # operations are computed (character reversal, vowel lengthening), not
  # concatenations, so a `pattern`/`B1` template would be a lie and the
  # concatenation replayer would read a correct reversal as a defect
  # (reports/round-25/argot/delta.md section 3).
  - id: STAMP-REVERSE
    name: STAMP-REVERSE
    operation: reverse
    base_classes: [noun]
    output_class: noun
    description: "the register's mark operation: the plain term read back to front (the stamp is the impression of the mold, the word read the other way)."
    productivity: "closed; the register licenses a fixed set of turned forms"
    base_eligibility: native-only
    available_from: E1
    axis: mark
    evidence: design-choice
    follows: [F-2, F-6]
  - id: STAMP-LENGTHEN
    name: STAMP-LENGTHEN
    operation: lengthen
    base_classes: [noun]
    output_class: noun
    description: "the register's fire operation: the stressed root vowel is doubled, because the fire lengthens. Replayed through the LENGTHEN pattern/output pair in morphology.derivation_rules."
    productivity: "closed; the register licenses a fixed set of lengthened forms"
    base_eligibility: native-only
    available_from: E1
    axis: fire
    evidence: design-choice
    follows: [F-2, F-6]

layers:
  - id: LY-01
    name: "Salt-road trade layer"
    donor: "the salt-road towns' speech (unrelated to D4)"
    donor_stage: "salt-road stage 1 (unmodelled; to-verify)"
    entry_stage: E1
    channel: "the salt road, via the measure and salt trade"
    contact_window: [E1, E2]
    substitutions: {sh: s, kh: k, gh: g}
    referent_available_from: E1
    register: trade
    domain: "salt, measures, carriage and bales only — the loan is a trade word, not a religion, a garment, or a second culture"
    axis: mark
    evidence: design-choice
    follows: [F-3, F-4]
  - id: LY-02
    name: "North-road kin layer"
    donor: "the hill sister variety (related to D4; one attested sister, unmodelled)"
    donor_stage: "sister stage E0"
    entry_stage: E0
    channel: "the north ore road, via the ore and charcoal trade"
    contact_window: [E0, E2]
    substitutions: {o: a}
    referent_available_from: E0
    register: craft
    domain: "ore, seams and works only — the kin layer carries no grammar and no script"
    axis: fire
    evidence: design-choice
    follows: [F-3, F-4]

