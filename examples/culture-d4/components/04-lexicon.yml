registers:
  # The register law. A register is a named social/stylistic variety, not a
  # semantic field: `register:` on a lexicon record is the scope, `field:` is
  # the domain. Per SKILL.md's slot-label routing table, a register field never
  # moves a form off the sound-and-identity channel, so the register stratum
  # owes no form slot and adds no hold (reports/round-26/register/impl.md 5).
  - {id: QREG-01, title: "plain", register: plain, class: unmarked, law: "the forge, the household and the road: the unmarked baseline the register is measured against, present from E0. Not a member of the stratum.", axis: neutral, evidence: design-choice, follows: [F-2]}
  - {id: QREG-02, title: "the stamp register", register: stamp, class: marked, law: "the attestation speech: the speech a stamp-holder uses when a spoken word is being made to bind, as against the plain speech of the forge floor. A stamp form is admissible only in a stamp-act slot (a charge at the weigh-stone, an oath attested before the stamp-holder, a lot named as it is sealed). The register owns no segment: a stamp form is inventory-checked exactly as a plain form.", axis: mark, evidence: design-choice, follows: [F-2]}
  - {id: QREG-03, title: "the operation rule", register: stamp, class: marked, operation_rule: "axis mark -> reverse; axis fire -> lengthen", law: "a stamp form is the plain base carried into the register by the operation the base's own axis selects. The rule is total over the two delivered axis values and is not total in effect: 13 of the 54 delivered lexicon records yield an unusable form, so each form is checked individually (reports/round-26/register/review.md section 3).", axis: mark, evidence: design-choice, follows: [F-2]}
  - {id: QREG-04, title: "era", register: stamp, class: marked, era_rule: "a stamp form is available_from E1", law: "the register is the speech of the stamp-house, which 03-orthography dates to E1. A stamp form claimed at E0 is a defect; E3 is reserved and unoccupied by delivered records.", axis: mark, evidence: design-choice, follows: [F-2]}

  # Round-30 amendment, 2026-10-18: the records cited by RGL-01..03.
  # reports/round-30/fixes/qreg-dangles.md records the oath reconciliation.
  - {id: QREG-05, title: "the charge", register: stamp, class: marked, speech_act: charge, speaker: "stamp-holder, furnace-master (RK-03)", force: directive-binding, consequence: "the spoken charge binds the lot's count and the stamp-holder enters the act on the stamp-roll", era_rule: E1, law: "RGL-01 governs the charge at the weigh-stone; the speaker's stamp attests the lot and no new speech permission is created by this record.", axis: mark, evidence: design-choice, follows: [F-2]}
  - {id: QREG-06, title: "the oath exclusion", register: stamp, class: marked, speech_act: oath, speaker: "stamp-holder only — no master, no delegate", force: "commissive-binding refused", consequence: "a stamp oath is void and carries no entry on the stamp-roll; the binding oath is plain speech (L-30 gis)", era_rule: E1, law: "RGL-02 governs: stamp cannot spell the plain oath word gis by its mark-axis reverse rule. The proposed positive oath in round-27 law/rules.md section 2 is not adopted; attestation by the stamp-holder does not make an oath in stamp binding.", axis: mark, evidence: design-choice, follows: [F-2]}
  - {id: QREG-07, title: "the naming of a lot", register: stamp, class: marked, speech_act: name-lot, speaker: "stamp-holder, mold-keeper (OR-02)", force: declarative-naming, consequence: "the lot's name is written on the ingot's tally face", era_rule: E1, law: "RGL-01 governs the naming as the lot is sealed; OR-02's delivered mold-keeper license supplies the office, without adding a rank or a form.", axis: mark, evidence: design-choice, follows: [F-2]}
  - {id: QREG-08, title: "the guest's charge", register: stamp, class: marked, speech_act: guest-charge, speaker: "broker, market-goer (RK-04), at market days", force: "directive-binding, not-rollable", consequence: "the act binds the goods at the gate and the stamp-holder enters it on the stamp-roll under the guest's stamp-name; the guest may not write or read the furnace roll", era_rule: E1, law: "RGL-03 governs the guest asymmetry: the guest speaks under a stamp-name but acquires no furnace-roll literacy or custody right.", axis: mark, evidence: design-choice, follows: [F-2]}

morphology:
  derivation_rules:
    - {id: CX-01, kind: compound, pattern: "^(?P<a>.+)\\+(?P<b>.+)$", output: "{a}{b}", note: "STACK-COMPOUND: modifier root before head root, concatenated without deletion; the plus is analysis only and never part of the delivered spelling"}
    - {id: CX-02, kind: suffix, affix: "-ar", pattern: "^(?P<stem>.+)$", output: "{stem}ar", note: "CRAFT-AGENT: worker named from the material or tool"}
    - {id: CX-03, kind: suffix, affix: "-en", pattern: "^(?P<stem>.+)$", output: "{stem}en", note: "ATTRIBUTIVE: of-the-X; naming and epithets only"}
    - {id: lengthen, kind: "vowel-length", pattern: "^(?P<onset>[^aeiou]*)(?P<vowel>[aeiou])(?P<rest>.*)$", output: "{onset}{vowel}{vowel}{rest}", note: "the register's fire operation: the stressed root vowel is doubled, because the fire lengthens. Stressed position is the root-initial syllable for every delivered root (02 STR-01), so doubling the first nucleus is the one length operation the language can spell."}
  derivation_note: "the three rules replay the four derived or compound records in this file and the eight names in 05-naming; rule ids match the constructions block"
  derivation_ops: [head2, reverse, lengthen]
  derivation_ops_note: "the three register operations. `reverse` and `head2` are computed character/syllable operations (reports/round-17/d4/design-language.md section 5); `lengthen` is declared as the machine-readable LENGTHEN pattern/output pair above. `reverse` is NOT expressible as such a pair (a reversal needs indexing, which the template subset refuses), so it stays computed in tools/gates/argot-derivation-gate.py. `head2` is declared but unused: over the delivered tree it is an identity, not a derivation (reports/round-26/register/review.md section 4)."
  derivation_spelling_note: "a record's `derivation.op` must equal the declared rule id by exact string. The design's own two files spell this operation two ways -- rules.md section 2 states `op = 'lengthen'` while its section 3 registry row gives `id: LENGTHEN` -- and the round-26 execution-1 seat measured that landing the lowercase op against the uppercase id emits six D4L-ARGOT-RULE holds (reports/round-26/register/execution-1.md section 2). This landing resolves the split by declaring the rule id in the lowercase spelling the design's own operation rule uses, so the rule id and every record's `op` agree and the leg replays clean."

