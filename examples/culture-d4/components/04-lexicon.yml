  # ---- the stamp register: register-scoped forms (8) ----
  # The register forms fixed by reports/round-26/register/forms.md section 1
  # (the authoritative table). Each is a delivered plain record carried into
  # `register: stamp` by the declared operation its own axis selects
  # (mark -> reverse, fire -> lengthen; rules.md section 2). Every form is
  # inventory-legal, syllable-legal and collision-free under 02's PHON-01.
  # The relation is machine-readable (`derived_from` + `derivation` +
  # `doublet_of`) and is replayed by tools/gates/argot-derivation-gate.py,
  # never by the concatenation replayer.
  # Record order: the two `reverse` pairs first, then the six `lengthen`
  # pairs. Order is not semantically load-bearing; it is fixed this way so the
  # lane runner's own teeth control -- which takes the FIRST declared pair and
  # writes a fixture carrying only a lexicon block, with no `morphology` -- is
  # exercised against a gate-computed operation. With a `lengthen` pair first,
  # that control cannot reach the derivation arithmetic at all (its fixture
  # declares no rule), so it would report the leg undiscriminating.
