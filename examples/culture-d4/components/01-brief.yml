contract:
  packet_name: "D4 furnace-league drill — round-17 design"
  packet_canon: "not canonized (D4 design drill)"
  era_tags:
    space: [E0, E1, E2, E3]
    rule: "E0 pre-script stamp era; E1 script seam; E2 literate league anchor; E3 reserved and unoccupied by delivered records. Tags are broad stages, not era names; 08-eras owns the names and dates."
  id_namespaces:
    - "L- lexicon records; LA- loan-adaptation rows; CX- constructions; LY- layers"
    - "P- phonology rules; AL- allophony rules; SC- ordered sound changes; W- witnesses"
    - "OR- orthography records; SG- sign records; WR- writing rules; LI- literacy institutions"
    - "NM- names; CC- cross-culture review rows"
    - "PAN- powers; ROL- roles; MOT- motifs; MYTH- narratives; RIT- rites"
    - "SYM- symbols; GAR- garments; CMAT- materials; CS- cloth sources; RK- rank rules"
    - "ER- era records; CAL- calendar units; FES- festivals; HELD- held turns"
    - "CT- contact layers; RT- routes; CE- contact events"
    - "PR- provenance rows; OQ- open questions"
  record_fields:
    universal: [id, axis, evidence, follows]
    lexicon: [id, term, gloss, field, route, bases, construction, layer, stage, register, derived_from, derivation, doublet_of, axis, evidence, follows]
    registers: [id, title, register, class, law, axis, evidence, follows]
    register_law: [id, register, axis, kind, act, speaker, holder, force, consequence, design_row, evidence, follows]
    names: [id, name, type, formation, syllables, license, era, axis, evidence, follows]
    pantheon: [id, name, role, domain, era, axis, evidence, follows]
    symbols: [id, sign, medium, audience, holder, era, register, axis, evidence, follows]
    costumes: [id, garment, form_slot, material, era, wearer_ranks, rite, axis, evidence, follows]
    eras: [id, tag, name, span, institution_seam, language_stage, record_stage, costume_seam, axis, evidence, follows]
  record_fields_amendments:
    - id: R30-QREG-ACTS
      date: "2026-10-18"
      block: registers
      records: [QREG-05, QREG-06, QREG-07, QREG-08]
      additional_fields: [speech_act, speaker, force, consequence, era_rule]
      rule: "These act records carry the base record_fields.registers fields plus additional_fields; QREG-01..04 and the base declaration are unchanged. RGL-01..03 remain the replayed law, and QREG-06 preserves RGL-02's refusal of a binding stamp oath."
      evidence: "reports/round-30/fixes/qreg-dangles.md"
  rules:
    - {id: RG-01, rule: "The mark is an impression, never a knot or a tie: stamp, mold-mark, and count-mark records describe contact-made marks; no record may treat a mark as binding or as a cord."}
    - {id: RG-02, rule: "Every record carries id, axis, evidence, follows. A record without axis is malformed; neutral requires a coupling_note."}
    - {id: RG-03, rule: "Cross-component references use contract ids only; a component never quotes a sibling file's content."}
    - {id: RG-04, rule: "No component coins a form another component owns: lexicon forms are 04's, garment forms are 04's via 09's form_slots, era names are 08's."}
    - {id: RG-05, rule: "Era tags come from E0–E3 only; a component with local era prefixes declares its alias rows, never silently."}
    - {id: RG-06, rule: "Loan records carry the full borrow ledger (layer, donor, donor_form, substitutions, entry_stage, referent_available_from); an incomplete ledger is a hold, never a pass."}
    - {id: RG-07, rule: "Rank claims reference furnace right (RK- records) and the league council; wealth alone never licenses a garment or a stamp."}
    - {id: RG-08, rule: "All forms are lowercase ASCII in the delivered spelling; no diacritics are used, and length is spelled as double vowels (aa ee ii oo uu) or the falling diphthongs ai/au."}
  hold_set_declaration:
    named_at: "2026-10-18, before implementation of the packet (this file, seat R17-D05)"
    artifact: "examples/culture-d4/expected-holds.json (schema kotodama-typed-pipeline-holds-v1)"
    expected_findings:
      - {id: D4L-FORM-UNRESOLVED, severity: hold, where: GAR-01, reason: "label_id LEX-GAR-01 has no supplied native/borrowed form; the garment gloss is a translated label, off-channel"}
      - {id: D4L-FORM-UNRESOLVED, severity: hold, where: GAR-02, reason: "label_id LEX-GAR-02 has no supplied native/borrowed form"}
      - {id: D4L-FORM-UNRESOLVED, severity: hold, where: GAR-03, reason: "label_id LEX-GAR-03 has no supplied native/borrowed form"}
