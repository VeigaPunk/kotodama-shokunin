scope_note: |
  This file registers components and fixes the shared contract only. It writes no
  phonology, script, lexicon, myth, costume, name, or era content of its own; those
  live in the component files named in the registry, each written as its own
  fragment. Cross-component dependencies are expressed by record IDs from the
  contract block, never by quoting a sibling file's contents. No real culture is
  described here: every comparator is a corpus entry inside this repo with its own
  provenance cautions, cited by path and section. Where a claim could not be
  checked in this session it is marked (to-verify) instead of asserted. The
  hold set declared in contract.hold_set_declaration is the round's
  pre-implementation record of the design debt the typed pipeline is expected to
  emit; it is named here before the packet exists, per the round-17 claim D.

