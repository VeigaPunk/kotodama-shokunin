design_problem: |
  Build one small, coherent, spine-legible D4 packet — brief, phonology, script,
  lexicon, myth, symbols, costume, names, eras, calendar, contact, provenance —
  such that: (1) every component is readable as an expression of the declared
  spine, FIRE (transformation: furnace, quench, ash, smoke) plus MARK
  (attestation: stamp, mold-mark, count-mark, name-mark); (2) nothing silently
  imports the D1 fixture's river/binding/aquatic grammar or D2's
  verticality/wind grammar; (3) the lexicon's seven-field matrix and the coupled
  myth/symbol/costume/era records are internally consistent at the record level;
  (4) the assembled packet carries no unresolved executable-gate FAIL, and the
  typed pipeline's finding set equals the hold set named in
  contract.hold_set_declaration — six unresolved garment form slots, zero fails;
  and (5) the whole thing is handoff-ready to lore as explicitly non-canon, with
  open questions named rather than decided. The difficulty is constraint
  propagation, not decoration: the seed decides the spine, the spine decides
  per-component obligations, and the acceptance block below makes each obligation
  checkable. Failure modes this brief exists to prevent: a packet whose
  components each make sense alone but contradict each other; a kiln culture that
  drifts into D1's river imagery or D2's wind-law under pressure; a stress-accent
  language that quietly becomes a tone language; and a stamp-mark script that
  turns into an alphabet with letter IDs.

seed_parameters:
  # Fixed inputs for this drill, restated from the round-17 dispatch seed.
  - {id: SEED-01, text: "Furnace-league culture: towns of smiths on a forested upland basin, working bog-ore with charcoal; terraced valley grain and a small wool flock; the furnace, not the field, is the civic institution."}
  - {id: SEED-02, text: "Fire-and-mark cosmology: fire transforms, the mark attests; the mold-mark is the truth-mark, smoke is the messenger, ash is the residue that outlives the work."}
  - {id: SEED-03, text: "Guild-house society: smith lineages hold furnace rights; the league council seats furnace-masters; rank is furnace right, not wealth alone."}
  - {id: SEED-04, text: "Exchange: ore, charcoal and wool move down the salt road to lowland towns; salt, measures and grain come up; the north road carries the hill sister variety's speech."}
  - {id: SEED-05, text: "Stress-accent language isolate with one attested sister variety in the northern hills (a small family, not an isolate family); length contrast on stressed vowels; no tone."}
  - {id: SEED-06, text: "Record trajectory: E0 tally-stamps on ingots (mold-mark tallies); the stamp inventory becomes a native script at the E0/E1 seam, not a borrowed alphabet; the script is incised and painted by E2."}
  - {id: SEED-07, text: "Non-negotiable spine: FIRE (transformation, heat, quench, ash, smoke) + MARK (stamp, mold-mark, attestation, count-mark); every component must couple to it."}
  - {id: SEED-08, text: "Contrast profile with D1 (river, binding/tying, alphabet) and D2 (verticality, wind): D4's spine is FIRE and MARK; no river/bank/flood imagery, no tying-as-obligation metaphor, no wind-law institution, no vertical world-axis."}

spine:
  - {id: SP-01, axis: fire, definition: "heat as transformation: the furnace, the charge, the quench, ash and smoke; fire is an institution (furnace right), a process (smelt, cast, temper), and a hazard (burn, slag, dross)", required_evidence: "craft and religion lexicon fields, myth narratives, the furnace calendar, costume protection records"}
  - {id: SP-02, axis: mark, definition: "attestation by impression: stamp, mold-mark, count-mark, name-mark; the mark carries the maker's identity and the work's account; marks are made by contact (stamp into wax, clay or metal), never by tying", required_evidence: "orthography records, trade measure vocabulary, naming formation, symbol records"}
  - {id: SP-03, axis: test, definition: "every design record in every component carries axis: with one of fire | mark | both | neutral-with-rationale; every component file declares spine_coupling: naming its two strongest couplings and their record IDs. A record that only makes sense read through D1 or D2 imagery is a violation, not a neutral record."}

aesthetic_stance:
  - {id: AS-01, stance: "measured in heats and casts", note: "time is reckoned in furnace turns and quench intervals; the year is one smelt season and one fallow season, not four seasons of waiting"}
  - {id: AS-02, stance: "the mark is the oath", note: "obligation is attested by a stamp, not spoken into the air and not tied; a false mark is the culture's cardinal fraud"}
  - {id: AS-03, stance: "continuity by reworking", note: "scrap returns to the charge; the same metal is cast twice; identity is the lineage's furnace kept lit, not a repaired object"}
  - {id: AS-04, stance: "rank is furnace right", note: "rights descend through smith lineages (SEED-03); the league council seats furnace-masters, and a master's stamp licenses work"}
  - {id: AS-05, stance: "records are stamped before they are written", note: "E0 tallies are stamp rows on ingots; the script of E1 is a native extension of the stamp inventory, not an imported alphabet"}

contrast_profiles:
  # D1 = the lane's D1 fixture "Retied Houses" (worked-example-mini-culture.md §2–§3).
  # D2 = the highland-plateau pastoralist drill (examples/culture-d2/).
  - {id: R-01, domain: "setting", d1: "river terrace and bank-work", d2: "winter valley shelters and summer high pastures", d4: "forested upland basin with furnace towns; water is the quench trough and the spring, never the medium of life", boundary_rule: "no river/tide/flood/bank imagery anywhere in D4 records"}
  - {id: R-02, domain: "obligation", d1: "oath-cloth and public witnesses", d2: "pasture rights and wind-sworn oaths", d4: "stamped attestation: the mark on the work and the count-mark in the ledger", boundary_rule: "no tie/bind/knot-as-obligation metaphor; no oath spoken into wind; obligation is an impression"}
  - {id: R-03, domain: "craft chain", d1: "flax, bast fiber, reeds", d2: "herd fiber (wool felt and weave)", d4: "ore, charcoal, clay molds, quench water; wool only as clothing and trade, never as the craft spine", boundary_rule: "no flax/bast/reed vocabulary; wool terms must be re-caused for a kiln economy"}
  - {id: R-04, domain: "literacy", d1: "E1 local alphabet with letter IDs", d2: "tally-knots, then a script adapted from the lowland partner", d4: "tally-stamps, then a native stamp-derived script (no donor script; the script's signs derive from 02's phonology)", boundary_rule: "no alphabet-first premise; no letter-ID list; sign values must be derived from 02 phonology"}
  - {id: R-05, domain: "prosody", d1: "penultimate stress, no tone", d2: "pitch accent, no tone", d4: "root-initial fixed stress, length contrast on stressed vowels, no tone", boundary_rule: "D1's stress pattern and D2's pitch accent may not be reused; D4's own sound laws are fixed by 02"}
  - {id: R-06, domain: "institutions", d1: "public oath and rotating delegate witnesses", d2: "lineage pasture rights and the storm moot", d4: "furnace right held by smith lineages; the league council of furnace-masters; no public-oath assembly and no storm law", boundary_rule: "no witness assembly import; no storm-as-institution import"}
  - {id: R-07, domain: "stance words", d1: "repair, replace, hold/show/release", d2: "return, ascend, descend, carry, strip", d4: "smelt, cast, quench, stamp, attest, rework", boundary_rule: "D4 register vocabulary must not translate D1 or D2 work chants, formulas, or stance words"}

no_import:
  # Review-time checks against the D1 fixture and the D2 drill; flagged as violations, never silently resolved.
  - {id: D1B-01, ban: "river/bank/tide/flood as setting, staple, or metaphor", check: "term lists and narrative records of 04/06/07 scanned at review; worked-example-mini-culture.md §2 is the reference"}
  - {id: D1B-02, ban: "tying/binding/knot-as-obligation imagery (oath-cloth, witness knots, 'retied')", check: "term lists of 04 and record texts of 06/07; marks are impressions, never knots"}
  - {id: D1B-03, ban: "bast/flax/reed fiber chain as the native textile story", check: "09-costumes materials and routes vs textile-technology.md §2 fiber hierarchy"}
  - {id: D1B-04, ban: "alphabet-first literacy; D1 letter IDs P T K M N S L R W Y A E I O U", check: "03-orthography sign inventory vs this list; any reuse is a finding"}
  - {id: D2B-01, ban: "verticality spine (up/down deixis, ascent/descent verbs, world-axis, summit/shelter poles)", check: "02/04/06/08 records; D4 has no world-axis and no ascent grammar"}
  - {id: D2B-02, ban: "wind as institution (storm law, breath-carried oath, whistled register)", check: "04/06/10 records; D4's smoke rises but carries no law"}
  - {id: D2B-03, ban: "D2 fixture forms and names (the D2 lexicon block and name ledger)", check: "collision run required at 05 acceptance A-05; examples/culture-d2/ is the reference list"}
  - {id: D2B-04, ban: "pitch-accent prosody and D2's sound laws (/p/ to /f/ is D1's; D2's nine allophony rules)", check: "02 rule lists"}
  - {id: D3B-01, ban: "D3's source-bound packet shape (attributed beliefs, closed source bindings) as D4's evidence story", check: "12-provenance records; D4's evidence is design-choice plus corpus comparators, not source bindings"}

coupling_principles:
  - {id: CP-01, principle: "Society reaches language: habitat, subsistence, ranking, religion, trade, literacy era, and history each produce a named lexical or grammatical consequence.", follows: [F-01, F-02]}
  - {id: CP-02, principle: "Cross-component claims are typed edges (F feasibility, I permission, T transmission, R retrospective interpretation); no component asserts that one system 'naturally caused' another.", follows: [F-03, F-04]}
  - {id: CP-03, principle: "The craft chain is lexical: furnace, charge, ore, charcoal, mold, quench, slag, stamp, and their derivative families are the densest fields; tool names carry literal senses (craft-artisan-lexicon.md §2).", follows: [F-16]}
  - {id: CP-04, principle: "The mark is an institution, not a decoration: stamp rights, count-marks, and maker's marks recur in trade, rank, and ritual language; a false mark is the cardinal fraud.", follows: [F-16 §6–§8, F-17 §3]}
  - {id: CP-05, principle: "Stress accent stays stress accent: root-initial fixed stress, length contrast stated, no tone contrast, and every script choice justified against the accent and length system.", follows: ["corpus/knowledge/linguistics/phonetics-phonology.md §6", "corpus/knowledge/verification/phonology-sanity-gate.md §2", F-18]}
  - {id: CP-06, principle: "Furnace-right institutions are visible in lexicon, names, and costume rank rules; no universal pantheon, no universal chief, and no guild beyond the league's own towns is implied.", follows: ["corpus/knowledge/culture-material/craft-artisan-lexicon.md §4–§5", "corpus/knowledge/verification/myth-consistency-gate.md §3"]}
  - {id: CP-07, principle: "Era tags are mandatory from the fixed space E0–E3: E0 = pre-script stamp era, E1 = script seam, E2 = literate league anchor, E3 reserved. Pre-contract components alias their own era prefixes in, never silently.", follows: ["corpus/knowledge/synthesis/era-language-staging.md §4, §7, §8", "corpus/knowledge/culture-material/era-periodization-models.md §13", "corpus/knowledge/verification/lexicon-coverage-audit.md §7"]}
  - {id: CP-08, principle: "Contact discipline: the salt-road loans are confined to declared layers and domains (trade, measures, salt) with donor stage and adaptation rules recorded; the north-road kin layer carries only ore-and-works vocabulary; no donor religion, costume, or second complete culture is imported.", follows: ["corpus/knowledge/linguistics/language-contact.md §4, §6, §10", "corpus/knowledge/synthesis/loanword-material-dating.md §2–§4", "corpus/knowledge/verification/real-world-inspiration-boundaries.md §3, §5"]}
  - {id: CP-09, principle: "Costume records carry the full route: fiber or import, preparation, cloth formation, cut, wearer/rank, rite, era; rank rules reference furnace rights rather than wealth alone.", follows: ["corpus/knowledge/culture-material/textile-technology.md §2, §6", "corpus/knowledge/synthesis/costume-language-coupling-table.md §2, §8", "corpus/knowledge/verification/costume-era-consistency-gate.md §4–§7"]}
  - {id: CP-10, principle: "Symbols work by context key, not by universal dictionary: each sign names its medium, audience, authorized holder, and date; era drift is a dated reinterpretation record, never a natural evolution.", follows: ["corpus/knowledge/synthesis/symbolism-consistency-rules.md §3–§7", "corpus/knowledge/myth-symbol/cosmology-cosmography.md §2, §4"]}
  - {id: CP-11, principle: "Evidence discipline: every record labels its status (design-choice, attested-comparator, contested, unknown); comparators cite repo corpus entries by path and section; anything unchecked is (to-verify).", follows: [F-11]}
  - {id: CP-12, principle: "Canon hygiene: all component files are non-canon design records; nothing here decides what is true in any world; the handoff follows the contract and canon decisions stay with lore.", follows: ["corpus/knowledge/synthesis/worldbible-integration-contract.md §6, §11, §12", "corpus/QUALITY.md §5"]}

