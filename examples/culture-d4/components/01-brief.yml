    design_note: |
      The six garment form slots are deliberately unresolved: the garment
      records carry English translated labels and LEX-GAR-nn slots that 04-lexicon
      does not fill in this drill. This is the named design debt, matching the D2
      precedent (its ten unresolved LEX-GAR slots) at the smaller garment count
      this registry requires (>= 6 garments). Every other checked surface is
      designed clean: all lexicon forms are native and inventory-legal, the two
      loan layers carry complete borrow ledgers, costume era tags reconcile by
      identity rows, and no rank rule collides. A finding set other than this
      six-hold set is a mismatch to report, not to absorb.

acceptance_criteria:
  - {id: A-01, criterion: "Every component file parses under the costume gate's YAML-subset reader and each declared packet_key block extracts exactly once.", check: "assemble-culture-d4.py --selftest and the assembly run"}
  - {id: A-02, criterion: "The assembled packet carries name, canon, phonology, orthography, lexicon, constructions, layers, pantheon, roles, motifs, narratives, symbols, eras, era_dates, named_eras, era_records, costumes, materials, cloth_sources, rank_rules, calendar, festivals, rites, contact, routes, provenance, names, cross_culture_review.", check: "assembly run + strict loader over packet.d4.yml"}
  - {id: A-03, criterion: "The lexicon carries >= 40 native lexemes across the seven-field matrix plus extensions, and two declared loan layers with complete borrow ledgers.", check: "lexicon-coverage-audit.py over the packet"}
  - {id: A-04, criterion: "The costume component carries >= 6 garments, each with a material reference, an era tag, and a form_slot of the LEX-GAR-nn shape.", check: "costume-era-consistency-gate.py over the packet"}
  - {id: A-05, criterion: "No D4 name or form collides with the D2 or D1 reference lists; the naming component records the sweep.", check: "naming-collision-gate.py over the packet + 05-naming cross_culture_review rows"}
  - {id: A-06, criterion: "All five culture gates run over the packet with exit 0 or 1 (no exit 2, no traceback).", check: "round-17 runner interop leg"}
  - {id: A-07, criterion: "The typed pipeline's finding set equals contract.hold_set_declaration exactly (six holds, zero notes, zero fails).", check: "D4 typed gate over packet.d4.typed.yml vs expected-holds.json"}
  - {id: A-08, criterion: "Assembly is deterministic: the assembler --check is byte-identical and two fresh typed builds are byte-identical.", check: "assemble-culture-d4.py --check + adapter builds"}
  - {id: A-09, criterion: "Every component declares NON-CANON status and no component claims real-world clearance, permission, or canon acceptance.", check: "round-17 runner NON-CANON leg"}

