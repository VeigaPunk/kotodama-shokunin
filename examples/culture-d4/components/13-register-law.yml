# examples/culture-d4/components/13-register-law.yml
# D4 design drill — component 13 of the round-17 registry's lineage.
# NON-CANON: this file proposes a design; it records nothing about any world.
#
# Write seat: R27-D05..D12 (D axis, register law + syllabify, 8 seats; single
# integrator owns the touched files). Round 27, 2026-10-18, loop 3 build 3 of 4.
# This is a NEW file: it supersedes nothing and no filed round-8..26 byte is
# rewritten by it. It answers the gap the round-26 register design named and
# left unowned — "the register *law* (admissibility, oath-only-plain, the guest
# asymmetry) is specified but not implemented anywhere; the delivered tree has
# no component that owns it" (reports/round-26/register/design.md:232, RL-6;
# reports/round-26/register/review.md:179).
component: 13-register-law
culture: D4
canon: not canonized (D4 design drill)
title: "13-register-law — the stamp register's speech-act rules: what may be said, by whom, with what record consequence"
status: "round-27 component write, 2026-10-18; supersede-by-new-file only"
packet_keys: [register_law]
scope: >
  The five law rows RGL-01..RGL-05 that govern the `stamp` register declared in
  04-lexicon's `registers` block (QREG-01..QREG-04). The forms themselves and
  their derivations are 04-lexicon's; this component owns only the admissibility
  law that makes them speech acts rather than vocabulary. Each row states the
  act that may be performed in the register, the holder who may perform it, and
  the record consequence the act carries.
spine_coupling: "mark — the law is the attestation institution's: a stamp form binds, is entered on the roll, or is void, and every row turns on the mark axis. fire — the register's forms are carried by the fire-axis bases, but the law itself is mark-axis, because what binds a word is the mark and not the heat."
spine_check: "no D1 or D2 imagery is imported. No knot, cord, or tally-cord appears as a record geometry (RG-01); the roll named in RGL-01 and RGL-03 is a written stamp-roll, not a cord. No oath is made binding by anything but plain speech (RGL-02)."

register_law:
  # The five rows of reports/round-26/register/forms.md section 5, landed as
  # packet records, and reconciled row-for-row with the four speech acts
  # reports/round-27/law/design.md section 3 fixes (the sibling design seats
  # D01..D04 authored this round; their `QREG-05..08` are the act rows this
  # block carries, and `design_row` names the correspondence so a reader can
  # check the law against the design rather than reconcile two vocabularies).
  #
  # `act` is what may be said, `speaker` is who may say it (the design's
  # vocabulary; `holder` below is the round-26 forms.md spelling of the same
  # field, kept so both readings resolve), `force` is the illocutionary value
  # the design's section 3 fixes and the round-26 rows left unstated, and
  # `consequence` is the record consequence. `axis` is the law's own axis under
  # the register's axis rule (reports/round-26/register/rules.md section 2) —
  # the law rows are mark-axis, because admissibility is an attestation fact,
  # not a heat fact.
  - {id: RGL-01, design_row: [QREG-05, QREG-07], register: stamp, axis: mark, kind: admissibility, act: "a charge at the weigh-stone, a lot named as it is sealed, or an oath attested before the stamp-holder", speaker: "stamp-holder, furnace-master (RK-03), mold-keeper (OR-02, component-only)", holder: "a stamp-holder, or a speaker the stamp-holder is attesting", force: "directive-binding for the charge; declarative-naming for the lot's name", consequence: "the spoken form binds and the stamp-holder enters the act on the stamp-roll; the lot's name is written on the ingot's tally face", evidence: design-choice, follows: [F-2], cite: "reports/round-26/register/forms.md section 5 RGL-01; reports/round-27/law/design.md section 3 QREG-05/QREG-07"}
  - {id: RGL-02, design_row: [QREG-06], register: stamp, axis: mark, kind: exclusion, act: "an oath", speaker: "stamp-holder only — no master, no delegate", holder: "none — the register admits no binding oath", force: "commissive-binding refused", consequence: "an oath spoken in stamp is void; the binding oath is plain speech (L-30 gis, the plain mark-axis oath word), so a stamp oath carries no entry on the stamp-roll", evidence: design-choice, follows: [F-2], cite: "reports/round-26/register/forms.md section 5 RGL-02; reports/round-27/law/design.md section 3 QREG-06; reports/round-17/d4/design-brief.md section 6 (the forecast's delta-6 register property, re-hosted)"}
  - {id: RGL-03, design_row: [QREG-08], register: stamp, axis: mark, kind: asymmetry, act: "a guest broker's charge, lot-naming or attested oath", speaker: "broker, market-goer (RK-04), at market days", holder: "a guest broker, speaking under a stamp-name", force: "directive-binding, not-rollable", consequence: "the act binds the goods at the gate and is entered on the stamp-roll under the guest's stamp-name, but the guest may not write or read the furnace roll; the asymmetry is recorded, not licensed away", evidence: design-choice, follows: [F-2], cite: "reports/round-26/register/forms.md section 5 RGL-03; reports/round-27/law/design.md section 3 QREG-08"}
  - {id: RGL-04, design_row: [], register: stamp, axis: fire, kind: no-segment, act: "any form in the register", speaker: "any speaker admitted by RGL-01 or RGL-03", holder: "any speaker admitted by RGL-01 or RGL-03", force: "none — a sound-channel constraint, not a speech act", consequence: "the register owns no segment: a stamp form is inventory-checked exactly as a plain form, so no phoneme, allophone or syllable template is licensed by being in-register", evidence: design-choice, follows: [F-2], cite: "reports/round-26/register/forms.md section 5 RGL-04; reports/round-26/register/design.md section 2"}
  - {id: RGL-05, design_row: [], register: stamp, axis: mark, kind: era, act: "any form in the register", speaker: "any speaker admitted by RGL-01 or RGL-03", holder: "any speaker admitted by RGL-01 or RGL-03", force: "none — a dating constraint, not a speech act", consequence: "every stamp form is available_from E1, the era 03-orthography dates the stamp-house to; an E0 stamp claim is a defect and E3 is reserved and unoccupied", evidence: design-choice, follows: [F-2], cite: "reports/round-26/register/forms.md section 5 RGL-05; examples/culture-d4/components/03-orthography.yml (the stamp-house's E1 date)"}

law_binding:
  # What this block binds to, stated so a reader can check the law against the
  # delivered bytes rather than take it on trust.
  register: "stamp (04-lexicon.yml registers QREG-02, class marked; QREG-01 `plain` is the unmarked baseline and no law row governs it)"
  forms: "the eight stamp forms L-55..L-62 (04-lexicon.yml), all stage E1, all inventory-checked as plain forms under RGL-04"
  axis_rule: "the register's axis->operation rule is QREG-03's and is not restated here; this component owns admissibility only"
  enforcement: "no gate executes these rows. The era leg (RGL-05) is specified and unimplemented — tools/gates/argot-derivation-gate.py has no era concept (reports/round-26/register/rules.md section 5, RL-8) — and the inventory leg RGL-04 asserts is measured by the projector's own check_sound_form, not by this block. The rows are a declared law with named non-execution, not a claim of enforcement."
  evidence_status: "design-choice throughout: no frequency, corpus or informant evidence exists for any row (reports/round-26/register/forms.md section 6 CAL-1)"

calibration:
  - {id: CAL-RL1, status: design-choice, note: "the five rows are a design choice calibrated to the delivered furnace-league institution; no real institution, court or register is described, cited or approximated"}
  - {id: CAL-RL2, status: to-verify, note: "whether the register should exist at E1 or E2 is a judgment on the stamp-house's institutional date; E1 follows 03-orthography and a reader who reads that seam differently moves RGL-05's window with it (reports/round-26/register/forms.md CAL-3)"}
  - {id: CAL-RL3, status: to-verify, note: "RGL-01's stamp-roll and RGL-03's guest asymmetry name institutions (the roll, the guest-broker's stamp-name) that no delivered record enumerates; the law is stated against the institution the brief names, and a later round that populates the roll owes the record shape"}

canon_boundary: |
  This component declares a design law; it records nothing about any world. Canon
  and handoff acceptance are lore-shokunin's, and the register's existence in the
  canon is their decision, not this file's. No sibling component was edited and
  no sibling content is quoted beyond the contract fields named in law_binding.
  No real-world language, institution, community, or rights question is decided
  or implied here.
