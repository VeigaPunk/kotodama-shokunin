phonology:
  consonants:
    - "p"
    - "t"
    - "k"
    - "b"
    - "d"
    - "g"
    - "m"
    - "n"
    - "s"
    - "r"
    - "l"
    - "w"
    - "j"
    - "h"
  vowels:
    - "a"
    - "e"
    - "i"
    - "o"
    - "u"
  phonotactics: "(C)V(V)(C)"
  coda:
    - "n"
    - "m"
    - "s"
    - "k"
    - "l"
    - "r"
    - "t"
    - "d"
  onset_clusters: false
  tones: 0
  accent: "stress accent, fixed on the first syllable of the root; suffixes and compounds never move it. The tones field counts lexical tone categories and D4 has none: no syllable carries an independent pitch category, and stress is not culminative pitch movement but a fixed position. Vowel length is contrastive only on the stressed syllable and is written as a double vowel (aa ee ii oo uu); the falling diphthongs ai and au are the only other vowel sequences."
  accent_levels: 1
  notable_rules:
    - "n → ŋ / _ k"
    - "n → ŋ / _ g"
    - "s → z / V _ V"
    - "t → ts / _ i"
    - "k → c / _ i"
    - "h → ç / _ i"
  strata_note: "Two strata are declared: the native D4 lexicon across both stages, and the loan strata declared in 04-lexicon's layers block (the salt-road trade layer and the north-road kin layer). Loans are governed by loan_adaptation below; the E0 and E1/E2 vernaculars share this inventory. The gate-facing rule list is written in finite symbol contexts; every rule's output is an allophone outside the phoneme inventory, so no rule is stated as a phoneme merger."
morphology:
  derivation_rules:
    -
      id: "CX-01"
      kind: "compound"
      pattern: "^(?P<a>.+)\\+(?P<b>.+)$"
      output: "{a}{b}"
      note: "STACK-COMPOUND: modifier root before head root, concatenated without deletion; the plus is analysis only and never part of the delivered spelling"
    -
      id: "CX-02"
      kind: "suffix"
      affix: "-ar"
      pattern: "^(?P<stem>.+)$"
      output: "{stem}ar"
      note: "CRAFT-AGENT: worker named from the material or tool"
    -
      id: "CX-03"
      kind: "suffix"
      affix: "-en"
      pattern: "^(?P<stem>.+)$"
      output: "{stem}en"
      note: "ATTRIBUTIVE: of-the-X; naming and epithets only"
    -
      id: "lengthen"
      kind: "vowel-length"
      pattern: "^(?P<onset>[^aeiou]*)(?P<vowel>[aeiou])(?P<rest>.*)$"
      output: "{onset}{vowel}{vowel}{rest}"
      note: "the register's fire operation: the stressed root vowel is doubled, because the fire lengthens. Stressed position is the root-initial syllable for every delivered root (02 STR-01), so doubling the first nucleus is the one length operation the language can spell."
  derivation_note: "the three rules replay the four derived or compound records in this file and the eight names in 05-naming; rule ids match the constructions block"
  derivation_ops:
    - "head2"
    - "reverse"
    - "lengthen"
  derivation_ops_note: "the three register operations. `reverse` and `head2` are computed character/syllable operations (reports/round-17/d4/design-language.md section 5); `lengthen` is declared as the machine-readable LENGTHEN pattern/output pair above. `reverse` is NOT expressible as such a pair (a reversal needs indexing, which the template subset refuses), so it stays computed in tools/gates/argot-derivation-gate.py. `head2` is declared but unused: over the delivered tree it is an identity, not a derivation (reports/round-26/register/review.md section 4)."
  derivation_spelling_note: "a record's `derivation.op` must equal the declared rule id by exact string. The design's own two files spell this operation two ways -- rules.md section 2 states `op = 'lengthen'` while its section 3 registry row gives `id: LENGTHEN` -- and the round-26 execution-1 seat measured that landing the lowercase op against the uppercase id emits six D4L-ARGOT-RULE holds (reports/round-26/register/execution-1.md section 2). This landing resolves the split by declaring the rule id in the lowercase spelling the design's own operation rule uses, so the rule id and every record's `op` agree and the leg replays clean."
orthography:
  case: "display-only"
  direction: "right-to-left in the E0 stamp rows and the E1 hand; the E2 league hand keeps right-to-left for text and left-to-right for account columns (a dated reversal recorded as OR-03)"
  type: "abugida with inherent vowel a; consonant signs carry the inherent a, and four vowel marks (e, i, o, u) modify them; a length mark doubles the marked vowel; a seam mark separates roots in compounds"
  signs: 20
  scheme: "D4-roman-1 (lowercase ASCII; length as double vowels; diphthongs ai/au; no diacritics)"
  notes: "the script is unicameral; no tone is notated (the language has none); numerals are the E0 count-stamps, kept as a separate numeral register, not as letters"
