registers:
  -
    id: "QREG-01"
    title: "plain"
    register: "plain"
    class: "unmarked"
    law: "the forge, the household and the road: the unmarked baseline the register is measured against, present from E0. Not a member of the stratum."
    axis: "neutral"
    evidence: "design-choice"
    follows:
      - "F-2"
  -
    id: "QREG-02"
    title: "the stamp register"
    register: "stamp"
    class: "marked"
    law: "the attestation speech: the speech a stamp-holder uses when a spoken word is being made to bind, as against the plain speech of the forge floor. A stamp form is admissible only in a stamp-act slot (a charge at the weigh-stone, an oath attested before the stamp-holder, a lot named as it is sealed). The register owns no segment: a stamp form is inventory-checked exactly as a plain form."
    axis: "mark"
    evidence: "design-choice"
    follows:
      - "F-2"
  -
    id: "QREG-03"
    title: "the operation rule"
    register: "stamp"
    class: "marked"
    operation_rule: "axis mark -> reverse; axis fire -> lengthen"
    law: "a stamp form is the plain base carried into the register by the operation the base's own axis selects. The rule is total over the two delivered axis values and is not total in effect: 13 of the 54 delivered lexicon records yield an unusable form, so each form is checked individually (reports/round-26/register/review.md section 3)."
    axis: "mark"
    evidence: "design-choice"
    follows:
      - "F-2"
  -
    id: "QREG-04"
    title: "era"
    register: "stamp"
    class: "marked"
    era_rule: "a stamp form is available_from E1"
    law: "the register is the speech of the stamp-house, which 03-orthography dates to E1. A stamp form claimed at E0 is a defect; E3 is reserved and unoccupied by delivered records."
    axis: "mark"
    evidence: "design-choice"
    follows:
      - "F-2"
