      id: "RG-01"
      rule: "The mark is an impression, never a knot or a tie: stamp, mold-mark, and count-mark records describe contact-made marks; no record may treat a mark as binding or as a cord."
    -
      id: "RG-02"
      rule: "Every record carries id, axis, evidence, follows. A record without axis is malformed; neutral requires a coupling_note."
    -
      id: "RG-03"
      rule: "Cross-component references use contract ids only; a component never quotes a sibling file's content."
    -
