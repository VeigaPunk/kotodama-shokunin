# §4 claim_ledger: statement, claim kind, provenance, evidence status,
# uncertainty, and relation to other records (vocabulary per contract §6).
claim_ledger:
  - claim_id: CL01
    statement: "/p/ > /f/ (L1) consistently separates E2 River surface forms from E1 archival forms in this design"
    claim_kind: "generative rule"
    provenance: "invented for D1 (worked example §§3-4); no real language is described"
    evidence_status: "invented"
    uncertainty: "cohort spread (Y145-170) is stipulated, not derived; the unsampled Upland sister retains /p/"
    relations: "A1, A2, A3 (L01, L02, L11-L20), A4 (N04, names)"
  - claim_id: CL02
    statement: "Japanese is SOV and suffixing; English is SVO (used only as a typological comparator)"
    claim_kind: "real-world reference"
    provenance: "source_ledger S2 (Dryer 2013, WALS ch. 81, §1 and example 2a); S1 (Shibatani 1990) bibliographic record"
    evidence_status: "attested"
    uncertainty: "one word-order feature only; no cultural, religious, or dress inference is licensed (worked example §3)"
    relations: "A1 (M6 clause)"
  - claim_id: CL03
    statement: "Sound correspondences, borrowing, and relative chronology are stated method, not proof of a real genealogy"
    claim_kind: "real-world reference (method)"
    provenance: "source_ledger S3 (Campbell 2013, 3rd ed.)"
    evidence_status: "attested (method level; edition corroborated; no page-specific quotation asserted)"
    uncertainty: "applies to method only"
    relations: "A2 (L1, era seams)"
  - claim_id: CL04
    statement: "Family F1 with stages E0 -> E1 -> E2 is an author's genealogy, not a comparative reconstruction from attested data"
    claim_kind: "designer interpretation"
    provenance: "D1 (worked example §3)"
    evidence_status: "invented"
    uncertainty: "single-word-list reconstruction is explicitly not claimed; Upland sister unsampled"
    relations: "A2, /open_questions OQ-05"
  - claim_id: CL05
    statement: "Stipulated performers say the three offices hold, open, and record; no narrator asserts that any deity exists"
    claim_kind: "attributed in-world belief (B-status)"
    provenance: "D1 (worked example §5)"
    evidence_status: "invented"
    uncertainty: "literal divine existence is unsettled by design (contract §6: temple teaches P != P is true)"
    relations: "A5 (DE01-DE03, ROL1-ROL3), /open_questions OQ-06"
  - claim_id: CL06
    statement: "A founding legend about opening the first assembly to all houses is contested within D1; E1 institutional copies praise it and no independent E0 chronicle supports it"
    claim_kind: "attributed in-world belief (contested)"
    provenance: "D1 (worked example §5)"
    evidence_status: "contested with alternatives (in-fiction source contest, not scholarly dispute)"
    uncertainty: "no E0 chronicle exists in the fixture"
    relations: "A5 (M-D1-02)"
  - claim_id: CL07
    statement: "E1 prescribes red-ochre beads for delegates and restricts the duty witness strip; E2 repeals the bead restriction while keeping the strip restricted"
    claim_kind: "candidate world-fact (institutional prescription)"
    provenance: "D1 (worked example §§4, 6, 7)"
    evidence_status: "invented; prescription recorded separately from observed practice"
    uncertainty: "compliance is a practice question; the enforcement pocket (hearings vs market) is documented in A6"
    relations: "A6 (RR01-RR03, C07-C09)"
  - claim_id: CL08
    statement: "D1 costume cuts and meanings are design choices; no real garment is reconstructed and no textile behaviour is measured"
    claim_kind: "designer interpretation"
    provenance: "D1 (worked example §7); comparators S5 (Roach-Higgins & Eicher 1992), S6 (Barber 1991)"
    evidence_status: "invented"
    uncertainty: "physical prototype, yields, skin comfort, rub-fastness untouched (/open_questions OQ-04)"
    relations: "A6"
  - claim_id: CL09
    statement: "The separation/transition/incorporation triad is used as a heuristic for the D1 passage rite, not as a law of ritual"
    claim_kind: "real-world reference (heuristic)"
    provenance: "source_ledger S4 (van Gennep 1960 [1909])"
    evidence_status: "inferred with stated bridge (edition corroborated; heuristic application to an invented rite)"
    uncertainty: "not every local design practice must fit the sequence (worked example §5)"
    relations: "A5 (rite), A7 (E14)"
  - claim_id: CL10
    statement: "Holding <-> opening mediated by visible repair is a declared generator (a design lens), not an unconscious universal binary"
    claim_kind: "designer interpretation"
    provenance: "D1 (worked example §5)"
    evidence_status: "invented (designer framing)"
    uncertainty: "a variant praising invisible repair would defeat this particular reading"
    relations: "A5, A7 (E10, E14)"
  - claim_id: CL11
    statement: "Dress is treated as body modifications and supplements, not garments alone"
    claim_kind: "real-world reference"
    provenance: "source_ledger S5 (Roach-Higgins & Eicher 1992)"
    evidence_status: "attested (bibliography/DOI corroborated; publisher text not retrieved in the design pass)"
    uncertainty: "framing only; no culture-specific outfit reconstructed from the article"
    relations: "A6"
  - claim_id: CL12
    statement: "Unilinear savagery -> barbarism -> civilization ladders are discredited as universal history"
    claim_kind: "real-world reference (historiographic caution)"
    provenance: "source_ledger S7 (Trigger 2006, 2nd ed.)"
    evidence_status: "attested (edition corroborated; full-text retrieval rate-limited in the design pass)"
    uncertainty: "used as a caution only; D1's stages are not a progress scale"
    relations: "A6, A2"
  - claim_id: CL13
    statement: "The delivered lexicon is a bounded 20-term sketch; body, kinship, weather, and war coverage is unbuilt, not absent-by-inspection"
    claim_kind: "designer interpretation"
    provenance: "D1 (worked example §8) + /validation gate runs"
    evidence_status: "invented; declared gap (silence is not proof of absence, contract §11)"
    uncertainty: "English translation supplies unbuilt vocabulary and must not be mined for conlang words"
    relations: "A3, /open_questions OQ-01"

# §11 provenance cautions: per-real-world-source record.
source_ledger:
  note: "metadata and locator status as verified in the design pass recorded in the worked example §11; source metadata verification is not full-text verification and not cultural permission (contract §11)"
  sources:
    - {id: S1, ref: "Shibatani, Masayoshi (1990), The Languages of Japan, Cambridge University Press", locator: "WALS refdb record Shibatani-1990", supports: "Japanese language-structure comparator", boundary: "bibliography checked; no sacred-name or clothing claim attributed"}
    - {id: S2, ref: "Dryer, Matthew S. (2013), Order of Subject, Object and Verb, WALS Online ch. 81", locator: "https://wals.info/chapter/81 §1, example 2a", supports: "Japanese SOV vs English SVO", boundary: "chapter text checked; dominant order is not a complete grammar or cultural psychology"}
    - {id: S3, ref: "Campbell, Lyle (2013), Historical Linguistics: An Introduction, 3rd ed., Edinburgh University Press", locator: "publisher title page + independent catalogue/review records", supports: "sound correspondence, borrowing, relative chronology as method", boundary: "publisher page bot-blocks fetches; no page-specific quotation or real lexical derivation asserted"}
    - {id: S4, ref: "van Gennep, Arnold (1960 [1909]), The Rites of Passage, trans. Vizedom & Caffee, University of Chicago Press", locator: "1960 edition record", supports: "separation/transition/incorporation heuristic", boundary: "edition corroborated; not a law requiring all rituals to share the stages"}
    - {id: S5, ref: "Roach-Higgins, Mary Ellen & Joanne B. Eicher (1992), Dress and Identity, Clothing and Textiles Research Journal 10(4): 1-8", locator: "doi:10.1177/0887302X9201000401", supports: "dress as body modifications and supplements", boundary: "bibliography/DOI corroborated; publisher text blocked; no culture-specific outfit reconstructed"}
    - {id: S6, ref: "Barber, E. J. W. (1991), Prehistoric Textiles, Princeton University Press", locator: "digitized-book DOI 10.1515/9780691201412", supports: "textile-technology comparator", boundary: "Crossref metadata checked; Aegean emphasis is not a global clothing chronology"}
    - {id: S7, ref: "Trigger, Bruce G. (2006), A History of Archaeological Thought, 2nd ed., Cambridge University Press", locator: "publisher catalog entry", supports: "historiography and limits of universal developmental schemes", boundary: "edition corroborated in publisher search results; full-text retrieval rate-limited; no invented page references"}
  calibration:
    established_descriptive_tools: "phonemic contrasts, morphological segmentation, explicit sound correspondences, textile construction vocabulary — usefulness does not make the fixture historically attested"
    limited_or_contested: "rite triads and structuralist oppositions generate candidate designs, not universal explanations"
    discredited_as_universal_history: "unilinear developmental ladders (S7); fixed global colour/animal dictionaries (unsupported pop rule; D1 associations are explicitly local inventions)"

