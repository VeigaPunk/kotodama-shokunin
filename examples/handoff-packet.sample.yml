# handoff-packet.sample.yml — NON-CANON sample world-bible handoff packet
# kotodama-shokunin -> lore-shokunin, assembled per
# corpus/knowledge/synthesis/worldbible-integration-contract.md
#
# WHAT THIS IS
#   A worked, deliberately unbound sample of the handoff envelope required by
#   contract §4, carrying the artifact payloads of §5 and the fictional-culture
#   drill of §12. Every record is derived from, and traceable to, the lane's
#   non-canon design fixture "Retied Houses" (D1) in
#   corpus/knowledge/synthesis/worked-example-mini-culture.md (digest pinned
#   in the artifact manifest below).
#
# WHAT THIS IS NOT
#   Not a world-bible entry, not canon, not lore acceptance, and no assertion
#   that lore has read or will read it (contract §§1, 3, 6, 8, 13). Nothing
#   here exists in any world until lore issues a receipt and canonizes it
#   (§§6, 8). Canon, entity identity, dates, and supernatural truth are
#   lore-shokunin's decisions alone; this lane proposes and traces systems.
#
# SERIALIZATION
#   Contract §4 prefers "UTF-8 Markdown with explicit tables unless both lanes
#   agree another serialization". This file is a YAML sample of the same data
#   requirements; it does not claim such agreement exists. Envelope keys cite
#   the contract sections they satisfy; payload sections additionally use the
#   fleet's shared culture-packet key names so the lane's executable gates can
#   read this file directly, and the gate runs are recorded in the validation
#   section at the end of this file.
#
# EDIT DISCIPLINE (contract §9)
#   Released bytes freeze. A change to the design record or to this packet's
#   records requires a new packet_version with a supersedes/derived_from
#   reference — never an in-place rewrite of a delivered/received snapshot.

# ===========================================================================
# §4 ENVELOPE — Markdown-serialization view (compatibility)
# The contract's default serialization is Markdown; this view carries the same
# §4 envelope in the `- field: value` list form that the lane's
# tools/gates/handoff-packet-check.py recognizes, while the YAML keys below
# carry the full records for the culture-packet gates. Keep both views
# identical; one freeze digest covers the single delivered file.
# ===========================================================================
envelope_markdown_view:
  - packet_id: kotodama.handoff.d1-retied-houses.sample
  - packet_version: "0.1.0-sample"
  - contract_ref: "kotodama-lore-adjacency, revision 1.0.0; contract digest sha256 5f4c02bfc4e6e4e943c2dd6983750ba34538219a6e239e451c81dc3fd4f79069; bilateral read pending"
  - producer: "kotodama-shokunin (round-2 adjacency worker; generative craft and design records only)"
  - recipient: "lore-shokunin (canon, world-bible entities, chronology, bible-wide consistency)"
  - request_ref: "none — no lore brief existed for this sample; assembled as an unbound drill"
  - baseline_bible_ref: "none — deliberately unbound research packet; cannot be imported as canon without a lore baseline and a new reviewed handoff"
  - artifact_manifest: "7 artifacts A1-A7; record counts 11/4/20/15/19/20/17; design record digest sha256 e96bc943a04e8f2691f3ba95f9cee5dd3456d3a9439714e0196eaaeeacaa2509; released-bytes digest pending-freeze"
  - subject_refs: "7 namespaced candidate refs cand:kotodama.d1.*, all unresolved; no lore entity ids supplied"
  - scope: "D1 language sketch, pantheon, symbols, eras, costumes, lexicon L01-L20, naming ledger; E0-E2; River branch F1"
  - dependency_manifest: "system versions P-D1-UNION, P-D1-E1LIT, L1, M1-M7, O1, A3, A4 all at 0.1.0-sample; no floating latest; prerequisites pinned by design-record digest"
  - claim_ledger: "13 claims CL01-CL13 with claim kind, provenance, evidence status, and uncertainty"
  - coupling_edges: "16 typed edges E01-E16 (dependency / analogy / attributed-association) plus change trial T-01"
  - requested_decisions: "8 decisions D-RD-01..D-RD-08 with mutually exclusive alternatives, blockers, and the partial-acceptance boundary"
  - validation: "local checks, six executable gate runs, and the provenance-audit non-applicability recorded in the validation section at the end of this file"
  - open_questions: "8 open questions OQ-01..OQ-08 with responsible lane and blocking status"

