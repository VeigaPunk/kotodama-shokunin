name: "Retied Houses (D1 handoff sample; NON-CANON)"

# --- A1/A2: language sketch, per-register inventories, diachrony -----------
phonology:
  # Declared stratum = E1 liturgical + E2 vernacular UNION, written in phonemic
  # symbols. Within the E2 vernacular alone /p/ is absent (see /sound_laws L1);
  # the union is declared so the diachronic law has a scoped home within one
  # phonotactic template.
  # Spelling vs sound (contract §5 keeps them separate): the design's working
  # romanization writes the /j/ glide as the letter y (worked example §3), while
  # this phonemic inventory lists it as j. The two register PROFILES below are
  # written in working-romanization letters, so every staged record in this
  # packet is checked against the letters actually spelled in it.
  consonants: [p, f, t, k, m, n, s, l, r, w, j]
  vowels: [a, e, i, o, u]
  phonotactics: (C)V
  tones: 0
  notable_rules:
    - "p → f / _"
  strata_note: "E2 vernacular consonants omit p; E1 liturgical register omits f. Working romanization: y = /j/, r = a tap; spelling does not mark predictable stress."
  profiles:
    E2-romanized:
      consonants: [f, t, k, m, n, s, l, r, w, y]
      vowels: [a, e, i, o, u]
      phonotactics: (C)V
      tones: 0
    E1-liturgical:
      consonants: [p, t, k, m, n, s, l, r, w, j]
      vowels: [a, e, i, o, u]
      phonotactics: (C)V
      tones: 0

sound_laws:
  - {id: L1, statement: "/p/ > /f/ in all positions within the River branch, including compounds and names; no other segment changes in this sketch", scope: "River branch, E1 -> E2", timing: "spreads across cohorts Y145-Y170 (stipulated, not derived from the charter date)", counterexample: "the unsampled Upland sister retains /p/; that is a retention, not a shared River innovation", status: "invented for D1"}
  - {id: L2, statement: "donor /lum/ acquires final /a/ on entry into E1 (coda repair)", scope: "the single modelled loan", status: "invented; no donor phonology beyond /lum/ is modelled"}

orthography:
  script: latin
  case: display-only
  separators: ["-"]
  transliteration: "working Latin sign IDs only; the E1 alphabet's letter shapes are not drawn or claimed"
  register_readings: "E2 vernacular reads the old P sign as /f/ in vernacular text; E1 liturgical copies retain E1 readings; a glyph alone cannot date a text (store script-stage, spoken-stage, register)"

morphology:
  type: agglutinative
  alignment: nom-acc
  word_order: SOV
  description: "suffixing and compounding; no gender agreement, no noun classes; lexical stems form before case/office morphology"
  rules:
    - {id: M1, rule: "STEM(-ma)(-ni|-ta); -ma plural, -ni genitive/affiliation, -ta object; subject unmarked", status: "invented rule"}
    - {id: M2, rule: "STEM(-ke)(=mu); -ke completed event, =mu reported source", status: "invented rule"}
    - {id: M3, rule: "zero conversion licensed: sena is noun 'witness' or verb 'witness'", status: "invented rule"}
    - {id: M4, rule: "modifier + head compounding (see /constructions CMP)", status: "invented rule"}
    - {id: M5, rule: "-ye derives a human custodian from a noun (fala + ye -> falaye)", status: "invented rule"}
    - {id: M6, rule: "clause order SOV; modifiers and possessors precede the head; the sourced claim marker =mu is not proof of the claim", status: "invented rule"}
    - {id: M7, rule: "address register: current office designation in a hearing, given name at home; funeral substitutes an office or kin description for the deceased's given name until reaggregation", status: "invented convention"}
  derivation_rules:
    - id: CMP
      kind: compound
      pattern: '^(?P<mod>.+)\+(?P<head>.+)$'
      output: "{mod}{head}"
    - id: YE
      kind: suffix
      affix: "-ye"
      gloss: human custodian
      stem_class: noun
      pattern: '^(?P<stem>.+)$'
      output: "{stem}ye"

