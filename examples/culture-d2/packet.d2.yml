symbols:
  -
    id: "S1"
    sign: "storm-slate (blue-black wool; the storm cloak's dye)"
    medium: "E1: naturally dark ewe-fleece (10-materials.yml MAT-01), carded and felted (MAT-02), optionally winter-hearth smoke-darkened (MAT-10), not dyed; E2+: wool felt with a tannin/smith-scale wool-black base (MAT-09, MAT-19) and traded-indigo vat reduction followed by air oxidation (MAT-08). The existing bog-iron wording in ground/T1 is an unresolved inventory mismatch (to-verify), not a declared local ore route."
    register: "color"
    era: "E1 bog-dark (undyed valley wool, a shelter dark); E2+ storm-slate after traded indigo arrives (M1 material/economic)"
    audience: "assembly oath-speakers first, all adults second; the lowland partner recognizes a public obligation is present but cannot read the knots that specify it"
    domain:
      id: "STORM-LAW"
      definition: "the enforceable stake of words spoken in the open — pasture claims, gate oaths, debts read aloud; the storm is what weighs un-witnessed words"
      includes:
        - "oaths at the gate and the high assembly"
        - "debts read aloud (cord in hand, head uncovered)"
      excludes:
        - "roofed household agreements with the cord visible (AX-3 reading, witness = the record)"
        - "mourning (S3)"
        - "herd-hygiene and butchery rules (practical, unmarked)"
      contrasts: "S2 fleece-white (yield, unmarked standing) and S3 ridge-grey (absence). Slate is the only color that witnesses."
    ground:
      type: "index"
      statement: "the dye is the receipt — traded indigo over a bog-iron base; wearing the slate is a visible claim of access to the road (colour-symbolism §10 dye-economics; method §2 index)"
    carrier: "pending(06.costumes[].garment) — the assembly cloak, worn OPEN (enforcement artifact A1); if 06 supplies no cloak record, the slate re-hangs on the pass-collar and the coupling is flagged at integration"
    satellites:
      -
        operator: "metonymy"
        reading: "the storm itself, as the enforcer of STORM-LAW ('the wind weighs it')"
        occasion: "assembly rhetoric and gate disputes"
        readers: "all"
      -
        operator: "borrowing"
        reading: "the roadward dye name, donor = the lowland trade partner (M5)"
        occasion: "gate-market usage"
        readers: "carriers and traders; donor marked, term pending(03.lexicon[].term)"
      -
        operator: "event-index"
        reading: "a dated runaway herd in the storm summer entered the idiom 'slate weather' for any self-inflicted disaster"
        occasion: "fixed collocation"
        readers: "all; event date pending the era component (M6)"
    couples:
      - "06 (cloak + wear rule)"
      - "07 (the storm-power, if any: see component_interfaces)"
      - "eras (E1 to E2 re-key)"
    follows:
      - "corpus/knowledge/myth-symbol/color-symbolism.md §10 (dye economics; codes ride on chromophore scarcity)"
      - "corpus/knowledge/myth-symbol/color-symbolism.md §5 (dualism modes — this is Mode A/B territory, NOT antagonistic Mode C)"
      - "corpus/knowledge/myth-symbol/symbolism-synthesis-method.md §6 M1 and drift law 3 (neighbour audit)"
    notes: "Variance guard V2: slate is law, not sin. No 'black = evil' import; the moral-dark genealogy is Zoroastrian-Christian-European (color-symbolism §11) and is not D2's."
  -
    id: "S2"
    sign: "fleece-white (undyed wool; the fold's own color)"
    medium: "E1+: undyed white ewe-fleece (10-materials.yml MAT-01), plucked in E1 or shorn in E2+, displayed as fleece or carded and rubbed into felt (MAT-02); no bleaching or white pigment. E4 paper satellite only: gall-iron ink (WM-01) written on imported-paper (WM-03), never projected into earlier eras."
    register: "color"
    era: "E1+ (unchanged across all four eras; the code's steady floor). E4 satellite: the script era's bills are written on pale traded paper, and 'white-measure' becomes a synonym for honest measure by M5 contact."
