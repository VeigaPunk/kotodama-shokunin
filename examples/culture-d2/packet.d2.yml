  -
    id: "PAN-01"
    name: "Halatu"
    role: "archaic sky-holder; demotion case, kept in formula only"
    domain: "holds the sky apart from the peaks — the world-axis as a standing figure, never a tie"
    era: "E0 formula; demoted by the E1 charter; survives in the opening line of the ascent blessing"
    axis: "verticality"
    evidence: "design-choice (to-verify against L- and ER- records)"
    cult_status: "no cult: no festival, no offering, no priest. The ritual-address test fails on purpose and the figure is kept as story, not cult"
    gender: "spoken as a man in the blessing; the language does not mark gender on theonyms"
    derivation: "hala (sky) + -tu (standing one); transparent compound, read as the archaic layer"
    epithets:
      - "Halasawa \"breath of the sky\""
      - "Humahala \"sky at the shelter\""
    demotion_event: "the E1 charter seats Kahatu as the oath patron; a holder who only holds cannot enforce a spoken word"
    deps:
      -
        component: "04-lexicon"
        ids:
          - "UNRESOLVED"
        note: "roots hala, huma"
      -
        component: "02-phonology"
        ids:
          - "UNRESOLVED"
        note: "provisional spelling"
    follows:
      -
        cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5"
        short: "PF-05"
      -
        cite: "corpus/knowledge/myth-symbol/cosmology-cosmography.md §2"
        short: "PF-09"
  -
    id: "PAN-02"
    name: "Kahatu"
    role: "storm-law; the oath patron; war function fused into punitive law"
    domain: "thunder, hail, blizzard and thin air over the saddle; the spring opening of the pass; the punitive half of a spoken promise"
    era: "E0 ridge cult of the pass bands; confederation oath patron from E1"
    axis: "both"
    evidence: "design-choice (to-verify against ER- records)"
    cult_status: "full cult address: three epithets, two festivals, two taboos, one offering, one address formula"
    gender: "spoken as a man; unmarked in grammar"
    derivation: "kaha (thunder-crack) + -tu (standing one); transparent compound"
    epithets:
      -
        form: "Halakaha"
        gloss: "sky-crack"
        register: "praise"
        use: "recitation and the pass-opening dawn"
      -
        form: "Sawakaha"
        gloss: "breath-thunder"
        register: "address"
        use: "the oath formula only: the released breath is what he hears"
      -
        form: "Humkaha"
        gloss: "shelter-thunder"
        register: "avoidance"
        use: "winter-camp substitute; his plain name is not said while the herd is under a roof"
    festivals:
      - "RIT-02"
      - "and the pass-opening dawn kept by the road keepers"
    taboos:
      - "the plain name is not spoken at the high pasture during the thunder halt"
      - "no fire is lit on the open ridge in storm season"
    offering: "a pinch of salt cast up into the wind; no blood offering is made above the shelter line"
    address_formula: "You who stand above, take this breath and hold the word"
    war_theology: "no standing army: a raid is filed as a debt claim and blessed at the pass; therefore no separate war god, no discipline god, and no berserk god"
    deps:
      -
        component: "04-lexicon"
        ids:
