        note: "roots kaha, hala, sawa"
      -
        component: "06-symbols"
        ids:
          - "UNRESOLVED"
        note: "storm slate and gate signs are symbols-owned"
    follows:
      -
        cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5"
        short: "PF-05"
      -
        cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §3"
