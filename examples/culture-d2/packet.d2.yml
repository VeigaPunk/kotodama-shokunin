era_records:
  -
    id: "ER-01"
    tag: "E0"
    name: "Open Grazing"
    span: "before D1; reckoned in hearth generations, not turns"
    institution_seam: "none; the era before the register — no seam rite exists for it"
    language_stage: "knot-era vernacular; the recitation register is the only formal speech"
    record_stage: "knot tallies only, hanging-line geometry (RG-01); no script"
    costume_seam: "requirement only: wool felt layers date from this stratum; garment records and dates belong to 11-costumes (GAR- ids unassigned at write time)"
    axis: "both"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §10"
      - "§12"
    notes: "retrospective label applied by the later chroniclers; in-world called 'the turns they did not count'; the folk generation count carries the standard error bars (Herodotus 2.142 via era-periodization §10)"
  -
    id: "ER-02"
    tag: "E0"
    name: "First Ascent"
    span: "[D1, D31); 30 turns"
    institution_seam: "the covenant ascent: pasture rights fixed at the first summer moot; era announced at the moot, effective at the descent that closes that turn (EL-02)"
    language_stage: "E0 knot-era vernacular (02/03 stage-E0 forms are this stage's inputs)"
    record_stage: "knot tallies; the covenant is remembered by recital"
    costume_seam: "requirement only: the banner felt and the keeper's staff are this stratum's objects; no garment is assigned here"
    axis: "verticality"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §3"
      - "§4"
    notes: "epoch by convention; the earliest surviving mark is ER-07's stratum — the retrospective-backdating caveat applies (era-periodization §3)"
  -
    id: "ER-03"
    tag: "E0"
    name: "Salt Turn"
    span: "[D31, D73); 42 turns"
    institution_seam: "T3: the first ratified salt term with the lowland towns; announced at the moot, effective at the closing descent"
    language_stage: "E0 vernacular; the trade vocabulary enters as a recipient-side stratum (02's loan filter); the lowland partner's own script is their ledger's business, not D2's yet"
    record_stage: "knot tallies; salt measures counted as knot groups on the trade lines"
    costume_seam: "requirement only: the lowland cloth arrives as an import dated from the E0/E1 seam, not earlier; costume records belong to 11-costumes"
    axis: "both"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §4"
      - "§13.3"
    notes: "the era ends mid-turn, so its last turn ('Salt Turn 42') lasts only a half-turn — artifact ART-01; the salt tablets are knotted, not incised, until the E0/E1 seam"
  -
    id: "ER-04"
    tag: "E0"
    name: "Long Storm"
    span: "[D73, D77); 4 turns; held turn D74"
    institution_seam: "T2 expiation: a failed ascent and storm deaths; announced at the summer moot of turn 72, effective at the closing descent"
    language_stage: "E0 vernacular; the storm-law formulae are recited, never written"
    record_stage: "the held turn is a gap in the knot count (RG-01 geometry; the gap is visible)"
    costume_seam: "requirement only: storm layers are used at the high stay; no garment record is asserted here"
    axis: "wind"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §9"
      - "§13.3"
    notes: "first of three names in one crisis; era-name churn is the in-world instability statistic here"
  -
    id: "ER-05"
    tag: "E0"
    name: "Ash Wind"
    span: "[D77, D78); 1 turn"
    institution_seam: "T2 as the crisis continues: storm deaths of two shelter heads at the moot of turn 76"
    language_stage: "E0 vernacular"
    record_stage: "knot tallies; the single-turn era shows as one knot group with no successor group"
    costume_seam: "requirement only: the banner is raised for one turn and taken down (artifact ART-05)"
    axis: "wind"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §13.3"
    notes: "the register's shortest era by turns; the object behind the Quiet Rule's minimum duration (EL-03)"
  -
    id: "ER-06"
    tag: "E0"
    name: "Bitter Smoke"
    span: "[D78, D86); 8 turns; held turns D78, D84"
    institution_seam: "T5: the Keeper's death in the storm season, in the turn of the eating-storm (D78); announced at the descent assembly, effective at that close"
    language_stage: "E0 vernacular; the eating-storm re-ratification is spoken (SKY-05)"
    record_stage: "knot tallies; two gaps in the climb count"
    costume_seam: "requirement only: the mourning pause (SEAM-06) is this stratum's dress question; costume records belong elsewhere"
    axis: "wind"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §4"
      - "§9"
    notes: "the eclipse inside its first turn is re-ratified, not a seam"
  -
    id: "ER-07"
    tag: "E1"
    name: "Marked Count"
    span: "[D86, D99); 13 turns; held turn D95"
    institution_seam: "T2/T4: the crisis assembly of turn 85 opens the era after the Keeper's death and the failed pastures; the Quiet Rule is carried at the D90 muster (the era's first Ninefold Muster); the E0/E1 seam states the script arrival: D2 adopts the lowland partner's incising practice for the register, and the knot domains are retained — herding tallies and rite counts stay knotted (RG-01), only the eracount is incised"
    language_stage: "script-era vernacular opens: SC-01 applies (intervocalic /h/ loss in ordinary speech), the recitation keeps the older forms"
    record_stage: "knot + incised register (the keeper's board); first D2-made marks date from this seam"
    costume_seam: "requirement only: the lowland cloth import is dated at or after this seam; costume dates remain 11-costumes' decision"
    axis: "verticality"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §4"
      - "§13.3; historical-linguistics.md §6"
    notes: "double dating with the lowland ledger begins; D95 is ratified retroactively at the D99 muster (artifact ART-02)"
  -
    id: "ER-08"
    tag: "E2"
    name: "Two Counts"
    span: "[D99, D103 sample present); 5 turns"
    institution_seam: "T4: the D99 muster, where the two shelter confederations declared different climb counts; the era label splits — official 'the Standing Wind', common 'Two Counts' (attributed accounts, contract §6)"
    language_stage: "literate standard: SC-02 applies (word-final high-vowel loss after n l r s); the E1/E2 seam states register stratification — the incised register is the legal surface, the recitation and the knot tally hold the sacred and herding registers, and SC-01's /h/ survives in the recitation"
    record_stage: "incised register normal; the recital of winds is still oral; the register's gaps are read as the count dispute's evidence"
    costume_seam: "requirement only: no costume movement follows from the era label itself; institution dates and costume dates are independent (A-09)"
    axis: "both"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §5"
      - "§13.2; historical-linguistics.md §6"
    notes: "official climb count C99, restored count C103 at the sample present; the two straddle the C100 rung boundary"
  -
    id: "ER-09"
    tag: "E3"
    name: "Still Air (reserved)"
    span: "undated; not entered on the official count"
    institution_seam: "reserved: the moot's register names the tag but has not declared the stratum; the restored count claims it began at C101, three climbs before the sample present"
    language_stage: "none attested; a prospective stratum only"
    record_stage: "none; the tag is reserved in the register"
    costume_seam: "not applicable; no costume claim is attached to a reserved stratum"
    axis: "wind"
    evidence: "design-choice"
    follows:
      - "era-periodization-models.md §9"
      - "§12"
      - "§13.2"
    notes: "content assigned by component 09 per contract.era_tags: the last rung's stratum; its computation is the dread at CL-ARI/CL-DRD and its dates will slip if it is ever declared (era-periodization §12)"
