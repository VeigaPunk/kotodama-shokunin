field_weights:
  - "subsistence 7 and kinship 4: the deepened fields of the pastoral brief (sf-lex §6 row adaptation)."
  - "weather 5 and landscape 5: deepened beyond the generic row because the declared spine of D2 is verticality plus wind; this is the one declared weighting deviation."
  - "religion 5: sky and wind cosmology plus the death taboo, per the seed; not a temple-state register."
  - "war 3: raiding only — no standing army, so no rank ladder is coined (the honest ceiling of the field at this stage)."
  - "trade 4: a tally word, the pass toll, the salt-road record word and the late script word; measure ladders are not coined and are carried as a known gap."
  - "costume 2: a fiber floor and one garment floor term, deliberately shallow because the dress vocabulary is native here and the full route belongs to the costume component (CP-09)."
  - "body 3: the corpus recipe for a body field — one anomalous limb partition, plus a two-part person doctrine (breath and bones)."
  - "social_order 2: a component-local extension field, not one of the audit's seven; a rebuild for that audit maps these two task-ranks into kinship and war."

spine_coupling_check:
  - "VERTICALITY: bel and tol are the season poles; the sara pair is their camp loci and is carried by accent alone; the snow-line is a vertical band; the salt licks are high; the tally is read by knot height (RG-01); the vanguard herder opens the upper pasture."
  - "WIND: su is a core root; the storm is the institution (hurir, storm law); the oath is sworn in moving air (wal, suwal); the soul travels as breath (ir, belir); meat is preserved by the upslope wind (tasur); the storm takes the dead down (tolsa)."
  - "D1 NON-IMPORT: no river, bank, flood, tide, ferry, net or tying-as-obligation material appears in any term, gloss, etymology or note. The tally cord counts and hangs; RG-01 forbids the tying metaphor, and the scan below reports the result."
  - "NEGATIVE SPACE: no sea, coast or watercourse terms and no flax, bast or reed craft vocabulary. The first is the highland brief (sf-lex §6 row); the second is the D1 craft-chain ban (R-03, D1B-03), and the native fiber here is wool."
lexicon:
  # ---- body (3): the corpus recipe — one anomalous partition + a two-part person doctrine
  - id: L-01
    term: ir
    gloss: "breath (the soul-carrier of a person)"
    field: body
    layer: native
    route: root
    stage: E0
    class: noun
    axis: wind
    evidence: design-choice
    etymology: "underived D2 root; ritual speech pairs ir with su (wind) — the one designed colexification of this packet, unchecked against CLICS3 until a check is run (to-verify)"
    follows: "sf-lex §4/Body (soul-organ doctrine); taboo §3 (breath as a sacred domain)"
  - id: L-02
    term: nel
    gloss: "hand and forearm, one term (no separate word for the forearm or the wrist)"
    field: body
    layer: native
    route: root
    stage: E0
    class: noun
    axis: neutral
    coupling_note: "a working-body term with no axis reading of its own; the field's axis duty is carried by ir (breath) and ban (bones), and what nel records is a partition, not a direction"
    evidence: design-choice
    etymology: "underived D2 root; the partition covers hand and forearm as one working segment (the milking grip) — the single anomalous partition this body field is allowed"
    follows: "sf-lex §4/Body (partitions vary with culture); audit §3 (Body review row)"
  - id: L-03
    term: ban
    gloss: "bone (the lineage substance; what remains of a person)"
    field: body
    layer: native
    route: root
    stage: E0
    class: noun
    axis: verticality
    evidence: design-choice
    etymology: "underived D2 root; the second half of the person beside ir: the breath leaves upward and the bones stay at the lineage cairn"
    sense_note: "the two-part person doctrine of this field — a winter guest taken into a household is said to be given bones, that is, a place in the lineage"
    follows: "sf-lex §4/Body (one soul-organ doctrine); cosmo §2 (the axis needs a built place — the cairn)"

  # ---- kinship (4): Omaha-skewed patrilineal, chosen before any term was coined
  - id: L-04
    term: las
    gloss: "lineage (the pasture-holding patrilineal descent group)"
    field: kinship
    layer: native
    route: root
    stage: E0
    class: noun
    axis: verticality
    evidence: attested-comparator
    etymology: "underived D2 root; the lineage is the property-holding unit of pasture rights, which is the social fact the terminology is chosen from (no universal chief, no assembly of witnesses)"
    follows: "kin §9 step 1 (economy and descent before terms); brief CP-06"
  - id: L-05
    term: wen
    gloss: "father"
    field: kinship
    layer: native
    route: root
    stage: E0
    class: noun
    axis: neutral
    coupling_note: "a descent term with no axis reading of its own; the field's axis duty is carried by the pasture-right records (L-04, L-18, L-36)"
    evidence: attested-comparator
    etymology: "underived; the everyday reference and address term of the father line"
    follows: "kin §1 (G+1 row); kin §8 (an address stratum is a decision, not an afterthought)"
  - id: L-06
    term: nen
    gloss: "mother"
    field: kinship
    layer: native
    route: root
    stage: E0
    class: noun
    axis: neutral
    coupling_note: "as wen: descent term; the Omaha fingerprint below is a structural note, not an axis claim"
    evidence: attested-comparator
    etymology: "underived; the mother term also absorbs the mother's brother's daughter, the read-off fingerprint of the Omaha skew chosen here for patrilineal pasture-holding lineages"
    follows: "kin §1 (Omaha fingerprint); kin §4 rule 4 (skewing derived from an Iroquois base)"
  - id: L-07
    term: nenter
    gloss: "mother's brother (the avunculate: he funds a nephew's first herd)"
    field: kinship
    layer: native
    route: derived
    construction: MATRI-SIDE
    bases: [nen]
    stage: E0
    class: noun
    axis: neutral
    coupling_note: "the cross-sex kin term; its axis work is economic (the first herd), not directional"
    evidence: attested-comparator
    etymology: "nen (mother) plus MATRI-SIDE; the opposite-sex sibling of the mother is the outside-man of the household — the atom-of-kinship role that is terminologically special in every system"
    follows: "kin §1 (the atom of kinship); kin §4 rule 1 (bifurcate terms kept distinct)"

  # ---- weather (5): the wind spine, coined one by one with a stated motivation
  - id: L-08
    term: su
    gloss: "wind"
    field: weather
    layer: native
    route: root
    stage: E0
    class: noun
    axis: wind
    evidence: design-choice
    etymology: "underived D2 root; wind is the medium of the breath and the carrier of news, oath and death, and every slope-wind word is built on it"
    follows: "sf-lex §4/Weather; cosmo §9 (direction lexemes from wind names)"
  - id: L-09
    term: hur
    gloss: "storm (the wind that takes animals and flattens the summer camp)"
    field: weather
    layer: native
    route: root
    stage: E0
    class: noun
    axis: wind
    evidence: design-choice
    etymology: "underived; the storm is an agent with a law, which is why the storm-breath hurir is the oath-keeper of this packet"
    follows: "sf-lex §4/Weather (each weather noun justified); brief CP-04 (wind is a register)"
  - id: L-10
    term: sin
    gloss: "snow"
    field: weather
    layer: native
    route: root
    stage: E0
    class: noun
    axis: verticality
