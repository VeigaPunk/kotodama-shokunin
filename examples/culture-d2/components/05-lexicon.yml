# kotodama-shokunin · round-3 component file · 05-lexicon (culture D2)
# NON-CANON sample design. No real culture and no real language is described;
# every form, gloss and etymology below is a design choice made inside this
# drill. Real-world statements, where they appear at all, cite this repo's
# corpus entries (see refs) and never an invented external source.
revision: 1.1
revision_notes:
  - "Round-4 naming repair: register the two name-only bases already proposed in 06-pantheon PAN-03 so huma + weha yields humaweha without deleting the vowel that keeps /m/ in an onset. These are design choices, not real-language attestations or added coverage headwords."
  - "Keep D2 citation forms separate from English garment descriptions; 13-naming carries the proposed GAR-01..10 forms and the unresolved pre-publication cross-cultural review, with owner integration explicitly pending."
naming_support:
  status: "NON-CANON repair support; the 40-record lexicon and its coverage counts below are unchanged"
  name_only_bases:
    - term: huma
      gloss: "shelter, low place"
      syllables: [hu, ma]
      evidence: design-choice
      source: "examples/culture-d2/components/06-pantheon.yml PAN-03 derivation"
      note: "Proposed cult-name register base, beside everyday tol (L-14); no historical sound change or donor language is claimed."
    - term: weha
      gloss: "wind, breath of"
      syllables: [we, ha]
      evidence: design-choice
      source: "examples/culture-d2/components/06-pantheon.yml PAN-03 derivation"
      note: "Proposed cult-name compound head, beside everyday su (L-08) and ir (L-01); not a new productive suffix or a replacement for SPIRIT."
  compound: {term: humaweha, bases: [huma, weha], construction: UP-COMPOUND, syllables: [hu, ma, we, ha], gloss: "shelter-wind, the wind that carries the last breath below"}
  garment_name_policy: "13-naming cross_component_repairs records D2 descriptive citation names, not new material terms or a fabricated donor lexicon. Match them to 11-costumes by GAR id, retain the full English garment descriptions in gloss/note fields, and keep native exonyms distinct from the imported-cloth loan words still requested by 11's form_slots_note."
  integration_gap: "06/07 must adopt the PAN-03 spelling consistently and 11 must put the D2 forms in its gate-facing garment fields; tools/assemble-d2.py currently copies those owner fields unchanged. No owner file or assembler is edited here."
component: 05-lexicon
culture: D2
canon: not canonized (D2 design drill)
status: "round-3 design record, 2026-10-17; revised to the coupling contract delivered in 01-brief.yml (adopted after first draft); supersede-by-new-file only"
packet_keys: [lexicon]
acceptance_claimed: A-04
acceptance_delta: "A-04 floors assume a >= 60-record lexicon (weather >= 10, landscape >= 10, loan >= 6, sacred >= 4, taboo >= 2, native >= 40, seven fields >= 4 each). This file carries the dispatched 40-record drill scope: body 3, kinship 4, weather 5, landscape 5, subsistence 7, war 3 (of seven fields, body and war below the A-04 count floor), religion 5, costume 2, social_order 2; native 34, loan 2, sacred 3, taboo 1. The delta is declared, not hidden: expanding to the A-04 floors is a dispatcher decision, and the record shape here is already contract-complete so expansion is additive."
registry_reconciliation: "RCN-02 row: file examples/culture-d2/components/05-lexicon.yml; packet_keys [lexicon]; accepted ID prefix L- (L-01..L-40, contract format); spine_coupling declared below; follows declared below; acceptance claimed A-04. Note for the integrator: 01-brief registry row C-04 attaches the lexicon packet key to the stem 04-lexicon while this round's dispatch names the stem 05-lexicon (and 04-orthography.yml exists on disk); both files' own component values govern and packet_keys are the binding identity, so the lexicon key resolves to this file."
value_aliases: "route values follow the gate's vocabulary so the executable audit stays strict: derived = the contract's 'derivation'; loan = the contract's 'loan' (the gate reads borrowed-ness from `layer`, not `route`); lexicalized is one declared extension (the taboo fossil record, taboo §5) and maps to the contract's 'root' only in an assembly sense, since the fossil is not underived. No other value differs."
era_usage: "records use the contract tag space E0-E3 only, and only E0/E1/E2 are occupied; E3 (reserved) is not touched here. Era names and dates are component 09's (ER- ids) and are not asserted in this file."
spine_coupling: "verticality: the two poles and their camp loci (bel, tol, sara/sara-accented pair, kol) carry the place vocabulary, the snow-line is a vertical band, the high licks carry the salt economy, and the tally geometry itself is vertical. wind: su is a core root, the storm is the law (hurir), the oath is sworn in moving air (suwal, wal), the soul travels as breath (ir, belir), and meat is preserved by the upslope wind (tasur). Every record carries axis:, and neutral records carry the coupling_note that RG-05 requires."
scope: "one declared language-stage set (the D2 core across the contract's tag space); dialect and register variation is out of scope and belongs to the register component"
brief: "D2 is a highland-plateau pastoralist culture: vertical transhumance between winter valley shelters and summer high pastures; sky- and wind-oriented cosmology; clan-segmentary lineages holding pasture rights; a herd economy (wool, milk, meat) with salt and dried-meat trade to lowland farmers; a pitch-accent language isolate; pre-script tally-knot records, with a lowland script adapted at the E0/E1 seam. Design spine: VERTICALITY and WIND. Contrast profile: D2 is not D1 — no river, bank, flood or tying-as-obligation material is imported (see d1_overlap_scan)."

