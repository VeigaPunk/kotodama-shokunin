follows:
  - "sf-lex §6 (decision table, row 'steppe pastoral'): the row licenses deepening subsistence (herd wealth), kin (clan), war (raid) and landscape (pasture) and leaving sea/coast vocabulary as a noted gap; this component adapts the row to a highland brief, and its one declared deviation is weather (kept at 5 because the spine is wind, not because the row asked for it)."
  - "sf-lex §4/Weather: weather words are coined one by one with a stated motivation (wind by direction of travel, snow by vertical band) instead of a word-count flourish; the N-words-for-snow hoax is not copied (sf-lex §4/Weather, §7)."
  - "sf-lex §3 (borrowability strata): religion, war, dress, cuisine, trade and administration are the high-borrow fields. That licenses exactly two loan strata here (a salt-road tally word at E1, a script word at E2) and a costume stratum that stays native because D2 is the fiber exporter, not the receiver (textile §2, §6)."
  - "sf-lex §3 (change routes) + §7 checklist: every non-root coinage names its route (derivation, compound, loan, fossilised lexicalisation) in its etymology."
  - "kin §1 and §4 rule 4 (Omaha skewing): the terminology type is chosen from descent and property before any term is coined — patrilineal pasture-holding lineages take the Omaha skew — and the skew is recorded as a fingerprint note on the mother term rather than as a copied list."
  - "kin §9 steps 2-5: reference forms, a register stratum, and terms still pending are carried as held-out derivation tests rather than as half-built entries."
  - "audit §3 (seven-field coverage matrix): all seven fields carry entries, and coverage_notes gives need-by-need rows with covered / gap / excluded-with-reason marks."
  - "audit §4 (derivational consistency): every derived entry names its construction and bases, and derivation_tests preserves held-out bases and boundary cases for the productive constructions."
  - "audit §6 (loan-layer coherence): each borrowed lexeme links to a declared layer carrying donor, donor stage, entry stage, channel, contact window and the adaptation substitutions that reproduce the recorded form; the layers are held inside the domains CP-08 permits (trade, measures, salt, script)."
  - "audit §7 (era-staging): the trade record word is staged at E1 and the script word at E2, keeping naming dates and material availability separate."
  - "trade §2 (weights and measures; counting technology) and RG-01: the tally is a counting device read by knot height, and the pass toll is counted and tallied rather than minted as a coin."
  - "taboo §3-§5: one deep taboo (the dead) yields one fossilised circumlocution nobody analyses (tolsa) plus a declared name-avoidance rule; a live ladder and a minced-oath slot are reserved for the register component."
  - "textile §2 and §6: wool is the state fiber and its toolchain is native, so this component coins a native fiber word and one native garment floor term and leaves the full route to the costume component (CP-09)."
  - "cosmo §2 and §9: a vertical world-axis needs built expression plus a ritual before it is credited; D2 names the axis by its two poles and their camp loci and coins winds from those poles, with direction built from wind names rather than from watercourse metaphors (which would be D1 imagery)."
  - "brief (01-brief.yml) CP-03, CP-04, CP-05, CP-07, CP-08, CP-11, RG-01, RG-05, RG-07, and contract.era_tags/record_fields: axis and evidence on every record, era tags from the fixed space, pitch accent kept as pitch accent, and loans confined to the declared domains."
  - "contact §4, §6, §10 (borrowability, adaptation, stratigraphy) and mini §8 (the D1 fixture lexicon used for the required overlap scan)."

