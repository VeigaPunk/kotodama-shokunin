  - "Pitch accent is not tone: tones is 0, no tone contrast is claimed, and the accent pair is a peak-placement contrast within 02's system (CP-05, RG-07)."
  - "The ir and su colexification (breath and wind) is a design choice, not a universal; it is flagged (to-verify) for a CLICS3 check before it is used as an argument, per sf-lex §3."
  - "Kinship frequencies are not claimed here. Omaha type is a minority pattern in the Ethnographic Atlas sample (kin §1); it is chosen because pasture-holding patrilineages select for it, and the choice is a prior, not a law (kin §2)."
  - "Borrowability strata (sf-lex §3) are tendencies, not prohibitions: the thin costume loan stratum is a consequence of D2 being the fiber exporter, not a claim that dress vocabulary is never borrowed."
  - "No glottochronological date appears anywhere in this packet; only era tags, stage names and relative order (sf-lex §2, §7)."
  - "No absence-of-word claim is made about the culture: the missing body-state and war-refusal verbs are declared gaps of this component, and per sf-lex §5 a missing word proves nothing about what speakers can say."
  - "Size floors are this project's acceptance policy, not universals; A-04's floors are not met and the delta is declared at the head of this file."
  - "The D1 scan above is a design-record scan, not philological proof: it establishes that no form, sense or image was imported, not that cultural influence is impossible."

floor_note: "The Swadesh-100 floor and its periphrasis strategy are not carried in this component; the 40-term budget is the culture-word drill. The floor, the water and weather items of the floor, and the daily-register verbs are scheduled as separate deliverables (sf-lex §6 method step 1). Items adjacent to this drill are absent by scope and not by judgement."

handoff:
  - "02-phonology: the sara pair senses are assigned here, discharging the handoff 02 names; the accent marks in this file follow RG-07 (contrastive, one per form)."
  - "03-morphosyntax: the eight constructions are this component's only morphological claim; a different affix inventory there makes these records the finding."
  - "06-pantheon and 07-myths: belir and hurir are epithet material; the storm as oath-enforcer and the upslope wind as soul-carrier are the two beliefs this lexicon assumes."
  - "09-eras-calendar: era candidate names Korne (E0), Kolne (E1), Perne (E2) are offered through the ER- namespace; dates and internal seams are theirs."
  - "10-materials and 11-costumes: mir and mirken are the fiber and garment floor; any imported cloth word must arrive with a declared layer or not at all."
  - "12-rank-rules: lasin and belin are task-ranks read off pasture rights; rank display is theirs."
  - "14-kin-address: L-04 to L-07 are the lexicon side of descent, the avunculate and the Omaha skew; the K- mapping is an assembly step."
  - "15-pragmatics and the register component: the taboo stratum (tolsa with its sanction), the elder register (lasin) and the fair-court register (suwal) are the three register hooks this component leaves open."

canon_boundary: "Everything above is a non-canon design proposal with its own evidence trail. It records no canon, decides nothing about the world, and asserts no real-world fact; real-world statements are citations of this repository's corpus entries, and the one uncertain design choice (the ir and su colexification) is flagged to-verify. Canon decisions, and any reconciliation with D1 or with the world bible, belong to lore-shokunin."