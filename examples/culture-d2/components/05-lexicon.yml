phonology:
  authority: "02-phonology owns the inventory and the accent analysis (P- records). The block below is a subset view used only to check the forms recorded in this file."
  consonants: [p, t, k, b, d, g, m, n, s, r, l, j, w, h]
  vowels: [a, e, i, o, u]
  phonotactics: "(C)V(C)"
  phonotactic_notes: "coda set {n l r s}; no onset clusters; no geminates; no contrastive length. All 40 forms in this file were machine-checked against this template (derivation_tests records the check)."
  tones: 0
  notable_rules:
    - "s → ∅ / _#"
  rule_witness_note: "the rule is witnessed by las (lineage) against lasin (lineage head), where the suffix keeps the s; the orthography is phonemic throughout, so recorded forms carry the s."
  accent_note: "the accent system is 02's: one high peak per word, early by default, with a licensed rightward ('up the slope') shift and a minority final-peak class. This file writes an accent mark only where it is contrastive, one mark per form, and records exactly two such forms (the sara pair below). No tone contrast is claimed anywhere (CP-05)."
  loan_adaptation_note: "donor aspiration simplifies on entry (bh to p, dh to t) and donor sh to s; the substitutions are declared per layer in the layers block, and their source forms are outside the D2 inventory by design."

eras: [E0, E1, E2, E3]

era_notes:
  - "E0 (pre-script knot era): the knot era of the two pastures; everything underived and every native coinage of this packet is E0."
  - "E1 (script-arrival seam): the lowland partners come over the pass; the salt road opens, the tally-sheet arrives, the slope winds are standardised for travellers, and the fair formula is coined."
  - "E2 (literate anchor): the borrowed script is normal in administration, and the D2 word for the borrowed mark is current."
  - "E3 is reserved and untouched here; era names and dates belong to component 09, and the candidate names this component designed (Korne for E0, Kolne for E1, Perne for E2) are offered to 09 through the ER- namespace, not asserted."

pitch_accent:
  - pair: [sára, sará]
    glosses: ["the winter camp locus (the spot the lineage holds on the valley floor)", "the summer camp locus (the spot the lineage holds on the ridge)"]
    rule: "one peak per word; the peak held early keeps the word down in the valley, and the peak moved rightward sends it up the slope — 02 delivers the mechanism (P- accent rules) and this component assigns the two senses, which is the pending handoff 02 names."
    note: "these are the only accent-marked forms in this file; RG-07 is satisfied (contrastive, one mark per form). No third accent pair is coined here."

constructions:
  - name: LOC
    pattern: "B1-ra"
    base_classes: [noun]
    output_class: noun
    productivity: productive
    available_from: E0
    description: "a place or span of B1 — the ground where the thing holds or is worked; bases ending in r take a different locution and are excluded by design"
  - name: AGENT
    pattern: "B1-in"
    base_classes: [noun]
    output_class: noun
    productivity: restricted
    available_from: E0
    description: "the keeper or taker of B1; eligible bases are herd, pasture, land, war-band and lineage bases; mass and abstract bases (ir breath, su wind, wal oath) are excluded"
  - name: SPIRIT
    pattern: "B1-ir"
    base_classes: [noun]
    output_class: noun
    productivity: restricted
    available_from: E0
    description: "the breath of B1 — the spirit suffix is the breath root itself; used for the wind-working terms of the sacred stratum only"
  - name: WIND
    pattern: "B1-su"
    base_classes: [noun]
    output_class: noun
    productivity: productive
    available_from: E1
    description: "the wind that comes off the place or slope B1; standardised at the E1 seam as the slope-wind set travellers and herds are warned by"
  - name: MATRI-SIDE
    pattern: "B1-ter"
    base_classes: [noun]
    output_class: noun
    productivity: restricted
    available_from: E0
    description: "the opposite-sex sibling of a parent-generation base B1 (the bifurcate term); eligible bases are parent kin terms only (nen, wen)"
  - name: UP-COMPOUND
    pattern: "B1-B2"
    base_classes: [noun, noun]
    output_class: noun
    productivity: productive
    available_from: E0
    description: "a qualifying compound: B1 (usually a vertical pole or a medium) qualifies B2"
  - name: PROCESS
    pattern: "B1-ur"
    base_classes: [noun]
    output_class: verb
    productivity: restricted
    available_from: E0
    description: "to work B1 into keepable form; eligible bases are foodstuffs and materials; kin and abstract bases are excluded"
  - name: GARMENT
    pattern: "B1-ken"
    base_classes: [noun]
    output_class: noun
    productivity: restricted
    available_from: E0
    description: "a wrap made of the material B1; eligible bases are fiber and hide bases only"

