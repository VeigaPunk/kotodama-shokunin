d1_overlap_scan:
  - "Required by A-04 against mini §8 (the D1 fixture lexicon) and reported here as this component's self-report; the reviewer's run governs (RG-06)."
  - "Method: edit distance from each of the 40 forms in this file to each of the 20 headwords and 4 name forms of mini §8, computed at write time."
  - "Result: exact collisions 0; distance-1 near forms 0; distance-2 pairs 38 (for example sara/sena, kor/kera, ral/fala). Distance-2 pairs are the expected consequence of a five-vowel inventory shared with the D1 fixture and are reported rather than smoothed away; no shared form carries a shared sense."
  - "Sense-domain overlap: none. D1's glossary is cloth, bank, watercourse, knot-as-obligation, dwelling, witness, ochre; this file's fields are pasture, herd, wind, snow, lineage, salt and record."
  - "Bans this file can answer: D1B-01 no river, bank, tide or flood term, image or gloss; D1B-02 no tying, binding or knot-as-obligation material — kor carries record geometry only and RG-01 governs it; D1B-03 no flax, bast, reed or field-fiber vocabulary, the native fiber being wool; D1B-05 no /p/ to /f/ law and no penultimate-stress claim; D1B-06 the scan above; D1B-07 no public-oath institution or rotating delegate witnesses — governance here is lineage pasture rights, and suwal is a ritual formula attendant on a bargain, not an assembly; D1B-09 pastoralism is this file's core economy, not offstage color."
  - "Bans this file cannot answer, handed to their owners: D1B-04 (the script block is the orthography and records components'), D1B-08 (the comparator package is a phonology/morphosyntax question), and the name-ledger collision run (08's acceptance). The segmental inventory of this file is a sound inventory, not a letter inventory: it overlaps D1's letter-ID list in the consonants any five-vowel highland language would share, and this file declares no letter values."

