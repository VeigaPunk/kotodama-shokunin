# Productivity test (method §5 R7: three fresh compounds per audit round).
# ---------------------------------------------------------------------------
productivity_test:
  - {compound: "slate knot on a white cord", expected: "DECODED — an obligation spoken in the open, therefore enforceable at the gate", competing_reading: "a gate-oath token rather than a debt", reader_group: "knot-keepers; carriers infer only that the wind has heard something"}
  - {compound: "grey bundle at the gate", expected: "DECODED — a death on the road, not yet counted; the descent count will close it", competing_reading: "an abandoned load (carriers' reading)", reader_group: "all adults"}
  - {compound: "white cord in the whistler's field", expected: "UNINTERPRETABLE — no licensed composition (a herd mark has no reading in a burrowed place); expected behaviour is refusal plus suspicion of hidden account", competing_reading: "none licensed", reader_group: "all; the refusal is the design's own negative case"}
  - {compound: "bird over the gate at dawn", expected: "INFERRED — either weather turning or a death being escorted; the grammar does not decide", note: "shows that INFERRED is a legitimate state, not a failure (consistency rules §9)"}

# ---------------------------------------------------------------------------
# Emic exegesis samples — the grammar spoken in-world WITHOUT framework
# vocabulary (method §5 R8: in-world exegesis is numerology and riddle
# tradition, never an alignment matrix).
# ---------------------------------------------------------------------------
emic_exegesis_samples:
  - "Riddle of the cord (knot-keepers, at the year's close): 'Two colours I carry, one road I ride, and when I am read from the top the year is already decided.'"
  - "The count-sayer's line: 'Up and down are one count read twice; the wind heard both readings.'"
  - "The antiquarian squabble: whether the rising star and the setting star are one body walked up and down the sky (the doctrine) or two signs (the calendar office's rival reading). Both speak in riddles; neither says 'register' or 'domain'."
  - "Outsider error to keep as period flavour: a roadward clerk writing that the highlanders 'worship a bird and a nail' — wrong on both, and the wrongness is datable to E4."

# ---------------------------------------------------------------------------
# Variance warnings — the ports that are FORBIDDEN in this culture, and why.
# ---------------------------------------------------------------------------
variance_warnings:
  - {id: V1, ban: "white = bridal purity / white = purity at all", why: "white bridal purity is post-1840 European fashion; there may be no unqualified 'white = X' sentence in any handoff (color-symbolism §11)", local_rule: "white = HERD-YIELD, the undone material"}
  - {id: V1b, ban: "white = mourning", why: "that is the lowland partner's code, not D2's; D2 mourning is grey (S3). A cross-border misreading scene is allowed and should be labelled intended-under-code-A / inferred-under-code-B (consistency rules §6)"}
  - {id: V2, ban: "black/slate = evil or sin", why: "moral-dark dualism is a Zoroastrian-Christian-European genealogy, not a human default (color-symbolism §5, §11); D2's dark carries law and shelter, never sin"}
  - {id: V3, ban: "purple = royalty; gold = the gods", why: "not portable status symbols, and neither chromophore exists in this biome's available dyestuffs; do not import a prestige ladder that has no dyes behind it (color-symbolism §10)"}
  - {id: V4, ban: "any knotting/binding/tying as a cosmic principle", why: "D1's design spine; D2's knots count and nothing else; oaths ride the wind and are carried, not bound"}
  - {id: V5, ban: "totemism as a culture type; 'they worship the totem'", why: "the stage theory is demolished (animal-symbolism §2); house-marks are rights to display, and the misnomer is only allowed in an outsider's mouth"}
  - {id: V6, ban: "imported funerary exotica or a rebirth-cycle doctrine", why: "the sky-sending rite's cut, authority and calendar are 06/07/era decisions, and a rite imported without its institutions reads as decoration (tibet.md §5: audit medium, authority and attribution)"}
  - {id: V7, ban: "multiple boundary-straddlers", why: "one anomaly per major boundary; more dilute the taboo (method §4.2)"}
  - {id: V8, ban: "7, 12, and other unenumerated numbers; a colour wheel or any hue-circle language", why: "no enumerator exists in D2 counting life (number-symbolism §1); hue-circles are post-Newtonian habits and anachronistic here (color-symbolism §2)"}
  - {id: V9, ban: "a Pleiad-style lost-sister narrative; a moon goddess / sun god default", why: "the six-or-seven motif is a convergence-or-diffusion test case, not free content (celestial §5); sun/moon genders are local and are 07's decision (celestial §2)"}
  - {id: V10, ban: "'blue = sky' licensing 'all slate garments are priestly'", why: "a colour word, a material colour, a ritual value and a political emblem are four different systems — corpus/knowledge/civilizations/mongol.md §'Symbolic system — anchor meanings to an event'"}

