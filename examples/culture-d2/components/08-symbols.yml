      - {operator: borrowing, reading: "the roadward calendar name, donor marked (M5)", occasion: "script-era documents", readers: "script-trained few", evidence_status: "PROPOSED; term pending(03.lexicon[].term)"}
    couples: ["07 (PENDING: is the dawn 'watched by' anyone, or does the office own it?)", "eras (the ascent date is an era-staged calendar fact)", "06 (ascent dress keyed to the rising)", "world latitude (to-verify)"]
    follows:
      - "corpus/knowledge/myth-symbol/celestial-symbolism-calendars.md §5 (the calendar star; hemisphere/latitude decides the festival)"
      - "corpus/knowledge/myth-symbol/celestial-symbolism-calendars.md §8 (calendar machinery; who owns the year)"
      - "corpus/knowledge/myth-symbol/celestial-symbolism-calendars.md §10 step 1 (fix latitude and hemisphere before festival dates)"
    notes: "Variance guard V9: no 'lost sister' / seven-sisters narrative is imported; the cluster's in-world story is 05/07's to write, and the perceptual six-or-seven debate is flagged as convergence-tested (celestial §5)."

  - id: S10
    sign: "the gate (the pass; the fifth slot; the one place where up and down are the same place)"
    register: direction
    era: "E1+; E2 drift M1/M5 — the salt and dried-meat road formalizes the gate market; E4 drift M3 — the first writing done on the plateau is the partner's bill, produced at the gate (seed: script arrives late by adaptation)"
    audience: "oath-takers, carriers, the lowland partner (who recognizes the gate but not the oath grammar); those barred from the high assembly may still speak at the gate, which makes the gate the code's political safety valve"
    domain:
      id: LIMINAL-PASS
      definition: "the crossing as an institution: the oath place, the market, the place where the world-axis is walked instead of drawn"
      includes: ["oaths sworn at the cairn", "first and last trade of the year", "the barred speaker's one hearing"]
      excludes: ["the high assembly's pasture law (that is UP-WARD)", "household agreements (SHELTERWARD)"]
      contrasts: "UP-WARD and DOWNWARD both claim legitimate speech; the gate's contrast is that there the two are indistinguishable, which is why only the gate can license a crossing claim"
    ground:
      type: index
      statement: "the pass is where the wind is strongest and the road actually crosses; oaths are sworn there because the wind is the witness (AX-2) — the material fact of the geography carries the institution"
    carrier: "the pass-collar (patterned white x dark cord on every animal crossing) — pending(06.costumes[] record); the cairn itself is a landscape record for the era/architecture component"
    satellites:
      - {operator: metonymy, reading: "'the gate' = the oath itself ('he was at the gate with him')", occasion: "assembly recall", readers: "all"}
      - {operator: borrowing, reading: "the roadward name for the pass, donor marked (M5)", occasion: "gate market", readers: "traders", evidence_status: "PROPOSED; term pending(03.lexicon[].term)"}
      - {operator: ritual inversion, reading: "at the crossing of the year's first flock, the barred and the debt-bound walk through in the flock's dust, and their ordinary standing is restored at the far cairn", occasion: "gate rite", readers: "all; bounded, ends at the far cairn"}
    couples: ["06 (pass-collar pattern cell)", "07 (PENDING: does any power hold the gate, or is the gate held by the wind itself?)", "eras (E2 road, E4 script)"]
    follows:
      - "corpus/knowledge/myth-symbol/symbolism-synthesis-method.md §4.5 (frame of reference first; landmark frames, not compasses)"
      - "corpus/knowledge/myth-symbol/color-symbolism.md §5 (pattern symbolism is a separate channel — the gate is the code's pattern cell)"
      - "corpus/knowledge/synthesis/symbolism-consistency-rules.md §5 (ritual inversion needs its bounded trigger and restoration)"
    notes: "The gate is the only slot where the direction register admits an outsider's term without loan-dating risk: the pass is a place both cultures must name, so borrowing here is expected, not suspicious (loans pre-dating E2 at the gate are (to-verify))."

# ---------------------------------------------------------------------------
# Composition rules — the grammar must be able to refuse, and to make a
# malformed combination visibly wrong (method §4.1 graphic constraint; the
# tincture-rule analog).
# ---------------------------------------------------------------------------
compositional_rule:
  id: CR-1
  name: "one cord, two colours"
  syntax: "knot colour (white = own herd / dark = owed) x knot shape (station knot) x cord colour (white lineage cord / slate trade cord); cords are read from the top knot, which is tied at the gate"
  admissible: ["white cord with white and dark knots", "slate trade cord with dark knots and counter-marks added at the gate"]
  inadmissible: ["a lineage house-mark and a slate trade knot on the same cord — the visible forgery (a malformed combination, like colour-on-colour in heraldry)"]
  decoding_states: ["DECODED (licensed reading)", "INFERRED (a reader's contextual guess)", "UNINTERPRETABLE (no licensed composition — the reader must refuse)"]
  negative_case: "a house-mark plus slate knot is UNINTERPRETABLE by rule, not by taste; the expected behaviour is refusal plus an accusation of forgery (consistency rules §9)"
  mode_marker: "mark, not hue: the gate slot's colour cell is a PATTERN, so a hue-only audit would silently drop half the code (color-symbolism §5 pattern channel)"

# ---------------------------------------------------------------------------
# Enforcement artifacts (color-symbolism §12 step 6: codes live in courts).
# ---------------------------------------------------------------------------
enforcement_artifacts:
  law:
    id: LAW-1
    name: "the open-flap oath"
    text: "No hood, no scarf, no wrapped head while swearing; the slate worn outside the white; a herd claim whose oath is taken covered is struck from the cord for one year."
    penalty_type: "counted time, not goods — the fine is expressed in knots (the debt stays on the cord one year longer)"
    couples: ["06 (wear rule, pending(06.costumes[].wearer_rank / rite))", "S1", "S7"]
  taboo:
    id: TAB-1
    name: "the whistler's ground"
    text: "No lineage count is read aloud where the ground is burrowed. Counts are read in the open, or under a roof with the cord visible to all parties (AX-3: the record substitutes the witness)."
    couples: ["S6", "S7", "06 (the where-counts-may-be-spoken rule interacts with dress and shelter)"]
  proverb:
    id: PRV-1
    text: "The wind keeps no knots; it keeps the words."
    note: "the one-line boundary against D1's binding-spine: records are knotted, oaths are not tied"
  heraldic_tincture_analog:
    id: TIN-1
    text: "A cord carries two colours and no more; the third colour must be a counter-mark, and a counter-mark is always the gate's, never a house's."
    note: "makes the forgery visible; couples old and new code layers (the slate is E2's, the counter-mark institution is E2's, the cord is E1's)"

# ---------------------------------------------------------------------------
# Era transitions — every meaning is date-stamped with a mechanism M1-M6
# (drift law 1). Closure survives change: when one slot re-keys, its aligned
# slots are re-audited the same round (drift law 3).
# ---------------------------------------------------------------------------
era_transition_table:
  - {id: T1, scope: "STORMWARD / colour", mechanism: M1, old: "bog-dark (shelter dark)", new: "storm-slate (traded indigo over bog iron)", bridge_uses: "the dark cloak first worn on the road by carriers", adoption_interval: "E1 to E2, unevenly over about two generations", agents: "gate carriers and the assembly (who needed a colour the whole camp could see from the high ground)", dissent: "valley households kept hearth-dark and called the slate 'road cloth'", residues: "hearth-dark idiom for a roofed, non-binding talk", evidence_status: "PROPOSED", coupled_review: "06 dye access; 03 loan of the indigo word (M5)"}
  - {id: T2, scope: "DOWNWARD / colour", mechanism: M6, old: "grey = the ordinary descent count", new: "grey also = famine-year colour", trigger: "the summer of losses (date pending the era component)", adoption_interval: "E3 onward", agents: "valley households", dissent: "counters resisted widening the colour, to keep the count exact", residues: "grey verbs in the descent count", evidence_status: "PROPOSED"}
  - {id: T3, scope: "number / cord", mechanism: M3, old: "cords are the trade record", new: "script bills are the trade record; the cord is ceremonial and proverbial", bridge_uses: "gate bills first, then year-end settlement", adoption_interval: "E4, slow; the assembly kept cords for pasture law long after the road gave them up", agents: "the lowland partner's clerks and the knot-keepers (who kept the office and lost the function)", dissent: "the top-knot dispute — knot-keepers insisted a written bill cannot be closed in the open because paper cannot be read by the wind", residues: "'the top knot' idiom; ceremonial cords at gate rites", evidence_status: "PROPOSED", coupled_review: "writing-systems component; 03 lexicon of the borrowed script terms"}
  - {id: T4, scope: "S5 / script-era split", mechanism: M5, old: "the bird carries the breath", new: "rival reading — the writing is the message", donor: "the lowland trade partner", adoption_interval: "E4, restricted to the script-trained few", dissent: "the bird reading is unchanged among mourners; the two readings coexist", residues: "the circumlocution chain is unaffected (taboo is older than the script)", evidence_status: "PROPOSED"}
  - {id: T5, scope: "THE-GATE / animal", mechanism: M5, old: "pack-ox works the crossing", new: "road-mule (imported) works the crossing at the gate; the ox stays on the high path", adoption_interval: "E4", agents: "the lowland partner's carriers", residues: "house-marks retain the ox long after the road forgets it (heraldic lag, animal-symbolism §7)", evidence_status: "PROPOSED"}

drift_laws_check:
  law_1_date_stamped: "every sign carries an era string; every transition carries a mechanism label"
  law_2_no_retro_projection: "no sign's present reading is used to explain an earlier one: T1 runs E1 to E2 with a fossil; T3 forbids reading the script era's writing back into E1 cords; the gate's oath grammar is E1+ and is NOT retro-explained by the E4 script"
  law_3_neighbour_audit: "after T1 (storm colour re-key) the aligned slots were re-audited: STORMWARD animal (S5, unchanged), the assembly wear rule (LAW-1, revised to name the slate explicitly), the gate oath formula (unchanged)"
  law_4_fossils: "one fossil per era minimum: E1 hearth-dark; E2 'road cloth' (as the older generation's name for slate); E3 the exactness dissent in the count; E4 'the top knot'"

