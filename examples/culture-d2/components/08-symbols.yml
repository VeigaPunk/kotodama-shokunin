component: 08-symbols
culture: D2
canon: not canonized (D2 design drill)
status: "PROPOSED — every record below is non-canon sample design; handoff is reference-only (AGENTS.md; method §10)"
rev: "round-3 drill, 2026-10-17, worker W08"
spine: "verticality (up/down, ascent/descent, seasonal poles) + wind (breath, soul-carrier, storm law)"
spine_boundary: "D1 imagery is excluded by construction: no river, no water cosmos, no binding-as-cosmic-principle. Knots appear ONLY as tally records on pack gear (per the D2 seed, pre-writing tally-knots); they count, they do not bind. Oaths are spoken into the wind, and the wind carries words; it does not tie them (variance warning V4)."
registers: [color, animal, number, celestial, direction]

partition:
  n: 5
  declared_first: "direction frame (method §4.5: the frame of reference is declared before any color or animal is assigned to a direction)"
  frame: "landmark/vertical + wind, NOT cardinal compass: UP-WARD (higher ground, the open top), STORMWARD (the quarter the weather comes in from), DOWNWARD (toward the valley floor), SHELTERWARD (the roofed winter side), THE GATE (the pass where up and down are one place). A compass would be meaningless here; every term is walkable."
  recurrence: "the same five slots recur as the five stations of the year (ascent, high stay, descent, low stay, gate crossing). Practice counts them: five stations per crossing, two crossings per year, ten knots per cord. The partition is the culture's real arithmetic, not an aesthetic choice (method §3 step 2; number-symbolism §1)."

polarity_axes:
  - {id: AX-1, axis: "upward / downward", use: "the vertical spine; inversions run here first (method §5 R6)"}
  - {id: AX-2, axis: "wind-reached (said in the open, under sky) / roofed (said under a roof)", use: "the witness axis, not a purity axis: what the wind can hear is enforceable at the gate"}
  - {id: AX-3, axis: "counted (carried on a cord) / uncounted (carried only by the wind)", use: "the ledger axis; generates the small class of legitimate roofed readings (where the cord, not the wind, is witness)"}

eras: ["E1 shelter era", "E2 road era", "E3 assembly era", "E4 script era"]
era_records:
  - {id: E1, label: "shelter era", note: "pre-road highland year; no traded dyestuff; undyed and bog-dark wool; cords are the only record. Labels are local handles — reconcile with the era component's eras[] at integration (PENDING interface)."}
  - {id: E2, label: "road era", note: "the salt and dried-meat road opens with the lowland partner; traded indigo arrives; the gate market formalizes"}
  - {id: E3, label: "assembly era", note: "clan-segmentary pasture disputes consolidate into the open-sky assembly; the oath grammar is written nowhere because there is nowhere to write"}
  - {id: E4, label: "script era", note: "script arrives late by adaptation from the lowland trade partner (seed); trade accounts begin to leave the cord; the cord's meanings become ceremonial and fossil"}

# ---------------------------------------------------------------------------
# Alignment matrix — rows are the declared direction-frame slots, columns the
# other four registers. One cell is deliberately UNALIGNED with its reason and
# its in-world doctrine (method §3 step 4: preserve the lump; §5 R2). Lumps are
# where in-world controversy lives.
# ---------------------------------------------------------------------------
alignment_matrix:
  columns: [color, animal, number, celestial]
  rows: [UP-WARD, STORMWARD, DOWNWARD, SHELTERWARD, THE-GATE]
  cells:
    - {row: UP-WARD, col: color, value: "S2 fleece-white", basis: "the legitimate claim is performed upward, and the clip climbs in its own undyed wool"}
    - {row: UP-WARD, col: animal, value: "S4 pack-ox", basis: "leads the ascent, carrying the harness cord that makes the claim a record"}
    - {row: UP-WARD, col: number, value: "5", basis: "one crossing = five station-knots; the outbound cord is knotted on the climb"}
    - {row: UP-WARD, col: celestial, value: "S9 ascent-star (rising face)", basis: "the cluster's first dawn rising opens the climb; the whole camp reads it (tolerance in S9)"}
    - {row: STORMWARD, col: color, value: "S1 storm-slate", basis: "the open top is where weather arrives; the slate is worn open at the assembly"}
    - {row: STORMWARD, col: animal, value: "S5 wind-rider bird", basis: "rides the same upslope wind the herders use; seen before the weather turns"}
    - {row: STORMWARD, col: number, value: "10", basis: "the whole cord is read aloud in the open at the high assembly — accounts need the wind as witness (AX-2), so the full number belongs to the exposed slot"}
    - {row: STORMWARD, col: celestial, value: "S8 axle-star (whole turning sky)", basis: "at the high stay the sky is watched all night around the unmoving light"}
    - {row: DOWNWARD, col: color, value: "S3 ridge-grey", basis: "losses are counted on the way down; the grey is the color of what did not come back"}
    - {row: DOWNWARD, col: animal, value: "lead-ewe", basis: "leads the descent by memory; slot member only, NOT a registered sign (consistency rules §4.7: no automatic symbolic promotion)"}
    - {row: DOWNWARD, col: number, value: "5", basis: "the return crossing is the same cord read from the other end — the doctrine 'up and down are one count read twice'"}
    - {row: DOWNWARD, col: celestial, value: "S9 ascent-star (setting face)", basis: "its evening setting closes the descent; the calendar office holds the rival two-sign reading (see S9)"}
    - {row: SHELTERWARD, col: color, value: "bog-dark (hearth-dark)", basis: "fossil, not a sign: the shelter-era dark that the storm slot occupied before traded indigo re-keyed it (see S1 era table; drift law 4 keeps one fossil per era)"}
    - {row: SHELTERWARD, col: animal, value: "S6 rock-whistler", basis: "lives on the high ground but winters under it — it takes the low road without descending"}
    - {row: SHELTERWARD, col: number, value: "1", basis: "the shelter-knot: the whole winter's summary kept as a single knot indoors"}
    - {row: SHELTERWARD, col: celestial, value: "UNALIGNED", reason: "the valley shelters are roofed and the valley horizon is walled; sky-reading is not a low-station practice. No star is assigned — and none is to be invented (method §3 step 4; consistency rules §4.6).", in_world_doctrine: "'the valley keeps no stars' — the sheltered world is the unwitnessed world, which is why roofed readings must show the cord instead (AX-3)", consequence: "star-delayed cases: disputes that need wind-and-star witness wait for the next ascent; the low courts cannot close them. A structural deferral rule, not a decorative gap."}
    - {row: THE-GATE, col: color, value: "PATTERN, not a hue: the pass-collar (white x dark braided cord)", basis: "the gate slot is marked by pattern, not by a color — the code's second channel (color-symbolism §5: pattern is a separate symbolic channel). Pattern entry, not an UNALIGNED cell."}
    - {row: THE-GATE, col: animal, value: "road-mule (imported)", basis: "the only animal that belongs to the crossing and never stays; donor = the lowland trade partner (M5), species local name pending the lexicon component"}
    - {row: THE-GATE, col: number, value: "5", basis: "the fifth slot counts as a station in its own right; the fourth station plus the crossing make the journey countable in fives, never in fours"}
    - {row: THE-GATE, col: celestial, value: "the sun-notch", basis: "a horizon feature of the gate ridge where the sun first strikes on crossing days — a horizon-calendar marker, checkable, tolerance ±2 days at the final latitude (to-verify; celestial §8); slot member only, NOT a registered sign"}

# ---------------------------------------------------------------------------
# The ten registered signs. Every record: sign, register, era (drift law 1),
# audience (who reads it, and who merely recognizes it — consistency rules
# §4.9), and a domain block whose id is the controlled domain name
# (one primary domain per sign, method §5 R1). Satellites are capped at 3 and
# each cites a licensed transformation (method §5 R3; consistency rules §5).
# status = PROPOSED everywhere.
# ---------------------------------------------------------------------------
symbols:

  - id: S1
    sign: "storm-slate (blue-black wool; the storm cloak's dye)"
    register: color
    era: "E1 bog-dark (undyed valley wool, a shelter dark); E2+ storm-slate after traded indigo arrives (M1 material/economic)"
    audience: "assembly oath-speakers first, all adults second; the lowland partner recognizes a public obligation is present but cannot read the knots that specify it"
    domain:
      id: STORM-LAW
      definition: "the enforceable stake of words spoken in the open — pasture claims, gate oaths, debts read aloud; the storm is what weighs un-witnessed words"
      includes: ["oaths at the gate and the high assembly", "debts read aloud (cord in hand, head uncovered)"]
      excludes: ["roofed household agreements with the cord visible (AX-3 reading, witness = the record)", "mourning (S3)", "herd-hygiene and butchery rules (practical, unmarked)"]
      contrasts: "S2 fleece-white (yield, unmarked standing) and S3 ridge-grey (absence). Slate is the only color that witnesses."
    ground:
      type: index
      statement: "the dye is the receipt — traded indigo over a bog-iron base; wearing the slate is a visible claim of access to the road (colour-symbolism §10 dye-economics; method §2 index)"
    carrier: "pending(06.costumes[].garment) — the assembly cloak, worn OPEN (enforcement artifact A1); if 06 supplies no cloak record, the slate re-hangs on the pass-collar and the coupling is flagged at integration"
    satellites:
      - {operator: metonymy, reading: "the storm itself, as the enforcer of STORM-LAW ('the wind weighs it')", occasion: "assembly rhetoric and gate disputes", readers: "all"}
      - {operator: borrowing, reading: "the roadward dye name, donor = the lowland trade partner (M5)", occasion: "gate-market usage", readers: "carriers and traders; donor marked, term pending(03.lexicon[].term)"}
      - {operator: event-index, reading: "a dated runaway herd in the storm summer entered the idiom 'slate weather' for any self-inflicted disaster", occasion: "fixed collocation", readers: "all; event date pending the era component (M6)"}
    couples: ["06 (cloak + wear rule)", "07 (the storm-power, if any: see component_interfaces)", "eras (E1 to E2 re-key)"]
    follows:
      - "corpus/knowledge/myth-symbol/color-symbolism.md §10 (dye economics; codes ride on chromophore scarcity)"
      - "corpus/knowledge/myth-symbol/color-symbolism.md §5 (dualism modes — this is Mode A/B territory, NOT antagonistic Mode C)"
      - "corpus/knowledge/myth-symbol/symbolism-synthesis-method.md §6 M1 and drift law 3 (neighbour audit)"
    notes: "Variance guard V2: slate is law, not sin. No 'black = evil' import; the moral-dark genealogy is Zoroastrian-Christian-European (color-symbolism §11) and is not D2's."

  - id: S2
    sign: "fleece-white (undyed wool; the fold's own color)"
    register: color
    era: "E1+ (unchanged across all four eras; the code's steady floor). E4 satellite: the script era's bills are written on pale traded paper, and 'white-measure' becomes a synonym for honest measure by M5 contact."
    audience: "everyone including children and visiting lowlanders — the most legible sign in the code; children learn it as 'the sheep's own color' before any dye word"
    domain:
      id: HERD-YIELD
      definition: "baseline standing: what the fold produced before any dye, debt or grief entered it; the unmarked year"
      includes: ["the clip", "an unencumbered household", "the first year after a herd is granted"]
      excludes: ["mourning (S3)", "oath-witnessing (S1)", "any purity or virginity claim (explicit anti-port, colour-symbolism §4 and §11)"]
      contrasts: "S3 ridge-grey — contrast axis declared: the fold's grease-soft fleece versus the rock's rain-bleached grey; material state, not hue (method §5 R5)"
    ground:
      type: index
      statement: "undyed wool is literally the herd's output; white here is 'undone' — not yet in the colour economy — which is why it reads as the unmarked year rather than as purity (color-symbolism §4 craft reading)"
    carrier: "the everyday wool of all ranks; no sumptuary gate exists, and that is the point of the sign (a sign anyone can be wrong about: a household that dresses too white is read as claiming an unencumbered year it does not have)"
    satellites:
      - {operator: metonymy, reading: "one's own herd, in gate talk", occasion: "trade", readers: "all"}
      - {operator: metaphor (AX-3), reading: "'white year' = a year whose accounts closed on time", occasion: "assembly review", readers: "knot-keepers and clan heads"}
    couples: ["06 (the ordinary wool register)", "03 (basic-term inventory: white is expected to be a base term — PENDING check against the language component's colour lexicon)"]
    follows:
      - "corpus/knowledge/myth-symbol/color-symbolism.md §4 ('white is usually undone'; derive white from what it materially is)"
      - "corpus/knowledge/myth-symbol/color-symbolism.md §11 ('white bridal purity is ancient and European' — flagged FALSE)"
    notes: "Variance guards V1 and V1b: this white is NEVER bridal, NEVER mourning, NEVER purity. A mourner in fleece-white is a scene error by construction; mourning wears S3."

  - id: S3
    sign: "ridge-grey (rain-worn rock; the descent's unwashed grey fleece)"
    register: color
    era: "E1+; E3 satellite by M6 event-index — the summer of losses (date pending the era component) made grey the famine-year colour in the lower valleys"
    audience: "mourners and the descent counters; the whole camp reads it, but only the counters may SPEAK the count it accompanies"
    domain:
      id: ABSENCE-COUNTED
      definition: "the accounting of what did not come back — losses are counted on the way down, because in the open the count cannot be spoken (AX-2 forbids loud loss-talk on the high ground: it would be reading a count where the pika can hear)"
      includes: ["deaths in the herd", "a person lost at the high stay", "the year's shortfall"]
      excludes: ["poverty claims (grey is absence, not shame)", "debt (that is counted in knots, not in cloth)"]
      contrasts: "S2 fleece-white (yield) and S1 storm-slate (law); grey is the only one of the three that is counted downward"
    ground:
      type: index
      statement: "the grey of the high rock after the rains, and the grey the fleece takes when it is carried down wet and unsorted; the colour is the descent's material fact, not a mood"
    carrier: "pending(06.costumes[].garment) — the grey descent-wrap, rite pending(06.costumes[].rite) 'descent-count'; a request, not an assertion about 06's content"
    satellites:
      - {operator: event-index, reading: "famine-year grey (M6)", occasion: "the summer of losses", readers: "valley households", evidence_status: "PROPOSED; needs the dated event from the era component"}
      - {operator: ritual inversion, reading: "at the marking of a child's first descent, grey is worn briefly to 'show the road what it may take and give it nothing' — inverted, bounded, ordinary reading restored after", occasion: "first-descent rite", readers: "the household"}
      - {operator: taboo substitution, reading: "the counters' euphemisms for 'died' (grey verbs) replace direct terms in the descent count", occasion: "the counting", readers: "counters; chain depth = age of the word (animal-symbolism §10)"}
    couples: ["06 (wrap + descent-count rite)", "eras (E3 event)", "number register (the count is spoken over the cord, S7)"]
    follows:
      - "corpus/knowledge/myth-symbol/color-symbolism.md §12 step 2 (derive the mourning colour from material logic, not a meaning table)"
      - "corpus/knowledge/myth-symbol/symbolism-synthesis-method.md §5 R1 and R3 (one primary; satellites licensed)"
    notes: "Variance guard V1c: D2 mourning is grey, and the neighbouring lowland partner's white-for-mourning is an OUTSIDE code — reading it in D2 is a designed cross-border misreading (consistency rules §6: intended under code A / inferred under code B)."

  - id: S4
    sign: "pack-ox (the salt-bearer; the animal of the tally-harness)"
    register: animal
    era: "E1+; E4 heraldic residue — the lowland partner's road-mule displaces the ox at the gate, and the ox survives on house-marks long after it stops working the road (animal-symbolism §7, heraldic lag)"
    audience: "knot-keepers read the harness cords; every herder reads the harness house-mark at a distance; outsiders read only 'a lineage is moving'"
    domain:
      id: LEDGER-BURDEN
      definition: "the lineage's account while it is in motion — the record is true only while it is carried"
      includes: ["house-marks on harness", "the cord's presence on the road", "the ascent order (whose ox leads)"]
      excludes: ["worship of any kind", "meat significance (the ox is eaten, but not marked)"]
      contrasts: "the lead-ewe (descent, memory) — both are lead animals, and the contrast between them (record vs memory) is the culture's own favourite riddle"
    ground:
      type: index
      statement: "the cord exists on the harness because the load needs it there; the sign is inseparable from the pack gear that carries the trade (seed: pre-writing tally-knots)"
    carrier: "harness house-marks and pending(06.costumes[] pass-collar / cord record) — the patterned gate collar is the same cord family (see THE-GATE pattern cell)"
    satellites:
      - {operator: metonymy, reading: "'the ox' = the debt itself in gate talk", occasion: "trade", readers: "carriers, traders"}
      - {operator: taboo substitution, reading: "the ox's true working name is not spoken at the gate; carriers use the load-word instead (name-taboo chain, animal-symbolism §10)", occasion: "gate market", readers: "carriers"}
      - {operator: borrowing, reading: "the road-mule's name arrives with the animal, donor marked (M5)", occasion: "gate", readers: "traders", evidence_status: "PROPOSED; term pending(03.lexicon[].term)"}
    couples: ["06 (harness / collar records)", "03 (animal terms; the lexicon component owns species words)"]
    follows:
      - "corpus/knowledge/myth-symbol/animal-symbolism.md §3 (crest/heraldry mechanism — inherited rights to display, not worship)"
      - "corpus/knowledge/myth-symbol/animal-symbolism.md §7 (heraldic lag: symbols outlive their animals)"
      - "corpus/knowledge/myth-symbol/animal-symbolism.md §9 (idiom-of-value species; decide which animal's words mean wealth)"
    notes: "Variance guard V5: outsiders may (wrongly) call the house-marks totemism; the misnomer is welcome as in-world error, never as a design claim (animal-symbolism §2 demolition shelf)."

  - id: S5
    sign: "wind-rider (the large soaring carrion bird of the high ground; species fixed against the biome list at integration)"
    register: animal
    era: "E1+; E4 drift M3/M5 — the script era's written death-formula arrives from the lowland partner, and the doctrine splits: the bird CARRIES the message (local reading) versus the writing IS the message (roadward reading). Both readings preserved as an in-world dispute."
    audience: "the dying and the mourners; the bird's true name is avoided at death-places and only the circumlocution chain is spoken aloud (animal-symbolism §10)"
    domain:
      id: SOUL-BREATH
      definition: "the breath that goes up — the bird is the escort of the last breath, because it alone rides the upslope wind that the dying cannot walk"
      includes: ["death on the high ground", "the escort reading at burials on open rock"]
      excludes: ["ordinary weather reading of the same bird (practical, unmarked)", "any claim about an afterlife inventory: D2 has a direction for the dead, not a map of a country"]
      contrasts: "S6 rock-whistler — the bird takes breath up, the whistler keeps words down; the two animals are the code's two verticalities, and the culture says so in proverbs"
    ground:
      type: index
      statement: "behaviour: it rides the same upslope wind the herders use, appears over the gate before weather turns, and gathers at high-ground deaths; three checks, all behavioural"
    carrier: "pending(06.costumes[].garment + 06.costumes[].rite 'sky-sending') — the corpse-cloth and the exposure rite; the exposure place itself is pending(axes/era component as a landscape record)"
    satellites:
      - {operator: metaphor (AX-1), reading: "'wind-ridden' = to have died on the high ground", occasion: "everyday speech", readers: "all"}
      - {operator: taboo substitution, reading: "the circumlocution chain for the bird (deepest euphemism = oldest word)", occasion: "death-places", readers: "all adults"}
      - {operator: borrowing, reading: "the roadward term for the bird, donor marked (M5)", occasion: "script-era religious talk", readers: "the script-trained few"}
    couples: ["06 (corpse-cloth, sky-sending rite)", "07 (PENDING: whether a power owns the birds or the birds own the road upward — ask 07, decide nowhere here)", "eras (E4 script drift)"]
    follows:
      - "corpus/knowledge/myth-symbol/animal-symbolism.md §4 (messenger-species households and dietary codes)"
      - "corpus/knowledge/myth-symbol/animal-symbolism.md §10 (euphemism chains; the kotodama hook)"
      - "corpus/knowledge/civilizations/tibet.md §5 (media-and-authority audit for a text-bearing practice — used here for the script-era split)"
    notes: "Variance guard V6: no cycle-of-rebirth doctrine and no sky-burial exoticism is imported; the rite's existence, cut and authority are 06/era decisions (tibet.md §6: keep separate timelines)."

  - id: S6
    sign: "rock-whistler (the alpine burrowing rodent; high burrows, sleeps the winter under the high ground)"
    register: animal
    era: "E1+ (the code's only stable anomaly; survives all four eras unchanged — an anomaly that does not drift is itself an era marker)"
    audience: "everyone; the insult and accusation register is fully public — 'has fed the whistler' = hid a word from the wind"
    domain:
      id: HIDDEN-SPEECH
      definition: "the taboo witness: the animal that hears under the ground, where the wind cannot reach"
      includes: ["accusations of hidden debt", "the ban on speaking lineage counts in burrowed fields"]
      excludes: ["ordinary pest talk", "hunting talk (it is not a game animal)"]
      contrasts: "S5 wind-rider — the code's two witnesses: the one above (wind) and the one below (ground). Two witnesses, two taboos, one axis."
    ground:
      type: symbol (with an anomaly ground, per method §4.2)
      statement: "category anomaly: it lives at the TOP but winters UNDER the ground — high and low at once; it sleeps through the storm, refusing the wind. Leach/Douglas style: the boundary-straddler carries the pollution load (animal-symbolism §1 and the method's §4.2 anomaly rule)"
    carrier: "no garment carrier — instead the whistle itself and the burrow-field (the ban is spatial: counts may not be spoken where the ground is holed)"
    satellites:
      - {operator: insult register, reading: "calling a person a whistler = accusing them of speaking only where the wind cannot hear", occasion: "all", readers: "all"}
      - {operator: taboo substitution, reading: "the whistler's name is used as a mild oath for 'I did not hear that'", occasion: "household", readers: "all"}
    couples: ["07 (PENDING: is the whistler anyone's creature? The code says no power owns it)", "06 (the burrow-field ban interacts with the where-counts-may-be-spoken dress rule)"]
    follows:
      - "corpus/knowledge/myth-symbol/animal-symbolism.md §1 (proximity + category salience; ecology first, then meaning)"
      - "corpus/knowledge/myth-symbol/symbolism-synthesis-method.md §4.2 (anomaly picks your taboo: one boundary-straddler per major boundary)"
      - "corpus/knowledge/myth-symbol/animal-symbolism.md §10 (insult map is the category system made hostile)"
    notes: "Variance guard V7: exactly ONE boundary-straddler is loaded (the up/down boundary). Do not multiply anomalies by reflex; a second one would dilute the taboo and read as decoration."

  - id: S7
    sign: "ten (the whole cord; two crossings of five station-knots)"
    register: number
    era: "E1-E3 the knots ARE the trade record; E4 the script takes the accounts (M3 media standardization) and the cord survives as ceremonial plus fossil idiom 'the top knot' (drift law 4: leave fossils on purpose)"
    audience: "knot-keepers (the office), the assembly (accounts read aloud in the open), the lowland partner (who receives script bills by E4 and stops reading cords)"
    domain:
      id: ACCOUNT-CLOSURE
      definition: "the moment a year's obligations are all on one cord and can be closed; closure is a public act, spoken in the open"
      includes: ["year-end settlement", "herd counts", "gate tolls"]
      excludes: ["counting for its own sake (the cord counts only what is owed or held)", "ritual repetition counts (D2 does not repeat rites in numbered series)"]
      contrasts: "'five' (one crossing, the half-cord) and 'one' (the shelter-knot) are satellites of the same sign, not rival signs (method §5 R5 handled by inclusion, not by a new entry)"
    ground:
      type: institutional arithmetic
      statement: "practice counts it: five stations per crossing, two crossings per year, ten knots per cord; the number HAS an enumerator in the culture's real counting life (number-symbolism §1: a number is sacred because it is load-bearing)"
    carrier: "the tally-cord itself: pending(06.costumes[] cord/harness record) and pending(03.lexicon[].term for the cord) — the cord is gear, and gear belongs to 06's material list"
    satellites:
      - {operator: synecdoche, reading: "five = the half-cord, a one-way journey or one season", occasion: "journey planning", readers: "all"}
      - {operator: metonymy, reading: "one = the shelter-knot, the winter summary kept indoors", occasion: "winter counting", readers: "households"}
      - {operator: event-index, reading: "'the lost cord' — a dated trading disaster entered the idiom for an unrecoverable debt", occasion: "fixed collocation", readers: "traders", evidence_status: "PROPOSED; date pending the era component (M6)"}
    couples: ["06 (cord gear)", "03 (numeral words and their assignment — the language component owns 'five', 'ten')", "eras (E4 script drift)"]
    follows:
      - "corpus/knowledge/myth-symbol/number-symbolism.md §1 (the three engines; load-bearing maxim)"
      - "corpus/knowledge/myth-symbol/symbolism-synthesis-method.md §4.3 (the enumeration rule) and §6 M3 (media standardization)"
      - "corpus/knowledge/myth-symbol/celestial-symbolism-calendars.md §8 (whoever declares the count owns the year — here the knot-keeper, not a priest)"
    notes: "Variance guard V8 (the enumerator test, collision log CL-5): 7 and 12 are DELIBERATELY ABSENT — no week, no zodiac, no administrative dozen exists in D2 counting life, so they may not be installed for flavour (number-symbolism §1)."

  - id: S8
    sign: "the axle-star (the unmoving one; the light the turning sky is hung on)"
    register: celestial
    era: "E1+ (no drift recorded; the sky is the code's slowest register — and that slowness is itself an emic observation: 'the one thing the road did not change')"
    audience: "the sky-readers (a named office, PENDING 07 to name the office or leave it unnamed); all herders on night watch; the lowland partner does not use it — their horizon is their own"
    domain:
      id: AXIS-UNMOVING
      definition: "the vertical world-axis, observed rather than drawn: the axis is where the sky does not turn"
      includes: ["night navigation", "the oath formula ('by the unmoving one')", "the high stay's nightly watch"]
      excludes: ["omens and weather (that is the gate's sky-colour business)", "any claim that the axis is a person — a power's ownership is PENDING 07, and the code functions without one"]
      contrasts: "S9 ascent-star — the unmoving versus the returning; the culture says the axle is what makes the returning count as returning"
    ground:
      type: index
      statement: "circumpolar behaviour: at the high pasture the circumpolar field turns visibly around it all night; the one light that does not travel. Circumpolarity requires the world latitude to be fixed first — (to-verify; method §4.4 tolerance figures belong in the handoff)"
    carrier: "no garment; the sign's carrier is the sky itself plus the night-watch station at the high pasture"
    satellites:
      - {operator: metaphor (AX-1), reading: "'the reason up and down exist'", occasion: "assembly rhetoric", readers: "clan heads"}
