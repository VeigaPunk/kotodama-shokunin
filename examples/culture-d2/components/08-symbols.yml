  - {id: CL-2, finding: "draft gave the storm its own star ('storm-star')", violated_rule: "method §4.4 (alignment claims are checkable) plus an unsupported alignment claim", repair: "the storm keeps no star; the stormward sky is read as colour and cloud at the gate, and the star load moved to S8/S9", impacted: "matrix STORMWARD/celestial", retest: "pass"}
  - {id: CL-3, finding: "draft filled SHELTERWARD/celestial with a 'hearth star'", violated_rule: "method §3 step 4 (do not force smoothness) — and the dial was decoration", repair: "removed; the cell is the deliberate UNALIGNED gap with its reason and its doctrine", impacted: "matrix", retest: "pass"}
  - {id: CL-4, finding: "draft had knots binding oaths", violated_rule: "the declared spine boundary — binding is D1's design spine", repair: "excised; oaths are spoken into wind; knots only count (PRV-1 backstops the change)", impacted: "S4, S7, LAW-1", retest: "pass"}
  - {id: CL-5, finding: "draft installed 7 and 12 for flavour", violated_rule: "number-symbolism §1 (a number is sacred because it is load-bearing)", repair: "both removed; the number register runs on 1/5/10, which the culture actually counts", impacted: "S7", retest: "pass"}

