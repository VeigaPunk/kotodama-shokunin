  - id: S9
    sign: "the ascent-star (the compact dawn cluster whose first morning rising opens the climb; the same body's evening setting closes the descent)"
    register: celestial
    era: "E1+; E4 drift M2/M5 — the lowland partner's calendar names for the same cluster arrive with the script, and the doctrine conflicts: one body walked up and down the sky (local) versus two named signs (roadward). Owned as in-world doctrine, not left as silent contradiction (celestial §4.4)."
    audience: "the calendar office (whoever watched it first claims the year); the whole camp reads the dawn; carriers at the gate wait for it before the road opens"
    domain:
      id: SEASONAL-OPEN
      definition: "the opening date — the cluster's rising is the ascent's licence, and its setting is the descent's deadline"
      includes: ["the ascent date", "the gate road's opening day"]
      excludes: ["the solstice (not marked in this grammar — the notch marks crossing days, not solstices)", "personal horoscopy (nothing in D2 reads a birth sky)"]
