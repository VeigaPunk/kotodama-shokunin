component: 14-kin-address
culture: D2
kind: kinship-terminology-and-address
canon: not canonized (D2 design drill)
record_status: "D2-specific content is DESIGN (D) unless a record says otherwise; comparative claims cite corpus entries by path + section; nothing here is a world fact (canon belongs to lore-shokunin — corpus/knowledge/synthesis/worldbible-integration-contract.md §3, §6)"
spine: "verticality (high/low, ascent/descent, seasonal poles) + wind (breath, soul-carrier, storm law); import audit at import_audit: below"
dispatch_note: "the shared D2 CONTRACT block was absent from this writer's dispatch text; every cross-component reference is written as a CONTRACT FIELD PATH (phonology / morphology / lexicon / names / eras / script / tally-record / trade / calendar) so it binds when the CONTRACT is fixed. No sibling component file was read for content."

needs_from_contract:
  - id: NC01
    field: "phonology: {consonants, vowels, phonotactics, tones, notable_rules}"
    need: "pitch-accent (2-level) statement; local minimum in phonology_min: below must be reconciled, not duplicated"
  - id: NC02
    field: "morphology: {type, alignment, word_order}"
    need: "only the possession/vocative slice is owned here (morphology_kin:); alignment and word order stay with the D2 language component"
  - id: NC03
    field: "lexicon"
    need: "terms K01-K24 below are candidate lexicon records with this component as origin; the lexicon component merges or rejects (no content imported)"
  - id: NC04
    field: "eras"
    need: "era slots E0-E3 in era_strata: bind by POSITION; local era names are placeholders"
  - id: NC05
    field: "names"
    need: "wind-name licence, teknonymy and the name-closing rite constrain the naming component's address slots"
  - id: NC06
    field: "tally-record system"
    need: "name-closing rite stores the closed name in the tally knot (rule A04); no tally content claimed here"
  - id: NC07
    field: "trade (salt / dried meat) + calendar (storm days)"
    need: "salt-kin rite A05 and the storm law A03 trigger on trade and weather slots owned elsewhere"

phonology_min:
  note: "LOCAL MINIMUM, kin terms only; reconciliation with NC01 required. Comparative basis: corpus/knowledge/linguistics/phonetics-phonology.md §6 (Hyman 2006 prosody typology: stress / pitch accent / tone)."
  consonants: "p t k q m n ŋ s h l w j"
  vowels: "a e i o u (+ length in call forms)"
  pitch_accent: "two-level pitch accent: one H syllable per word, all other syllables L (design; 2-level system labelled 'pitch accent', not register tone)"
  phonotactics: "(C)V(C); coda = n ŋ l q s"
  notable_rules:
    - id: PH1
      rule: "call form: H migrates to the final syllable + final vowel lengthens (patúː); licensed in distance address only"
    - id: PH2
      rule: "down-call: H is suppressed to L and the diminutive -l is added (pátul)"
    - id: PH3
      rule: "register flattening: in the súwa register every H is realized L (the audible marker of the register)"

morphology_kin:
  note: "only the slice kin terms need; type/alignment/word order belong to NC02"
  - id: M1
    rule: "nouns with inalienable possession take possessive prefixes: n- 1sg, t- 2sg, k- 3sg (ni-pátu 'my father')"
  - id: M2
    rule: "address forms are the bare stem with the call accent: the possessive is dropped, the breath owns the word, not the hand (design rationale; reference/address split per corpus/knowledge/linguistics/kinship-terminology.md §7)"
  - id: M3
    rule: "diminutive/endearment suffix -l, used in down-call forms only"
  - id: M4
    rule: "prefix kí- 'over (the pass), beyond' derives the married-out aunt series K04/K05"
  - id: M5
    rule: "declared absence: no speaker-sex marking on any kin term; seniority (K06/K07) carries the interactional load instead"

kinship_type:
  id: T01
  system: "Omaha type (Murdock 1949 label): Iroquois bifurcate-merging base + patrilateral skewing (Lounsbury rule 4)"
  why_omaha_fits_segmentary_clans:
    - id: T01-a
      claim: "D2 descent is patrilineal and segmentary; wáqa 'lineage' is the corporate pasture-holding body in the male line — Murdock's Omaha package is exactly 'strong patrilineages, patrilineal exogamy, property in the male line'"
      follows: "corpus/knowledge/linguistics/kinship-terminology.md §1 (fingerprints) + §2 (Omaha package row)"
    - id: T01-b
      claim: "skew makes the mother's line terminologically senior: MBD ⇒ mother class (K02), MBS ⇒ mother's-brother class (K03) — marriage toward the mother's pastures is unthinkable in the lexicon itself"
      follows: "kinship-terminology.md §4 rule 4 (Omaha skewing; MBD ⇒ mother class) + §5 (the marriage rule lives in the lexicon)"
    - id: T01-c
      claim: "alliance therefore runs outward to the father's-sister side: FZD/FZS are distinct, marriageable cross-terms (K08/K09); segmentary feud and fusion, by contrast, run inward and are phrased in sibling words (K06/K07 cover parallel cousins)"
      follows: "kinship-terminology.md §1 (Iroquois base cells) + §4 rule 2 (sibling-merging) + §4 rule 3 (cross-cousin distinctness)"
  rejected_alternatives:
    - id: T01-d
      alternative: "Crow type (matrilineal skew, FZS ⇒ father class)"
      rejected_because: "requires matrilineages; D2 pasture rights and herd inheritance are male-line (design constraint from the shared D2 seed)"
    - id: T01-e
      alternative: "Sudanese (descriptive) as the spoken base"
      rejected_because: "one term per genealogical position fits codified state law, not an oral segmentary system; it appears only as a written-law drift in era ES2"
    - id: T01-f
      alternative: "Eskimo (lineal) / Hawaiian (generational)"
      rejected_because: "Eskimo presumes no unilineal groups; Hawaiian merges exactly the parent-generation cells (F=FB=MB) that D2 exogamy needs kept apart"
  calibration: "terminology is ONE weighted vote among residence, inheritance, marriage rule and economy — a moderate tendency, not a law (kinship-terminology.md §3; Kroeber 1909, Lowie 1917 via §3/§11). T01 is a declared DESIGN package, not an inference about any real people."

lexicon:
  note: "field: kin for K01-K19; K20-K24 are candidate records shared with NC03/NC04. layer: native except K19 (loan, E1 trade). All glosses are design."
  records:
    - {id: K01, term: "pátu", gloss: "father; father's brother (same-line father)", field: kin, etymology: "design: root pat- 'the standing/root one' + noun ending -u", layer: native}
    - {id: K02, term: "míni", gloss: "mother; mother's sister; (skew) mother's brother's daughter", field: kin, etymology: "design: root min- 'milk-giver' (couples to the milking term in NC03)", layer: native}
    - {id: K03, term: "súnu", gloss: "mother's brother; (skew) mother's brother's son; the shade-giver who starts his sister's son's herd", field: kin, etymology: "design: root sun- 'shade' + -u; the avunculate shade cast down-slope", layer: native}
    - {id: K04, term: "kíra", gloss: "father's sister; the aunt who crossed to another pasture", field: kin, etymology: "design: kí- 'over the pass, beyond' + -ra 'woman'", layer: native}
    - {id: K05, term: "kíru", gloss: "father's sister's husband; (preferred marriage) wife's father", field: kin, etymology: "design: kí- 'beyond' + -ru 'man'", layer: native}
    - {id: K06, term: "táŋa", gloss: "senior sibling; senior parallel cousin (FBS, MZS)", field: kin, etymology: "design: 'upper shoulder (of the pass)'", layer: native}
    - {id: K07, term: "túŋa", gloss: "junior sibling; junior parallel cousin (FBS, MZS)", field: kin, etymology: "design: 'lower shoulder (of the pass)'; minimal pair with K06 by vowel", layer: native}
    - {id: K08, term: "wíya", gloss: "father's sister's daughter (marriageable cross-cousin); (preferred marriage) wife's sister / husband's sister", field: kin, etymology: "design: cross root wi- + -ya; partial affine-merging, see A-merge", layer: native}
    - {id: K09, term: "wísa", gloss: "father's sister's son (marriageable cross-cousin); (preferred marriage) wife's brother / sister's husband — the joking in-law", field: kin, etymology: "design: cross root wi- + -sa", layer: native}
    - {id: K10, term: "píko", gloss: "son; brother's son (same-line son)", field: kin, etymology: "design: root pik- 'the one carried up' + -o", layer: native}
    - {id: K11, term: "síta", gloss: "daughter; brother's daughter", field: kin, etymology: "design: root sit- 'the one sheltered' + -a", layer: native}
    - {id: K12, term: "háwe", gloss: "sister's child (a man's ZC; 'down-line child' — walks in another pasture-line)", field: kin, etymology: "design: ha- 'down-slope' + -we; design extension, see V3", layer: native}
    - {id: K13, term: "wéri", gloss: "husband", field: kin, etymology: "design: root wer- 'the one across the fire' + -i (hearth image, not a binding image — see import_audit:)", layer: native}
    - {id: K14, term: "ása", gloss: "wife", field: kin, etymology: "design: root as- 'hearth-sharer'", layer: native}
    - {id: K15, term: "ánpa", gloss: "up-side one: escape honorific for any person a generation or more above (kin or stranger); upward honorific slot", field: kin_address, etymology: "design: an- 'side' + -pa 'up'", layer: native}
    - {id: K16, term: "ánti", gloss: "same-altitude one: default address between unrelated age-mates", field: kin_address, etymology: "design: an- + -ti 'level'", layer: native}
    - {id: K17, term: "ánku", gloss: "down-side one: address to any person a generation or more below; downward endearment slot", field: kin_address, etymology: "design: an- + -ku 'down'", layer: native}
    - {id: K18, term: "aŋa", gloss: "one with breath: pre-kin address for an unknown person; asserts shared humanity and no kin claim", field: kin_address, etymology: "design: breath root aŋ- + -a; the wind doctrine in one word", layer: native}
    - {id: K19, term: "túki", gloss: "salt-kin: fictive kin created by the salt rite between D2 herders and lowland trade partners", field: kin_address, etymology: "layer loan: donor form from the lowland trade language unsampled (to-verify at NC07); D2 shape by coda repair", layer: loan}
    - {id: K20, term: "suwá", gloss: "held-air: the D2 avoidance register (see avoidance_register:)", field: register, etymology: "design: su- 'hold, keep' + -wa 'of the air'", layer: sacred}
    - {id: K21, term: "íla", gloss: "breath; wind; the carrier that takes words to the ears the speaker cannot see", field: cosmology, etymology: "design: breath root; owner: NC03 (candidate only, needed by A02/A03)", layer: sacred}
    - {id: K22, term: "wáqa", gloss: "lineage (pasture-holding body, male line; exogamous segment)", field: social, etymology: "design: 'the line of a pasture'; owner: NC03", layer: native}
    - {id: K23, term: "jíla", gloss: "high summer pasture (the mixed summer camps where affines meet)", field: landscape, etymology: "design: jil- 'high, open sky-ground'; owner: NC03", layer: native}
    - {id: K24, term: "úlma", gloss: "winter valley shelter (single-lineage camps; where wind-names live)", field: landscape, etymology: "design: ul- 'valley floor' + -ma 'shelter'; owner: NC03", layer: native}

feature_matrix:
  note: "componential bundles per corpus/knowledge/linguistics/kinship-terminology.md §4 (Goodenough 1956; Lounsbury 1956): every term is a feature bundle, and a system built this way is internally consistent for free. G0 = ego's generation; + = yes, − = no, s = by seniority."
  columns: [term, +generation, ±lineal, ±sex, ±cross, ±relative-age, ±affinal, ±skew, address_dir]
  rows:
    - [K01, "+1", "lineal (F) + same-line collateral (FB)", "+m", "−", "−", "−", "−", "up-call"]
    - [K02, "+1", "lineal (M) + same-line collateral (MZ); +skew MBD", "+f", "−", "−", "−", "+skew", "up-call"]
    - [K03, "+1", "matrilateral collateral (MB); +skew MBS", "+m", "+ (matrilateral cross)", "−", "−", "+skew", "up-call"]
    - [K04, "+1", "patrilateral collateral (FZ)", "+f", "+ (patrilateral cross)", "−", "−", "−", "up-call"]
    - [K05, "+1", "affine of FZ (FZH); +affinal WF", "+m", "+", "−", "+", "−", "up-call"]
    - [K06, "0", "collateral (FBS, MZS = sibling-merging)", "±", "− (parallel)", "+ senior", "−", "−", "level"]
    - [K07, "0", "collateral (FBS, MZS = sibling-merging)", "±", "− (parallel)", "− junior", "−", "−", "down-call"]
    - [K08, "0", "collateral (FZD); +affinal WZ/HZ after preferred marriage", "+f", "+ (patrilateral cross)", "s", "+ (conditional)", "−", "level"]
    - [K09, "0", "collateral (FZS); +affinal WB/ZH after preferred marriage", "+m", "+ (patrilateral cross)", "s", "+ (conditional)", "−", "level"]
    - [K10, "−1", "lineal (S) + same-line collateral (BS)", "+m", "−", "−", "−", "−", "down-call"]
    - [K11, "−1", "lineal (D) + same-line collateral (BD)", "+f", "−", "−", "−", "−", "down-call"]
    - [K12, "−1", "collateral (ZC through a woman: another lineage)", "±", "+", "s", "−", "−", "down-call"]
    - [K13, "0", "affinal (H)", "+m", "−", "−", "+", "−", "level"]
    - [K14, "0", "affinal (W)", "+f", "−", "−", "+", "−", "level"]
    - [K15, "escape term", "non-kin upward honorific", "±", "−", "−", "−", "−", "up-call"]
    - [K16, "escape term", "non-kin level default", "±", "−", "−", "−", "−", "level"]
    - [K17, "escape term", "non-kin downward endearment", "±", "−", "−", "−", "−", "down-call"]
    - [K19, "fictive", "ritual kin (salt)", "±", "−", "−", "−", "−", "level then up-call"]
  a_merge:
    id: A-merge
    rule: "partial affine-merging (design narrowing of Lounsbury rule 6): cross-cousin terms K08/K09 also cover spouse's siblings after a preferred marriage; they do NOT cover the spouse. Marriageability is half-visible in the lexicon"
    follows: "kinship-terminology.md §4 rule 6 (affine-merging, Dravidian move) + §5 (marriage rule readable from vocabulary)"

term_table:
  note: "procedure step 3 of corpus/knowledge/linguistics/kinship-terminology.md §9: fill every cell — reference / address at the fire / address across distance / register substitute."
  columns: [position, reference (possessive), address at the fire, address across distance, súwa substitute, id]
  rows:
    - [F / FB, "ni-pátu", "pátu", "patúː (up-call)", "ánpa class", T2]
    - [M / MZ / MBD, "ni-míni", "míni", "miníː (up-call)", "ánpa class", T3]
    - [MB / MBS, "ni-súnu", "súnu", "sunúː (up-call)", "ánpa class", T4]
    - [FZ / (preferred) WM, "ni-kíra", "kíra", "kiráː (up-call)", "ánpa class", T5]
    - [FZH / (preferred) WF, "ni-kíru", "kíru", "kirúː (up-call)", "ánpa class", T6]
    - [senior sibling / FBS / MZS senior, "ni-táŋa", "táŋa", "taŋáː (up-call)", "ánti", T7]
    - [junior sibling / FBS / MZS junior, "ni-túŋa", "túŋal", "tuŋal (down-call, low)", "ánti", T8]
    - [FZD / (preferred) WZ / HZ, "ni-wíya", "wíya (wind-name allowed)", "wiyáː", "ánti", T9]
    - [FZS / (preferred) WB / ZH, "ni-wísa", "wísa (wind-name allowed)", "wisáː", "ánti", T10]
    - [S / BS, "ni-píko", "píkol", "pikol (down-call, low)", "ánku", T11]
    - [D / BD, "ni-síta", "sítal", "sital (down-call, low)", "ánku", T12]
    - [ZC (man's sister's children), "ni-háwe", "háwel", "hawel", "ánku", T13]
    - [H, "ni-wéri", "wéri (wind-name at the fire only)", "weri (level)", "ánti", T14]
    - [W, "ni-ása", "ása (wind-name at the fire only)", "asa (level)", "ánti", T15]
    - [cold-pass in-laws, "NONE (design gap: no term is a decision)", "ánpa / ánku at the correct pitch", "same, at distance", "súwa mandatory", T16]

address_rules:
  - id: A01
    name: pitch compass
    rule: "to a person a generation up (or a senior at level) address rises: H moves to the final syllable and lengthens. To a person down: H is suppressed to L and -l is added. At level: the lexical accent is kept. Any bystander can hear the direction of the dyad in the pitch alone"
    couples: "verticality (the generation axis is audibly an altitude)"
  - id: A02
    name: wind-name licence
    rule: "a personal name is spoken only at the same fire in the same winter shelter (K24); outside, kin relation terms only. Speaking a name across distance is believed to hand the person's breath to any ear the wind reaches (in-world belief, not narratorial fact)"
    couples: "wind (breath, soul-carrier)"
  - id: A03
    name: storm law
    rule: "while the storm-wind runs, no wind-names at all, in any camp; all address drops to relation terms at flat low pitch. Sanction: the elder's public ridicule, then the lineage's discipline — kin/elder sanction rung of the sanction gradient"
    couples: "wind (storm); calendar slot NC07"
  - id: A04
    name: name closing (death)
    rule: "at death the name is closed and left in the tally knot (NC06) until the reckoning; for one turning of the seasons the close kin speak no name, only relations — the 'still-breath' year"
    follows: "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §3 (names of the dead as a taboo domain; taboo is replaced and preserved as a citation form) + §6 step 3"
  - id: A05
    name: stranger protocol
    rule: "first contact: aŋa 'one with breath', plus the path question (which pass did you come over — under or over the sky-line). Kin-class assignment needs a broker (any person who knows both) or the salt rite: salt shared at a hearth makes túki salt-kin, addressable ever after at level, then up-call by age. Refusing an offered ánti is an auditable social event; the repair is the salt offer. No broker and no salt: two fires, two winds — ánpa/ánku at correct distance forever"
    follows: "kinship-terminology.md §7 (escape terms, refusal event, stranger protocol) + §7 (fictive kin institutionalized: compadrazgo — Mintz & Wolf 1950)"
  - id: A06
    name: teknonymy (the kin clock)
    rule: "from the birth of a first child, juniors may address the parent as '<child-name>-ánpa' ('the one above X'); the parent's own wind-name leaves public use. A person's address status therefore changes at the first birth"
    follows: "kinship-terminology.md §7 (teknonymy — Geertz 1961; kunya) + corpus/knowledge/synthesis/conlang-blueprint-template.md §6 (name/address rules slot)"
  - id: A07
    name: marriage-direction pitch
    rule: "in each marriage pair of lineages, the lineage that GAVE a bride in the current generation is called up (up-call) by the takers; because the preferred marriage (FZD/FZS) alternates the direction each generation, deference alternates with it. A wrong-direction call is heard and corrected in public"
    couples: "verticality (whole lineages sit up-slope or down-slope of each other, per generation); era ledger NC04"
  - id: A08
    name: joking licence
    rule: "K08/K09 dyads (cross-cousins and, after a preferred marriage, siblings-in-law) may use wind-names and teasing in public — permitted disrespect; they are also the repair channel when someone has overstepped a súwa boundary"
    follows: "kinship-terminology.md §5 (joking vs avoidance relations — Radcliffe-Brown 1940)"
  - id: A09
    name: bystander rule
    rule: "an affine who triggers the register forces it on the whole room, addressees included — the trigger is the audience, not the addressee"
    follows: "corpus/knowledge/linguistics/linguistic-anthropology.md §5.2 (the trigger is audience; an avoidance register is audible etiquette) + politeness-taboo-euphemism.md §2 (Comrie 1976 axes: speaker→bystander)"
  - id: A10
    name: dry-word rule (script)
    rule: "written kin terms are reference forms only; writing an address form, and above all the up-call, is a blunder ('a dry word cannot be called'). Chancery practice writes the reference form plus a relation mark. In-world ideology AND a local script gap at ES2 — the adapted script carries no accent marks until they are added"
    couples: "wind (breath cannot cross a dry surface) + script slot (contract: script, eras)"
  - id: A11
    name: seasonal address ecology
    rule: "at the summer high pasture (K23, mixed allied camps, affines present) registers dominate: relation terms, súwa in cold-pass company, up-calls across the valley. At the winter shelter (K24, single lineage) wind-names run free at the fire. Address ecology follows transhumance, not mood"
    couples: "verticality (seasonal poles) + NC04"
  - id: A12
    name: refusal and repair
    rule: "refusing a kin term offered is a move, not a silence: the refused party may restate with a lower class (ánti→ánku→aŋa) or demand the salt rite. Each step down is remembered; the lowest step is 'counting you with the herds' (addressing by herd phrase)"

avoidance_register:
  id: R01
  name: suwá ('held-air')
  real_world_recipe: "same grammar and phonology, wholly different lexicon, generic terms where the everyday has many, trigger = presence of taboo persons, extends to sacred topics and post-death name taboos"
  follows: "corpus/knowledge/linguistics/linguistic-anthropology.md §5.2 (Dyirbal Guwal/Jalnguy, Dixon 1972; Guugu Yimithirr, Haviland 1979; Lardil Damin, Hale 1982) + §5.4 decision-table row 'Avoidance register'"
  design_extension: "the register adds one prosodic override (PH3: all H realized L). The real Jalnguy comparator has an identical phonology; the flattening is a DESIGN addition, not a comparative claim"
  triggers:
    - id: R01-a
      trigger: "cold-pass affines: two people linked by a marriage that did NOT follow the cross-cousin preference, of opposite sex, one kin-generation apart (S/WM, D/WF) — the two families were not kin before the wedding"
    - id: R01-b
      trigger: "storm-wind running (A03): flattening only, no substitution needed if no taboo person is present"
    - id: R01-c
      trigger: "the still-breath year after a death (A04)"
  substitutes:
    note: "generative class rule, not a fixed word list: every everyday term is replaced by one of three altitude classes (ánpa up / ánti level / ánku down) or by a work phrase; the herd, the salt and the weather keep their everyday words (work continues)"
    rows:
      - [S01, "pátu / míni / súnu / kíra / kíru (all G+1)", "ánpa"]
      - [S02, "táŋa / túŋa / wíya / wísa / wéri / ása (all G0)", "ánti"]
      - [S03, "píko / síta / háwe (all G−1)", "ánku"]
      - [S04, "a specific herd animal", "kept ('the white one' / 'the horned one' — herd words are safe)"]
      - [S05, "salt, wool, dried meat", "kept (trade words are safe)"]
      - [S06, "storm, sky, wind", "kept (weather words are safe; they belong to the wind already)"]
      - [S07, "any personal name", "NOT SAYABLE — replaced by relation term or, if none, 'the one of the <herd phrase>'"]
      - [S08, "a stranger's name", "NEVER ASKED inside the register; asked outside it, by a third party"]
  register_markers:
    - "all H flattened to L (PH3) — audible from outside the tent"
    - "no personal names of any kind, including the dead"
    - "sentence-final particles dropped (design)"
    - "vehemence is indecent: anger is expressed by leaving the register, which is itself the insult"
  enforcement: "the offending elder's public repetition of the correct form; the register's breach is repeated as a family anecdote for years (kin/elder ridicule rung)"

context_table:
  note: "the six pragmatics situations of corpus/knowledge/synthesis/conlang-blueprint-template.md §6 mapped to D2 kin address; audience column added per A09"
  columns: [ctx, setting, speakers, address choice, register, id]
  rows:
    - ["winter fire, one lineage", "K24", "grandparent → child", "wind-name + relational", "none (free)", CTX1]
    - ["summer camp, allied lineages", "K23", "cousins at work", "táŋa/túŋa + teasing", "joking licence (A08)", CTX2]
    - ["summer camp, cold-pass in-laws present", "K23", "anyone in earshot", "ánpa/ánti/ánku only", "súwa mandatory (R01-a)", CTX3]
    - ["assembly, tally recitation", "K23", "lineage head → assembly", "reference forms + closed names from the knot", "ritual; no wind-names", CTX4]
    - ["marriage negotiation", "either", "giver lineage ↔ taker lineage", "up-call to the current giver side", "level; súwa if cold pass", CTX5]
    - ["first contact, trail", "pass", "stranger ↔ herder", "aŋa, then path question", "none; no kin term without broker", CTX6]
    - ["lowland trade camp", "lowland", "herder ↔ trade partner", "túki salt-kin, level or up by age", "level", CTX7]
