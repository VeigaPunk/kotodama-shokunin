# examples/culture-d2/components/15-pragmatics.yml
# kotodama-shokunin — D2 design drill (round 3), dispatch-named component 15-pragmatics.
# NON-CANON SAMPLE DESIGN. No real culture and no real language is described; every
# form-level claim is owned by a sibling component and cited here by ID only. Real-world
# comparators are cited to corpus/knowledge entries by path + section; nothing else is
# asserted and nothing here is a world fact (canon stays with lore-shokunin).
#
# Revision note (same session, pre-handoff): this file was rewritten after siblings
# 01-brief, 02-phonology, 03-morphosyntax, 04-orthography, 05-lexicon, 06-pantheon,
# 07-myths-motifs, 08-symbols, 09-eras-calendar, 10-materials, 12-rank-rules and
# 14-kin-address landed, to (a) replace placeholder lexicon IDs with the delivered
# 05-lexicon IDs, (b) defer the addressee/address machinery to 14-kin-address and the
# say-rules to 12-rank-rules instead of duplicating them, (c) drop the invented venue
# vocabulary in favour of the delivered moot / fair court terms, and (d) carry the
# contract fields (axis, evidence, follows) 01-brief requires. The overlap with any
# not-yet-delivered register component (11/13) is named in overlap_note, not resolved.

component: 15-pragmatics
culture: D2
canon: not canonized (D2 design drill)
status: non-canon sample design; handoff-eligible, lore disposition required (PROVINCE.md; corpus/knowledge/synthesis/worldbible-integration-contract.md §6, §11)
packet_keys: []
registry_note: "01-brief's registry lists components 02-10 plus the assembly artifact; this round dispatched additional stems (12-rank-rules, 14-kin-address, 15-pragmatics, and others), and the brief's own registry note makes the file's component value governing. This is a dispatch-named extension component with no shared packet key."
scope: "politeness axes (addressee and referent), speech-act norms for moot hearing / oath / salt-fair market, and the euphemism ladders and fossil strata for the deep taboos. Address forms, say-rules, lexicon forms, phonology, morphology and era names are owned by siblings and are referenced by ID only (RG-03)."
spine_declared: "verticality (high/low, ascent/descent, seasonal poles) + wind (breath, soul-carrier, storm law)"
spine_coupling:
  - {id: SPC-1, coupling: "the referent honorific axis is the vertical spine made audible about an ABSENT person: exalt raises the spoken-of, descend lowers the speaker's own camp, so every third-person clause encodes the height relation", records: [PR-01, PR-02, PR-04], axis: verticality}
  - {id: SPC-2, coupling: "the wind decides answerability: an utterance in the moot's hearing is answerable and recordable, an utterance above the snow-line is given to the wind and can be recited by any ear it reaches, which is what makes oaths and the taboo ladders work", records: [PR-03, SA-2, TB-1, TB-3], axis: wind}

axis_policy: "every record carries axis (verticality | wind | both | neutral per RG-05) and evidence (design-choice | attested-comparator | contested | unknown per CP-11); neutral would require a coupling_note and none of the records below are neutral."

deps:
  - component: 05-lexicon
    ids: [L01, L08, L09, L12, L13, L14, L16, L17, L18, L21, L22, L25, L26, L27, L28, L29, L30, L31, L32, L33, L36, L37]
    relation: "lexeme IDs cited as 05-lexicon:<id> with the term echoed for resolution only; the lexicon owns every form, gloss, stage and layer (RG-03, RG-04)"
    axis: both
    evidence: design-choice
    follows:
      - "examples/culture-d2/components/05-lexicon.yml contract.record_fields lexicon row (id, term, gloss, field, layer, route, stage, class, etymology, axis, evidence)"
  - component: 14-kin-address
    ids: [A01, A02, A03, A04, A08, A09, A11, A12, PH1, PH2, PH3, K23, K24]
    relation: "the addressee axis and the audience-triggered register are owned there; this file binds them into act tables and does not restate or re-coin them"
    axis: both
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/sociolinguistics-registers.md §4 (registers chosen per setting; address as live negotiation)"
  - component: 12-rank-rules
    ids: [SR-01, SR-02, SR-03, SR-04, SR-05, SR-06, JU-1, JU-2, JU-3]
    relation: "the say-rules and the altitude-band jurisdictions are law there (moot, fair court, Storm Seat); this file supplies the pragmatic machinery beneath them (felicity conditions, void rules, ladders)"
    axis: verticality
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §1 (discernment: politeness as grammatically prescribed fit to social variables)"
  - component: 02-phonology
    ids: []
    relation: "pitch accent is assumed as the delivered 2-level system; the hearable direction of an address is theirs (via 14-kin-address PH1-PH3) and this file adds no accent claim"
    axis: wind
    evidence: unknown
    follow_note: "no ids cited: assembly carries a to-confirm item, not a failure (RG-04)"
  - component: 03-morphosyntax
    ids: []
    relation: "PR-01 and PR-02 request two referent-affix slots (exalt, descend) and an evidential choice for testimony; the morphology component owns whether and how those slots exist"
    axis: both
    evidence: unknown
    follow_note: "id to confirm at assembly; the need itself is 15-pragmatics content."
  - component: 04-orthography
    ids: []
    relation: "SA-1 and TB-6 reference the delivered tally-cord record and the adapted script artifacts; forms and signs are theirs"
    axis: wind
    evidence: unknown
    follow_note: "id to confirm at assembly."
  - component: 09-eras-calendar
    ids: []
    relation: "era tags E0/E1/E2 are fixed by 01-brief; the span names used below (Korne, Nalne, Pertne) are the ones 05-lexicon stages its records in, and the era component's own naming governs at assembly"
    axis: both
    evidence: unknown
    follow_note: "binding to confirm; the mapping stated in era_coupling is a request, not an assertion."

overlap_note: "If a register component (11 or 13 in the dispatch series) lands with its own honorific stack, dedupe against axes_map: this file owns the referent axis (PR-01, PR-02), the act tables (SA-1..SA-4) and the taboo ladders (TB-1..TB-6) only. The addressee axis and audience-triggered register belong to 14-kin-address; the say-rules to 12-rank-rules."
brief_cite: "This file is written against the D2 packet contract in examples/culture-d2/components/01-brief.yml (contract.record_fields, contract.rules RG-01..RG-08, coupling_principles CP-01..CP-13)."

d1_guard:
  - id: DG-1
    rule: "No D1 import in this component. Checked against the ban list: no river, bank, tide or flood imagery (D1B-01); no tying, binding or knot-as-obligation metaphor — knots appear only as record geometry (D1B-02, RG-01); no public-oath-with-rotating-witnesses institution, since the oaths here are the lineage cord oath and the fair formula that 12-rank-rules SR-04 owns (D1B-07); no D1 alphabet or sound-law content (D1B-04, D1B-05)."
    this_file_check: "the answerable-vs-given-to-the-wind rule is a jurisdiction of speech, not a bond over speech; the word carrying happens in moving air, not through a tie"
    axis: wind
    evidence: design-choice
    follows:
      - "examples/culture-d2/components/01-brief.yml d1_no_import D1B-01, D1B-02, D1B-04, D1B-05, D1B-07"
      - "examples/culture-d2/components/01-brief.yml contract.rules RG-01 (tying is a manufacturing act, never a metaphor for obligation)"
      - "corpus/knowledge/synthesis/worked-example-mini-culture.md §2 (the D1 fixture against which the ban list is checked)"

follows:
  - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §1 (politeness logics; discernment vs volitional; impoliteness genres) — primary frame for axes_map and logic_mix"
  - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §2 (Comrie 1976 addressee/referent/bystander axes; honorific construction kit; enregisterment; who profits)"
  - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §3-§5 (taboo domains and sanction gradient; euphemism ladder mechanics; the four-strata fossil rule)"
  - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §6 (construction procedure 1-7) and §7-§8 (calibration; canon boundary)"
  - "corpus/knowledge/linguistics/semantics-pragmatics.md §5 (Austin felicity conditions; Searle classes; commissives with self-curse clauses) and §6 (social deixis; absolute frames ride topography)"
  - "corpus/knowledge/linguistics/semantics-pragmatics.md §4 (evidentials as the grammar of testimony) and §7 (method steps 4-6)"
  - "corpus/knowledge/linguistics/sociolinguistics-registers.md §1 (enregisterment, indexical order), §5 (linguistic capital), §8 (structure-to-variation table, clan/segmentary row)"

axes_map:
  - id: AX-1
    axis_name: "speaker to addressee"
    owner: "14-kin-address (A01 pitch compass; A08 joking licence; A11 seasonal address ecology; A12 refusal and repair) and 12-rank-rules (SR-02 greeting formula by band)"
    this_file_adds: "nothing formal; this file binds the addressee axis into the act tables and records the one consequence the address component does not state: a grade error voids an act rather than merely offending"
    ruin_test: "a wrong-direction call at the moot is not rudeness alone; the act spoken in it (testimony, offer, oath) is void and re-spoken"
    axis: verticality
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §2 (kit item (c); the same axis may be particles or pitch, the mechanism is not fixed by the theory)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §6 step 6 (stress-test scenes; most drafts forget eavesdroppers)"
  - id: AX-2
    axis_name: "speaker to referent (the built axis)"
    owner: "15-pragmatics (PR-01, PR-02, PR-04)"
    this_file_adds: "two referent affixes and their licensing rules; the morphology slot is requested from 03-morphosyntax, the forms belong to the lexicon"
    axis: verticality
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §2 (kit items (a) referent-raising affix and (b) humilific; separate referent from addressee honorification)"
  - id: AX-3
    axis_name: "speaker to bystander, realized as wind-answerability"
    owner: "14-kin-address (A09 audience trigger; A11 seasonal ecology), 12-rank-rules (SR-03 wind carries what the valley does not hear), 15-pragmatics (PR-03)"
    this_file_adds: "the two juridical statuses of an utterance, answerable and given-to-the-wind, and their effect on act validity"
    axis: wind
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §2 (Comrie 1976 bystander axis; eavesdroppers as grammatical participants)"
  - id: AX-4
    axis_name: "the logic mix"
    logic: "discernment vertically (the pitch direction is not chosen, it is computed from relation and band), volitional laterally (camps of equal standing negotiate offers and refusals), licensed impoliteness calendrically (the summer gathering's teasing licence, which 14-kin-address A08 already holds for specified dyads)"
    rudeness_is: "a category error heard in the pitch and a wind status error; only at the fair is a bald wish the mark of an outsider"
    axis: both
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §1 (discernment, volitional, and discursive rows; Culpeper: worlds need rude genres)"
      - "corpus/knowledge/linguistics/sociolinguistics-registers.md §4 (speech levels: one mis-levelled sentence is a plot-sized insult)"

referent_honorifics:
  - id: PR-01
    item: "exalt affix (raises the spoken-of)"
    rule: "available for the dead of one's own lineage at the dead-roll (05-lexicon:L32 toksa 'the one who went down'), for the storm-law in recitation (05-lexicon:L31 hurim 'the storm-breath'), and for a lineage head of ANOTHER camp (05-lexicon:L36 lasin 'lineage head'); the affix and its slot are requested from 03-morphosyntax"
    forbidden_use: "exalting one's own lineage head to another camp; the failure is the classic comedy-and-insult beat, played as 'raising your own fire on a stranger's wind'"
    axis: both
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §2 (referent-raising; in-group versus out-group footing)"
      - "corpus/knowledge/linguistics/semantics-pragmatics.md §5 (conventional implicature: honorifics add non-cancellable social content to any statement)"
  - id: PR-02
    item: "descend affix (lowers the speaker's own side)"
    rule: "mandatory when a speaker reports their own camp's or lineage's action to an outsider or at the moot; the chairman of a lineage's claim speaks the claim descended, including when the claim is strong"
    effect: "descend is a legal courtesy, not modesty theatre: a claim spoken undescended at the moot is heard as a claim against the moot, not against the other lineage"
    axis: verticality
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §2 (humilific for self-directed action)"
      - "corpus/knowledge/linguistics/sociolinguistics-registers.md §4 (self-lowering as grammatical, not strategic)"
  - id: PR-03
    item: "wind status of an utterance (the pragmatics of AX-3)"
    states:
      - {state: "answerable", where: "in the moot's hearing (winter valley, the moot ground) or at the fair court", effect: "recordable, prosecutable, citable at the next hearing; the tally-cord entry (05-lexicon:L25 kor 'tally-cord') is what makes it stick"}
      - {state: "given to the wind", where: "above the snow-line (05-lexicon:L11 sirra 'the snow-line'), at the camps, and in the storm season", effect: "unanswerable in law but recitable by any ear the wind reaches; what is said there can be brought to the moot by a witness, and then the speaker is heard again"}
    design_effect: "this is the bystander axis as a jurisdiction, not a clitic: no new morphology is coined, and 12-rank-rules SR-03 owns the underlying rule"
    axis: wind
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §2 (bystander axis: cheap to build, high scene value)"
      - "corpus/knowledge/linguistics/semantics-pragmatics.md §6 (deictic origo and who may quote an utterance onward)"
  - id: PR-04
    item: "referent selection in the taboo domains"
    rule: "the dead are referred to with exalt and never by name outside the lineage's own valley recitation (05-lexicon:L32; 14-kin-address A04 name closing); the storm-law is referred to with exalt only in recitation (05-lexicon:L31); ordinary storm talk uses the valley substitute (05-lexicon:L09 hur 'storm'), which is the fossil rung of TB-1"
    axis: both
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §3 (the dangerous word is replaced and preserved as a citation form)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §2 (referent honorifics and name avoidance share one axis)"

speech_acts:
  - id: SA-1
    act: "hearing (moot / fair court)"
    searle_class: "assertives in testimony, declarations in the finding"
    venue: "the moot in the winter valley (band JU-1), the fair court at the pass in the trade season (band JU-2); the pasture camp is not a venue (12-rank-rules SR-03: the pasture is the exemption of fact, not of law)"
    who_may_speak: "pasture-right holders of the disputed range and their lineage head (05-lexicon:L36 lasin 'lineage head, who keeps the pasture tally and speaks the lineage herd count at the fair'); a sworn reciter for any clause whose tune is in question (12-rank-rules SR-05, SR-06); spectators may attend, and their presence is what makes an utterance answerable (PR-03)"
    felicity_conditions:
      - "the claim is opened on the tally-cord before the first word (05-lexicon:L25 kor 'tally-cord')"
      - "the claim is spoken with the descend affix (PR-02); an undescended claim is heard as a claim against the moot"
      - "testimony is marked for source: witnessed or wind-reported, per the evidential set requested from 03-morphosyntax (deps); wind-reported testimony needs a reciter who will stand for the words"
      - "the act is spoken in the moot tune; a clause no wind-speaker has recited is mute law (12-rank-rules SR-05)"
    void_rules: "a wrong-direction call (14-kin-address A01) voids the act spoken in it and it is re-spoken; a claim not opened on the cord is not a claim; a finding pronounced off the moot ground grants nothing"
    axis: both
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/semantics-pragmatics.md §5 (Austin felicity conditions: who may speak, in what venue, with what precedent; Searle declaration class)"
      - "corpus/knowledge/linguistics/semantics-pragmatics.md §4 (evidential choice as testimony discipline; the witness line becomes a grammar line)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §6 step 6 (hearing as stress-test scene)"
  - id: SA-2
    act: "oath"
    searle_class: "commissives with a self-curse clause"
    forms: "two oath institutions exist and must not be swapped (12-rank-rules SR-04): the lineage oath sworn on the cord in the household's own speech and the moot tune (05-lexicon:L29 wal 'oath, the sworn word'), and the trade oath in the loan formula before the fair court (05-lexicon:L33 suwal 'the wind-oath, the formula sworn at the pass before the salt fair')"
    felicity_conditions:
      - "the oath is sworn against the herd and in the moving air (05-lexicon:L29 etymology); an oath sworn in still air, in a closed winter shelter, is provisional and must be re-sworn outdoors at the next crossing of a pass (05-lexicon:L17 kol 'the pass')"
      - "the self-curse names the swearer's breath and herd, and calls the storm-law as enforcer (05-lexicon:L01 im 'breath, the soul-carrier'; L31 hurim 'the storm-breath, the wind that answers a false oath')"
      - "the form matches the forum: a written lineage oath is void; a knotted trade oath is unenforceable (12-rank-rules SR-04)"
    breach: "the sanction gradient runs supernatural dread first (self-enforcing, and in-world the wind is believed to answer it), the moot's finding and knot cut second (12-rank-rules SA-1 knot cut; SA-4 moot silence), and the offender's name read at the dead-roll recitation third (12-rank-rules SR-01, SR-03 sanctions)"
    axis: wind
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/semantics-pragmatics.md §5 (commissives with self-curse clauses; a culture where words bind absolutely)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §3 (sanction gradient: supernatural dread through reputation to law)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §6 step 6 (oath as stress-test scene)"
  - id: SA-3
    act: "market (the salt fair at the pass)"
    searle_class: "directives and expressives; the fair court alone declares"
    venue: "the pass (05-lexicon:L17 kol 'the pass'), where the wind-oath is sworn before the fair opens (05-lexicon:L33 suwal) and the toll is taken (05-lexicon:L28 kól 'the toll taken at the pass, counted in salt or in flock animals')"
    goods_and_count_units: "salt and dried meat go down (05-lexicon:L22 pal 'salt'; L21 tal 'dried meat'); herd counts and tolls are reckoned in flock animals (05-lexicon:L18 ral 'flock animal, the counting unit of wealth')"
    norms:
      - "opening and closing are announced formulas; between them the ground is level for speech, and the addressee pitch of A01 is suspended on the ground itself (design-choice; the fair court owns enforcement, 12-rank-rules SR-04)"
      - "first offers are indirect; two pitch shapes do the work, the inviting contour and the asserting contour, and the interpreter's trade is rendering one as the other for a lowland partner who hears neither"
      - "a spoken bargain is half a bargain: it stands when the cord is notched; from the script era the fair also demands the written tally-sheet (05-lexicon:L26 kat 'the written tally-sheet demanded at the salt fair, a debt record'; L27 pert 'the script-mark')"
      - "the lowland partner's greeting and thanks are loan-layer and market-only; using them in camp is overreach or flirtation (loan layer per 05-lexicon layers; the term id is on the lexicon's side)"
    sanction: "a bargain reneged before the cord is notched is 'paid in weather' (proverb MD-1) and no court will hear it; a bargain notched and reneged goes to the fair court"
    axis: both
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §6 step 6 (market haggling stress test)"
      - "corpus/knowledge/linguistics/sociolinguistics-registers.md §4 (registers chosen per setting) and §5 (interpreters as exchange counters)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §4 (propriety euphemisms churn; the loan greeting will date and can date documents)"
  - id: SA-4
    act: "condolence at a herd loss and at a death"
    searle_class: "expressives"
    norms: "the condolent speaks the up-call even when standing is equal (14-kin-address A01); only rungs of the death ladder (TB-3) are used, never the closed name; the condolence counts no herds aloud and touches no herd-numbers, which are said held, not carried (PR-03); the dead-roll reciter, not the family, speaks the name when its season comes (12-rank-rules SR-03)"
    axis: wind
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/semantics-pragmatics.md §5 (expressives: mourning etiquette; envy taboos)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §4 (fear-euphemism as prophylaxis: naming attracts the thing)"

taboo_ladders:
  - id: TB-1
    taboo: "the storm-name"
    ownership_note: "the rule is 12-rank-rules SR-01 (named above the snow-line by wind-speakers alone; below the line, the valley substitute); the ladder and its strata are this file's contribution"
    fossil_rung: "05-lexicon:L09 hur 'storm' is the valley substitute that has become the ordinary word: underived to living speakers and felt as no euphemism at all. This is the fossil stratum the design rule asks for, and it is lexicon-owned."
    live_rungs:
      - {rung: R1, gloss: "the loud one", user: "herders in the storm season", age: "two to three generations", status: "still felt as a euphemism", term_id: "pending 05-lexicon delivery"}
      - {rung: R2, gloss: "the high guest", user: "the valley moot's public speech and the wind-speakers", age: "one generation", status: "polite circumlocution, now the public rung", term_id: "pending 05-lexicon delivery"}
      - {rung: R3, gloss: "outside weather", user: "the girl and boy herds' speech at the fair", age: "current youth usage", status: "loan-flavoured; elders call it careless and it will be the next standard", term_id: "pending 05-lexicon delivery"}
    minced_oath: "the worn storm-formula is the everyday swear of the camps, reduced to two syllables and parsed by nobody; it survives exactly because the full formula answers a name said by mistake (05-lexicon:L32 sense_note: a name said by mistake is answered by the storm formula), so the swear and the rite share a fossil"
    reserved_by: "05-lexicon's follows entry for taboo §3-§5 reserves the live ladder and the minced-oath slot; 15-pragmatics delivers them here, with forms left to the lexicon"
    axis: wind
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §5 stratum 1 (frozen replacement: a word whose etymology is a circumlocution nobody feels)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §4 (fear-euphemism freezes; one to two generations per rung)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §5 closing rule (one fossil, one live ladder, one minced oath, one legal fossil)"
  - id: TB-2
    taboo: "the storm-name, legal and liturgical fossil"
    items:
      - "the storm-name is written with a closed mark in the recitation text once the lowland script arrives, and later readers no longer parse the mark (05-lexicon:L27 pert 'the script-mark'); a script-era legal fossil"
      - "the statute that keys the name to the snow-line (12-rank-rules SR-01) exists as cord plus recitation, not as script, and the script's failure to mark the tune is why the cord survives (12-rank-rules SR-05)"
      - "the month name for the storm season is read as an ordinary calendar word and its substitute reading is dead, a calendar fossil (era coupling in 09-eras-calendar)"
    axis: wind
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §5 stratum 4 (divine-name doubles, calendar erasure, legal fossils)"
      - "corpus/knowledge/linguistics/writing-systems.md §4 (script spread and reform; diglossia and scribal politics)"
  - id: TB-3
    taboo: "the dead of a lineage"
    lexicon_anchor: "05-lexicon:L32 toksa 'the one who went down' is the fossilised circumlocution built on tok (the low ground) that no living speaker can gloss — the fossil stratum, lexicon-owned"
    live_rungs:
      - {rung: D1, gloss: "the one who went down", user: "everyone, from the moment of death", age: "the current ordinary rung", status: "the ladder's bottom step; itself the fossil", term_id: "05-lexicon:L32 toksa"}
      - {rung: D2, gloss: "gone up on the noon wind", user: "close kin in the still-breath year", age: "newer, coined on the upslope wind", status: "warmer, used while the name is closed", term_id: "pending 05-lexicon delivery"}
      - {rung: D3, gloss: "called up early", user: "the age-sets at the summer gathering", age: "in use now", status: "gentle-mocking, may become the next standard", term_id: "pending 05-lexicon delivery"}
    closing_rule: "a personal name is not spoken for four grass-seasons (05-lexicon:L32 sense_note); 14-kin-address A04 holds the name-closing rite and the still-breath year, and the recitation that may still speak the name at the dead-roll is 12-rank-rules SR-03"
    axis: both
    evidence: design-choice
    follows:
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §5 stratum 1 and the closing rule (fossil plus live ladder)"
      - "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §4 (fear ladders freeze; propriety ladders churn — this one freezes because the fear is real in-world)"
  - id: TB-4
    taboo: "the dead, minced-oath and accounting fossil"
