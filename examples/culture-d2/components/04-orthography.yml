  - {id: E1, name: "sul war", gloss: "Notched Wind", note: "tally-knot ledger; the standing frame; cord-keepers emerge as an office"}
  - {id: E2, name: "ashu war", gloss: "Wind of Columns", note: "borrowed script arrives up the salt road; adaptation begins"}
  - {id: E3, name: "hurshi", gloss: "The Standing", note: "reform: standard vertical hand, obligatory marks, wind-book archive"}
