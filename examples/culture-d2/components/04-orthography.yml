# examples/culture-d2/components/04-orthography.yml
# D2 design drill — orthographic system component (write worker, round 3).
# Non-canon. No real culture is described; every comparator is cited to a
# corpus entry by path + section, never to invented scholarship.

component: 04-orthography
culture: D2
canon: not canonized (D2 design drill)
component_version: 0.1.0-drill
scope: >-
  D2's recording systems only: the pre-writing tally-knot ledger, the late script
  borrowed from the lowland trade partner and its adaptation to D2 phonology, the
  glyph inventory, orthographic rules, media and archive, and the literacy
  institutions those imply. Phonology, morphosyntax, and the general lexicon are
  CONSUMED interfaces, never authored here.
follows:
  - corpus/knowledge/linguistics/writing-systems.md §1 (typology), §2 (calibration),
    §3.1-§3.4 (lineages), §4 (spread/reform/digraphia/literacy texture),
    §5 (decipherment keys), §6 (script-to-phonology fit table, inventory
    arithmetic, depth dial), §7 (conspect pitfalls), §8 (workbook)
  - corpus/knowledge/synthesis/era-language-staging.md §4 (stage packets),
    §5 (register strata; orthography-is-not-audio; script restriction vs
    language restriction), §7 (label typing; name record), §8 (non-deterministic sync)
  - corpus/knowledge/synthesis/loanword-material-dating.md §2 (separate clocks;
    TPQ/TAQ), §3 (loan strata; ultimate etymon vs immediate donor vs carrier)
  - corpus/knowledge/synthesis/contact-scenario-builder.md §2 (Thomason-Kaufman;
    Haspelmath), §3 (contact dossier), §5 (loan-row minimum)
  - corpus/knowledge/verification/phonology-sanity-gate.md §1 (stage x register
    scoping), §3 (inventory comparison bands), §4 (no inference from inventory
    to era/society), §5 (legality and allophony audit shape)
  - corpus/knowledge/linguistics/conlang-methodology.md Stage 0 (culture brief as
    spec), Stage 1 (inventory baselines), Stage 2 (phonotactics)
  - corpus/knowledge/linguistics/phonetics-phonology.md §6 (Hyman 2006 prosody
    typology; tonogenesis), §7 (whistled speech as a solid environment coupling)
  - corpus/knowledge/linguistics/historical-linguistics.md §6 (relative chronology),
    §9 (names as fossils; strata table)
  - corpus/knowledge/linguistics/orality-formulaic-language.md §8 (register design),
    §9 (textualization), §10 (calibration)
  - corpus/knowledge/culture-material/era-periodization-models.md §1 (emic vs etic),
    §2 (typology), §3 (era-name craft rules), §4 (seam logistics),
    §5 (calendar as loyalty)
  - corpus/knowledge/synthesis/worldbible-integration-contract.md §3 (ownership
    decision table), §4 (envelope fields), §5 (payload minimums), §6 (claim kind
    vs evidence vs canon), §7 (era staging without a universal ladder)

# ---------------------------------------------------------------- spine ----
spine:
  declared: >-
    Verticality (high/low, ascent/descent, seasonal poles) and wind (breath,
    soul-carrier, storm law). The record systems below are built so that the
    vertical axis of the writing surface and the wind that reads it are
    meaning-bearing, not decorative.
  coupling_rules:
    - id: SP-1
      rule: >-
        Sign geometry uses the vertical axis. Vowel marks for front vowels sit
        ABOVE the letter, back vowels BELOW; the inherent vowel /a/ is unmarked
        and is glossed in-culture as "plain air".
      follows: [writing-systems.md §3.3 (matra placement in real abugidas), §7.3 (ductus and baseline logic)]
    - id: SP-2
      rule: >-
        Text runs DOWNWARD in columns; blocks of columns are read as a descent
        from the head of the record to its foot. Column order differs by medium
        (bark-strips left-to-right, stelae right-to-left as archaic donor memory).
      follows: [writing-systems.md §4 (scripts travel and turn 90 degrees; Aramaic-to-Manchu chain)]
    - id: SP-3
      rule: >-
        The tally's positional semantics are the transhumance poles: low rung of
        the cord = valley-shelter account, high rung = high-pasture account, and
        the order of magnitude climbs with the ascent.
      follows: [writing-systems.md §7.6 (numerals as missing plumbing), §1 (semasiography is not writing)]
    - id: SP-4
      rule: >-
        Wind is procedural: a record gains authority only by standing a full
        season on the open frame ("wind-tested"); the storm season is the annual
        audit that unwinds failed records.
      follows: [era-periodization-models.md §4 (transition seams as designed logistics), celestial-symbolism-calendars.md §8 (whoever declares the cycle owns the count)]
    - id: SP-5
      rule: >-
        The whistle register is the long-distance read-out: herders whistle
        tallies and names across the valley, and the late reform makes accent
        marks obligatory on names and numerals so a whistle cannot be
        mis-recovered from the page.
      follows: [phonetics-phonology.md §7 (whistled speech: mountains + long-distance herding), §6 (pitch prominence in long-distance ecology)]
  non_import_guard:
    - id: NG-1
      rule: "No river, water, or flood imagery in D2 orthographic design, terminology, or emblems."
      why: "D1's spine is river + binding; D2's declared spine is verticality + wind (task brief)."
    - id: NG-2
      rule: >-
        The knot medium carries no binding/tying cosmology. Record authority words
        are STAND (hurshi) and READ (waren); cut/untie vocabulary is
        taboo-displaced, not foundational.
      why: "D1's contrast profile; a knot is tool physics here, never a metaphysical key."
    - id: NG-3
      rule: >-
        D2's script is NOT an alphabet. A full vowel-letter alphabet is D1's
        profile and is rejected below on phonology-fit grounds as well.
      why: "Contrast spine; writing-systems.md §6."
    - id: NG-4
      rule: "No D1 glyphs, sign names, or orthographic vocabulary are imported; the only modelled donor is the lowland trade partner L (unbuilt)."
      why: "D1 is a separate fixture; cross-fixture borrowing is not designed."

# ------------------------------------------------- phonology interface ----
# Consumed, not authored. Reconcile with 02-phonology.yml at handoff; the
# mapping rules are parameterized so a differing inventory re-derives.
phonology_interface:
  consumed_from: 02-phonology (shared key name: phonology)
  interface_id: P-D2-PHON
  interface_version: 0.1.0-assumed
  status: assumed-interface; reconcile at handoff (to-verify)
  consonants: "/p t k b d g m n s S r l j w h/ (15; spelled p t k b d g m n s sh r l y w h)"
  vowels: "/a e i o u/ (5 qualities; no contrastive length)"
  phonotactics: "(C)V(C); codas limited to /n l r s/; no onset clusters; no geminates"
  tones: >-
    pitch accent, not tone (Hyman 2006 type): one H per word, culminative;
    H is usually initial and a minority class carries non-initial H, which the
    script marks (to-verify: 02 owns the actual accent rule and any minimal pair).
  notable_rules:
    - "accent contrast is assumed to have arisen when an older coda contrast was reanalysed as pitch (tonogenesis path; phonetics-phonology.md §6)."
    - "stress and reduction are not assumed; term forms below are drill placeholders built from this interface."
  recompute_rule: >-
    If 02 differs: (1) consonant letters := |C| classes; (2) vowel diacritics
    := |V| - 1 (inherent vowel /a/); (3) if pitch accent is absent, delete glyph
    G-P01 and the OR-4 accent obligation, and the mark degrades to a learned
    non-initial stress mark; (4) if the coda set exceeds {n l r s}, re-run the
    syllabary arithmetic of SD-1 before reopening a syllabary option.
  follows: [writing-systems.md §6 (freeze the language first), §8.1; phonology-sanity-gate.md §1, §3]

