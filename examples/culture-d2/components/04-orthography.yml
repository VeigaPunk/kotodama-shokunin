    rule: >-
      E-labels are etic designer labels; the quoted names are emic era names and
      are the culture's own count. Era seams fall at the ascent muster (spring),
      not at a New Year; a lineage seat that keeps the lapsed count is signalling
      a claim, the D2 analogue of calendar-as-loyalty.
    follows: [era-periodization-models.md §1, §2, §3 (era-name craft rules), §5]

# ----------------------------------------------------------- tally block ---
tally:
  - id: T-00
    status: pre-writing recording system; declared NON-PHONETIC by this drill
    calibration: >-
      A cord-and-knot record is a recording technology, not a demonstrated
      phonetic writing system; the in-world dispute over whether the tallies ever
      "held speech" is modelled on the open quipu research question, and the drill
      asserts neither side.
    follows: [writing-systems.md §2 (quipu; no demonstrated phonetic encoding), §1 (semasiography class)]
  - id: T-01
    name: hur
    gloss: "standing frame; the vertical staff array on which records hang"
    design: >-
      Three vertical staffs bound to a head-beam, rungs at fixed heights, erected
      at the lineage seat and again at the summer pasture station. The frame is
      the record's coordinate system before it is a piece of furniture.
    follows: [writing-systems.md §7.9 (media physics), §1]
  - id: T-02
    name: sula
    gloss: "a lineage's tally cord"
    design: >-
      Spun from that lineage's own wool; dye and ply identify the lineage, so the
      pasture-right ledger is literally made of the herd it records. Spin
      direction (pura) encodes the record's seasonal pole; a cord whose spin
      contradicts its rung station is invalid on sight. One lineage, one cord
      keeper.
    follows: [writing-systems.md §7.5 (no homogeneity fallacy: per-holder registers), contact-scenario-builder.md §3 (who holds what)]
  - id: T-03
    name: sul
    gloss: "notch; the counted unit"
    design: >-
      Units are notches cut with the cord-keeper's knife; a group of ten is
      marked by a rung-crossing, and magnitude climbs UP the cord (low rung =
      units, higher = tens, hundreds), reading with the ascent. Empty positions
      are read as absence of account, i.e. the zero is positional, not a glyph.
    follows: [writing-systems.md §7.6 (numerals), §6 (orthographic depth analog: positional vs sign value)]
  - id: T-04
    name: hurshi
    gloss: "the standing; a wind-tested record"
    design: >-
      A ledger entry hangs on the open frame from ascent to descent muster. If no
      challenger's counter-cord defeats it through the storm season, it is cited
      as hurshi thereafter; a defeated cord is unwound (not destroyed) and
      re-cut. Institutional consequence: the verification ritual is public,
      seasonal, and weather-exposed, which is why the D2 phrase for reliable
      testimony is "it stood".
    belief: "B (attributed): the storm itself is said to test true records; the institution is real, the judgement is attributed to the wind."
    follows: [era-periodization-models.md §4, worldbible-integration-contract.md §6 (belief vs fact)]
  - id: T-05
    name: waren
    gloss: "the wind's reading; the read-out of a record"
    design: >-
      Ascent-season records are counted from the bottom rung upward;
      descent-season records from the top downward. Reading a cord against its
      recorded orientation is "reading downhill" and yields a wrong number by
      construction: the orientation convention is the ledger's checksum.
    follows: [writing-systems.md §7.6 (plumbing: conventions are part of the system), number-style positional logic in §1]

# --------------------------------------------------- script decision table -
script_decision:
  - id: SD-00
    method: >-
      Step 0 freeze the language (02-phonology interface above), then score each
      candidate type against D2's profile with the corpus fit table, computing the
      inventory price before choosing.
    follows: [writing-systems.md §6 (decision table; inventory arithmetic; depth dial), §8.2-§8.3]
  - id: SD-01
    candidate: syllabary
    arithmetic: "(C+1) x (V+1) x (1 + coda classes) = 16 x 6 x 5 = ~480 signs for a faithful CV(C) syllabary"
    verdict: rejected
    reason: >-
      A faithful syllabary prices at ~480 signs, and the lossy alternative
      (CV-only) would misrepresent codas and say nothing about accent. Both the
      learning cost and the distortion are unaffordable for a lineage-scale
      society with no school apparatus.
    follows: [writing-systems.md §6 (inventory arithmetic; syllabary trap), §7.4 (inventory denial), §7.2 (wrong typology)]
  - id: SD-02
    candidate: abjad (the donor's own shape)
    verdict: accepted as arrival form, rejected as final form
    reason: >-
      Fits the donor's templatic morphology; hides exactly what D2 cannot hide
      (five vowel qualities plus a culminative accent that distinguishes words).
      It is what comes up the salt road, and it must be patched.
    follows: [writing-systems.md §3.2 (a script carries the donor's blind spots), §6 (templatic roots -> abjad)]
  - id: SD-03
    candidate: abugida
    verdict: chosen target shape
    reason: >-
      CV-heavy, cluster-light, small legal coda set: consonant letters carry an
      inherent vowel, diacritics override it, and residual codas use the coda
      letters directly. Base signs = 15 letters + 4 vowel marks; the accent mark
      is a fifth layer. Sign count sits at the low end of the abugida band
      because the inventory is moderately small.
    follows: [writing-systems.md §3.3 (abugida mechanics), §6 (CV-heavy agglutinative-ish profile -> abugida), §1 (inventory bands)]
  - id: SD-04
    candidate: full alphabet (vowel letters as equals)
    verdict: rejected on two grounds
    reason: >-
      Phonology-fit: an alphabet pays for itself with rich clusters and a large
      vowel system, neither of which D2 has. Contrast spine: a vowel-letter
      alphabet is precisely D1's profile, and D2 was not designed to converge on
      it. The patch that D2 chose keeps vowels as marks, not letters.
    follows: [writing-systems.md §6 (alphabet row), §2 (no teleology toward alphabets)]
  - id: SD-05
    candidate: logosyllabary
    verdict: rejected
    reason: >-
      Requires a graph budget and a scribal bureaucracy D2 does not have
      (clan-segmentary lineages, no central chancery). Graph price 2,500-3,500
      for functional literacy is out of scale.
    follows: [writing-systems.md §1 (inventory), §7.4, §4 (literacy cost by script)]
  - id: SD-06
    candidate: featural script
    verdict: rejected
    reason: "Featural design is historically near-unique; handing it to D2 would be overdesign, and it would also encode the accent system too neatly to be believed."
    follows: [writing-systems.md §7.7 (featural overdesign), §2 ("most scientific script" rhetoric)]
  - id: SD-07
    candidate: keep tallies only, no script
    verdict: rejected
    reason: >-
      The felt need is concrete and external: salt and dried-meat sales to lowland
      farmers generate debt records the partner's own script already writes, and
      pasture leases between lineages need recitable copies that outlive a
      cord-keeper. Recording systems spread when they solve a community's felt
      need and get institutional backing; D2 has both.
    follows: [writing-systems.md §2 (new scripts live on felt need + institutional backing)]
  - id: SD-08
    candidate: digraphia
    verdict: adopted
    reason: >-
      Two hands, one script: a market hand in the donor's horizontal orientation
      for contracts with L, and a pasture hand rotated vertical for internal
      records. This is the Eurasian norm for a trading polity and doubles as a
      register marker.
    follows: [writing-systems.md §4 (digraphia as the norm; scripts turn 90 degrees), era-language-staging.md §5 (register strata)]

# --------------------------------------------------------- adaptation -----
adaptation:
  - id: AD-00
    donor: >-
      L, the lowland trade partner (design placeholder; unbuilt culture, to-verify).
      Ultimate etymon, immediate donor, and carrier are kept distinct: L is the
      immediate donor and carrier of the script; nothing is asserted about where L
      got it.
    follows: [loanword-material-dating.md §3.2 (ultimate etymon vs immediate donor vs carrier)]
  - id: AD-01
    step: arrival bound
    design: >-
      The first D2-facing documents are L-side market tallies that list D2
      lineage names. Their existence gives a terminus post quem for D2 names in
      writing, not a date for D2 adoption of the letters; the script's arrival
      and the community's adoption are separate clocks.
    follows: [loanword-material-dating.md §2 (separate clocks; TPQ/TAQ), era-language-staging.md §1 (five clocks)]
  - id: AD-02
    step: rotation
    design: "The letters are rotated to descend down the strip and down the stela face; horizontal writing survives only in the market hand."
    follows: [writing-systems.md §4 (rotated-vertical lineage), §7.9 (media physics: strip and awl)]
  - id: AD-03
    step: inherent-vowel patch
    design: "Consonant letters are read with inherent /a/ unless a vowel mark overrides; the market hand keeps the donor habit of omitting vowels, the pasture hand does not."
    follows: [writing-systems.md §3.3 (inherent vowel + virama family), §6 (borrower patches the donor's blind spot)]
  - id: AD-04
    step: vowel marks
    design: "Four marks: front vowels above the letter, back vowels below. In-culture gloss: above = high breath, below = low breath; unmarked = plain air."
    follows: [writing-systems.md §3.3 (matra placement), §7.3 (ductus logic)]
  - id: AD-05
    step: accent mark
    design: >-
      One tick, written above the vowel mark, derived from the pre-writing NOTCH
      rather than from any donor letter: the pitch layer of the script is the
      tally's inheritance. It is written only for non-initial accent at E2, and
      becomes obligatory on names and numerals at E3 (SP-5).
    follows: [writing-systems.md §7.9 (glyph shape from tool and prior medium), §2 (Pahawh-style tone marking as the marked option)]
  - id: AD-06
    step: silent record mark
    design: >-
      One donor letter whose segment D2 does not have is retained as a silent
      mark distinguishing a trade copy from a pasture copy - a silent
      classifier in the determinative tradition, not a sound.
    follows: [writing-systems.md §1 (determinatives/classifiers as a reusable device)]
  - id: AD-07
    step: numerals
    design: >-
      No numeral glyph is borrowed. Native notch-figures (vertical stroke groups)
      continue the tally's count; magnitude is positional down the column; an
      empty position is the zero. The festival-muster recalculation is the annual
      audit of the numeral set.
    follows: [writing-systems.md §7.6 (numerals, positional systems), §3.1 (accounting-first invention path)]
  - id: AD-08
    step: word division and separators
    design: >-
      Words are separated by a gap about one rung wide plus a small rung-mark
      separator between ledger items; the donor's unseparated style is abandoned
      in the pasture hand because herders read aloud by item.
    follows: [writing-systems.md §4 (scriptura continua vs word separation; Saenger), §7.6 (punctuation plumbing)]

# ---------------------------------------------------------- orthography ----
orthography_rules:
  - id: OR-01
    rule: "Columns descend; bark-strips are ordered left-to-right in a bundle; stelae keep the archaic right-to-left column order."
  - id: OR-02
    rule: "Word gap = one rung; item separator = rung-mark; record end = the cord's end mark; corrections are knife-cuts through the erroneous notch, never erasures (hide and bark do not erase)."
    follows: [writing-systems.md §7.6, §7.9]
  - id: OR-03
    rule: >-
      Register variants of one script: monumental (stelae, angular, full marks),
      ledger (hide strips, ligatures, abbreviation by notch-signs; the working
      hand), market (donor orientation, donor conventions, vowels may be omitted).
    follows: [writing-systems.md §7.5 (monumental vs cursive, regional hands), era-language-staging.md §5]
  - id: OR-04
    rule: >-
      Depth dial: at E2 the orthography is deep (vowels and accent optional;
      spellings carry the pre-reform accent); at E3 the ledger becomes shallow
      (vowel marks obligatory, accent obligatory on names, numerals, and loans)
      while legal and monumental registers stay deep and archaizing.
    follows: [writing-systems.md §6 (depth dial; sound change after standardization -> deep), §4 (reform events)]
  - id: OR-05
    rule: >-
      Orthography is not audio. Archival spellings are recited with the current
      accent system unless a learned register licenses the older reading; a
      spelling-pronunciation revival movement is an E3 feature, not a fact about
      E3 speech.
    follows: [era-language-staging.md §5 (orthography is not audio; reading convention), historical-linguistics.md §6]
  - id: OR-06
    rule: >-
      Script restriction and language restriction are separate: a D2 lineage may
      archive in the D2 language and D2 hand, and a market document may be
      written in L's language in L's hand with D2 names inside it.
    follows: [era-language-staging.md §5 (separate a script restriction from a language restriction)]
  - id: OR-07
    rule: "Read-out may be spoken or whistled; the whistle carries accent and number, which is why SP-5's marking reform lands on names and numerals first."
    follows: [phonetics-phonology.md §7 (whistled speech), §6]
  - id: OR-08
    rule: "The sign set is not a substitution cipher over any real alphabet: letters map to D2 phoneme classes, marks map to vowel colour and accent, and the numeral layer is native."
    follows: [writing-systems.md §7.1 (cipher-script trap)]

# ------------------------------------------------------- glyph inventory ---
glyph_inventory:
  - id: G-00
    note: >-
      Working key only: these are sign classes and counts, not drawings. Letter
      identities are phonological classes, never a cipher over a real alphabet
      (OR-08). Donor glyph shapes are not fixed by this file (to-verify; L is
      unbuilt).
    follows: [writing-systems.md §8.3 (state the inventory and the literacy price), §7.1]
  - id: G-C01..G-C15
    class: consonant letters
    count: 15
    design: "One letter per D2 consonant phoneme class; the letters for n l r s double as codas; no separate coda forms at E2, ligatures appear by E3."
    follows: [writing-systems.md §3.3 (abugida behaviour), §7.3 (small stroke inventory)]
  - id: G-V01..G-V04
    class: vowel marks
    count: 4
    design: "e and i above the letter, o and u below; /a/ inherent and unmarked; the mark is the vowel's colour placed on the vertical axis (SP-1)."
    follows: [writing-systems.md §3.3 (matra placement), §6 (abugida fit)]
  - id: G-P01
    class: accent tick
    count: 1
    design: "Written above the vowel mark for non-initial accent at E2; obligatory on names and numerals at E3; derived from the tally notch, not from a donor letter (AD-05, SP-5)."
    follows: [writing-systems.md §2 (under-marking tone is the common native pattern; Pahawh is the marked option), phonetics-phonology.md §6]
  - id: G-S01
    class: silent record mark
    count: 1
    design: "A donor letter with no D2 value, retained as a silent trade-copy / pasture-copy classifier (AD-06)."
    follows: [writing-systems.md §1 (determinatives/classifiers as a reusable device)]
  - id: G-N00..G-N09
    class: numeral figures
    count: 10
    design: "Native notch-figures; magnitude by column position; an empty position is the zero; no numeral was borrowed (AD-07)."
    follows: [writing-systems.md §7.6 (numerals), §3.1 (accounting-first path)]
  - id: G-U01..G-U04
    class: separators and correction marks
    count: 4
    design: "Word gap (spacing, not a sign), rung separator, record-end mark, and the correction cut that strikes an erroneous notch (OR-02)."
    follows: [writing-systems.md §7.6 (plumbing), §7.9 (media physics: correction by cut, not erasure)]
  - id: G-TOTAL
    total_basic_signs: "15 letters + 4 vowel marks + 1 accent + 1 silent mark + 4 separators + 10 numerals = 35 basic signs; the literacy price is priced in LI-03"
    follows: [writing-systems.md §4 (literacy cost by script is a first-order social variable), §8.3]

# -------------------------------------------------------------- symbols ----
symbols:
  - {id: S-01, sign: "the standing frame (three verticals, three rungs)", domain: "lineage record authority; pasture rights", era: "E1-", notes: "cut over the door of the winter shelter and on the pass stela; reads as 'this seat keeps records', never 'this seat ties'."}
  - {id: S-02, sign: "the notch tick (accent mark)", domain: "speech; the breath that carries a word", era: "E2-", notes: "descends from the tally notch; on stelae it is the 'breath mark' that tells a reader which syllable stands high."}
  - {id: S-03, sign: "the descending column", domain: "the pass; the descent between pasture and shelter", era: "E2-", notes: "a column of text at a pass doubles as a waymark; 'the pass speaks' is how a traveller reports finding one."}
  - id: S-00
    follows: [writing-systems.md §7.9 (shape from medium and prior systems)]
    note: "sign records use the culture-packet symbols keys: sign, domain, era, notes."

