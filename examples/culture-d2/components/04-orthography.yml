# --------------------------------------------------- media and archive -----
media_archive:
  - {id: M-01, medium: "bark strip", use: "working ledger line; hangs with the cord; cheap, short-lived", survives: no}
  - {id: M-02, medium: "incised hide", use: "contract and lease copies; knife-cut parallel to the fibers", survives: no (rot)}
  - {id: M-03, medium: "pass stelae", use: "monumental register: era name, lineage, right claimed, curse formula", survives: yes}
  - {id: M-04, medium: "L-side market archive", use: "unbuilt (to-verify); the only likely bilingual corpus of D2 names", survives: to-verify}
  - id: M-05
    rule: >-
      Survival logic decides what any future in-world philology can read: cords
      and strips rot, so pre-writing D2 is recoverable only through later
      descriptions and the stelae; the bilingual keys sit in L's archive, not in
      D2's pastures. A false-decipherment industry around the tallies is a
      standing genre, and the honest outcome of a tally corpus is a live dispute.
    follows: [writing-systems.md §5 (decipherment keys; false decipherments), §8.5-§8.6, §2 (quipu dispute)]

# --------------------------------------------------- literacy institutions -
literacy_institutions:
  - id: LI-01
    rule: "The scribal class does not appear with the script: the cord-keepers of E1 (custodians of the standing frames) are the first lettered D2, so the institution predates the letters."
    follows: [writing-systems.md §2 (institutional backing), §7.4 (the scribal class is an institution)]
  - id: LI-02
    rule: "Scribes are licensed at the ascent muster by the assembly of lineage heads; a lowland-trained scribe is a status outlier and a plot hook."
    follows: [era-periodization-models.md §4, §5]
  - id: LI-03
    rule: "Literacy price: about 30 signs (15 letters + 4 vowel marks + 2 marks + numerals). Merchant-level literacy is a season of study; scribe-level requires the ledger conventions. One reader per lineage seat and per trade house is the design baseline, not a measured census."
    follows: [writing-systems.md §4 (literacy cost by script; a first-order social variable), §7.4]
  - id: LI-04
    rule: "Families of practice diverge: the market hand indexes lowland dealings, the pasture hand indexes lineage standing, and the monumental hand indexes a right that must outlive both."
    follows: [writing-systems.md §7.5, era-language-staging.md §5]

