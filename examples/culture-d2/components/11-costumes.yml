  exit_code: "0 (clean) — final run after the 10-materials/09-eras reconciliation, 2026-10-17. Earlier in the same session a first run returned exit 2 (G-DATA, input is not one mapping) because two keys sat at the same indent as their sibling list items (era_reconciliation.warning, form_slots.note); both were re-placed, and every later revision was re-run."
