  a07_selfcheck: "A-07 fields present on all 10 garment records (garment, material, wearer_rank, rite, era, route, axis, evidence); >= 6 materials with kind/stage routes (9); >= 2 cloth_sources with max_width_m and eras (3); wool chain complete at CMAT-01/CMAT-02 (fiber -> cloth -> garment); felt and loom ceilings justified (CS-03 vs textile §5); lowland cloth is an E1 import with a dated route and is excluded in E0 (CMAT-06/CMAT-07 excluded_eras); no 'silk-like' placeholder, though CMAT-08 silk is flagged for having no counterpart in 10-materials (OQ-3); ascent/descent/storm layers are named records (GAR-02 high pole + storm layer, GAR-03 the crossing and its descent state, GAR-10 the gale layer)."
  scope_note: "The gate reads this file's own blocks only: costumes, materials, cloth_sources, eras (tags). The R-checks are vacuous here by construction because the rule records live in 12-rank-rules and are not duplicated (OQ-4); material, import-era, loom-bound and anachronism checks are live."
  findings: "none (exit 0, no FINDING lines) on the final run. Findings dispositioned at write time: the exit-2 parse defect is fixed, not waived; the two material records with no 10-materials counterpart are recorded as findings in the file (OQ-3), not silently merged."
