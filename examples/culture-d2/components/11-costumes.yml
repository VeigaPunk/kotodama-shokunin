follows_index:
  alias_dress: "corpus/knowledge/culture-material/dress-through-eras.md §1 (three-slot grammar: silhouette / material / wearer rule; port constraints, never names), §3 (the trouser-and-riding axis, re-caused here for a herding pass), §5 (layer grammar; rank in layer count and trim), §9 (the hem speaks: hem-as-person-proxy device, re-read vertically here as the count line), §10 (who-wears-what rule generator: ledger columns and the two-mechanism minimum), §11 (application protocol steps 1-8), §12 (debunk shelf: no timeless costume without a dated founding fight)"
  alias_semiotics: "corpus/knowledge/culture-material/costume-semiotics.md §1 (dress is a weak code, not a language; the misreading test), §3 (channel grid: rank, rite, region, gender, occupation, faction, age), §4 (sumptuary display: on-the-books vs on-the-street; hidden undersides as the defiance channel), §5 (a modesty code needs its display sibling), §6 (legibility dial; imposture theorem), §7 (cross-era signaling drift; one region one era behind), §9 (application protocol: enforcement artifacts, reading scenes, drift plan, language wiring), §10 (coupling notes)"
  alias_sumptuary: "corpus/knowledge/culture-material/sumptuary-law-rank-display.md §2 (the regulated object: fiber/material, trim, garment-type axes), §5 (status outfit with a hidden-luxury dialect; the analogy used here is bounded, not evidence), §8 (drafting formulae: degree, assay, forfeiture-plus-informer, occasion exemption, renewal — implemented by 12-rank-rules, consumed here by rule id), §10 (build sequence)"
  alias_textile: "corpus/knowledge/culture-material/textile-technology.md §1 (the four gates: fiber, dye, loom, finish), §2 (fiber hierarchy and the fiber prestige order), §5 (fulling and finishing as the expensive half: the felt grade ladder), §6 (a culture cannot have a basic costume term for a cloth its gates cannot make)"
  alias_ritual: "corpus/knowledge/culture-material/ritual-garments.md §1 (garment-as-office; donning as a rite with order and formula), §6 (lifecycle-rite dress: the mourning year as a liminal sequence), §8 (build order for a fictional sacral wardrobe)"
  alias_garlex: "corpus/knowledge/culture-material/garment-lexicon-crosslinguistic.md §4 (loan vs coin: a cloth's name travels with the cloth when the receiver does not make it), §6 (classifiers: how a language ontologizes garments), §9 (craft checklist)"
  alias_eras: "corpus/knowledge/culture-material/era-periodization-models.md §13 (build order: give the culture its own way of cutting time, then date the seams)"
  alias_brief: "examples/culture-d2/components/01-brief.yml contract.era_tags (E0/E1/E2 fixed), contract.record_fields.costumes, contract.rules RG-01 (cord geometry: vertical position, never obligation), RG-02 (every record carries follows), RG-05 (every record carries axis), CP-09 (costume records carry the full route), A-07 (this component's acceptance block)"

eras: ["E0", "E1", "E2"]
era_note: "Tags only, defined by 09-eras-calendar.era_tag_map and its nine named_eras records. The contract's fixed space is E0-E3 (01-brief.yml contract.era_tags, revised mid-round on 2026-10-17, with the alias rule); these records occupy E0-E2 and E3 is unoccupied here (09-eras-calendar assigns it). Era names and era_dates are that component's and are not asserted here; the assembler takes `eras`/`era_dates` from it. This component uses the contract tag space directly, so no alias is needed for its own records — stated here explicitly per the alias rule."
era_reconciliation:
  # 09/11/12 now share canonical tags; other components retain local labels.
  # Earlier labels are mapped explicitly, never merged by their E-number.
  - {id: ERX-0, source: 09-eras-calendar, their_labels: "era_tags E0|E1|E2|E3 (identical meanings to the contract) with in-world era names Open Grazing, First Ascent, Salt Turn, Long Storm, Ash Wind, Bitter Smoke, Marked Count, Two Counts, Still Air (reserved)", mapping: "identity for the tags; the names are theirs and are not used as era values here", status: "confirmed on disk at write time; their ER- records' `costume_seam` fields point at this component's GAR- ids (e.g. felt layers from the earliest stratum, lowland cloth not before the E0/E1 seam) and match what this file dates"}
  - {id: ERX-R, source: 12-rank-rules, their_labels: "E0|E1|E2", legacy_labels: {era-1: E0, era-2: E1, era-3: E2}, maps_to: "identity; E0 covers ER-01..ER-06, E1 is ER-07 Marked Count, E2 is ER-08 Two Counts", status: "round-4 alignment; record tags follow 09-eras-calendar.era_tag_map, with rule intervals preserved in era_history"}
  - {id: ERX-1, source: "10-materials (slot ids), 08-symbols (E1..E4)", their_labels: {10-materials: "E1 shelter era", 08-symbols: "E1 shelter era"}, maps_to: "E0", status: "(to-verify) proposed mapping; slot-level, not label-level"}
  - {id: ERX-2, source: "10-materials, 08-symbols, 05-lexicon", their_labels: {10-materials: "E2 road era", 08-symbols: "E2 road era", 05-lexicon: "Nalne (salt-road naming)"}, maps_to: "E1 (script-arrival seam; the road and the treaty register are the same seam in this file's dating)", status: "(to-verify)"}
  - {id: ERX-3, source: "10-materials, 08-symbols, 05-lexicon", their_labels: {10-materials: "E3 assembly era", 08-symbols: "E3 assembly era", 05-lexicon: "Pertne (script naming)"}, maps_to: "E1 -> E2 (two-to-one: their assembly era sits inside the seam and the anchor; the finer grain is theirs)", status: "(to-verify)"}
  - {id: ERX-4, source: "10-materials, 08-symbols", their_labels: {10-materials: "E4 script era", 08-symbols: "E4 script era"}, maps_to: "E2 (literate anchor; the luxury import slot)", status: "(to-verify)"}
  - {id: ERX-W, warning: "08-symbols' and 10-materials' E-numbers do NOT coincide with the contract's (their E1 = shelter = contract E0). Merge by slot, never by number; and note 10-materials' own flagged seam tension (12-rank-rules' E1 register, formerly era-2, vs 08-symbols' E4 script media) is the same seam this table maps."}

deps:
  - component: 12-rank-rules
    kind: I
    ids: [WR-01, WR-02, WR-03, WR-04, WR-05, WR-06, WR-07, WR-08, WR-09, TR-02, TR-03, TR-05, TR-06, LO-01, LO-02, LO-05]
    note: "Permission edges. These rule records consume GAR-01..GAR-08 by id (12-rank-rules `garment_refs`); this file writes no rule records of its own and keeps the id/gloss match so their rule text stays valid. The rule-to-garment mapping per garment is listed in each garment record's `rule_edges`."
    status: "(to-verify) the sibling's rules were read only at its declared contract block and its WR-02 record; the full rule text is not restated here (RG-03)."
  - component: 05-lexicon
    kind: T
    ids: [L08, L09, L14, L15, L18, L25, L34, L35, L36, L37]
    note: "Transmission edge. Surface forms are the lexicon component's; L34 mir (fleece, wool) and L35 mirken (wool cloak, the felted wrap worn at both pastures) are the two costume-field lexemes already landed, and GAR-01/GAR-02 are their valley and high-pole grades. L36 lasin (lineage head) and L37 velin (vanguard herder) supply two wearer institutions used below."
    status: "(to-verify) further garment forms are requested as form slots (LEX-GAR-01..10, (to-verify)); the lexicon component owns whether it coins them."
  - component: 08-symbols
    kind: R
    ids: [S1, S3, S4]
    note: "Retrospective-interpretation edge. The storm register (S1), the counted-absence register (S3) and the pack-gear register (S4) supply the hue reading, the descent grey and the pack-ox the fiber comes off; hue meaning stays theirs (each garment record states only what is worn, and cites S1/S3 where a colour is involved)."
    status: "Updated after 10-materials landed: the local darkening is now carried as CMAT-09 hearth-dark (their MAT-10 slot), so this file no longer coins a competing storm dye; 08-symbols' storm cloak is still read as GAR-02 (OQ-2)."
  - component: 09-eras-calendar
    kind: F
    ids: []
    note: "Feasibility edge for names, dates and seams: the tags E0/E1/E2 are the contract's and this file's records use them; the in-world era names (Open Grazing ... Two Counts) and all dates are that component's and are not asserted here. Its ER- records' `costume_seam` fields address this component's GAR- ids by id."
    status: "Read on disk at write time; the two files agree on the felt layers' earliest stratum and on lowland cloth not predating the E0/E1 seam (mapping ERX-0)."
  - component: 10-materials
    kind: F
    ids: []
    note: "Feasibility edge, and the contract this component's material set is bounded by. Mapping is by slot per that file's own instruction: each CMAT record carries `maps_to` to its MAT- record (wool/ewe-fleece, felt/felt, leather/herd-hide, horn/horn-and-bone, plant-thread cloth/lowland-plant-cloth, cord/lowland-plant-cord, hearth-dark/hearth-dark). Two records have no counterpart and are reported, not merged: CMAT-03 pack-ox down and CMAT-08 silk (OQ-3). ID collision resolved by re-lettering this file's records to CMAT-* (their MAT-01..MAT-22 space left intact)."
    status: "Read on disk at write time; slot mappings declared above; two unmapped records carried as findings."
  - component: 06-names, 14-kin-address, 15-pragmatics
    kind: R
    ids: []
    note: "No direct claims. Named for completeness: the mourner's address and the fair-court formulae are theirs; this file only states which garment is worn."

wearer_institutions:
  # Rank is held as a pasture task, never as wealth (CP-06, CP-09; A-07 check 4).
  - {id: WI-1, institution: "lineage head", lexicon_ref: L36, rule_ref: DEG-1, garment_basis: "speaks the lineage herd count at the fair; wears the lineage's coat grade"}
  - {id: WI-2, institution: "vanguard herder", lexicon_ref: L37, rule_ref: "(to-verify) DEG slot", garment_basis: "opens the summer pasture; first up the pass wears the high-pole coat first"}
  - {id: WI-3, institution: "registered herd-master", lexicon_ref: "(to-verify)", rule_ref: "WR-02 (the registered class the fair court reads against the caravan register)", garment_basis: "the only rank licensed lowland-woven cloth, and only at the fairgrounds and on the valley road"}
  - {id: WI-4, institution: "wind-standard bearer", lexicon_ref: "(to-verify)", rule_ref: "GAR-05 refs WR-04, TR-02, TR-05, LO-05", garment_basis: "appointed annually, not inherited; wears the mast-sash and nothing that outlives the appointment"}
  - {id: WI-5, institution: "treaty stranger", lexicon_ref: "(to-verify)", rule_ref: "GAR-06 refs WR-02, WR-07, TR-06", garment_basis: "the regulated lowland person at the fair: lowland cut, no hem-cords, no lineage coat"}
  - {id: WI-6, institution: "mourner (household of the dead)", lexicon_ref: "(to-verify)", rule_ref: "GAR-07 refs WR-05, TR-02", garment_basis: "time-locked one year; felt left shaggy, undyed, hem-cords cut back"}
  - {id: WI-7, institution: "bale keeper / caravan hand", lexicon_ref: "(to-verify)", rule_ref: "GAR-08 refs WR-08, WR-09, TR-03, LO-02", garment_basis: "handles the imported cord under the exception channel; wears no imported cloth"}

materials:
  # IDs re-lettered CMAT-* to avoid colliding with 10-materials' MAT-01..MAT-22 (that
  # component owns the inventory; this block is the costume-facing subset with routes).
  # Mapping is by slot, per 10-materials' own instruction ("map by slot id rather than by
  # label", 10-materials interface_facts) — never by label merge. `maps_to` names the
  # 10-materials record where one exists; a null map is a reported finding, not a merge.
  - id: CMAT-01
    material: "wool"
    composition: "fleece of the herd's wool analog (a sheep analog; no real breed is described); native state fiber, spun and woven in the valley sheds"
    maps_to: "10-materials MAT-01 ewe-fleece (same slot: the state fiber)"
    axis: both
    evidence: design-choice
    follows: [alias_textile]
    routes:
      - {kind: local, stage: fiber}
      - {kind: local, stage: cloth}
  - id: CMAT-02
    material: "felt"
    composition: "matted and fulled wool, non-woven; formed on the felt table, so the loom ceiling does not bound it (CS-03 is the bound that applies)"
    maps_to: "10-materials MAT-02 felt (name and slot match)"
    axis: verticality
    evidence: design-choice
    follows: [alias_textile]
    routes:
      - {kind: local, stage: cloth}
      - {kind: local, stage: garment}
  - id: CMAT-03
    material: "pack-ox down"
    composition: "fine combed underfleece of the pack-ox (the salt-bearer of 08-symbols S4), taken at the summer clip; the finest thing the herd yields"
    maps_to: null
    maps_to_note: "REPORT, do not merge: 10-materials supplies the pack-ox's hair as cordage (MAT-03 ox-hair cordage) but no down/underfleece record. This material is the 'yak/camelid fiber analog' of this component's dispatch; it is carried with the flag rather than dropped (OQ-3)."
    axis: verticality
    evidence: design-choice
    follows: [alias_textile]
    routes:
      - {kind: local, stage: fiber}
  - id: CMAT-04
    material: "leather"
    composition: "smoke-cured hide of the herd (sheep and pack-ox); worked straight to the piece, so its route has a garment stage and no yarn or cloth stage"
    maps_to: "10-materials MAT-20 herd-hide (same slot: the wind-facing outer layer)"
    axis: both
    evidence: design-choice
    follows: [alias_textile]
    routes:
      - {kind: local, stage: garment}
  - id: CMAT-05
    material: "horn"
    composition: "horn of the herd, steam-softened and cut into toggles and placket pins"
    maps_to: "10-materials MAT-22 horn-and-bone (same slot: toggles and pins)"
    axis: neutral
    coupling_note: "A fastening material, not a spine record: it couples to the herd economy (brief R-03 allows leather and horn from the same herds) and to no axis of its own."
    evidence: design-choice
    follows: [alias_textile]
    routes:
      - {kind: local, stage: trim}
  - id: CMAT-06
    material: "lowland plant-thread cloth"
    composition: "woven plant-thread cloth of the lowland farmers, imported by the caravan as finished cloth; no D1 craft route is reused (this is the partner's weave, and the local bast of 10-materials MAT-04 nettle-bast is that component's cordage material, not a garment here)"
    maps_to: "10-materials MAT-05 lowland-plant-cloth (same slot) — note the convergent exclusions: their record is excluded in its E1 (shelter) slot and this one in E0, which are the same slot under the era mapping"
    axis: verticality
    evidence: design-choice
    follows: [alias_textile, alias_garlex]
    excluded_eras: ["E0"]
    routes:
      - {kind: import, stage: cloth, eras: ["E1", "E2"]}
    note: "The dated E1 import the acceptance block requires, and the cloth 12-rank-rules' GAR-04/GAR-06/GAR-08 glosses assume. Reconciliation: it is present in 10-materials (MAT-05) although not in this component's dispatch list — kept, mapping declared (OQ-3)."
  - id: CMAT-07
    material: "lowland cord"
    composition: "twisted plant-thread cord of the lowland partner; imported in coils and used for bales and harness repair under the exception channel"
    maps_to: "10-materials MAT-06 lowland-plant-cord (same slot: the exception channel)"
    axis: neutral
    coupling_note: "Kept out of the axes because its only spine contact is record geometry: a cord counts (RG-01), it does not bind a person to anyone."
    evidence: design-choice
    follows: [alias_sumptuary, alias_brief]
    excluded_eras: ["E0"]
    routes:
      - {kind: import, stage: trim, eras: ["E1", "E2"]}
  - id: CMAT-08
    material: "silk"
    composition: "filament silk of the lowland partner's moths, arriving as woven cloth in the treaty grade; never reared, reeled, spun or woven in D2"
    maps_to: null
    maps_to_note: "REPORT, do not merge: 10-materials has no silk record; its luxury import of the anchor era is MAT-07 lowland-broadcloth (fulled, sheared, wool), arriving in its E4 slot = brief E2. Silk is this component's dispatch-mandated 'late-era luxury' and is retained; the integrator must either keep both luxury imports or re-letter GAR-06 to the broadcloth (OQ-3)."
    axis: verticality
    evidence: design-choice
    follows: [alias_textile, alias_garlex]
    routes:
      - {kind: import, stage: cloth, eras: ["E2"]}
    note: "The late-era luxury of this component's dispatch. It is the treaty grade of the same lowland-woven cloth channel 12-rank-rules regulates (WR-02), not a second import class; the word and the cloth arrive together (alias_garlex §4)."
  - id: CMAT-09
    material: "hearth-dark"
    composition: "smoke-darkening of wool and felt at the winter hearth — soot and heat, no dye molecule added (the chemistry of 10-materials MAT-10, mapped by slot)"
    maps_to: "10-materials MAT-10 hearth-dark (same slot and chemistry; the earlier name 'storm-slate bath' was withdrawn in favour of this slot's name)"
    axis: wind
    evidence: design-choice
    follows: [alias_textile, alias_semiotics]
    routes:
      - {kind: local, stage: dye}
    note: "Hue meaning belongs to 08-symbols (S1); this record claims makeability only. The genuine tannin-and-iron black (10-materials MAT-09 wool-black) and the traded indigo (MAT-08) are NOT claimed here."

cloth_sources:
  - {id: CS-01, name: "valley ground loom (winter sheds; warp staked to the shelter floor)", max_width_m: 0.65, eras: ["E0", "E1", "E2"], axis: verticality, evidence: design-choice, follows: [alias_textile]}
  - {id: CS-02, name: "upright warp-weighted loom (the tall shelter frame)", max_width_m: 1.25, eras: ["E0", "E1", "E2"], axis: verticality, evidence: design-choice, follows: [alias_textile]}
  - {id: CS-03, name: "felt table (non-woven matting; the felt ceiling, not a loom)", max_width_m: 1.9, eras: ["E0", "E1", "E2"], axis: verticality, evidence: design-choice, follows: [alias_textile]}
loom_note: "A felted coat is not bounded by loom width but by the table it is worked on (textile §5: fulling is the expensive half); CS-03 is declared for exactly that reason, so the seamless-panel check has a real bound to read."

costumes:
  - id: GAR-01
    garment: "winter valley coat (heavy felted wool; uncombed finish optional)"
    form_slot: "LEX-GAR-01, the valley grade of L35 mirken (to-verify with 05-lexicon)"
    material: "felt"
    wearer_rank: "any adult of a pasture-holding lineage, at the low pole (lineage head speaks the coat's grade at the fair; WI-1)"
    rite: "low stay (the shelter season); not worn above the sell-line"
    era: "E0"
    route: "native chain: L34 mir (fleece) -> shear -> card -> felt table (CS-03) -> cut and seamed in the valley shelter -> horn toggles; no imported component"
    provenance: local-production
    closures: [{material: horn, form: "toggle"}]
    panels: [{name: "body felt panel", width_m: 1.7, seamless: true}]
    rank_mark: "none on the body; the coat's grade is spoken, not worn (the count lives on GAR-03 and the cords)"
    axis: verticality
    evidence: design-choice
    viewer_read: "A stranger at the valley gate reads a heavy coat as weather, not as rank; a lineage member reads the finish (combed or not) as who did the work."
    penalty: "none for the coat itself; wearing it above the sell-line in the pasture season is the lapse the law catches by coat, not by name (12-rank-rules TR-05)"
    era_seam: "E0 to E1 unchanged; E2 keeps it as the shelter coat while the road coat takes the fair"
    misread: "A lowland trader at the gate offers to buy 'the poor man's coat' from a lineage head's son; the offer is taken as an assay of the household's workmanship."
    rule_edges: [WR-01, WR-06, WR-08, TR-05]
    follows: [alias_dress, alias_textile, alias_semiotics]
  - id: GAR-02
    garment: "high-pasture coat (fine first-shear felt; narrow placket; wind-flap at the shoulder)"
    form_slot: "LEX-GAR-02, the high grade of L35 mirken (to-verify)"
    material: "felt"
    wearer_rank: "vanguard herder and the household that opens the pasture (WI-2); the fine grade is licensed by the degree ladder (DEG-*)"
    rite: "ascent (the opening of the summer pasture)"
    era: "E0"
    route: "native chain as GAR-01, but from the first shear and fulled twice; the wind-flap is cut from the same felt sheet, no imported trim"
    provenance: local-production
    closures: [{material: horn, form: "toggle"}]
    dye: "hearth-dark"
    rank_mark: "the wind-flap itself (a working mark, not a badge: it is read as 'this one goes up first')"
    axis: both
    evidence: design-choice
    viewer_read: "On the high ground the flap is read as function and as office at once; at the fair it reads as a claim to have opened the pasture, which a stranger cannot check."
    penalty: "imposture edge: a flap sewn on a shelter coat is read against the ascent order (12-rank-rules WR-01, WR-07)"
    era_seam: "E0 to E2 unchanged in cut; the darkening bath is the storm register's (S1) and drifts in hue reading, not in make"
    misread: "This is the layer 08-symbols' colour register calls the storm cloak; read here as the storm-facing high-pole coat, and flagged as a naming question (OQ-2)."
    rule_edges: [WR-01, WR-07, WR-09, TR-05]
    follows: [alias_dress, alias_semiotics, alias_textile]
  - id: GAR-03
    garment: "transit coat (felted outer; fringed hem-cords at the hem-line; the coat of the pass)"
    form_slot: "LEX-GAR-03 (to-verify)"
    material: "felt"
    wearer_rank: "herd hands on the move, and the lineage head on a moot road; counted by whoever keeps the cords"
    rite: "the crossing (ascent and descent both; the descent state is the same coat unwashed and turned, ridge-wool out, read as the counted absence of S3)"
    era: "E0"
    route: "native chain as GAR-01; the hem-cords are attached at the hem-line, each after a verified crossing, and are never woven into the cloth"
    provenance: local-production
    closures: [{material: horn, form: "toggle"}]
    rank_mark: "hem-cords, read vertically: the lowest cord is the first crossing, and the count is read from the bottom up (RG-01: cord geometry is position, never obligation)"
    axis: both
    evidence: design-choice
    viewer_read: "At the lineage moot the cords are a public count; on the road the same cords are rolled inward and readable only by someone who knows to look at the hem."
    penalty: "a cord added for a crossing that did not happen is the packet's imposture edge (12-rank-rules WR-03, TR-02, TR-06)"
    era_seam: "E1 to E2: the script takes the count off the hem for trade accounts; the cords stay ceremonially and stop being the ledger (the drift the costume-semiotics §7 strata predict)"
    misread: "A lowland fair clerk reads the cords as a tally of debts and asks what the wearer owes; the question is answered with the number of times he has gone up."
    rule_edges: [WR-01, WR-03, WR-06, TR-02, TR-06, LO-01]
    follows: [alias_dress, alias_semiotics, alias_brief]
  - id: GAR-04
    garment: "lowland-cloth coat (woven plant-thread cloth of the lowland partner; a lowland cut)"
    form_slot: "LEX-GAR-04 (to-verify)"
    material: "lowland plant-thread cloth"
    wearer_rank: "registered herd-master only (WI-3), and lawful only within the fairgrounds and on the valley road"
    rite: "the caravan fair (treaty days)"
    era: "E1"
    route: "import: lowland farm thread -> lowland weaving -> caravan (CMAT-06) -> cut by a D2 tailor to a lowland cut in the valley; no D2 fiber stage at all"
    provenance: import
    closures: [{material: horn, form: "toggle"}]
    rank_mark: "none: the coat is jurisdiction, not rank; it is the coat that says where you may stand"
    axis: verticality
    evidence: design-choice
    viewer_read: "At the fairgrounds it reads as credit with the partner; one step up the valley road it reads as a claim the wearer may not make."
    penalty: "forfeiture face: the coat worn above the sell-line is the packet's clean statute case (12-rank-rules WR-02: void above the sell-line)"
    era_seam: "Arrives E1 (the dated import route A-07 requires); forbidden in E0 by construction (CMAT-06 excluded_eras, converging with 10-materials' own exclusion in the same slot under the era mapping)"
    misread: "A vanguard herder keeps the coat on returning up the road because the wind is cold; at the first shelter it is read as showing off the partner's cloth, and the telling is remembered."
    rule_edges: [WR-02, WR-05, WR-09, LO-02]
    follows: [alias_sumptuary, alias_semiotics, alias_garlex]
  - id: GAR-05
    garment: "mast-sash (narrow woven wool band, lineage-issued; the wind standard's sash)"
    form_slot: "LEX-GAR-05 (to-verify)"
    material: "wool"
    wearer_rank: "wind-standard bearer, appointed annually by the lineage and revocable (WI-4)"
    rite: "the standard raised at the moot and at the departure of the herds (storm-watch days)"
    era: "E0"
    route: "native chain: the narrow band is woven on CS-02 with a warp kept for bands only; darkened at the winter hearth in the hearth-dark of CMAT-09"
    provenance: local-production
    dye: "hearth-dark"
    rank_mark: "the sash is the office: it is issued with the standard and surrendered with it, so it cannot be inherited or worn by a household (ritual-garments §1: garment-as-office)"
    axis: wind
    evidence: design-choice
    viewer_read: "On a storm-watch day the sash is read at distance as 'the standard is up'; indoors it is read as nothing, which is the point (wind-reached vs roofed, 08-symbols AX-2)"
    penalty: "wearing it out of appointment is an imposture case (12-rank-rules WR-04, TR-02, LO-05)"
    era_seam: "unchanged E0 to E2; the standard is the one garment-record that never takes an import grade"
    misread: "A lowland envoy reads the sash as a badge of rank and addresses the bearer as a chief; the bearer answers for the herd's route that day and for nothing else."
    rule_edges: [WR-04, TR-02, TR-05, LO-05]
    follows: [alias_ritual, alias_dress, alias_sumptuary]
  - id: GAR-06
    garment: "stranger's fair coat (flat-woven lowland cut, no fringed hem; the treaty stranger's coat)"
    form_slot: "LEX-GAR-06 (to-verify)"
    material: "silk"
    wearer_rank: "treaty stranger (WI-5); by gift, a registered herd-master may wear one at the fairgrounds only, which is the received-robe reading"
    rite: "the treaty renewal at the fair"
    era: "E2"
    route: "import: the partner's own weave, arriving as a finished coat-to-be; the D2 tailor may shorten it and must not add cords"
    provenance: import
    rank_mark: "the absence of hem-cords: a coat that cannot count crossings says its wearer never crossed (the flat hem is the mark)"
    axis: verticality
    evidence: design-choice
    viewer_read: "At the fair it reads as the partner's cloth at its top grade and as a person who is lawful only here; up the valley it reads as a claim with no lineage behind it."
    penalty: "cutting cords onto a fair coat is the offence that reads as a forged lineage at the moot (12-rank-rules TR-06)"
    era_seam: "E1 to E2 drift: the same coat was the plant-thread grade (CMAT-06) in the trade-contact era; silk is the treaty grade of one channel, not a new garment (the drift record is this one id). Integration note: 10-materials' luxury import of the anchor era is lowland-broadcloth (its MAT-07), not silk — the two luxuries must be reconciled before assembly (OQ-3)."
