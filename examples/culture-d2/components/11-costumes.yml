    wearer_rank: "mourner, household of the dead (WI-6); the coat is the household's, not the wearer's, and returns after the year"
    rite: "the mourning year (time-locked; the liminal sequence of ritual-garments §6)"
    era: "E0"
    route: "native chain as GAR-01, then deliberately unfinished: no combing, no bath, and the hem-cords of GAR-03 cut back to stubs"
