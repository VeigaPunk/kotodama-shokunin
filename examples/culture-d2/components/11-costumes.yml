two_wardrobe_calendar:
  # The time-lock (dress-through-eras §11 step 5 analogue): dress is keyed to the pole
  # the household occupies, and the transitions are the ritual seams.
  - {id: CAL-1, pole: "low pole (valley shelter)", dress_set: "GAR-09 + GAR-01 + GAR-03 (cords rolled inward)", when: "the low stay, from the descent to the ascent"}
  - {id: CAL-2, pole: "the pass", dress_set: "GAR-09 + GAR-02 + GAR-10 (+ GAR-03 on the moot road), cords outward and countable", when: "the crossing days, both directions"}
  - {id: CAL-3, pole: "high pole (summer pasture)", dress_set: "GAR-09 + GAR-02 + GAR-03; the valley coat stays folded in the shelter and is not carried up", when: "the high stay, from the opening of the pasture to the descent"}
  - {id: CAL-4, pole: "the fairgrounds (lowland edge)", dress_set: "GAR-04 (registered herd-master) or GAR-06 (treaty stranger); never cords onto a fair coat", when: "the treaty days only"}
  - {id: CAL-5, pole: "the mourning year (time out of the cycle)", dress_set: "GAR-07, one year, then back to the cycle set", when: "the year after a death in the household"}

legibility:
  - {id: LEG-1, setting: "the lineage moot at the winter shelter", station: "L5-L6 (engineered to sumptuary): cords and grades are counted by role, and a false cord is a prose case (costume-semiotics §6)", audience: "lineage counters"}
  - {id: LEG-2, setting: "the pass in the crossing season", station: "L4 (rite-indexed): who goes up first is read off the coat and the issued pair, by people who know the order", audience: "herd hands"}
  - {id: LEG-3, setting: "the high pasture alone", station: "L4 among the lineage's own; L3 for the rare stranger, who reads only 'herder'", audience: "lineage, strangers"}
  - {id: LEG-4, setting: "the fairgrounds", station: "L3-L5 (boundary plus import law): lowland cloth reads as credit with the partner, and the register, not the eye, decides who may wear it", audience: "fair court, caravan"}
  - {id: LEG-5, station_note: "One deliberate pocket: the fairgrounds run L5 while the pasture runs L4/L6, so the same coat changes meaning by one valley stage — the scenario engine this packet is built to hand over (costume-semiotics §6 pockets)."}

enforcement:
  # Costume-side only. The rule records are 12-rank-rules' (WR-/TR-/LO-); this block states
  # who reads what on the body, and what the reading costs.
  mechanisms:
    - {id: EN-1, mechanism: "rite (the crossing and the ascent)", binds: "which layer may be worn at which pole, and when cords may be added", reading: "the cords are added in front of witnesses at the crossing, not claimed later", corpus: "dress-through-eras §10 (cult/liturgy); 12-rank-rules TR-02"}
    - {id: EN-2, mechanism: "rank institution (the lineage moot and the degree ladder)", binds: "coat grades and the wind-flap; the sash office", reading: "the count is spoken by the lineage head and checked against the hem", corpus: "dress-through-eras §10 (rank badge/institution); alias_sumptuary §2"}
    - {id: EN-3, mechanism: "market/monopoly (the fair court and the caravan register)", binds: "imported cloth, its grades, and the cord exception", reading: "the register is read against the coat at the gate, in the partner's script", corpus: "dress-through-eras §10 (market/monopoly); alias_semiotics §4"}
  economy:
    - "which law everyone works around: the fair coat's grade (a herd-master's spouse wears the coat the register cannot name — the wives problem, alias_sumptuary §8 pattern 6, implemented by 12-rank-rules WR-02)"
    - "what enforcement pays in: cords, not coins (the informer's share stays inside the herd economy; alias_sumptuary §8 pattern 4)"
    - "the statute that ends a family: not the silk, but a cord added for a crossing that never happened (the count is the one signal the lineage cannot afford to be wrong)"

reading_ledger:
  # costume-semiotics §9 step 3: term | carrier | wearer | viewer | penalty | era-of-change
  - {id: RL-1, term: "felt finish (combed / not)", carrier: "GAR-01", wearer: "any adult", viewer: "lineage, at touch", penalty: "none (workmanship read)", era_of_change: "stable E0-E2"}
  - {id: RL-2, term: "wind-flap", carrier: "GAR-02", wearer: "vanguard herder", viewer: "herd hands at the pass", penalty: "imposture edge at the moot", era_of_change: "stable; hue reading drifts with S1"}
  - {id: RL-3, term: "hem-cord count", carrier: "GAR-03", wearer: "herd hands", viewer: "moot counters, road hands", penalty: "false cord (12-rank-rules WR-03)", era_of_change: "E2: the script takes the count for trade; cords become ceremonial"}
  - {id: RL-4, term: "lowland cut", carrier: "GAR-04, GAR-06", wearer: "registered herd-master, treaty stranger", viewer: "fair court", penalty: "forfeiture above the sell-line", era_of_change: "E1 arrival; E2 silk grade of the same channel"}
  - {id: RL-5, term: "flat hem (no cords)", carrier: "GAR-06", wearer: "treaty stranger", viewer: "anyone who counts", penalty: "cords cut onto it read as a forged lineage", era_of_change: "E1-E2"}
  - {id: RL-6, term: "cut-back cords", carrier: "GAR-07", wearer: "mourner", viewer: "lineage", penalty: "rite lapse beyond the year", era_of_change: "stable"}
  - {id: RL-7, term: "shoulder coil of cord", carrier: "GAR-08", wearer: "bale keeper", viewer: "fair clerk", penalty: "worn as dress, the import becomes the cloth offence", era_of_change: "E1-E2"}
  - {id: RL-8, term: "sash + standard", carrier: "GAR-05", wearer: "bearer, appointed annually", viewer: "distance read on storm-watch days", penalty: "wearing it out of appointment", era_of_change: "stable; the one record with no import grade"}

misread_scenes:
  - {id: MRS-1, scene: "gate assay", staging: "A vanguard herder comes down to the fair in the high-pole coat with the cords rolled inward; the fair clerk, reading costume only, takes him for a carrier and quotes a carrier's toll (kól, L28). He answers by unrolling the hem.", payoff: "the coat's real signal is on the hem, and the law's register never sees it"}
  - {id: MRS-2, scene: "one region one era behind", staging: "A partner's envoy arrives at the pasture in the plant-thread grade of the fair coat a year after the treaty grade became the norm at the fair; the lineage reads him as either poor or as refusing the new grade.", payoff: "drift is legible at the seam (costume-semiotics §7 synchronization device)"}
  - {id: MRS-3, scene: "the borrowed coat", staging: "A herd-master's nephew is sent to the fair in the gift-grade coat; the coat reads as the partner's house and he is asked for terms he has no standing to give.", payoff: "material legibility outruns person identity (the imposture theorem read forward: the outfit passes, the standing fails)"}
  - {id: MRS-4, scene: "the offered cord", staging: "A road hand offers cord from his bale to a mourner whose hem-cords are cut back, taking the cut for damage; refusing the cord without telling the year would read as pride.", payoff: "a kind act that would convert a rite garment into an illegal dress item if it were taken"}
  - {id: MRS-5, scene: "the legging in cloth", staging: "The envoy asks for leggings woven in his own cloth for the crossing; the answer is that cloth on the pass is what takes a man off it.", payoff: "the textile ceiling argued on the trail, by people who have to walk on it"}

drift_plan:
  - {id: DR-1, seam: "E0 to E1", change: "the imported lowland coat arrives (GAR-04), lawful only at the fairgrounds and on the valley road; the cord stays the only local record", dated_by: "the dated import route CMAT-06 (A-07 check 3), converging with 09-eras-calendar's ER-03 costume_seam (lowland cloth from the E0/E1 seam, not earlier)"}
  - {id: DR-2, seam: "E1 to E2", change: "the treaty grade of the same coat becomes silk (GAR-06); the script takes trade accounts off the hem of GAR-03, so the cord count becomes ceremonial and the ascents become memory", dated_by: "09-eras' seam records (ER-), not asserted here"}
  - {id: DR-3, founding_fight: "the first coat worn above the sell-line (a vanguard herder who kept the fair coat up the road) is the trickster story the later law is remembered by: the 'always' rule has a dated fight behind it (dress-through-eras §12: no timeless costume without a founding scandal)"}
  - {id: DR-4, fossil: "the bog-dark of the shelter era survives as the mourning coat's unbathed felt after the storm register is re-keyed dark; a fossil, not a fresh sign"}

calibration:
  - "design-choice: every garment, material, route and seam in this file is invented for the D2 drill; no real culture or garment is described."
  - "corpus-derived: the grammar of the file is taken from the cited decision tables (three slots, ledger columns, two mechanisms, drift strata) — the citations are to this repo's corpus entries, never to outside scholarship."
  - "bounded analogy: the hidden-luxury dialect (alias_sumptuary §5) and the [L] stations (alias_semiotics §6) are analogies for a reading pattern, not evidence that any herding culture worked this way."
  - "convergent with siblings, not attested: GAR-01..GAR-08 follow 12-rank-rules' pre-declared refs so its rule text stays valid; that makes them contract-compatible, not canon."
  - "(to-verify): the slot-to-slot era mapping (era_reconciliation, proposed not confirmed); the storm-cloak naming (OQ-2); the two unmapped materials and the silk/broadcloth luxury conflict (OQ-3); the felt-grade slot mapping (OQ-6); every LEX-GAR-* form."

open_questions:
  - {id: OQ-1, question: "09-eras-calendar, this file and 12-rank-rules now agree on canonical E0-E3 tags, with the nine named eras mapped in 09. Other landed components still use local labels (08-symbols E1..E4; 10-materials E1..E4 slots; 05-lexicon Nalne/Pertne; 14-kin-address ES0-ES3). This file's era_reconciliation maps those sets at slot level, still (to-verify). The integrator should adopt that table (or publish its own) before assembly, or assembly will merge label sets by number and be wrong.", owner: "round integrator"}
  - {id: OQ-2, question: "08-symbols' colour register names a storm cloak; no garment id here is titled that. Read as GAR-02 (wind-flap, high pole)? If the sibling meant a separate garment, the id should be declared by that component.", owner: "round integrator"}
  - {id: OQ-3, question: "Material set vs the landed contracts (rewritten after 10-materials was read): (a) this file's lowland plant-thread cloth and cord map cleanly to 10-materials MAT-05/MAT-06; (b) two dispatch materials have NO counterpart in that inventory and are carried as REPORT-don't-merge — pack-ox down (their pack-ox yields only hair cordage, MAT-03) and silk (their anchor-era luxury is lowland-broadcloth MAT-07, not silk); the integrator must either extend the inventory or re-letter GAR-06 to broadcloth; (c) the felt-grade ladder G1-G3 used by 12-rank-rules has no slot in this file's garment records yet (OQ-6).", owner: "round integrator"}
  - {id: OQ-4, question: "The assembled packet needs a `rank_rules:` block in the gate's schema for the R-checks to run; 12-rank-rules' rule records are written in its own shape (WR-/TR-/LO-). Who maps them, and at which revision?", owner: "round integrator"}
  - {id: OQ-5, question: "This component asserts no dates and no era names; if 09-eras-calendar's naming changes, the records above need only the tag mapping, not a rewrite. Note it already agrees with this file on the two costume seams it states (felt from the earliest stratum; lowland cloth not before the E0/E1 seam).", owner: "round integrator"}
  - {id: OQ-6, question: "Felt-grade slots: 12-rank-rules licenses 'felt grades through G3' and 10-materials assumes a G1-G3 ladder. This file writes 'heavy winter grade' (GAR-01) and 'fine first-shear, fulled twice' (GAR-02) without the slot ids. The two records should be stamped G1/G3 (or whatever the ladder says) at integration; no guess is made here.", owner: "round integrator"}
  - {id: OQ-7, question: "Packet-key ownership overlap: both this file and 10-materials supply `materials` and `cloth_sources` bodies (its registry row is not in 01-brief.yml, so RCN-02 registration is owed). Its inventory is the richer one; this file's is the costume-facing subset with A-07 routes. Recommend: assembler takes the union with this file's routes where the costume gate reads them, and 10-materials' blocks retained under their own key names — decided by the integrator, not here.", owner: "round integrator"}

spine_coupling:
  # SP-03: the two strongest couplings of this component, with record ids.
  - {id: SPC-1, axis: verticality, coupling: "The wardrobe is the year's movement worn: a low-pole set, a high-pole set and a pass set, and the counting line is a hem whose cords are read from the lowest crossing up, so rank, record and season share one axis.", records: [GAR-01, GAR-02, GAR-03, GAR-07, GAR-10]}
  - {id: SPC-2, axis: wind, coupling: "The wind is what is built against and what the count is read by: the high-pole coat's wind-flap, the gale legging cut to take no slack, the standard's sash that exists only while the standard is up, and a storm layer darkened by hearth smoke rather than by any traded dye.", records: [GAR-02, GAR-05, GAR-10, CMAT-09]}

registration:
  # RCN-02: a round component not in the brief's registry owes a registration row. This
  # worker does not edit 01-brief.yml; the row is supplied here for the integrator.
  file: "examples/culture-d2/components/11-costumes.yml"
  component: 11-costumes
  packet_keys: [costumes, materials, cloth_sources]
