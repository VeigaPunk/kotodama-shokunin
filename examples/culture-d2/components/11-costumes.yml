component: 11-costumes
culture: D2
canon: not canonized (D2 design drill)
title: "Costumes — the two-wardrobe year: valley, pass, high pasture, and what may be worn at each"
status: "round-3 write drill, 2026-10-17, worker W11; single-component write assignment; supersede-by-new-file only"
packet_keys: [costumes, materials, cloth_sources]
registry_ref: "01-brief.yml registry C-07 (07-costumes): packet_keys are the binding identity; this file is written under the round dispatch stem 11-costumes, and its own `component:` value governs (01-brief.yml registry note)"
brief_ref: "examples/culture-d2/components/01-brief.yml (contract.record_fields.costumes, contract.rules RG-01..RG-08, spine SP-01..SP-03, d1_contrast R-01..R-06, acceptance A-07)"
handoff_recipient: "lore-shokunin (canon, entity identity, chronology) — reference only"

scope_note: |
  Ten garment records (GAR-01..GAR-10), nine material records (CMAT-01..CMAT-09), three
  cloth sources (CS-01..CS-03), and the dress reading tables this component is judged by.
  Material ids are CMAT-* because component 10-materials (landed mid-round) owns the
  MAT-01..MAT-22 space; each CMAT record carries a `maps_to` slot mapping to that
  component's inventory, per its own instruction to map by slot rather than by label.
  GAR-01..GAR-08 are written to be compatible with the garment refs already declared by
  component 12-rank-rules (its `garment_refs` block lists ids GAR-01..GAR-08 with glosses,
  and names the rules each appears in); id and gloss are matched, and the rule ids are
  carried here as typed I-edges in `deps`. GAR-09 and GAR-10 are this component's own
  records and no sibling law claims them yet. Surface forms are the lexicon component's:
  this file coins none and carries its requirements as form slots (LEX-GAR-*), the same
  pattern 12-rank-rules used for its degree slots. No rank-rule records are written here;
  the law lives in 12-rank-rules and is consumed by id (see deps, open questions).

spine:
  verticality: "The wardrobe is a two-pole set (valley shelter, high pasture) plus the pass, and every garment record is licensed to one of the three. Layers are named per pole, not per season: GAR-01 low pole, GAR-02 high pole, GAR-03 the crossing, GAR-10 the gale layer of the crossing. Rank and record are counted on the body along the same line the year moves: cords hang at the hem and are read from the lowest (first ascent) upward."
  wind: "Wind is what the coat is built against and what the cords are read by. The high-pole coat takes the wind-flap; the gale legging is cut so no slack can be taken; the storm-layer dye is the darkening bath of the storm register (S1, consumed by id). Breath and soul vocabulary is the lexicon component's (L01 im, L08 su, L09 hur) and is not restated here."
  anti_import: "No river, bank, tide, ford or flood imagery; no tying/binding metaphor. Tying appears once, as manufacture (cord twisting and hem-cord attachment), and never as obligation: obligations are pasture rights held by lineages (SP/AS-04). No D1 fiber route (flax, bast, reed) is reused as the native textile story: the state fiber chain is the herd's wool (L34 mir), and the only woven cloth in this file other than wool and felt is the lowland partner's import. (10-materials' local nettle-bast is that component's cordage material and no garment record here is bast.)"

