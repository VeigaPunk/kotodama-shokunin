follows_scope_note: "RG-02 conformance stated plainly: every costume, material and cloth-source record carries `follows`; the auxiliary tables carry their corpus basis in the block header comment or inline (two_wardrobe_calendar: dress-through-eras §11 step 5; legibility: costume-semiotics §6; enforcement.mechanisms: the `corpus` field per row; reading_ledger: costume-semiotics §9 step 3; misread_scenes: costume-semiotics §7 for MRS-2, §6 for MRS-3; drift_plan: `dated_by` per row plus the founding-fight note). No auxiliary record is left without a located corpus basis."

assembly_note: "For the assembler: this file supplies `costumes`, `materials`, `cloth_sources` (registry C-07 packet_keys) — with 10-materials supplying the full inventory under its own richer blocks (OQ-7), so merge by CMAT-to-MAT slot mapping, not by label. Do not take `eras`/`era_dates` from here — that is 09-eras-calendar — and do not take `rank_rules` from here (12-rank-rules). Apply the era_reconciliation table before merging any sibling era labels."

