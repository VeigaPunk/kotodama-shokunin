    viewer_read: "In the lineage it is read as the year's count; at the fair a stranger reads it as a shabby coat and offers a better one, which must be refused without explanation."
    penalty: "keeping the coat past the year is a rite lapse, not a sumptuary offence (12-rank-rules WR-05, TR-02)"
    era_seam: "unchanged E0 to E2; the E2 court keeps it while the accounts move to script"
    misread: "A mourning coat seen from behind at the pass is read by a road hand as a coat with its cords lost, and he offers cord from his own bale: an act read as a kindness and as a small theft of grief."
    rule_edges: [WR-05, TR-02]
    follows: [alias_ritual, alias_dress, alias_semiotics]
  - id: GAR-08
