# examples/culture-d2/components/06-pantheon.yml
# D2 design drill — pantheon component (round-3 write worker; dispatch stem 06-pantheon).
# NON-CANON: everything below is proposed design for a fictional highland-plateau
# pastoralist culture. No real culture or religion is described; no real pantheon
# is renamed. Comparators are corpus entries inside this repo, cited by path and
# section; anything unchecked is marked (to-verify).
#
# Spine: VERTICALITY (high/low, ascent/descent, seasonal poles) + WIND (breath,
# soul-carrier, storm law). D1 guards held: no river/water/flood setting or
# metaphor (D1B-01); knots count, they never bind (RG-01); no oath-cloth or
# rotating delegate institution (D1B-02, D1B-07) — D2 governance is lineage
# pasture rights. Storm language is high-altitude only: hail, blizzard, thin air.

component: 06-pantheon
culture: D2
name: D2 pantheon component (standalone gate run)
registry_alias: "the 01-brief registry calls this slot C-05 / 05-pantheon; the round dispatch names 06-pantheon. Recorded as an assembly finding, not silently reconciled."
id_prefix_declaration: "this file uses PAN- for agents and RIT- for rites per the contract. Its narrative records use PAN-MYTH-01 to PAN-MYTH-05 — a declared prefix per RCN-02, because the delivered 07-myths-motifs file already occupies the plain MYTH- namespace. Assembly aliases PAN-MYTH-* to the narrative namespace or drops the duplicate layer; no other file was edited"
canon: not canonized (D2 design drill)
status: "proposed, non-canon sample design; handoff is reference-only (lore-shokunin owns canon)"
evidence_note: "status per CP-11; every record carries axis and evidence; every record cites corpus follows entries by path, section, and short id"
verified_at: 2026-10-17
recheck: "before packet assembly; after 02-phonology and the lexicon component land; before any lore handoff"

brief_line: "six divine records plus one human record; coverage is functional (storm/wind, sky, pastures, herds, trade, the vertical axis) with deliberate blank slots, not archetype completion"
provisional_forms: "every spelled form in this file is provisional on the placeholder segment set used by 03-morphosyntax (vowels a e i o u; consonants k t m n s r l w h; open syllables). Structure is the claim; segment values are not. Re-spell when 02-phonology lands."

contract_deps:
  - {component: 01-brief, ids: [RG-01, RG-03, RG-04, RG-05, RG-07, D1B-01, D1B-02, D1B-07, AS-02, AS-03, AS-04, SEED-02, SEED-03], note: "rules and bans honoured; era tags drawn from the fixed space E0-E3; AS-02 (the storm is an institution) is the stance the storm-law myths license, with AS-03 and AS-04 as the return and pasture-right stances"}
  - {component: 02-phonology, ids: [UNRESOLVED], note: "P- records not delivered at write time (2026-10-17 11:30 local); all spellings provisional, per RG-04 recorded as UNRESOLVED rather than invented"}
  - {component: 04-lexicon, ids: [UNRESOLVED], note: "root lexemes for sky, thunder, wind, shelter, height, salt, road, herd, count; L- ids pending. Note the on-disk naming conflict — 04-orthography.yml is delivered as component 04 while the registry expects 04-lexicon"}
  - {component: 06-symbols, ids: [UNRESOLVED], note: "the delivered symbols file numbers its records S1-S9 while the registry fixes the SYM- prefix; the cult couplings below reference the symbols component rather than copying signs"}
  - {component: 08-names, ids: [UNRESOLVED], note: "final theonym spellings, NM- records, and the name-taboo layer are names-owned; this file proposes derivations only"}
  - {component: 09-eras, ids: [UNRESOLVED], note: "era names and ER- records are era-owned; E0, E1, E2 here are tags from the fixed space E0-E3, whose E3 slot is reserved for the fourth stratum. Observed conflict — the delivered symbols file writes E1-E4 with different labels; flagged for the integrator under the contract's alias rule, not resolved by this worker"}

follows:
