# ---------------------------------------------------------------------------
# Theonym derivation (proposal only; producers and final forms are lexicon-,
# phonology-, and names-owned — see contract_deps and RG-04).
# ---------------------------------------------------------------------------
theonym_pipeline:
  rule_set:
    - {id: TP-01, rule: "modifier precedes head in a compound, matching the M- record for compounding; all proposed theonyms are open-syllable", axis: neutral, coupling_note: "kept neutral deliberately: derivational morphology is not itself a spine claim"}
    - {id: TP-02, rule: "transparent compounds carry the recitation layer; substituted and avoidance forms carry the address layer", axis: wind, citation: "PF-31"}
    - {id: TP-03, rule: "opacity is recorded, never dated; no name in this file is claimed to be older than another", axis: neutral, coupling_note: "a dating claim would need ER- and P- records that do not exist yet", citation: "PF-31"}
  lexicon_alignment: "NOT ALIGNED, stated plainly. The lexicon component landed after this file was drafted and its roots differ from every working root below (its wind term is not the one used here, and its terms for salt and milk are shorter stems). No L- id is claimed for any form below, no alignment is asserted, and the theonyms must be re-derived from the delivered L- records at assembly, or the lexicon's own roots adopted then — either way the derivational structure (root plus agent or locative suffix) is the part this file owns"
  working_roots:
    - {form: hala, gloss: sky, note: "working gloss; lexicon-owned"}
    - {form: kaha, gloss: the crack of thunder, note: "working gloss; lexicon-owned"}
    - {form: weha, gloss: "wind, breath", note: "working gloss; lexicon-owned"}
    - {form: huma, gloss: "shelter, the low place", note: "working gloss; lexicon-owned; do not collide with the illustrative stem hani used elsewhere"}
    - {form: kala, gloss: "height, high pasture", note: "working gloss; lexicon-owned"}
    - {form: sawa, gloss: the breath you can hear, note: "working gloss; lexicon-owned"}
    - {form: sura, gloss: "back, reversed", note: "working gloss; bound form su- in theonym position"}
    - {form: sera, gloss: "road, pass", note: "working gloss; lexicon-owned"}
    - {form: tasa, gloss: salt, note: "working gloss; lexicon-owned"}
    - {form: nusa, gloss: milk, note: "working gloss; lexicon-owned"}
    - {form: kora, gloss: herd, note: "working gloss; lexicon-owned"}
    - {form: muta, gloss: "to count, to tally", note: "working gloss; lexicon-owned"}
    - {form: sulu, gloss: "second, returning", note: "working gloss; lexicon-owned"}
  working_suffixes:
    - {form: -tu, gloss: "standing one, keeper of", note: "agent suffix; M- record pending"}
    - {form: -weha, gloss: "wind or breath of", note: "spirit suffix; M- record pending"}
    - {form: -huma, gloss: at or of the shelter, note: "locative; M- record pending"}
    - {form: -kala, gloss: at or of the height, note: "locative; M- record pending"}
    - {form: -sura, gloss: backward, note: "directional; M- record pending"}

# ---------------------------------------------------------------------------
# PAN- agents. Record fields per contract: id, name, role, domain, era, axis,
# evidence; extra keys welcome.
# ---------------------------------------------------------------------------
pantheon:
  - id: PAN-01
    name: Halatu
    role: archaic sky-holder; demotion case, kept in formula only
    domain: "holds the sky apart from the peaks — the world-axis as a standing figure, never a tie"
    era: "E0 formula; demoted by the E1 charter; survives in the opening line of the ascent blessing"
    axis: verticality
    evidence: design-choice (to-verify against L- and ER- records)
    cult_status: "no cult: no festival, no offering, no priest. The ritual-address test fails on purpose and the figure is kept as story, not cult"
    gender: "spoken as a man in the blessing; the language does not mark gender on theonyms"
    derivation: "hala (sky) + -tu (standing one); transparent compound, read as the archaic layer"
    epithets: [Halasawa "breath of the sky", Humahala "sky at the shelter"]
    demotion_event: "the E1 charter seats Kahatu as the oath patron; a holder who only holds cannot enforce a spoken word"
    deps: [{component: 04-lexicon, ids: [UNRESOLVED], note: "roots hala, huma"}, {component: 02-phonology, ids: [UNRESOLVED], note: "provisional spelling"}]
    follows: [{cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5", short: "PF-05"}, {cite: "corpus/knowledge/myth-symbol/cosmology-cosmography.md §2", short: "PF-09"}]

  - id: PAN-02
    name: Kahatu
    role: storm-law; the oath patron; war function fused into punitive law
    domain: "thunder, hail, blizzard and thin air over the saddle; the spring opening of the pass; the punitive half of a spoken promise"
    era: "E0 ridge cult of the pass bands; confederation oath patron from E1"
    axis: both
    evidence: design-choice (to-verify against ER- records)
    cult_status: "full cult address: three epithets, two festivals, two taboos, one offering, one address formula"
    gender: "spoken as a man; unmarked in grammar"
    derivation: "kaha (thunder-crack) + -tu (standing one); transparent compound"
    epithets:
      - {form: Halakaha, gloss: sky-crack, register: praise, use: "recitation and the pass-opening dawn"}
      - {form: Sawakaha, gloss: breath-thunder, register: address, use: "the oath formula only: the released breath is what he hears"}
      - {form: Humkaha, gloss: shelter-thunder, register: avoidance, use: "winter-camp substitute; his plain name is not said while the herd is under a roof"}
    festivals: [RIT-02, and the pass-opening dawn kept by the road keepers]
    taboos: ["the plain name is not spoken at the high pasture during the thunder halt", "no fire is lit on the open ridge in storm season"]
    offering: "a pinch of salt cast up into the wind; no blood offering is made above the shelter line"
    address_formula: "You who stand above, take this breath and hold the word"
    war_theology: "no standing army: a raid is filed as a debt claim and blessed at the pass; therefore no separate war god, no discipline god, and no berserk god"
    deps: [{component: 04-lexicon, ids: [UNRESOLVED], note: "roots kaha, hala, sawa"}, {component: 06-symbols, ids: [UNRESOLVED], note: "storm slate and gate signs are symbols-owned"}]
    follows: [{cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5", short: "PF-05"}, {cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §3", short: "PF-03"}]

  - id: PAN-03
    name: Humweha
    role: keeper of the ended breath; the wind that carries the last breath below
    domain: "death, breath-souls, the tally of ended breaths, the Still Camp at the lowest shelter"
    era: E0 onward
    axis: wind
    evidence: design-choice
    cult_status: "full cult address: three epithets, the descent count, two taboos, one offering that is a count rather than a gift, one address formula"
    gender: "spoken as a woman; unmarked in grammar"
    derivation: "huma (shelter, low place) + -weha (wind, breath of); transparent compound, deliberately paired with Kalweha"
    epithets:
      - {form: Sawahuma, gloss: breath at the shelter, register: address, use: "the descent count"}
      - {form: Mutu, gloss: the Counter, register: functional, use: "the cord keepers' title for her"}
      - {form: Korasawa, gloss: the herd's breath, register: pastoral, use: "said over a beast that dies on the road"}
    death_architecture: "a keeper and a place, no judge, no devil; dualism is not imported. The uncounted dead whistle in the passes — a folktale belief, not a doctrine"
    taboos: ["her name is not said while a body lies unwashed", "a dead person's personal name is not spoken once the count is entered"]
    offering: "the last milk of the autumn descent poured at the shelter door, and one knot added to the tally — a count, not a gift"
    address_formula: "Keeper below, count this breath gently"
    deps: [{component: 04-lexicon, ids: [UNRESOLVED], note: "roots huma, weha, sawa, muta, kora"}, {component: 09-eras, ids: [UNRESOLVED]}]
    follows: [{cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5", short: "PF-05"}, {cite: "corpus/knowledge/myth-symbol/ritual-liminality.md §1", short: "PF-22"}]

  - id: PAN-04
    name: Kalweha
    role: the high pasture's power; herd increase and milk; the ascent
    domain: "the summer pasture, milk, lambing, wool; the opening and closing of the high stay"
    era: E0 onward
    axis: both
    evidence: design-choice
    cult_status: "full cult address: three epithets, the ascent departure and the milk-first rite, two taboos, one offering, one address formula"
    gender: "spoken as a woman; unmarked in grammar"
    derivation: "kala (height) + -weha (wind, breath of); transparent compound, paired with Humweha as the upper pole"
    epithets:
      - {form: Nusatu, gloss: milk-keeper, register: functional, use: "the milk-first rite"}
      - {form: Kalamutu, gloss: counter of the height, register: praise, use: "she counts what comes in, as Humweha counts what goes out"}
      - {form: Sawakala, gloss: breath of the height, register: address, use: "the ascent blessing"}
    taboos: ["no wool is cut on the height before the milk-first rite", "no one climbs past the shoulder stone before the ascent departure rite"]
    offering: "the first milk poured on the pasture stone; a tuft of wool at the gate"
    address_formula: "Mother of the height, count them as they come"
    deps: [{component: 04-lexicon, ids: [UNRESOLVED], note: "roots kala, weha, nusa, muta"}, {component: 06-symbols, ids: [UNRESOLVED], note: "fleece-white and the gate signs are symbols-owned"}]
    follows: [{cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §2", short: "PF-02"}, {cite: "corpus/knowledge/myth-symbol/celestial-symbolism-calendars.md §2", short: "PF-27"}]

  - id: PAN-05
    name: Seratu
    role: keeper of the salt road; strangers, trade vows, and the restricted salt craft
    domain: "the down-road, the salt springs, the boundary stone, foreign names and the lowland receipts"
    era: "E1, with the opening of the road; foreign equated name from the same seam"
    axis: verticality
    evidence: design-choice (the lowland equation is a design proposal, recorded as the D2 side only)
    cult_status: "full cult address: three epithets, the salt opening and the market vow, two taboos, one offering, one address formula; the cutting rite is licensed to one keeper lineage"
    gender: "spoken as a man; unmarked in grammar"
    derivation: "sera (road, pass) + -tu (standing one); transparent compound"
    restricted_craft: "the salt-cutters and trade-iron workers are an endogamous liminal caste: salt-bleached hands and soot-marked brows are their marks; they may not hold pasture rights and may not enter the high pasture shrine. The smith-god slot is merged here rather than filled separately"
    epithets:
      - {form: Tasatu, gloss: salt-keeper, register: functional, use: "the salt opening"}
      - {form: Kalasera, gloss: the high pass road, register: praise, use: "the road keepers' recitation"}
      - {form: Serasura, gloss: the road turned back, register: avoidance, use: "said when a caravan turns back; his plain name is not spoken at the boundary stone while a debt is open"}
    foreign_equation: "the lowland trade partner maps its own road-and-receipt power onto Seratu; the mapping gives him gates, keys, and written receipts he never had. Distortions are kept as contact evidence and belong to the contact record, not to this pantheon"
    taboos: ["salt is not sold before the salt opening", "a caste member may not enter the high pasture shrine"]
    offering: "a salt block set at the boundary stone"
    address_formula: "Keeper of the road below, hear the vow at the stone"
    deps: [{component: 04-lexicon, ids: [UNRESOLVED], note: "roots sera, tasa, kala, sura"}, {component: 06-symbols, ids: [UNRESOLVED]}]
    follows: [{cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §2", short: "PF-02"}, {cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5", short: "PF-05"}]

  - id: PAN-06
    name: Suweha
    role: trickster; the wrong-time wind — the trickster slot, with an institution and no cult
    domain: "the wind that blows a round backward; the winter telling season; the one-day reversal at midwinter"
    era: "E0 tale figure; the reversal rite is attested from E1"
    axis: wind
    evidence: design-choice
    cult_status: "no cult address and no festival of his own; the reversal rite addresses the round, not the god — a tale figure held to an institution, per the institutional-pairing rule"
    gender: "the figure's gender follows the teller: the grandmothers' winter telling has the old aunt, the men's telling has the boy. The two tellings disagree and neither is corrected here"
    body: "shown as the chough — an alpine bird that rides the upslope wind and robs nests at the edge"
    derivation: "bound su- (backward) + weha (wind, breath of); transparent, deliberately paired with Humweha as the wrong-wind against the down-wind"
    constraint: "the wrong round may run one day only; a second day is forbidden"
    etiologies: ["why the chough's beak is red", "why the marmot sleeps through the first snow", "why one stone at the pass never melts"]
    teller_class: "winter camp; the tales are told after the descent, never at the high pasture"
    deps: [{component: 04-lexicon, ids: [UNRESOLVED], note: "root weha with bound su-"}, {component: 08-names, ids: [UNRESOLVED], note: "tale names and the avoidance forms are names-owned"}]
    follows: [{cite: "corpus/knowledge/myth-symbol/trickster.md §1", short: "PF-16"}, {cite: "corpus/knowledge/myth-symbol/trickster.md §3", short: "PF-17"}, {cite: "corpus/knowledge/myth-symbol/trickster.md §9", short: "PF-20"}]

  - id: PAN-07
    name: Ula
    role: human founder of the salt road, deified in the later cult; the culture-hero slot fused into a deified human
    domain: "the first descent with salt; the written receipt; the market vow from E2"
    era: "person in E1; cult from E2; assimilated into Seratu's address in the same seam"
    axis: verticality
    evidence: design-choice (the exposure legend is a legitimation device, not history)
    cult_status: "market-cult address: one title and one festival day; the salt-cutter caste, his foster caste, refuses the divine address and keeps only the human name"
    legend: "exposed as an infant at the pass during a thunder halt and spared by the storm; raised by a salt-cutter band; first carried salt down; brought the lowland script back"
    cult_title: {form: Seratusulu, gloss: the road-keeper returned, register: market address, use: "an assimilation title, not a second god"}
    schism: "the salt-cutters insist he was a man and refuse the title; the market cults use it. Live in-world dispute, not resolved here"
    deps: [{component: 04-lexicon, ids: [UNRESOLVED], note: "roots sera, tasa, sulu"}, {component: 08-names, ids: [UNRESOLVED], note: "NM- record for a human name pending"}]
    follows: [{cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5", short: "PF-05"}, {cite: "corpus/knowledge/myth-symbol/hero-journey-variants.md §2", short: "PF-28"}]

# ---------------------------------------------------------------------------
# Role coverage ledger. Functional coverage, with deliberate blanks. Status
# marks per the shared gate vocabulary.
# ---------------------------------------------------------------------------
roles:
  - {dependency: storm-petition, status: ASSIGNED, agents: [Kahatu], exclusive: true, substitute: denied, note: "one patron; the petition is spoken at the ridge stones only"}
  - {dependency: oath-enforcement, status: SHARED, agents: [Kahatu], note: "shared with the pasture-right holders: they hear the complaint, the pass rite releases the breath; a disputed invocation goes to the pass rite first. No oath-cloth and no rotating witnesses — this is a claim before lineage rights, not a D1 bond"}
  - {dependency: mortality-breath, status: ASSIGNED, agents: [Humweha]}
  - {dependency: herd-increase, status: ASSIGNED, agents: [Kalweha], note: "increase and milk; herd losses are counted under Humweha"}
  - {dependency: pasture-rights-legitimacy, status: SHARED, agents: [Kalweha], note: "shared with the lineage reciters who keep the cords; the ascent departure rite confirms the claim at the gate; a rival claim goes to the cords, not to a court"}
  - {dependency: salt-road-exchange, status: ASSIGNED, agents: [Seratu], exclusive: true, substitute: denied, note: "one keeper lineage licenses the cutting rite; the road vow is spoken at the boundary stone"}
  - {dependency: foreign-trade-vow, status: SHARED, agents: [Seratu, Ula], note: "the boundary-stone vow is Seratu's; the market cults hear it under Ula's title; the caste disputes the second claim"}
  - {dependency: war-raiding, status: SHARED, agents: [Kahatu], note: "no standing army; a raid is filed as a debt claim before the pasture-right holders and blessed at the pass; there is no separate war patron"}
  - {dependency: vertical-axis, status: SHARED, agents: [Kalweha, Humweha], note: "the between-pole line is invoked as a pair at every crossing; no single axis god is claimed"}
  - {dependency: sky-and-stars, status: NON-DIVINE, agents: [], note: "the sky has a named holder in formula only, with no cult practice; the star readings are the reciters' craft and no patron is claimed"}
  - {dependency: hearth-and-fire, status: NON-DIVINE, agents: [], note: "dung fires are household work; no patron is claimed and none is needed"}
  - {dependency: cosmic-origins, status: NON-DIVINE, agents: [], note: "the climb account is recited by the lineage reciters as a route charter; no maker is claimed"}
  - {dependency: first-cause, status: EXPLICITLY-UNEXPLAINED, agents: [], note: "the recitation stops at the lowest shelter; doctrine refuses a first cause rather than answering it"}
  - {dependency: eros-courtship, status: NON-DIVINE, agents: [], note: "paired songs at the ascent; doctrine assigns courtship to no god and claims no patron"}
  - {dependency: reproduction-care, status: UNKNOWN, agents: [], basis: "the closed winter rites are not in the reciters' corpus", evidence: "no claim made; recorded as a knowledge gap, not a silence to be filled by a guess"}

# ---------------------------------------------------------------------------
# Careers and seams: one demotion, one rise, one deified human, one foreign
# equation, one live schism. Each datable to a contract era tag.
# ---------------------------------------------------------------------------
pantheon_history:
  - {id: PH-01, kind: demotion, era: E1, event: "the charter seats Kahatu as oath patron; Halatu is demoted to a formula in the ascent blessing", axis: verticality, evidence: design-choice}
  - {id: PH-02, kind: rise, era: E1, event: "Kahatu moves from the ridge cult of one band to the confederation's oath patron as pasture claims are heard at the pass", axis: both, evidence: design-choice}
  - {id: PH-03, kind: deified-human, era: "E1 person, E2 cult", event: "Ula's market cult grows with the road; his title assimilates to Seratu's address while the caste refuses it", axis: verticality, evidence: design-choice}
  - {id: PH-04, kind: foreign-equation, era: E1 to E2, event: "the lowland partner equates its road-and-receipt power with Seratu; D2 keeps the distortions as contact evidence", axis: verticality, evidence: design-choice (to-verify against the contact record)}
  - {id: PH-05, kind: schism, era: E2, event: "the salt-cutters deny Ula's divine title; the market cults keep it. Unresolved by design", axis: verticality, evidence: design-choice}

# ---------------------------------------------------------------------------
# RIT- calendrical rites across the transhumance year. Fields per contract:
# id, rite, season, actors, era, axis, evidence.
# ---------------------------------------------------------------------------
rites:
  - id: RIT-01
    rite: Ascent departure
    season: "the first open grazing day at the low gate, spring"
    actors: "pasture-right holders, herd callers, lineage reciters"
    era: E0 onward
    axis: both
    evidence: design-choice
    passage_phases: "separation: the herd is cut from the winter fold; liminal: the traverse; incorporation: the first night on the open height"
    follows: [{cite: "corpus/knowledge/myth-symbol/ritual-liminality.md §1", short: "PF-22"}]
  - id: RIT-02
    rite: High-stay oath
    season: "the storm season at the high pasture, summer"
    actors: "oath speakers, ridge-stone keepers, the pasture-right holders"
    era: E0 onward
    axis: both
    evidence: design-choice
    note: "the release formula is spoken into the wind; the storm is the witness. No cloth and no knot is used — knots count, they do not bind"
    follows: [{cite: "corpus/knowledge/myth-symbol/ritual-liminality.md §5", short: "PF-25"}]
  - id: RIT-03
    rite: Descent count
    season: "the descent to the winter shelters, autumn"
    actors: "lineage reciters, cord keepers, the household heads"
    era: E0 onward
    axis: both
    evidence: design-choice
    note: "the year's cords are read at the shelter door; each ended breath is counted once, and the count is the year's arithmetic"
    follows: [{cite: "corpus/knowledge/myth-symbol/cosmology-cosmography.md §8", short: "PF-12"}]
  - id: RIT-04
    rite: Backward drive
    season: "midwinter, one day only"
    actors: "the chosen youth, the winter tellers, the camp"
    era: E1 onward
    axis: verticality
    evidence: design-choice
    note: "the licensed reversal: one round of the animals is driven the wrong way and the tellings follow it; a second day is forbidden. The rite addresses the round, not the god"
    follows: [{cite: "corpus/knowledge/myth-symbol/ritual-liminality.md §2", short: "PF-23"}, {cite: "corpus/knowledge/myth-symbol/trickster.md §3", short: "PF-17"}]
  - id: RIT-05
    rite: Salt opening
    season: "the first thaw at the salt springs, early spring"
    actors: "the salt-cutter caste, the road keepers"
    era: E1 onward
    axis: verticality
    evidence: design-choice
    note: "the first block is set at the boundary stone; no salt is sold before it"
    follows: [{cite: "corpus/knowledge/myth-symbol/ritual-liminality.md §4", short: "PF-24"}]

# ---------------------------------------------------------------------------
# MYTH- narratives with attributed tellers and rival tellings. The gate reads
# these as its motif ledger.
# ---------------------------------------------------------------------------
motifs:
  - id: PAN-MYTH-01
    tier: myth
    title: The pass-opening
    genre: myth
    teller: ridge reciters of the pass bands
    era: E0 onward
    axis: both
    evidence: design-choice
    law:
      rule: storm law frees the pass
      when: the thunder speaks over the saddle in spring
      then: the ice lets go and the herd road opens
    variants:
      - id: var-ridge
        teller: ridge reciters
        register: ascent blessing
        asserts_law: true
        events:
          - {actor: Kahatu, action: the thunder speaks over the saddle in spring, effect: the ice lets go and the herd road opens}
      - id: var-road
        teller: low-road market singers
        register: fireside
        asserts_law: false
        exception: "a rival telling recorded as such: it credits the salt buyers' arrival instead, and is not corrected here"
        events:
          - {actor: the salt buyers, action: come up the road in early spring, effect: the carriers go the long way around until the pass dries}
    licensing: "licenses AS-02 (the storm is an institution) and the seasonal poles: the ascent waits on the storm, so the storm's season and the pasture's season are one institution"
    follows: [{cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §3", short: "PF-03"}, {cite: "corpus/knowledge/myth-symbol/comparative-frameworks.md §1", short: "PF-33"}]

  - id: PAN-MYTH-02
    tier: myth
    title: Why the wind comes down
    genre: myth
    teller: lineage reciters at the descent count
    era: E0 onward
    axis: wind
    evidence: design-choice
    law:
      rule: an ended breath goes below with the wind and returns at the thaw
      when: an ended breath is counted on the cord
      then: the wind carries it below and the thaw brings it back up
    variants:
      - id: var-reciter
        teller: lineage reciters
        register: descent count
        asserts_law: true
        events:
          - {actor: Humweha, action: an ended breath is counted on the cord, effect: the wind carries it below and the thaw brings it back up}
      - id: var-cordkeeper
        teller: a cord keeper of the low shelters
        register: work telling
        asserts_law: false
        exception: "this telling keeps only the count and drops the return, and is recorded as a variant without a ruling"
        events:
          - {actor: the reciter, action: an ended breath is counted on the cord, effect: the name is safe and the wind is not mentioned}
    licensing: "licenses the vertical axis as a round: descent carries, ascent returns; this is also why the axis is invoked as a pair"
    follows: [{cite: "corpus/knowledge/myth-symbol/creation-myths-taxonomy.md §4", short: "PF-15"}, {cite: "corpus/knowledge/myth-symbol/cosmology-cosmography.md §1", short: "PF-08"}]

  - id: PAN-MYTH-03
    tier: folktale
    title: The wrong round
    genre: folktale
    teller: grandmothers in the winter camp
    era: E0 onward
    axis: verticality
    evidence: design-choice
    law:
      rule: one reversed round costs one herd and returns one rule
      when: a herder runs the round backward
      then: one herd is lost and one rule is learned
    variants:
      - id: var-aunt
        teller: grandmothers
        register: winter telling
        asserts_law: true
        events:
          - {actor: Suweha, action: runs the round backward in summer, effect: one herd is lost and one rule is learned}
      - id: var-boy
        teller: men on the descent
        register: work telling
        asserts_law: false
        exception: "the men's telling gives Suweha the herd back and takes the road instead; recorded as the rival telling"
        events:
          - {actor: Suweha, action: runs the round backward in summer, effect: he keeps the herd and loses the road}
    licensing: "the failure upward: the reversal deposits the one-day rule that the midwinter rite obeys"
    follows: [{cite: "corpus/knowledge/myth-symbol/trickster.md §7", short: "PF-19"}, {cite: "corpus/knowledge/myth-symbol/trickster.md §10", short: "PF-21"}]

  - id: PAN-MYTH-04
    tier: legend
    title: The first descent with salt
    genre: legend
    teller: market scribes at the boundary stone
    era: E1 onward
    axis: verticality
    evidence: design-choice (a legitimation device, not history)
    law:
      rule: the storm spares the exposed child and the road is his
      when: a child is left at the pass during a thunder halt
      then: the storm spares the child and the road claims him
    variants:
      - id: var-market
        teller: market scribes
        register: market address
        asserts_law: true
        events:
          - {actor: the infant Ula, action: is left at the pass during a thunder halt, effect: the storm spares the child and the road claims him}
      - id: var-caste
        teller: the salt-cutter caste
        register: caste recitation
        asserts_law: false
        exception: "the caste telling denies the exposure and calls it a market invention; recorded as a denial, not adjudicated"
        events:
          - {actor: the band, action: takes in an orphan of the caste, effect: the road is worked and no title is claimed}
    licensing: "licenses the market vow and, later, the assimilation title; the two tellings are the E2 schism's charter"
    follows: [{cite: "corpus/knowledge/myth-symbol/hero-journey-variants.md §2", short: "PF-28"}, {cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5", short: "PF-05"}]

  - id: PAN-MYTH-05
    tier: myth
    title: The holder steps aside
    genre: myth
    teller: pass-clan reciters at the charter
    era: E1
    axis: verticality
    evidence: design-choice
    law:
      rule: the sky is held apart standing, never tied
      when: the sky leans on the saddle
      then: a standing one sets his shoulders under it
    variants:
      - id: var-formula
        teller: ascent blessing keepers
        register: recitation
        asserts_law: true
        events:
          - {actor: Halatu, action: sets his shoulders under the sky as it leans on the saddle, effect: the sky is held apart and the herds pass under it}
      - id: var-charter
        teller: the E1 charter reciters
        register: assembly recitation
        asserts_law: false
        exception: "the charter telling adds the handover to Kahatu and is recorded as a political addition, dated to the charter"
        events:
          - {actor: Halatu, action: yields the seat to Kahatu, effect: the oath is heard at the pass and the old holder keeps the first line only}
    licensing: "the demotion's own story; it keeps the axis standing and keeps the pantheon's sovereignty chained to the pass institution"
    follows: [{cite: "corpus/knowledge/myth-symbol/pantheon-archetypes.md §5", short: "PF-05"}, {cite: "corpus/knowledge/myth-symbol/comparative-frameworks.md §7", short: "PF-34"}]

