deliberate_blanks:
  - {slot: creator, why: "no maker is claimed anywhere; the climb account is a route charter. Roughly a third of the classic slots stay empty or merged, per the build protocol"}
  - {slot: sun-deity, why: "the sun is not petitioned; the year is read by the poles and the cords, not by a solar god"}
  - {slot: moon-deity, why: "the moon is not petitioned; the night count is the cord keepers' arithmetic"}
  - {slot: love-deity, why: "courtship is institutional, in the paired ascent songs; no patron"}
  - {slot: separate-war-god, why: "merged into the storm's punitive law because the army is the raiding party, not an estate"}
  - {slot: smith-god, why: "merged into the restricted salt-and-iron craft under Seratu; the caste carries the liminality"}
  - {slot: devil, why: "no dualism; the keeper of the dead is a keeper and a place, not an evil principle"}

open_questions:
  - {id: OQ-P01, question: "Component numbering — this file is 06-pantheon by dispatch, while the 01-brief registry names C-05 as the pantheon slot and 06 as symbols. Which numbering governs at assembly?", owner: "round integrator"}
  - {id: OQ-P02, question: "Era tags — the contract's fixed space is E0 to E3 (E3 reserved for the fourth stratum, with a declared alias rule for pre-contract components); the delivered symbols file writes E1 to E4, and the delivered era component writes E0 to E5. This file's records use E0, E1, E2 only. Which mapping governs?", owner: "round integrator and 09-eras"}
  - {id: OQ-P03, question: "Symbol record IDs — the registry fixes a SYM- prefix, the delivered symbols file numbers S1-S9. Reconcile before the cult couplings in this file are resolved", owner: "assembly"}
  - {id: OQ-P04, question: "02-phonology and the lexicon component were absent when this file was drafted and landed later in the same round; every spelled form here remains provisional on the earlier placeholder set, the delivered phonology's own consonants are compatible, and no re-spelling or L- alignment was attempted after delivery. Every L-, P-, NM-, SYM- and ER- reference is recorded UNRESOLVED per RG-04", owner: "assembly"}
  - {id: OQ-P05, question: "Do the theonyms move to the names component as NM- records, or stay PAN- properties with NM- alias records? Both are supported by the registry", owner: "round integrator and 08-names"}
  - {id: OQ-P06, question: "Narrative ID collision — the contract's namespace row gives MYTH- to the pantheon component, but the delivered 07-myths-motifs file also occupies it (MYTH-01 and MYTH-04 to MYTH-08). This file re-prefixed its five narratives to PAN-MYTH-* under RCN-02 and claims no alignment; assembly must either alias them into the narrative namespace or drop the duplicate layer", owner: "round integrator and assembly"}

