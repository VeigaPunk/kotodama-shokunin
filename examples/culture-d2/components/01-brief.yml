# examples/culture-d2/components/01-brief.yml
# D2 (highland-plateau pastoralists) design drill — component 01 of the registry below.
# NON-CANON: this file proposes a design; it records nothing about any world.
component: 01-brief
culture: D2
canon: not canonized (D2 design drill)
artifact: design brief, component registry, and coupling contract for the D2 packet
status: round-3 design record, 2026-10-17; supersede-by-new-file only (no in-place rewrite of a frozen version)
language_id: D2 (working id; per SEED-05 the language is an isolate with no relatives to name)
handoff_recipient: lore-shokunin (canon, entities, chronology, and bible-wide consistency stay theirs)
verified_at: 2026-10-17
recheck: before any comparator detail is quoted beyond this file, before packet assembly, and before any proposed lore handoff

scope_note: |
  This file registers components and fixes the shared contract only. It writes no
  phonology, grammar, lexicon, myth, costume, name, or era content of its own; those
  live in the component files named in the registry, each written by its own worker.
  Cross-component dependencies are expressed by record IDs from the contract block,
  never by quoting a sibling file's contents. No real culture is described here or
  anywhere in this drill: every comparator is a corpus entry inside this repo with
  its own provenance cautions, cited by path and section. Where a claim could not be
  checked in this session it is marked (to-verify) instead of asserted.

follows:
  # The corpus decision tables this brief is built on. Paths are repo-relative.
  - {id: F-01, cite: "corpus/knowledge/linguistics/conlang-methodology.md §Stage 0 — the culture brief is a spec, not flavor", use: "brief rows become design obligations: habitat, subsistence, ranking, religion, neighbors, literacy era, history"}
  - {id: F-02, cite: "corpus/knowledge/synthesis/conlang-blueprint-template.md §0 — brief, scope, and reference passport", use: "the coupled-system fill-in rows and gate G0 this registry implements for D2"}
  - {id: F-03, cite: "corpus/knowledge/synthesis/coupling-model.md §1 — contract: interderive constraints, not cultural essences", use: "spine constraints everywhere; no component may claim a culture essence"}
  - {id: F-04, cite: "corpus/knowledge/synthesis/coupling-model.md §3 — dependency graph, directed, typed, time-indexed", use: "every cross-component edge in a component file must be typed F/I/T/R; only F is a hard limit"}
  - {id: F-05, cite: "corpus/knowledge/synthesis/worldbible-integration-contract.md §12 — apply to a fictional culture: handoff drill", use: "the six dossier components of the handoff map onto the registry below"}
  - {id: F-06, cite: "corpus/knowledge/verification/lexicon-coverage-audit.md §2 — required inputs and counting units", use: "culture brief + coupling brief contents this file must supply; lexicon record fields fixed in contract.record_fields"}
  - {id: F-07, cite: "corpus/knowledge/verification/myth-consistency-gate.md §2 — minimum review packet", use: "record shapes for pantheon, narrative, and symbol records named in the contract"}
  - {id: F-08, cite: "corpus/knowledge/verification/costume-era-consistency-gate.md §2 — freeze the claim before reviewing it", use: "costume record fields and the materials/cloth-source blocks in the contract"}
  - {id: F-09, cite: "corpus/knowledge/verification/naming-collision-gate.md §2 — required input records", use: "name-record fields incl. formation and social license"}
  - {id: F-10, cite: "corpus/knowledge/verification/real-world-inspiration-boundaries.md §3 — borrowing versus copying; §5 — transformation checklist", use: "the D1 no-import list and the comparator guardrails are this transformed, not copied"}
  - {id: F-11, cite: "corpus/knowledge/verification/calibration-registry.md §11 — how to apply to a fictional culture: coupling audit", use: "every record carries an evidence status; comparators are corpus entries, not scholarship claims"}
