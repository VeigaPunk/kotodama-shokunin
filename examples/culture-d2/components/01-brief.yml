registry:
  # File stems follow the round's incident naming (e.g. 03-morphosyntax). If a dispatch
  # names a stem differently, the file's own `component:` value governs; packet_keys are
  # the binding identity.
  - {id: C-01, component: 01-brief, file: examples/culture-d2/components/01-brief.yml, packet_keys: [], spine_duty: "defines the spine contract and registry; makes the spine checkable via acceptance", gates: "manual review against corpus/QUALITY.md", acceptance: A-01}
  - {id: C-02, component: 02-phonology, file: examples/culture-d2/components/02-phonology.yml, packet_keys: [phonology], spine_duty: "pitch-accent contour is the audible form of the vertical spine; wind/breath terms must be well-formed", gates: "tools/gates/phonology-sanity-gate.py", acceptance: A-02}
  - {id: C-03, component: 03-morphosyntax, file: examples/culture-d2/components/03-morphosyntax.yml, packet_keys: [morphology, syntax], spine_duty: "vertical direction morphology; evidentials sized to a storm-law ecology", gates: "none dedicated; manual review per corpus/knowledge/linguistics/morphological-typology.md §11 and corpus/knowledge/linguistics/syntax-typology.md §6", acceptance: A-03}
  - {id: C-04, component: 04-lexicon, file: examples/culture-d2/components/04-lexicon.yml, packet_keys: [lexicon], spine_duty: "landscape/weather density; up/down and breath senses; pastoral and trade fields", gates: "tools/gates/lexicon-coverage-audit.py", acceptance: A-04}
  - {id: C-05, component: 05-pantheon, file: examples/culture-d2/components/05-pantheon.yml, packet_keys: [pantheon], spine_duty: "storm/wind/star/axis roles; narratives that license AS-02; calendrical rites tied to transhumance", gates: "tools/gates/myth-consistency-gate.py", acceptance: A-05}
  - {id: C-06, component: 06-symbols, file: examples/culture-d2/components/06-symbols.yml, packet_keys: [symbols], spine_duty: "height, wind/storm, star/sky, knot-geometry registers with holders and dates", gates: "tools/gates/myth-consistency-gate.py", acceptance: A-06}
  - {id: C-07, component: 07-costumes, file: examples/culture-d2/components/07-costumes.yml, packet_keys: [costumes, materials, cloth_sources], spine_duty: "wool chain; layers for ascent/descent and storm; rank rules via pasture rights", gates: "tools/gates/costume-era-consistency-gate.py", acceptance: A-07}
  - {id: C-08, component: 08-names, file: examples/culture-d2/components/08-names.yml, packet_keys: [names], spine_duty: "names built from vertical/wind roots; name taboo coupled to wind", gates: "tools/gates/naming-collision-gate.py", acceptance: A-08}
  - {id: C-09, component: 09-eras, file: examples/culture-d2/components/09-eras.yml, packet_keys: [eras, era_dates], spine_duty: "E0–E3 seams; script arrival; sound changes; seasonal calendar poles", gates: "none dedicated; manual review per corpus/knowledge/synthesis/era-language-staging.md §11", acceptance: A-09}
  - {id: C-10, component: 10-records, file: examples/culture-d2/components/10-records.yml, packet_keys: [records, script], spine_duty: "tally-knot geometry as vertical positions; adapted script matched to pitch accent", gates: "none dedicated; manual review", acceptance: A-10, absorption_rule: "if the round did not dispatch a separate 10-records file, its required content must be absorbed into 09-eras under a `records_and_script:` block with the same IDs and the same acceptance checks — no silent omission"}
  - {id: C-14, component: 14-kin-address, file: examples/culture-d2/components/14-kin-address.yml, packet_keys: [lexicon (kinship field), names (address)], spine_duty: "address registers coupled to wind/storm law and to the pitch system, as delivered", gates: "tools/gates/lexicon-coverage-audit.py and tools/gates/naming-collision-gate.py when assembled", acceptance: A-14, status: "already delivered 2026-10-17 (evidence: LOG.md entry `round 3 D2: component 14-kin-address written`); pre-dates this contract, so its ID conventions are reconciled in round_registry_reconciliation and nothing in it is renumbered"}
  - {id: C-ASM, component: packet-assembly, file: examples/culture-d2/packet.d2.yml, packet_keys: [name, phonology, morphology, lexicon, pantheon, symbols, costumes, names, eras, era_dates, materials, cloth_sources], spine_duty: "none of its own; assembly only", gates: "all six executable gates + tools/gates/handoff-packet-check.py for a handoff drill", acceptance: A-ASM, note: "assembly artifact, not a component file; may be produced by the round integrator after all components land"}

round_registry_reconciliation:
  # The round's component list is longer than the packet-key registry above (component 14
  # observed). Reconciliation rule: a component written before this contract keeps its own
  # conventions and is ALIASED here, never renumbered or rewritten; a component written after
  # this contract adopts the contract fields. The full dispatch list is OQ-04.
  - {id: RCN-01, observed_component: 14-kin-address, evidence: "LOG.md, 2026-10-17, entry `round 3 D2: component 14-kin-address written` (delivered file examples/culture-d2/components/14-kin-address.yml)", observed_conventions: "kin records K01–K24; era strata ES0–ES3; its own typed coupling edges stated as contract-field paths", contract_treatment: "K- is registered as the kin/address namespace (alias family of the kinship portion of L-); ES- era strata are aliased to the contract tag space by a declared one-line mapping recorded at assembly; no record is renumbered and no file is edited by this brief"}
  - {id: RCN-02, rule: "Any round component not listed in this registry (or listed after this revision) registers by appending a row here or in the assembly manifest, naming: file, packet_keys, accepted ID prefixes, spine_coupling, follows, and the acceptance block it claims. A component that invents an ID prefix not in the contract must declare it in its own header and it must be aliased here before assembly."}
  - {id: RCN-03, rule: "Aliasing never changes content: assembly maps IDs; it does not rename records in their source files. Collisions between a new prefix and a registered namespace are an assembly finding (RG-04), resolved by the integrator or a new revision of this file."}

contract:
  id_namespaces:
    - {prefix: P-, component: 02-phonology, format: "P-01", covers: "phoneme, rule, accent, example records"}
    - {prefix: M-, component: 03-morphosyntax, format: "M-01", covers: "morphemes, paradigms, allomorphy"}
    - {prefix: SYN-, component: 03-morphosyntax, format: "SYN-01", covers: "clause constructions, evidentials, order rules"}
    - {prefix: L-, component: 04-lexicon, format: "L-01", covers: "lexemes (one record per lexeme; senses linked)"}
    - {prefix: PAN-, component: 05-pantheon, format: "PAN-01", covers: "agents/roles; MYTH- for narratives, RIT- for rites"}
    - {prefix: SYM-, component: 06-symbols, format: "SYM-01", covers: "sign records"}
    - {prefix: GAR-, component: 07-costumes, format: "GAR-01", covers: "garment records; MAT- for materials, CS- for cloth sources"}
    - {prefix: NM-, component: 08-names, format: "NM-01", covers: "names; AL- for alias relations"}
    - {prefix: ER-, component: 09-eras, format: "ER-01", covers: "era records (tags from the fixed space E0–E3)"}
    - {prefix: REC-, component: 10-records, format: "REC-01", covers: "tally-knot record types; SGN- for script signs"}
    - {prefix: K-, component: 14-kin-address, format: "K01", covers: "kin and address records as delivered; alias family of the kinship portion of L- (RCN-01; no renumbering)"}
    - {prefix: ES-, component: 14-kin-address, format: "ES0", covers: "era strata as delivered by component 14; aliased to the contract tag space by a declared mapping (RCN-01)"}
    - {prefix: BR-, component: 01-brief, format: "BR-01", covers: "this brief's decision records, reserved for future revisions"}
  era_tags:
    fixed: [E0, E1, E2, E3]
    meanings:
      E0: "pre-script highland era; tally-knots only; no script"
      E1: "script-arrival seam era; script adapted from the lowland trade partner; knots retained in herding/ritual domains"
      E2: "literate anchor era; script normal; register stratification visible"
      E3: "reserved fourth slot; content assigned by component 09 (an already-delivered component may occupy this slot under RCN-01)"
    alias_rule: "components written before this contract may use their own era-tag prefix (e.g. ES0–ES3); each such component declares a one-line mapping to the fixed space in its header, and assembly records the mapping. No mapping is assumed silently."
    design_space: "era names, dates, and internal events belong to component 09; only the tag space and the seam anchors are fixed here"
  record_fields:
    # Gate-recognized shared keys first; every component record additionally carries
    # `id`, `axis`, and `evidence` (status per CP-11). Extra keys are welcome.
    phonology: "{consonants, vowels, phonotactics, tones: 0, notable_rules} + rule records {id, form, description, stage, axis, evidence}"
    morphology: "{type, alignment, word_order} + rule records {id, form, gloss, function, stage, axis, evidence}"
    syntax: "SYN- records {id, construction, order, example, gloss, stage, axis, evidence}; extra key allowed"
    lexicon: "{id, term, gloss, field, layer, route, stage, class, etymology, axis, evidence}; layer values native|loan|sacred|taboo; route values root|derivation|compound|loan|calque"
    pantheon: "{id, name, role, domain, era, axis, evidence}; MYTH- {id, title, genre, teller, events, era, axis, evidence}; RIT- {id, rite, season, actors, era, axis, evidence}"
    symbols: "{id, sign, domain, era, medium, register, audience, exclusive, notes, axis, evidence}"
    costumes: "{id, garment, material, wearer_rank, rite, era, route, axis, evidence}; materials[] {material, composition, routes:[{kind: local|import, stage: fiber|yarn|cloth|dye|trim|garment, eras}]}; cloth_sources[] {name, max_width_m, eras}"
    names: "{id, name, type, era, formation:{stem, rule}, etymology, axis, evidence}; alias records {name, alias_of, relation}"
    eras: "eras:[names]; era_dates:{name:[from,to]}; ER- records {id, tag, name, institution_seam, language_stage, record_stage, costume_seam, axis, evidence}"
    records: "REC- {id, name, medium, purpose, stage, geometry, axis, evidence}; SGN- {id, sign, value, source, adaptation, stage, axis, evidence}"
  rules:
    - {id: RG-01, rule: "Tally-knots encode by vertical position on a hanging line (height = magnitude/register, not ownership); tying is a manufacturing act, never a metaphor for obligation or kinship. Violation = D1B-02 finding."}
    - {id: RG-02, rule: "Every record cites corpus decision tables it follows in `follows:` (path + section + short id); a record without a follows entry is rejected at review."}
    - {id: RG-03, rule: "Cross-component references use only IDs from this contract, e.g. deps: [{component: 04-lexicon, ids: [L-07]}]. Quoting sibling file contents is forbidden; a dependency that cannot be expressed by IDs is itself a contract-change request."}
    - {id: RG-04, rule: "Unresolved IDs are assembly findings (recorded in assembly.validation as UNRESOLVED), never silently defaulted or invented at assembly time."}
    - {id: RG-05, rule: "Every record carries axis: (verticality | wind | both | neutral). neutral requires a coupling_note giving the institutional or material reason it stays out."}
    - {id: RG-06, rule: "D1 checks (D1B-01..09) are run at review against each component's term lists and record texts; findings are listed, not resolved by the component writer."}
    - {id: RG-07, rule: "Romanization: one declared policy; reading rules supplied with each example; accent marks only if contrastive, and if used, one mark per accent."}
    - {id: RG-08, rule: "No fabricated real-world citations. Corpus paths are citations; anything else is marked (to-verify) until a checkable source is found."}

acceptance_criteria:
  - id: A-01
    component: 01-brief
    checks:
      - "Header carries component, culture: D2, and `canon: not canonized (D2 design drill)`."
      - "Registry covers components 02–10 plus the assembly artifact, each with packet_keys, spine_duty, gates, and an acceptance block."
      - "Every coupling principle and registry row cites corpus decision tables (path + section) in follows."
      - "Contract fixes ID namespaces, the era tag space E0–E3 with the alias rule, record fields per packet key, and the cross-reference rule."
      - "D1 no-import list present with check methods; D1 is referenced only as contrast and ban items, never reused as design content."
  - id: A-02
    component: 02-phonology
    checks:
      - "phonology block present with consonants, vowels, phonotactics (stated maximal template), tones: 0, notable_rules >= 6 (>=2 accent-placement rules, >=1 reduction or sandhi rule with a verticality/wind-sensitive environment)."
      - "Consonant inventory >= 14 tokens; vowel inventory >= 5; no vowel-harmony import; length contrast allowed only if stated as contrastive."
      - "Accent system: placement rule(s) stated; >=5 minimal pairs distinguished only by accent; accent marked only if written contrast is needed."
      - ">= 8 example words with glosses; >= 4 of them in verticality or wind fields; all built from the declared inventory and phonotactics (replay shown)."
      - "spine_coupling declared; >= half the example words non-neutral axis; zero D1B-05 or D1B-04 items."
      - "If a herding whistle/shout signal register is designed, it is recorded as a register (audience, range, limits) whose contrasts derive from the 02 system; climate or altitude is not used to justify any inventory choice (CP-13)."
      - "Gate run recorded: python3 tools/gates/phonology-sanity-gate.py <packet>; every finding is RESOLVED or carried as a documented REVIEW item in assembly.validation; no FAIL left open."
      - "follows cites corpus/knowledge/linguistics/conlang-methodology.md §Stage 1–2, corpus/knowledge/linguistics/phonetics-phonology.md §6, corpus/knowledge/verification/phonology-sanity-gate.md §2."
  - id: A-03
    component: 03-morphosyntax
    checks:
      - "morphology block carries type, alignment, word_order; any split phenomena have a stated trigger; marking locus consistent with the typology chosen."
      - ">= 10 M-/SYN- records with id, form, gloss, function, stage, axis, evidence; >= 1 non-affixal process (e.g. ablaut or accent shift) is described where it is pitch-coupled."
      - "Vertical direction grammar: >= 2 morphemes or particles for upslope/downslope (or at least-pole deixis); one full paradigm of 8–12 forms and one sentence family (>= 6 glossed clauses) present."
      - "Evidentials: 2–5 terms sized per corpus/knowledge/linguistics/syntax-typology.md §4 (evidential sizing table) and coupled to the name/rumor/storm-law ecology; no mirativity double-marking against 02 phonology."
      - "Relative-clause strategy matched to chosen order; center-embedding ceiling respected."
      - "Every morpheme listed is buildable from 02's inventory, phonotactics, and accent rules (cross-referenced by ID only); mismatch = violation."
      - "Order choice harmonically swept; no free-order-plus-zero-morphology without a stated history. No D1 forms or D1 order-comparator import."
  - id: A-04
    component: 04-lexicon
    checks:
      - ">= 60 lexeme records; all seven fields covered with >= 4 each (body, kinship, weather, landscape, subsistence, war, religion); weather >= 10 and landscape >= 10 (spine salience)."
      - "Every record has id, term, gloss, field, layer, route, stage, class, etymology, axis, evidence; senses linked, homophones given distinct IDs; no gloss-only records."
      - "Layer use: native >= 40; loan >= 6 (declared trade domains: salt/measures/metal/script/trade), each with donor stage and adaptation note; sacred >= 4 (sky/wind/storm, breath); taboo >= 2 with sanction recorded."
      - "Derivational consistency: >= 3 productive patterns demonstrated replaying from 02/03 rules; licensed irregularity flagged, not hidden."
      - "Etymology strings separate design-choice from attested-comparator status; no invented real-language citations."
      - "Gate run recorded: tools/gates/lexicon-coverage-audit.py; findings dispositioned; no unresolved FAIL. D1 overlap scan run against worked-example-mini-culture.md §8 and reported."
  - id: A-05
    component: 05-pantheon
    checks:
      - ">= 5 PAN- agents with name, role, domain, era, axis, evidence; role coverage is functional (storm/wind, stars/sky, pastures, herds, trade, the vertical axis), not archetype completion."
      - ">= 3 MYTH- narratives with teller and genre; >= 1 rival or variant telling recorded as such; stories license AS-02 (storm law) and the seasonal poles."
      - ">= 2 RIT- calendrical rites tied to the transhumance year (departure/return), with actors and season; rite records reference era tags."
      - "No water-flood lead deity or river-adjacent myth import (D1B-01); storm language is high-altitude (hail, blizzard, thin air), not riverine."
      - "Agent names derivable via 08 slots from 04 roots (by ID); evidence labels per record; gate run recorded: tools/gates/myth-consistency-gate.py, findings dispositioned."
  - id: A-06
    component: 06-symbols
    checks:
      - ">= 8 SYM- records with sign, domain, era, medium, register, audience, exclusive, notes, axis, evidence; >= 4 registers (height, wind/storm, star/sky, knot-geometry)."
      - "Each sign names an authorized holder/interpretive community; no duplicate sign carries opposite in-scope meanings without a dated, attributed divergence record."
      - ">= 1 dated era-drift reinterpretation (mechanism + causal record); no evolutionary-ladder phrasing."
      - "No universal color/sign dictionary claims; each assigned reading is tied to a context key."
      - "Gate run recorded: tools/gates/myth-consistency-gate.py (symbol ledger), findings dispositioned."
  - id: A-07
    component: 07-costumes
    checks:
      - ">= 8 GAR- records with garment, material, wearer_rank, rite, era, route, axis, evidence; >= 6 materials[] entries each with kind/stage routes; >= 2 cloth_sources[] with max_width_m and eras."
      - "Wool is native and its chain (fiber to cloth to garment) is complete; felt and/or loom choice justified against textile-technology.md ceilings; no 'silk-like' placeholder."
      - "Lowland cloth arrives as an E1 import with a dated route; E0 records exclude it."
      - "Wearer rank rules reference lineage/pasture-right institutions; ascent/descent and storm layers resolved as named garment records, not adjectives."
      - "Gate run recorded: tools/gates/costume-era-consistency-gate.py; findings dispositioned; no unresolved FAIL."
  - id: A-08
    component: 08-names
    checks:
      - ">= 15 NM- records: >= 5 person, >= 3 place/shelter, >= 2 deity, >= 2 lineage/segment, >= 3 tool/record names; each with id, type, era, formation {stem, rule}, etymology, axis, evidence."
      - "formation stems reference L- IDs and rule IDs reference M-/SYN- IDs only; no new morphemes invented in the names component."
      - "Name taboo/name-magic layer: >= 2 records coupling naming to wind (e.g. names not carried into storm) with authority and sanction."
      - "Gate run recorded: tools/gates/naming-collision-gate.py; the run explicitly includes the D1 fixture name set as the collision review input (D1B-06) and reports matches."
      - "Pronounceability checked against 02 phonotactics and accent rules for every name."
  - id: A-09
    component: 09-eras
    checks:
      - "eras list carries >= 3 names and era_dates; ER- records for each era with a tag from E0–E3 (or an aliased pre-contract prefix with its declared mapping), plus institution_seam, language_stage, record_stage, costume_seam, axis, evidence."
      - "E0/E1 seam states the script arrival from the lowland trade partner and the retained knot domains; E1/E2 seam states register stratification."
      - ">= 2 ordered sound changes from E0 to E2 with examples (corpus/knowledge/linguistics/historical-linguistics.md §6–§7: dating stages; constructing proto-languages and daughter languages); no reimport of D1's /p/-to-/f/ law."
      - "Seasonal calendar poles (departure/return) fixed with festival/rite references to 05's RIT- IDs; institution dates independent of costume dates."
      - "Manual review against era-language-staging.md §11 checklist recorded in the component's validation block."
  - id: A-10
    component: 10-records
    checks:
      - ">= 4 REC- record types (herd tallies, pasture-right claims, salt/dried-meat trade, ritual calendars) with medium, purpose, stage, geometry, axis, evidence; geometry follows RG-01 (vertical position on a hanging line)."
      - ">= 12 SGN- sign records with value, source (lowland trade partner), adaptation rule, stage E1, axis, evidence; sign values mapped to 02 phonology (pitch accent included where contrastive)."
      - "Script type justified against writing-systems.md §6 decision table; no D1 letter-ID reuse; knot/script coexistence rule stated for E1."
      - "If absorbed into 09-eras, the same IDs and checks apply under a records_and_script block and the absorption is declared in that file's header."
  - id: A-14
    component: 14-kin-address
    status: "retrofit acceptance for a delivered component; this brief neither rewrites nor reopens it"
    checks:
      - "Registered ID conventions (K01–K24, ES0–ES3) are aliased under RCN-01; the component declares its ES-to-E mapping line before assembly, or assembly records the mapping as UNRESOLVED (RG-04)."
      - "Kin terms remain in the kinship field of the lexicon payload at assembly; no renumbering, no renames of delivered records."
      - "Its own import audit (LOG.md evidence, 2026-10-17) stands as the D1 check for this component; a re-run is required only if the component is revised."
      - "Any record IDs it cites from other components are resolved at assembly by ID, not by quoting; unresolved IDs are findings."
      - "Packet assembly maps K- into the kinship portion of lexicon and the address material into names; both routes recorded in assembly.validation."
  - id: A-ASM
    component: packet-assembly
    checks:
      - "packet.d2.yml assembled with name, all packet_keys, era_dates, materials, cloth_sources; source component IDs recorded per top-level block (provenance to component files by path + digest)."
      - "All six gates run over the assembled packet with commands, exit codes, and per-finding disposition recorded; no unresolved FAIL; REVIEW-class items itemized."
      - "handoff-packet-check run for a non-canon handoff drill; §4 envelope fields present; validation section present; release freeze rule (§9) stated with a digest."
      - "UNRESOLVED cross-reference IDs are listed (RG-04), not defaulted."
      - "No canon claim anywhere; lore receipt is a separate decision (contract §8)."

assembly:
  packet_path: examples/culture-d2/packet.d2.yml
  gate_commands:
    - "python3 tools/gates/phonology-sanity-gate.py examples/culture-d2/packet.d2.yml"
    - "python3 tools/gates/lexicon-coverage-audit.py examples/culture-d2/packet.d2.yml"
    - "python3 tools/gates/myth-consistency-gate.py examples/culture-d2/packet.d2.yml"
    - "python3 tools/gates/costume-era-consistency-gate.py examples/culture-d2/packet.d2.yml"
    - "python3 tools/gates/naming-collision-gate.py examples/culture-d2/packet.d2.yml"
    - "python3 tools/gates/handoff-packet-check.py examples/culture-d2/packet.d2.yml"
  validation_requirements: "Per phonology-sanity-gate.md §7 full-gate record: profile id + input digest, reviewer, exit codes and findings, counts, exceptions, and every open verification item carried with its claim ID."

open_questions:
  # For the round integrator; anything touching canon or lore procedure goes to lore via the lane's allowed L0 surface, not decided here.
  - {id: OQ-01, question: "Is 10-records dispatched as its own component this round, or absorbed into 09-eras? The registry supports both; the absorption must be declared, not silent.", owner: "round integrator"}
  - {id: OQ-02, question: "Who assembles packet.d2.yml (component worker or round integrator), and at which revision are component digests pinned for §1 read records?", owner: "round integrator"}
  - {id: OQ-03, question: "Which serializer (Markdown default vs YAML) is used for the D2 handoff drill, given the round-2 serialization question still open with lore?", owner: "lore, via L0", status: "already filed in round 2; no new filing made by this file"}
  - {id: OQ-04, question: "The round's component list is longer than the packet-key registry (component 14 observed in LOG.md; more may exist). The integrator should publish the full dispatch list so every component registers against this contract and no component is silently unregistered.", owner: "round integrator"}
  - {id: OQ-05, question: "Era tag reconciliation: components written pre-contract use their own era-strata prefixes (e.g. ES0–ES3 in component 14). Confirm at assembly which declared mapping applies (contract.era_tags.alias_rule) and record it in assembly.validation.", owner: "round integrator"}

canon_boundary: |
  NON-CANON. This file is a design drill record in kotodama-shokunin. It invents a
  culture, its spine, and its contract; it describes no real people, and it decides
  nothing for any world bible. Canon, entity identity, dates, and supernatural truth
  belong to lore-shokunin alone; the D2 packet may be handed off only as a proposal
  carrying provenance cautions and open questions (worldbible-integration-contract.md
  §6, §11, §12). If lore's answer to OQ-03 changes the serializer, this file's
  contract is unaffected (it is format-neutral); the affected artifact is the
  assembly file, which re-serializes without touching component content.