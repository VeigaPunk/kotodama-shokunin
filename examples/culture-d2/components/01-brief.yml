design_problem: |
  Build one small, coherent, spine-legible D2 packet — brief, phonology, morphosyntax,
  lexicon, myth, symbols, costume, names, eras, records — such that:
  (1) every component is readable as an expression of the declared spine, VERTICALITY
  (high/low, ascent/descent, seasonal poles, world-axis) plus WIND (breath,
  soul-carrier, storm law); (2) nothing silently imports the D1 fixture's river/
  binding/aquatic grammar; (3) the seven-field lexicon and the coupled myth/symbol/
  costume/era records are internally consistent at the record level; (4) the assembled
  packet carries no unresolved executable-gate FAIL and every review-class finding is
  dispositioned; and (5) the whole thing is handoff-ready to lore as explicitly
  non-canon, with open questions named rather than decided. The difficulty is
  constraint propagation, not decoration: the seed decides the spine, the spine
  decides per-component obligations, and the acceptance block below makes each
  obligation checkable. Failure modes this brief exists to prevent: a packet whose
  components each make sense alone but contradict each other; a highland culture that
  drifts into D1 imagery under pressure; a pitch-accent isolate that quietly becomes
  a tone language; and a knot record system that turns into a binding metaphor.

seed_parameters:
  # Restated from the round-3 shared culture seed; these are fixed inputs, not design space.
  - {id: SEED-01, text: "Highland-plateau pastoralist culture: vertical transhumance between winter valley shelters and summer high pastures."}
  - {id: SEED-02, text: "Sky- and wind-oriented cosmology; storm, stars, and the vertical world-axis carry mythic weight."}
  - {id: SEED-03, text: "Clan-segmentary society; lineages hold pasture rights."}
  - {id: SEED-04, text: "Herd economy: wool, milk, meat; salt and dried-meat trade with lowland farmers."}
  - {id: SEED-05, text: "Pitch-accent language isolate; no known relatives."}
  - {id: SEED-06, text: "Pre-writing era uses tally-knot records; a script arrives late, adapted from a lowland trade partner."}
  - {id: SEED-07, text: "Non-negotiable spine: verticality (high/low, ascent/descent, seasonal poles) + wind (breath, soul-carrier, storm law); every component must couple to it."}
  - {id: SEED-08, text: "Contrast profile with D1 (river, binding/tying, alphabet): D2's spine is VERTICALITY and WIND, not binding and water. Nothing may silently import D1's imagery."}

spine:
  - {id: SP-01, axis: verticality, definition: "height relations organize space, motion, season, status, and record: upslope/downslope deixis, ascent/descent verbs, summit/shelter poles, the world-axis as between-pole line", required_evidence: "lexicon landscape/weather fields, direction morphology, pantheon/star register, seasonal rite calendar"}
  - {id: SP-02, axis: wind, definition: "moving air carries breath, soul, news, and law: storm as institution (storm law), wind as carrier and stripper, breath vocabulary coupled to speech and taboo", required_evidence: "wind/breath lexicon with sacred/taboo layers, ritual-liminal registers, myth narratives, whistle or signal practice if any (needs its own evidence)"}
  - {id: SP-03, axis: test, definition: "every design record in every component carries `axis:` with one of verticality | wind | both | neutral-with-rationale; every component file declares `spine_coupling:` naming its two strongest couplings and their record IDs. A record that only makes sense when read through D1 imagery is a violation, not a neutral record."}

aesthetic_stance:
  # What D2 feels like, stated so other components can be judged against it.
  - {id: AS-01, stance: "measured in ascents and descents", note: "time and effort are reckoned vertically; the year is two moves, not four seasons of waiting"}
  - {id: AS-02, stance: "the storm is an institution", note: "storm law (SEED-02) is where obligation and punishment live; no lawgiver on a throne is required"}
  - {id: AS-03, stance: "continuity by seasonal return", note: "the same route walked twice a year; identity is showing up at the pasture and at the shelter, not repairing what broke"}
  - {id: AS-04, stance: "obligations are held as pasture rights", note: "rights descend through lineage segments (SEED-03); no assembly of public witnesses, no oath-cloth import"}
  - {id: AS-05, stance: "records are vertical before they are written", note: "E0 tallies encode by cord position on a hanging line; the script of E1 is an administration tool, not a native invention"}

d1_contrast:
  # D1 = the lane's D1 fixture "Retied Houses" (worked-example-mini-culture.md §2–§3).
  - {id: R-01, domain: "water", d1: "river terrace, bank-work meals, river fish, seasonally flooded ground as the organizing medium", d2: "winter valley shelters and summer high pastures; water is a seasonal forage condition, never the medium of life", boundary_rule: "no river/tide/flood/bank imagery anywhere in D2 records"}
  - {id: R-02, domain: "binding", d1: "obligations witnessed in public; oath-cloth; repair-before-replacement as the stated priority", d2: "obligations held as lineage pasture rights; continuity by return (AS-03)", boundary_rule: "no tie/bind/knot-as-obligation metaphor; knots appear only as record geometry (contract.records rule RG-01)"}
  - {id: R-03, domain: "craft chain", d1: "flax plots, bast fiber, reeds; woven cloth from field and bank materials", d2: "herd fiber chain (wool; felt/weave per component 07); leather and horn from the same herds", boundary_rule: "no flax/bast/reed craft vocabulary or route may be reused; shared domain 'wool' must be re-caused and re-lexified, not inherited"}
  - {id: R-04, domain: "literacy", d1: "E1 local alphabet introduced with letter IDs; script from the start", d2: "E0 tally-knots only; script adapted from the lowland trade partner at the E0/E1 seam (SEED-06)", boundary_rule: "no alphabet-first premise; script sign values must be derived from 02 phonology, not from D1 letter IDs"}
  - {id: R-05, domain: "prosody", d1: "penultimate stress; no tone; the /p/ to /f/ change as the era's sound law", d2: "pitch accent (SEED-05); no tone; the isolate has no sister branch to contrast with", boundary_rule: "D1's sound law and stress pattern may not be reused; D2's own ordered changes are fixed by component 09"}
  - {id: R-06, domain: "stance words", d1: "repair, replace, hold/show/release", d2: "return, ascend, descend, carry, strip (wind)", boundary_rule: "D2 register vocabulary must not translate D1's work chants or witness formulas"}

d1_no_import:
  # Review-time checks against the D1 fixture; flagged as violations, never silently resolved.
  - {id: D1B-01, ban: "river/bank/tide/flood as setting, staple, or metaphor", check: "term lists and narrative records of 04/05/06/07 scanned at review; worked-example-mini-culture.md §2 is the reference"}
  - {id: D1B-02, ban: "tying/binding/knot-as-obligation imagery (oath-cloth, witness knots, 'retied')", check: "term lists of 04 and record texts of 05/06; knots allowed only under contract rule RG-01"}
  - {id: D1B-03, ban: "bast/flax/reed fiber chain as the native textile story", check: "component 07 materials and routes vs textile-technology.md §2 fiber hierarchy"}
  - {id: D1B-04, ban: "alphabet-first literacy; D1 letter IDs P T K M N S L R W Y A E I O U", check: "component 10 script block vs this list; any reuse is a finding"}
  - {id: D1B-05, ban: "D1 sound law (/p/ to /f/) and penultimate stress", check: "components 02 and 09 rule lists"}
  - {id: D1B-06, ban: "D1 fixture forms and names (the D1 lexicon block and name ledger)", check: "collision run required at 08 acceptance A-08; worked-example-mini-culture.md §8–§9 is the reference list"}
  - {id: D1B-07, ban: "public-oath institutions and rotating delegate witnesses as D2 governance", check: "component 05/09 institutional records; D2 governance is lineage pasture rights (SEED-03)"}
  - {id: D1B-08, ban: "D1's comparator package (its stated reference language for word order)", check: "component 02/03 comparator notes; D2 draws only on the comparators block below"}
  - {id: D1B-09, ban: "importing D1's scenic props (upland markets, sheep-on-higher-ground as incidental color) as D2's core", check: "component 04 subsistence field and 07 routes; D2 pastoralism is the core economy, not an offstage supplier"}

coupling_principles:
  # The rules every component must honor. Each is checkable and names its corpus basis.
  - {id: CP-01, principle: "Society reaches language: habitat, subsistence, ranking, religion, trade, literacy era, and history each produce a named lexical or grammatical consequence.", follows: [F-01, F-02]}
  - {id: CP-02, principle: "Cross-component claims are typed edges (F feasibility, I permission, T transmission, R retrospective interpretation); no component asserts that one system 'naturally caused' another.", follows: [F-03, F-04]}
  - {id: CP-03, principle: "Vertical deixis is grammatical and lexical: directional morphology for upslope/downslope and at-least-two poles (summer pasture, winter shelter); landscape and weather fields are the densest in the lexicon.", follows: ["corpus/knowledge/linguistics/semantic-fields-lexicon-building.md §3–§4 (field engineering; weather, landscape, subsistence briefs)"]}
  - {id: CP-04, principle: "Wind is a register, not a decoration: breath/soul vocabulary recurs in sacred and taboo layers and in ritual speech; the storm is where institutional language (storm law) lives.", follows: ["corpus/knowledge/myth-symbol/ritual-liminality.md §5 (calendrical rites)", "corpus/knowledge/linguistics/politeness-taboo-euphemism.md §3 (taboo domains, sanctions)"]}
  - {id: CP-05, principle: "Pitch accent stays pitch accent: no tone contrast, no stress-timing class claims, accent placement rules stated, and every script/romanization choice justified against the accent system.", follows: ["corpus/knowledge/linguistics/phonetics-phonology.md §6 (prosody typology; the stress/syllable/mora-timing dichotomy is flagged discredited there)", "corpus/knowledge/verification/phonology-sanity-gate.md §2 (kernel boundary; prosody items carried as review, not silently ignored)", "corpus/knowledge/linguistics/writing-systems.md §6 (matching script type to phonology)"]}
  - {id: CP-06, principle: "Lineage-pasture institutions are visible in lexicon, names, and costume rank rules; no universal pantheon or universal chief is implied.", follows: ["corpus/knowledge/linguistics/kinship-terminology.md §5, §9 (affinal logic in the lexicon; construction procedure)", "corpus/knowledge/myth-symbol/pantheon-archetypes.md §1, §7 (functional map; build protocol)", "corpus/knowledge/verification/myth-consistency-gate.md §3 (role coverage, not archetype completion)"]}
  - {id: CP-07, principle: "Era tags are mandatory from the fixed space E0–E3: E0 = pre-script knot era, E1 = script-arrival seam, E2 = literate anchor; E3 is reserved for the round's fourth stratum (see contract.era_tags). Pre-contract components alias their own era prefixes in, never silently. Institutions, language stages, records, and costume seams are dated independently, not moved as one block.", follows: ["corpus/knowledge/synthesis/era-language-staging.md §4, §7, §8 (stage packets; type every label; synchronize without determinism)", "corpus/knowledge/culture-material/era-periodization-models.md §13 (build order)", "corpus/knowledge/verification/lexicon-coverage-audit.md §7 (era-staging audit coordinates)"]}
  - {id: CP-08, principle: "Contact discipline: lowland trade-partner loans are confined to declared layers and domains (trade, measures, salt-related, script) with donor stage and adaptation rules recorded; no donor religion, costume, or second complete culture is imported.", follows: ["corpus/knowledge/linguistics/language-contact.md §4, §6, §10 (borrowability; adaptation; stratigraphy)", "corpus/knowledge/verification/real-world-inspiration-boundaries.md §3, §5 (name the relationship; rebuild causes)"]}
  - {id: CP-09, principle: "Costume records carry the full route: fiber or import, preparation, cloth formation (loom/felt per textile ceiling), cut, wearer/rank, rite, era; rank rules reference pasture-right institutions rather than wealth alone.", follows: ["corpus/knowledge/culture-material/textile-technology.md §2, §6 (fiber hierarchy; the vocabulary ceiling)", "corpus/knowledge/synthesis/costume-language-coupling-table.md §2, §8 (relation model; blank template)", "corpus/knowledge/verification/costume-era-consistency-gate.md §4–§7 (material availability, textile bounds, rank rules, anachronism sweep)"]}
  - {id: CP-10, principle: "Symbols work by context key, not by universal dictionary: each sign names its medium, audience, authorized holder, and date; era drift is a dated reinterpretation record, never a natural evolution.", follows: ["corpus/knowledge/synthesis/symbolism-consistency-rules.md §3, §4, §5, §7 (lookup key; invariants; licensed transformations; drift)", "corpus/knowledge/myth-symbol/cosmology-cosmography.md §2, §4 (world-axis; direction codes)", "corpus/knowledge/myth-symbol/celestial-symbolism-calendars.md §4, §8 (re-lexified sky; cycle to calendar)"]}
  - {id: CP-11, principle: "Evidence discipline: every record labels its status (design-choice, attested-comparator, contested, unknown); comparators cite repo corpus entries by path and section; anything unchecked is (to-verify).", follows: [F-11, "corpus/knowledge/verification/calibration-registry.md §1 (status vocabulary)"]}
  - {id: CP-12, principle: "Canon hygiene: all component files are non-canon design records; nothing here decides what is true in any world; the handoff follows the contract and canon decisions stay with lore.", follows: ["corpus/knowledge/synthesis/worldbible-integration-contract.md §6, §11, §12", "corpus/QUALITY.md §5 (canon hygiene)"]}
  - {id: CP-13, principle: "Long-distance herding communication is a register, not a second language: where a whistled or shouted signal register is designed, its contrasts derive from the 02 system and it is recorded with register, audience, and limits; altitude or climate never dictates the inventory.", follows: ["corpus/knowledge/linguistics/phonetics-phonology.md §7 (solid coupling: whistled speech in mountains + long-distance herding; altitude/ejective and climate/tone claims are contested seeds there and must be labeled as such if used)"]}

comparators:
  # Allowed reference entries (repo corpus). Each is used for a bounded craft question and
  # carries its own cautions; no comparator may be imported as a package.
  - {id: CMP-01, cite: "corpus/knowledge/civilizations/mongol.md §Heaven, earth, ancestors — sacred lexicon with time-depth", use: "bounded example of sky/Heaven sacred lexicon with political usages", guardrail: "its own text warns against forcing every occurrence into a personal deity and against installing later lists as an era's chart; D2 must not copy Tengrist vocabulary, and D2 has no imperial office"}
  - {id: CMP-02, cite: "corpus/knowledge/civilizations/ainu.md §Language family, structure, and writing; §Kamuy reciprocity", use: "isolate-status and oral-transmission caution; reciprocity model without a fixed god roster", guardrail: "no plot or term borrowing; its prosody/anthropology coverage is partial by its own statement"}
  - {id: CMP-03, cite: "corpus/knowledge/civilizations/finnic-sami.md §Language family, writing, and substrate; §Sky-god terminology debate; §Era model", use: "independent dating of loans, script standards, and ritual titles; sky-terminology caution", guardrail: "do not manufacture a common pantheon or transfer vowel-harmony/grammar wholesale; its substrate discussion is a reconstruction, not a witnessed history"}
  - {id: CMP-04, cite: "corpus/knowledge/civilizations/inca.md §Khipu: record system before a writing verdict", use: "bounded example of cord records assessed before any writing verdict", guardrail: "no imperial apparatus, no solar-kingship import; khipu specifics are not D2's"}
  - {id: CMP-05, cite: "corpus/knowledge/civilizations/tibet.md §Script creation: charter narrative versus historical reconstruction; §Era staging: institutions develop on different clocks", use: "script-origin stories and era clocks as separate questions", guardrail: "no Buddhist strata, no reincarnation-office analog; script charter narratives are its own material"}
  - {id: CMP-06, cite: "corpus/knowledge/civilizations/inuit.md §Polysynthetic morphology: a generative model, not long-word decoration; §Parka/anorak technology", use: "morphology-as-generator caution; clothing vocabulary follows construction and use", guardrail: "no polysynthesis import; its own file marks snow-vocabulary myths and thin ground"}
  # Deferred comparator, flagged not silent: Andean terrace-agriculture material for a
  # vertical-economy comparison is not yet located as a corpus entry in this repo and stays
