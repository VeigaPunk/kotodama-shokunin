# examples/culture-d2/components/09-eras-calendar.yml
# kotodama-shokunin — D2 design drill (round 3), packet component 09, path fixed
# by the round assignment (the 01-brief registry expects 09-eras.yml; that name
# mismatch is recorded as an assembly finding in the validation block).
#
# NON-CANON SAMPLE DESIGN. Every name, date, and rule below is invented for this
# exercise; no real culture is described and no canon is set. Comparators cite
# corpus/knowledge entries; no outside scholarship is asserted.
#
# SPINE: verticality (ascent/descent, high/low, the standing pole) + wind
# (breath, the carried word, storm law). D1 imagery (river, binding, alphabet)
# is refused: no water, no binding, no thread as themes. The seed's tally-knot
# record tech appears only as the given pre-script record substrate, under the
# contract's record rule RG-01 (knot geometry = vertical position on a hanging
# line, never a metaphor for obligation).

component: 09-eras-calendar
culture: D2
canon: not canonized (D2 design drill)
id: d2.09.eras-calendar
status: sample design record; canon decisions belong to lore-shokunin
axis: both
evidence: design-choice
packet_keys: [eras, era_dates]
one_line: >
  Era model (contract tag space E0–E3; moot-held wind-register eras; next-descent
  rule; seam rites), ordered sound changes E0→E2, the transhumance calendar
  (gates, held days, sky events), and dating conventions for the D2
  highland-plateau pastoralists.

contract_conformance:
  brief: examples/culture-d2/components/01-brief.yml
  follows_contract: [contract.era_tags, contract.record_fields.eras, contract.id_namespaces (ER-), RG-01, RG-02, RG-03, RG-04, RG-05, RG-07, RG-08, RCN-02, acceptance A-09]
  era_tag_mapping: >
    one line, per the alias rule: E0 = ER-01..ER-06 (the pre-script knot era,
    before D1 through D86); E1 = ER-07 Marked Count (script-arrival seam,
    D86–D99); E2 = ER-08 Two Counts (literate anchor, D99–present sample D103);
    E3 = ER-09 assigned here as the reserved fourth slot's content: the
    prospective Still Air stratum, undated.
  local_prefixes_declared: >
    per RCN-02, this file declares the internal prefixes ER- (era records, the
    contract namespace), EL- (era-change law), SC- (sound changes), SKY- (sky
    events), CAL-/GATE-/H- (calendar units, gates, day register), FES-, SEAM-,
    DC-, ART-, TRQ-, XC-, CB-. Cross-component references use contract IDs only.
  deps:
    - {component: 02-phonology, ids: [P- records unassigned at write time], need: "the E0 inventory and template (C)V(C), coda set {n l r s}, pitch accent" }
    - {component: 03-morphosyntax, ids: [M-/SYN- records unassigned at write time], need: "stage-E0 forms used as sound-change inputs" }
    - {component: 04-lexicon, ids: [L- records unassigned at write time], need: "term requests TRQ-01..TRQ-25" }
    - {component: 06-pantheon, ids: [RIT-01, RIT-02, RIT-03, RIT-04, RIT-05], need: "the transhumance poles and the licensed reversal referenced by the calendar and the seam" }
    - {component: 11-costumes, ids: [GAR- records unassigned at write time], need: "costume_seam requirements per era; no garment content is asserted here" }
    - {component: 06-symbols, ids: [SYM- records unassigned at write time], need: "the sky objects whose calendar use this file fixes as handles only" }
    - {component: 10-records, ids: [REC-/SGN- records unassigned at write time], need: "knot and incised-record types that the dating rules reference" }
  conformance_notes:
    - "eras and era_dates are delivered in the contract's shape; ER- records carry tag, institution_seam, language_stage, record_stage, costume_seam, axis, evidence."
    - "schema split: sample_dates (Y-coordinates like D103) are in-world register coordinates and are not BCE/CE; no absolute chronology is claimed."
    - "costume dates and institution dates are independent, per A-09; nothing here moves a costume record."
    - "record shape (RG-05, RG-02): a record is any entry carrying a record id (ER-, EL-, CL-R*, CAL-, SKY-, FES-, SEAM-, DC-, ART-, TRQ-, VAL-, CB-); each record carries axis or a neutral axis with a coupling_note. Block containers (EL, CL, CAL, SC, SKY, FES, SEAM, DC, TRQ, XC, VAL, CB, CANON) are not records. Declared follows inheritance: a record without its own follows entry inherits the follows list of its enclosing block; blocks that hold such records carry an explicit follows list (term_requests and coupling_handles included)."

follows:
  - corpus/knowledge/culture-material/era-periodization-models.md §1 (periodization as legitimacy technology; emic vs etic), §2 (two layers at once), §3 (era-name craft; next-New-Year rule; backdating caveat), §4 (seam logistics; reveal object; broken artifact), §5 (calendar as loyalty; rival counts), §9 (world-ages doctrine; scheduled dread), §10 (generation counts as pre-numerate dating), §12 (calibration), §13 (build order 1–7)
  - corpus/knowledge/culture-material/calendar-festival-systems.md §1 (three clocks and the lie), §2 (intercalation strategies; leap ownership), §6 (week alternatives; per-day register), §8 (new-year placement; era as statute), §9 (vocabulary), §10 (calibration shelf), §11 (application protocol 1–9)
  - corpus/knowledge/linguistics/historical-linguistics.md §6 (dating language stages), §7 (ordered law lists; feeding/bleeding; strata; pitfalls)
  - corpus/knowledge/myth-symbol/celestial-symbolism-calendars.md §5 (heliacal calendar stars), §7 (eclipse as omen and archive), §8 (cycle machinery; leap ownership)
  - corpus/knowledge/myth-symbol/cosmology-cosmography.md §2 (axis: built expression + ritual required), §3 (layered cosmos needs a count-bearing ritual), §5 (world-ages motion and arithmetic), §7 (axis/count/procession kit), §8 (cosmography → calendar)
  - corpus/knowledge/myth-symbol/ritual-liminality.md §5 (calendrical rites; inversion licence and aftermath), §6 (performative speech; felicity conditions)
  - corpus/knowledge/myth-symbol/number-symbolism.md §2 (five and nine clusters) — read for the hand arithmetic only, not as a claim
  - corpus/knowledge/synthesis/worldbible-integration-contract.md §6 (claim kind vs evidence vs canon status), §7 (era staging; half-open intervals; prescribed vs first-attested), §9 (edit discipline)
  - corpus/QUALITY.md §1–2 (provenance; calibration)

spine_check:
  verticality: [standing pole and its notches, ascent/descent as the year unit, graze bands as time units, cairn line, the keeper's staff passed hand over hand]
  wind: [the carried word at the seam, the smoke test for oaths, wind-gates, storm season closures, held days owned by the wind]
  D1_avoidance: "no river/water/binding/thread imagery; 'knot' occurs only in the seed's tally-knot record tech under RG-01; the lowland script is an adaptation receipt for register marks, not an alphabet theme"

# ===========================================================================
# ERAS — contract shape (eras:[names]; era_dates; ER- records)
# ===========================================================================
eras:
  - "Open Grazing"
  - "First Ascent"
  - "Salt Turn"
  - "Long Storm"
  - "Ash Wind"
  - "Bitter Smoke"
  - "Marked Count"
  - "Two Counts"
  - "Still Air (reserved)"

era_dates:
  "Open Grazing": [null, "D1"]
  "First Ascent": ["D1", "D31"]
  "Salt Turn": ["D31", "D73"]
  "Long Storm": ["D73", "D77"]
  "Ash Wind": ["D77", "D78"]
  "Bitter Smoke": ["D78", "D86"]
  "Marked Count": ["D86", "D99"]
  "Two Counts": ["D99", "D103"]
  "Still Air (reserved)": [null, null]
era_dates_note: "half-open [from, to) in descent coordinates; D1 = the covenant ascent; the in-world quarter is not convertible without convention (era-periodization §10)"

held_turns:
  id: HELD
  list: [74, 78, 84, 95]
  by_era: {"74": ER-04, "78": ER-06, "84": ER-06, "95": ER-07}
  effect: "the official climb count = descents − held turns; at the sample present, 103 − 4 = 99 vs the restored 103"
  axis: verticality
  evidence: design-choice
  follows: [era-periodization-models.md §5, §13.2]

era_tags:
  E0: {meaning: "pre-script highland era; tally-knots only; no script", contents: "ER-01..ER-06", axis: both, evidence: design-choice, follows: [era-periodization-models.md §13.1]}
  E1: {meaning: "script-arrival seam era; script adapted from the lowland trade partner; knots retained in herding and rite domains", contents: "ER-07", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §13.3]}
  E2: {meaning: "literate anchor era; script normal; register stratification visible", contents: "ER-08", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §13.3]}
  E3: {meaning: "reserved fourth slot; content assigned by this component", contents: "ER-09", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §9]}

era_records:
  - id: ER-01
    tag: E0
    name: "Open Grazing"
    span: "before D1; reckoned in hearth generations, not turns"
    institution_seam: "none; the era before the register — no seam rite exists for it"
    language_stage: "knot-era vernacular; the recitation register is the only formal speech"
    record_stage: "knot tallies only, hanging-line geometry (RG-01); no script"
    costume_seam: "requirement only: wool felt layers date from this stratum; garment records and dates belong to 11-costumes (GAR- ids unassigned at write time)"
    axis: both
    evidence: design-choice
    follows: [era-periodization-models.md §10, §12]
    notes: "retrospective label applied by the later chroniclers; in-world called 'the turns they did not count'; the folk generation count carries the standard error bars (Herodotus 2.142 via era-periodization §10)"
  - id: ER-02
    tag: E0
    name: "First Ascent"
    span: "[D1, D31); 30 turns"
    institution_seam: "the covenant ascent: pasture rights fixed at the first summer moot; era announced at the moot, effective at the descent that closes that turn (EL-02)"
    language_stage: "E0 knot-era vernacular (02/03 stage-E0 forms are this stage's inputs)"
    record_stage: "knot tallies; the covenant is remembered by recital"
    costume_seam: "requirement only: the banner felt and the keeper's staff are this stratum's objects; no garment is assigned here"
    axis: verticality
    evidence: design-choice
    follows: [era-periodization-models.md §3, §4]
    notes: "epoch by convention; the earliest surviving mark is ER-07's stratum — the retrospective-backdating caveat applies (era-periodization §3)"
  - id: ER-03
    tag: E0
    name: "Salt Turn"
    span: "[D31, D73); 42 turns"
    institution_seam: "T3: the first ratified salt term with the lowland towns; announced at the moot, effective at the closing descent"
    language_stage: "E0 vernacular; the trade vocabulary enters as a recipient-side stratum (02's loan filter); the lowland partner's own script is their ledger's business, not D2's yet"
    record_stage: "knot tallies; salt measures counted as knot groups on the trade lines"
    costume_seam: "requirement only: the lowland cloth arrives as an import dated from the E0/E1 seam, not earlier; costume records belong to 11-costumes"
    axis: both
    evidence: design-choice
    follows: [era-periodization-models.md §4, §13.3]
    notes: "the era ends mid-turn, so its last turn ('Salt Turn 42') lasts only a half-turn — artifact ART-01; the salt tablets are knotted, not incised, until the E0/E1 seam"
  - id: ER-04
    tag: E0
    name: "Long Storm"
    span: "[D73, D77); 4 turns; held turn D74"
    institution_seam: "T2 expiation: a failed ascent and storm deaths; announced at the summer moot of turn 72, effective at the closing descent"
    language_stage: "E0 vernacular; the storm-law formulae are recited, never written"
    record_stage: "the held turn is a gap in the knot count (RG-01 geometry; the gap is visible)"
    costume_seam: "requirement only: storm layers are used at the high stay; no garment record is asserted here"
    axis: wind
    evidence: design-choice
    follows: [era-periodization-models.md §9, §13.3]
    notes: "first of three names in one crisis; era-name churn is the in-world instability statistic here"
  - id: ER-05
    tag: E0
    name: "Ash Wind"
    span: "[D77, D78); 1 turn"
    institution_seam: "T2 as the crisis continues: storm deaths of two shelter heads at the moot of turn 76"
    language_stage: "E0 vernacular"
    record_stage: "knot tallies; the single-turn era shows as one knot group with no successor group"
    costume_seam: "requirement only: the banner is raised for one turn and taken down (artifact ART-05)"
    axis: wind
    evidence: design-choice
    follows: [era-periodization-models.md §13.3]
    notes: "the register's shortest era by turns; the object behind the Quiet Rule's minimum duration (EL-03)"
  - id: ER-06
    tag: E0
    name: "Bitter Smoke"
    span: "[D78, D86); 8 turns; held turns D78, D84"
    institution_seam: "T5: the Keeper's death in the storm season, in the turn of the eating-storm (D78); announced at the descent assembly, effective at that close"
    language_stage: "E0 vernacular; the eating-storm re-ratification is spoken (SKY-05)"
    record_stage: "knot tallies; two gaps in the climb count"
    costume_seam: "requirement only: the mourning pause (SEAM-06) is this stratum's dress question; costume records belong elsewhere"
    axis: wind
    evidence: design-choice
    follows: [era-periodization-models.md §4, §9]
    notes: "the eclipse inside its first turn is re-ratified, not a seam"
  - id: ER-07
    tag: E1
    name: "Marked Count"
    span: "[D86, D99); 13 turns; held turn D95"
    institution_seam: "T2/T4: the crisis assembly of turn 85 opens the era after the Keeper's death and the failed pastures; the Quiet Rule is carried at the D90 muster (the era's first Ninefold Muster); the E0/E1 seam states the script arrival: D2 adopts the lowland partner's incising practice for the register, and the knot domains are retained — herding tallies and rite counts stay knotted (RG-01), only the eracount is incised"
    language_stage: "script-era vernacular opens: SC-01 applies (intervocalic /h/ loss in ordinary speech), the recitation keeps the older forms"
    record_stage: "knot + incised register (the keeper's board); first D2-made marks date from this seam"
    costume_seam: "requirement only: the lowland cloth import is dated at or after this seam; costume dates remain 11-costumes' decision"
    axis: verticality
    evidence: design-choice
    follows: [era-periodization-models.md §4, §13.3; historical-linguistics.md §6]
    notes: "double dating with the lowland ledger begins; D95 is ratified retroactively at the D99 muster (artifact ART-02)"
  - id: ER-08
    tag: E2
    name: "Two Counts"
    span: "[D99, D103 sample present); 5 turns"
    institution_seam: "T4: the D99 muster, where the two shelter confederations declared different climb counts; the era label splits — official 'the Standing Wind', common 'Two Counts' (attributed accounts, contract §6)"
    language_stage: "literate standard: SC-02 applies (word-final high-vowel loss after n l r s); the E1/E2 seam states register stratification — the incised register is the legal surface, the recitation and the knot tally hold the sacred and herding registers, and SC-01's /h/ survives in the recitation"
    record_stage: "incised register normal; the recital of winds is still oral; the register's gaps are read as the count dispute's evidence"
    costume_seam: "requirement only: no costume movement follows from the era label itself; institution dates and costume dates are independent (A-09)"
    axis: both
    evidence: design-choice
    follows: [era-periodization-models.md §5, §13.2; historical-linguistics.md §6]
    notes: "official climb count C99, restored count C103 at the sample present; the two straddle the C100 rung boundary"
  - id: ER-09
    tag: E3
    name: "Still Air (reserved)"
    span: "undated; not entered on the official count"
    institution_seam: "reserved: the moot's register names the tag but has not declared the stratum; the restored count claims it began at C101, three climbs before the sample present"
    language_stage: "none attested; a prospective stratum only"
    record_stage: "none; the tag is reserved in the register"
    costume_seam: "not applicable; no costume claim is attached to a reserved stratum"
    axis: wind
    evidence: design-choice
    follows: [era-periodization-models.md §9, §12, §13.2]
    notes: "content assigned by component 09 per contract.era_tags: the last rung's stratum; its computation is the dread at CL-ARI/CL-DRD and its dates will slip if it is ever declared (era-periodization §12)"

# ---------------------------------------------------------------------------
# ERA-CHANGE LAW (EL-; the register's rules, not era names)
# ---------------------------------------------------------------------------
era_law:
  id: EL
  follows: [era-periodization-models.md §1, §2, §3, §13.3]
  rules:
    - {id: EL-01, rule: "eras belong to the moot, never to a person or lineage head; an era is named for a wind, a graze band, a storm, a pass, or a ratified salt term", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §13.3]}
    - {id: EL-02, rule: "next-descent rule: an era announced at the summer moot takes effect at the descent that closes that turn (half-turn tail); an era announced at the descent assembly takes effect at that assembly's close (tail of a hand of days)", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §3, §4]}
    - {id: EL-03, rule: "the Quiet Rule (E1 era, carried at the D90 muster): an era runs at least one full turn, and no more than one seam rite in a turn; stated reason: the E0 churn — three names in thirteen turns, one of them a single-turn era (ER-05)", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §13.3]}
    - {id: EL-04, rule: "what breaks at a seam: salt tablets keep the old mark for one turn (grace); muster rolls are re-marked; the era travels at herald speed over the passes, so a town holds whichever era its last herald brought — 'the count is one, the hearing is many'", axis: neutral, coupling_note: "herald lag is an information-speed institution, not a spine carrier", evidence: design-choice, follows: [era-periodization-models.md §4]}
    - {id: EL-05, rule: "trigger classes: T1 a new graze band held one full turn; T2 expiation (failed ascent, storm deaths, eating-storm); T3 a ratified salt term; T4 a ninefold muster that re-cuts pasture rights; T5 the Keeper's death in the storm season (ratified at the next moot)", axis: both, evidence: design-choice, follows: [era-periodization-models.md §3, §4]}
    - {id: EL-06, rule: "name craft: two-part compounds from the wind/sky register; never reused; never an ordinary herd word; omen-sourced; screened against the names of living lineage heads; the Keeper recites the whole register at each muster (the recital of winds is the chronicle)", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §3, §11]}
    - {id: EL-07, rule: "held turns: a turn withheld from the climb count; after the Quiet Rule a held turn needs muster ratification; in the E0 storm the Keeper held three turns by his own word, the abuse the Quiet Rule answered", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §5]}
    - {id: EL-08, rule: "record separation: announced_at / effective_from / first_mark / retrospective_label are kept distinct; bounds are half-open with uncertainty; the narrative voice endorses neither the register's nor the rungs' truth", axis: neutral, coupling_note: "a bookkeeping rule required by the handoff contract", evidence: design-choice, follows: [worldbible-integration-contract.md §6, §7]}# ===========================================================================
# COSMIC LAYER — the Rungs, kept by the watchers
# ===========================================================================
cosmic_layer:
  id: CL
  follows: [cosmology-cosmography.md §2, §3, §5, §7, §8; era-periodization-models.md §9, §12]
  doctrine:
    id: CL-DOC
    text: >
      The Standing Pole holds the sky off the ground. The pasture line climbs one
      rung per twenty-five counted climbs, and the world climbs with it: each rung
      the grazing is thinner and the wind louder. A cost-of-ascent variant of
      world-ages doctrine, not moral decay, and never narrator-endorsed.
    axis: verticality
    evidence: design-choice
    follows: [cosmology-cosmography.md §5]
  rungs:
    - {id: CL-R1, label: "Ground Wind", climbs: "1–25", axis: both, evidence: design-choice, follows: [cosmology-cosmography.md §5]}
    - {id: CL-R2, label: "Grass Wind", climbs: "26–50", axis: both, evidence: design-choice, follows: [cosmology-cosmography.md §5]}
    - {id: CL-R3, label: "Storm Wind", climbs: "51–75", axis: wind, evidence: design-choice, follows: [cosmology-cosmography.md §5]}
    - {id: CL-R4, label: "Counting Wind", climbs: "76–100", axis: verticality, evidence: design-choice, follows: [cosmology-cosmography.md §5], note: "the only rung name with no pre-E1 attestation — the watchers' claim that it was named before the marks came is unsupported"}
    - {id: CL-R5, label: "Still Air", climbs: "101–125", axis: wind, evidence: design-choice, follows: [cosmology-cosmography.md §5]}
  arithmetic:
    id: CL-ARI
    text: "a rung = 25 counted climbs (five hands of five); five rungs to the Top at climb 126. Invented design arithmetic, flagged as invented; the five/nine resonances are resonance, not evidence (number-symbolism §2)"
    axis: neutral
    coupling_note: "the arithmetic is a doctrine-internal count; it carries the spine only through the pasture-line reading at CL-INS"
    evidence: design-choice
    follows: [number-symbolism.md §2, §8; era-periodization-models.md §9]
  instrument:
    id: CL-INS
    label: "the cairn line"
    rule: "the watchers keep cairns at the top of each graze band and record the highest usable graze of each ascent; the count says which rung, the cairns say whether the grass has followed"
    axis: verticality
    evidence: design-choice
    follows: [cosmology-cosmography.md §8; calendar-festival-systems.md §11.8]
  dispute:
    id: CL-DIS
    text: >
      Two readings of one doctrine. The moot register holds the four held turns and
      keeps the world in the Counting Wind rung (C99 at the sample present; the last
      climb of that rung is C100, next turn). The restored count puts the held turns
      back, arguing that the count is the world's climb and the grass follows later;
      at C103 it places the world three climbs into the Still Air. Observation-first
      versus count-first is the in-world methodological fault line and re-opens at
      every muster.
    axis: both
    evidence: design-choice
    follows: [era-periodization-models.md §13.2, §5]
  dread:
    id: CL-DRD
    top_at: "climb 126"
    schedule: "officially 27 climbs away; by the restored count 23; the moot reckons a generation as 30 descents, so the Top falls inside the present generation"
    axis: wind
    evidence: design-choice
    follows: [era-periodization-models.md §9, §12]
    calibration: "computations of this kind slip; the design leaves unresolved what happens if the grass does not follow the count"

# ===========================================================================
# CALENDAR — the transhumance machinery
# ===========================================================================
calendar:
  id: CAL
  follows: [calendar-festival-systems.md §1, §2, §6, §8, §11; celestial-symbolism-calendars.md §5, §8; cosmology-cosmography.md §7, §8]
  clocks:
    - id: CAL-CLK-1
      label: "the turn (herd clock)"
      type: "procedural: the ascent gate opens and the descent closes; criterion-bound (band readiness, herd condition), not arithmetic"
      axis: both
      evidence: design-choice
      follows: [calendar-festival-systems.md §1]
    - id: CAL-CLK-2
      label: "the sky station (watchers' clock)"
      type: "solar-observational: shadow post to shadow post, plus the gate reading; authoritative but not public"
      axis: wind
      evidence: design-choice
      follows: [celestial-symbolism-calendars.md §8]
    - id: CAL-CLK-3
      label: "the borrowed moon (trade clock)"
      type: "lunar: the lowland partner's months; used only at the salt market and in double-dated contracts"
      axis: neutral
      coupling_note: "a trade institution; the feasts and the spine never run on the borrowed moon"
      evidence: design-choice
      follows: [calendar-festival-systems.md §1]
  day_reckoning:
    id: CAL-DAY
    rule: "a day opens at the evening penning and closes at the next penning; the speakable hour is the first hour after the morning fire is lit"
    smoke_test: "oaths and era formulas are carried only if the smoke rises straight while the words are spoken; if the smoke bends, the words are not carried and must be spoken again"
    axis: wind
    evidence: design-choice
    follows: [ritual-liminality.md §6]
  units:
    day: "penning to penning"
    hand: "five days — the finger count; the work cadence"
    stage: "one graze band of the ascent or the descent (four bands each way)"
    gate: "an observed transition between stages (eight per turn, plus the penning)"
    turn: "one full round: ascent plus descent; the year"
    climb: "a turn counted by the register (held turns do not count)"
  stages:
    ids: [G1-Folds, G2-Stone-Graze, G3-Middle-Grass, G4-High-Felts]
    note: "each band named for its ground; the descent reads the same names downhill"
    axis: verticality
    evidence: design-choice
    follows: [cosmology-cosmography.md §4]
  gates:
    - {id: CAL-GATE-1, name: "the sky-gate", event: "the gate cluster's first dawn opens the ascent; the watchers raise the smoke column", axis: wind, evidence: design-choice, follows: [celestial-symbolism-calendars.md §5]}
    - {id: CAL-GATE-2..4, name: "the stage gates of the ascent", event: "each band entered on the herd criterion confirmed by winds", axis: verticality, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
    - {id: CAL-GATE-5, name: "the turn-gate", event: "the turning wind opens the descent; travel closes after the storm line", axis: wind, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
    - {id: CAL-GATE-6..8, name: "the stage gates of the descent", event: "read downhill; the last gate is the low fold", axis: verticality, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
    - {id: CAL-GATE-9, name: "the penning", event: "the descent closes at the winter shelters; the herd is counted and the turn ends", axis: verticality, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
  held_days:
    id: CAL-HELD-D
    trigger: "declared by the Wind-Speaker at the sky-gate or the turn-gate when the sky reading and the herd criterion disagree"
    length: "3 to 12 days"
    state: "not counted; no oaths, no sales, no marriages, no formulas; the common name is avoided — the euphemism is 'the still'"
    politics: "who declares the wait owns the muster and the marriage season; the gate was declared early once in the storm era to skip a muster, and the abuse is remembered"
    axis: wind
    evidence: design-choice
    follows: [calendar-festival-systems.md §2, §8; ritual-liminality.md §5]
  day_register:
    id: CAL-REG
    axis: both
    evidence: design-choice
    follows: [calendar-festival-systems.md §6, §11.3]
    days:
      - {id: CAL-H1, name: "folding", work: "count and pen checks", speech: "ordinary speech only; no oaths", axis: verticality, evidence: design-choice, follows: [calendar-festival-systems.md §6]}
      - {id: CAL-H2, name: "salting", work: "salt ration; trade talk", speech: "sales valid; oaths valid only if the smoke test passes", axis: neutral, coupling_note: "the trade cadence is institutional; its speech rule is the spine-carrying part", evidence: design-choice, follows: [calendar-festival-systems.md §6]}
      - {id: CAL-H3, name: "felting", work: "felt and banner repair; pole care", speech: "no oaths, no sales", axis: verticality, evidence: design-choice, follows: [calendar-festival-systems.md §6]}
      - {id: CAL-H4, name: "wind", work: "the watchers read", speech: "no sales, no formulas", axis: wind, evidence: design-choice, follows: [calendar-festival-systems.md §6]}
      - {id: CAL-H5, name: "raising", work: "pens moved; notches cut", speech: "oaths and contracts valid if the smoke test passes — the contract day", axis: both, evidence: design-choice, follows: [calendar-festival-systems.md §6]}
    note: "the weekday-register move (calendar-festival §6, §11.3) carrying the wind theology; D2 has no seven-day week"
  muster:
    id: CAL-MUSTER
    label: "the Ninefold Muster"
    cadence: "every ninth descent, at the summer high moot at the Standing Pole"
    business: "pasture rights re-cut; herds audited; the era register recited; rung declarations taken; held turns ratified after the Quiet Rule"
    axis: both
    evidence: design-choice
    follows: [calendar-festival-systems.md §8]
  reforms:
    - {id: CAL-REF-1, label: "the Quiet Rule", adopted: "E1 era, carried at the D90 muster", content: "minimum one full turn per era; no more than one seam rite in a turn; held turns need muster ratification", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §13.3]}
    - {id: CAL-REF-2, label: "the register's marks", adopted: "E1 era, at the E0/E1 seam", content: "the register is incised on the keeper's board in the lowland partner's manner; era names are still carried by recital, marks carry only counts", axis: neutral, coupling_note: "a recording change; the script's own design belongs to 10-records", evidence: design-choice, follows: [historical-linguistics.md §6]}
    - {id: CAL-REF-3, label: "the gate reading reform", adopted: "pending at the D108 muster", content: "a standing proposal to require the cairn reading at every gate declaration — the observation-first faction's instrument", axis: verticality, evidence: design-choice, follows: [cosmology-cosmography.md §8]}
  drift:
    id: CAL-DRIFT
    text: "held days absorb the annual disagreement; held turns absorb the doctrinal count, so the official climb count drifts behind the descents by however many turns the moot has held; the drift is visible to anyone comparing a shelter's tally with the keeper's board"
    axis: both
    evidence: design-choice
    follows: [calendar-festival-systems.md §11.8]

# ===========================================================================
# SOUND CHANGES — ordered laws E0 → E2 (A-09)
# ===========================================================================
sound_changes:
  id: SC
  follows: [historical-linguistics.md §6, §7]
  note: >
    Two ordered changes, written against 02-phonology's E0 system (template
    (C)V(C), coda set {n l r s}, no clusters, no length, pitch accent). Example
    stems are 02's inventory forms; their P- ids and 04's L- ids are unassigned
    at write time (assembly finding if they stay unresolved). Glosses are not
    asserted here. No D1 law is reimported (no /p/ → /f/).
  records:
    - id: SC-01
      order: 1
      change: "intervocalic /h/ is lost in the ordinary register (word-initial /h/ and the recitation register keep it)"
      stage: "E0 → E1 (the script-arrival seam era)"
      examples:
        - "/hewa/ → /ewa/ (word-initial /h/ kept: the changed environment is intervocalic only)"
        - "/tamu-hani/ → /tamuani/"
        - "recitation register: /hewa/ unchanged (the old stage is frozen in the rite register; historical-linguistics §7.4 strata)"
      axis: wind
      evidence: design-choice
      follows: [historical-linguistics.md §6, §7]
      note: "the breath phoneme thins in the trade speech and survives in the storm-law recitation — the register stratification that the E1/E2 seam states"
    - id: SC-02
      order: 2
      change: "word-final high vowels /i u/ are lost after the coda-legal sonorants {n l r s}; low vowels and non-legal consonants are untouched"
      stage: "E1 → E2 (the literate anchor era)"
      examples:
        - "/kiru/ → /kir/"
        - "/duru/ → /dur/"
        - "/nera/ → /ner/ when word-final; /nera-ka/ keeps its vowel (the loss is word-final only)"
        - "/tamu/ unchanged — /m/ is not in the coda set, so the template itself blocks the loss"
      axis: neutral
      coupling_note: "driven by the script era's clipped surface style, not by the spine; declared neutral with this reason (RG-05)"
      evidence: design-choice
      follows: [historical-linguistics.md §6, §7]
      note: "SC-01 and SC-02 are ordered; in this sketch SC-02 neither feeds nor bleeds SC-01, and no later law is written. The recitation blocks both changes."
    - id: SC-03
      change: "none — declared so the sketch is not read as a complete family history: D2 is an isolate, and no sister branch is modelled"
      stage: "n/a"
      axis: neutral
      coupling_note: "the isolate premise (seed) forbids a comparative reconstruction; this record exists to stop one being inferred"
      evidence: design-choice
      follows: [historical-linguistics.md §7.5, §7.6]

# ===========================================================================
# SKY EVENTS — the calendar's honesty check
# ===========================================================================
sky_events:
  id: SKY
  follows: [celestial-symbolism-calendars.md §5, §7, §8; calendar-festival-systems.md §8]
  note: "the sky objects' myth and names belong to 06-symbols; this block owns only their calendar use"
  records:
    - {id: SKY-01, name: "the shadow post", kind: "solstice observation", effect: "closes the turn's inner accounting at the winter shelters", axis: verticality, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
    - {id: SKY-02, name: "the gate cluster's first dawn", kind: "heliacal rising", effect: "opens the ascent (CAL-GATE-1)", axis: both, evidence: design-choice, follows: [celestial-symbolism-calendars.md §5]}
    - {id: SKY-03, name: "the turning wind", kind: "equinoctial wind observation", effect: "opens the descent (CAL-GATE-5)", axis: wind, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
    - {id: SKY-04, name: "the storm line", kind: "seasonal closure", effect: "travel closed; oaths not carried while the smoke bends", axis: wind, evidence: design-choice, follows: [ritual-liminality.md §6]}
    - {id: SKY-05, name: "the eating-storm", kind: "eclipse", effect: "the moot's expiation: the era formula is spoken again (re-ratification, not a seam); a Keeper's death within the turn is read retrospectively as the omen's payment and can trigger a T5 seam", axis: wind, evidence: design-choice, follows: [celestial-symbolism-calendars.md §7; era-periodization-models.md §4]}
    - {id: SKY-06, name: "the cairn reading", kind: "pasture-line observation", effect: "confirms or contests the rung question (CL-DIS)", axis: verticality, evidence: design-choice, follows: [cosmology-cosmography.md §8]}# ===========================================================================
# CALENDAR POLES (A-09) — the transhumance season, referenced by RIT- IDs
# ===========================================================================
calendar_poles:
  id: CAL-POLE
  follows: [calendar-festival-systems.md §8, §11.4; ritual-liminality.md §5]
  poles:
    - {id: CAL-POLE-DEPART, pole: "departure", season: "the sky-gate dawn (spring); the ascent opens", rite_ref: RIT-01, actor_ref: "the pasture-right holders and herd callers of RIT-01", axis: both, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
    - {id: CAL-POLE-RETURN, pole: "return", season: "the penning and the descent count (autumn)", rite_ref: RIT-03, actor_ref: "the lineage reciters and cord keepers of RIT-03", axis: verticality, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
  note: "the two poles are 06-pantheon's rites, referenced by ID only; the calendar adds the day-register rules and the gate declarations at each pole, and asserts nothing about the rites' content (RG-03)"

# ===========================================================================
# FESTIVALS — the arc (inversion / dead / return / founding) plus the muster
# ===========================================================================
festivals:
  id: FES
  follows: [calendar-festival-systems.md §8, §11.5; ritual-liminality.md §5, §6]
  records:
    - id: FES-01
      name: "the Unpitching"
      when: "the last herd leaves the high felts (descent opening)"
      slot: "inversion festival"
      rite: "the altitude order is inverted for one day: herd-boys direct the loads, the senior heads carry the youngest's burdens, mockery of the senior heads is licensed aloud"
      licence_and_aftermath: "burden-swapping and mockery are licensed; violence is not and is prosecuted after the descent count; the mockery is remembered as debts and quoted at the next muster"
      speech: "sales valid under the salting-day rule; no oaths (the wind is up)"
      axis: both
      evidence: design-choice
      follows: [ritual-liminality.md §5, §6]
    - id: FES-02
      name: "the Low Smoke"
      when: "the winter shelters, the hand of days when the smoke lies along the ground instead of rising"
      slot: "season of the dead"
      rite: "the dead are addressed by office or kin description, not by given name; households keep a low fire and speak little; no contracts, no new banners"
      rite_ref: RIT-04
      speech: "no oaths, no sales; the dead's names are avoided until the smoke rises again"
      axis: wind
      evidence: design-choice
      follows: [ritual-liminality.md §5]
    - id: FES-03
      name: "the Descent Count"
      when: "the penning closes the turn (CAL-GATE-9)"
      slot: "return assembly (autumn)"
      pole_ref: CAL-POLE-RETURN
      rite: "herds counted at the pens; debts spoken aloud at the pens (knotted before the E0/E1 seam) or read from the board after it; the turn's tally closed; the era's tail turn measured"
      speech: "oaths valid if the smoke test passes; emergency seams are announced at this assembly"
      axis: verticality
      evidence: design-choice
      follows: [calendar-festival-systems.md §8]
    - id: FES-04
      name: "the Ascent Opening"
      when: "the sky-gate dawn (CAL-GATE-1)"
      slot: "founding-act civic cycle"
      pole_ref: CAL-POLE-DEPART
      rite: "the founding ascent is recited; the procession moves the households up band by band over the season — the transhumance itself is the procession"
      speech: "the era formula is recited at the pole (re-ratification); no new era may be announced except by a T2 emergency"
      axis: both
      evidence: design-choice
      follows: [cosmology-cosmography.md §7; calendar-festival-systems.md §8]
    - id: FES-05
      name: "the Ninefold Muster"
      when: "every ninth descent, at the summer high moot"
      slot: "assembly and audit cycle"
      rite_ref: RIT-02
      rite: "rights re-cut; herds audited; the recital of winds; rung declarations; held-turn rulings; the high-stay oaths fall in the same season"
      speech: "formal moot speech; the Keeper's recital must be whole or be corrected by the elders"
      axis: both
      evidence: design-choice
      follows: [calendar-festival-systems.md §8]

# ===========================================================================
# TRANSITION RITUALS — scripting the seam (era-periodization §4)
# ===========================================================================
transition_rituals:
  id: SEAM
  follows: [era-periodization-models.md §3, §4, §5, §13.5; ritual-liminality.md §5, §6]
  place: "the Standing Pole at the summer moot, or the descent ground's pole frame for a descent seam"
  reveal_object: "the felt banner on the Standing Pole — the lowering and raising of felt is the reveal; a segmentary moot has no crown to hand over"
  sequence:
    - {id: SEAM-01, name: "the wind watch", act: "the watchers read the gate and raise a smoke column at the descent ground; the announcement travels as vertical smoke, then as herald", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §4]}
    - {id: SEAM-02, name: "the lowering and the cutting", act: "the old banner is lowered; the shelter heads cut it into strips, one per lineage, each keeping the old era's mark; a household strip is the broken artifact that outlives the era (ART-01)", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §4]}
    - {id: SEAM-03, name: "the raising and the carried word", act: "the new felt is raised; the Wind-Speaker stands upwind and speaks the era formula; every head must hear it and the smoke must rise straight; if the smoke bends the formula is not carried, contracts may not bear the new era, and the formula is spoken again at the next still dawn — until then the era stands 'in the wind'", axis: wind, evidence: design-choice, follows: [ritual-liminality.md §6; era-periodization-models.md §4]}
    - {id: SEAM-04, name: "the staff climb", act: "the keeper's notched staff is passed hand over hand up the file — the transfer is the staff climbing the line", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §4]}
    - {id: SEAM-05, name: "the mark", act: "the assistant cuts the new mark: a knot group on the cord before the E0/E1 seam, an incised mark on the keeper's board after it; held turns are marked as gaps, never as marks", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §4; historical-linguistics.md §6]}
    - {id: SEAM-06, name: "the mourning pause", act: "on a T5 death seam, one stage of mute: banners half-height, no formulas, no marks until the stage gate", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §4], costume_ref: "rite-bound dress belongs to 11-costumes (GAR- ids unassigned at write time)"}
    - {id: SEAM-07, name: "the recital", act: "the Keeper recites the era register with the new name last; the elders may correct an error, and a correction is entered as a correction, not a rewrite", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §3]}
  variants:
    - {id: SEAM-HALF, rule: "a summer-moot announcement takes effect at the closing descent: the tail is a half-turn (ART-01)", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §3]}
    - {id: SEAM-DAYS, rule: "a descent-assembly announcement takes effect at that close: the tail is a hand of days; the emergency T2/T5 form", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §3]}
    - {id: SEAM-FAILED, rule: "a formula not carried within three still dawns stays 'in the wind': no document may bear the new era name and the moot dates by 'the turn that waits'; a rival may read the wait as evidence that the moot has lost the wind", axis: wind, evidence: design-choice, follows: [ritual-liminality.md §6]}
    - {id: SEAM-REPEAT, rule: "an eating-storm triggers re-ratification, not a new era: the same formula is spoken again into still air and the register doubles the name, not the seam", axis: wind, evidence: design-choice, follows: [celestial-symbolism-calendars.md §7]}

# ===========================================================================
# DATING CONVENTIONS
# ===========================================================================
dating_conventions:
  id: DC
  follows: [era-periodization-models.md §2, §4, §5, §10, §13.6, §13.7; calendar-festival-systems.md §8, §9, §11.6; worldbible-integration-contract.md §7]
  rules:
    - {id: DC-01, formula: "<era name> <era turn>, the <descent ordinal> descent — the <climb ordinal> climb; <stage> of the ascent|descent; <gate or held state>", example: "Two Counts 5, the 103rd descent — the 99th climb; the high felts of the descent; still air", axis: neutral, coupling_note: "a notation convention", evidence: design-choice, follows: [calendar-festival-systems.md §9]}
    - {id: DC-02, double_number: "both ordinals are written: the descent count (continuous since the covenant, never reset at a seam) and the climb count (the world's counted climbs); the machinery survives era names while the count is the contested surface", axis: both, evidence: design-choice, follows: [era-periodization-models.md §1, §5]}
    - {id: DC-03, pre_register: "before the E0/E1 seam dates are knot groups plus the era turn; hearth generations date anything earlier, with the folk rule's error bars", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §10]}
    - {id: DC-04, borrowed_moon: "contracts with lowland towns carry the borrowed moon's month beside the D2 date; the road reopens at the salt opening (RIT-05) and the double-dated season runs from there", axis: neutral, coupling_note: "trade institution; the loan forms belong to 04-lexicon (TRQ-19, TRQ-20)", evidence: design-choice, follows: [calendar-festival-systems.md §1, §11.6]}
    - {id: DC-05, held_state: "no sale or oath may be dated inside held days; a document claiming a sale inside the still is void on its face and the parties may be fined at the next muster", axis: wind, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
    - {id: DC-06, herald_lag: "the era arrives at herald speed; each town holds whichever era its last herald brought, and 'the count is one, the hearing is many' keeps both correct", axis: neutral, coupling_note: "information speed, not a spine carrier", evidence: design-choice, follows: [era-periodization-models.md §4]}
    - {id: DC-07, two_counts: "in the literate anchor era a document's climb ordinal tells its author's faction: 99 (moot register) or 103 (restored count); the salt road writes both; a document that writes neither is dated by the descent and left unranked", axis: both, evidence: design-choice, follows: [era-periodization-models.md §5]}
    - {id: DC-08, epoch: "the covenant ascent is the epoch; a seam never resets the descent count", axis: verticality, evidence: design-choice, follows: [calendar-festival-systems.md §8]}
  worked_tests:
    - {id: DC-T1, task: "date a burnt winter shelter", method: "the board's mark places the fire in Bitter Smoke 3; the charred pole's notch groups match; the lowland ledger's salt delivery in the same season corroborates; the era name is attested only by later recital, so the caveat is recorded", axis: neutral, coupling_note: "a dating drill", evidence: design-choice, follows: [era-periodization-models.md §13.7]}
    - {id: DC-T2, task: "test a disputed contract", method: "the contract claims a sale dated inside the held days of D95; the board shows the gap; the smoke law voids it; the rival offers the seller's cord tally showing no salt moved", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §13.7]}
    - {id: DC-T3, task: "test an antiquarian find", method: "a strip bearing 'First Ascent 4' is offered as ancient felt: the mark was cut with the E1-era incising tool, the era name is absent from the recital register for that stratum, and the felt itself is late (textile testing belongs to 11-costumes)", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §13.7]}
  artifacts:
    - {id: ART-01, label: "the half-turn strip", detail: "'Salt Turn 42', the shortest turn in the register, cut at the Salt Turn / Long Storm seam and kept in a shelter; the period detail that outlives its era", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §4]}
    - {id: ART-02, label: "the keeper's board", detail: "the incised register carrying the literate era's marks and the four held-turn gaps; the primary evidence for the count dispute", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §4]}
    - {id: ART-03, label: "the double-dated salt tablet", detail: "an E1-era tablet with the descent ordinal and the borrowed moon's month; the required double-dated document", axis: neutral, coupling_note: "trade artifact; its forms belong to 10-records and 04-lexicon", evidence: design-choice, follows: [calendar-festival-systems.md §11.6]}
    - {id: ART-04, label: "the forged strip", detail: "DC-T3's find; anachronistic tool marks and an era name absent from the recital", axis: verticality, evidence: design-choice, follows: [era-periodization-models.md §13.7]}
    - {id: ART-05, label: "the single-turn banner", detail: "the E0 storm-era banner raised for one turn and taken down again; the object behind the Quiet Rule's minimum duration", axis: wind, evidence: design-choice, follows: [era-periodization-models.md §13.3]}

