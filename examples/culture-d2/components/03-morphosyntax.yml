revision: 1.1
revision_note: |
  Round-4 FIX: add morphology.derivation_rules with explicit regex/output pairs
  for the eight constructions used by 05-lexicon and 13-naming, so their spelling
  operations can be replayed without guessing affixes or deleting segments.
  Declare the two-base compound input and the remaining naming-input mismatch:
  the unchanged gate reads formation.stem, which 13 currently supplies as B1 only.
  Preserve the M-/SYN- records, paradigms, phonology authority and non-canon scope.
component: 03-morphosyntax
culture: D2
canon: not canonized (D2 design drill)
id: d2.03.morphosyntax
status: "round-3 component write; non-canon sample design; hands off to lore-shokunin (system and evidence only)"
producer_note: |
  kotodama-shokunin — D2 design drill (round 3), packet component 03.
  NON-CANON SAMPLE DESIGN. Every form, rule and institution below is invented for
  this exercise; no real culture is described and no canon is set. Real-world
  comparators are cited to corpus/knowledge entries only (path + section), never to
  outside scholarship. Record shape follows the contract in component 01-brief
  (contract.id_namespaces M-/SYN-, contract.record_fields, RG-01..RG-08).
  SPINE (shared seed): verticality (ascent/descent, high/low, seasonal poles) +
  wind (breath, soul-carrier, storm law). D1 imagery (river, binding/tying,
  alphabet) is refused; the seed's tally-knot record tech appears only as counting.
scope: "morphological type and synthesis/fusion indices, alignment, word order, nominal morphology, verb morphology, evidentiality, clause types"
packet_keys: [morphology, syntax]
contract_ref: "examples/culture-d2/components/01-brief.yml — contract.id_namespaces (M- = morphemes/paradigms/allomorphy, SYN- = clause constructions, evidentials, order rules); contract.record_fields.{morphology,syntax}; rules RG-01..RG-08"

spine_coupling:
  strongest:
    - {axis: verticality, records: [M-07, M-08, M-09, M-10, M-11, SYN-05], why: "the directional case set is the grammar of ascent and descent, and the fluid-S split makes storm-drift grammatically distinct from a chosen descent"}
    - {axis: wind, records: [SYN-08, SYN-09, SYN-11, M-25, M-26], why: "evidence felt on the air is a core evidential term; reported speech is 'carried by another's breath'; switch-reference is same-breath / other-breath"}
  d1_guard: "no river, water, tying, binding, knot, cord, or thread imagery in any record; 'knot' appears nowhere in this file. The one record technology named (tally) is counting (seed-level), not an obligation metaphor (brief D1B-02, RG-01)."
  neutral_records_rule: "records marked axis: neutral carry a coupling_note; they are number, possession-class, person and loan-adaptation machinery, which stay out of the spine by design (RG-05)"

deps:
  - {component: 02-phonology, field: "contract.record_fields.phonology (P- records) + interface P-D2-PHON 1.0.0-drill", ids: [P-D2-PHON, AC-1, AC-2, AC-3, AC-4, AC-5, AC-6, AC-7, CX-1], status: "DELIVERED and ADOPTED 2026-10-17 (02-phonology interface.adoption_decision); every form in this file re-checked legal against the delivered inventory and phonotactics", need: "closed — inventory, template, coda set and accent rules are now cited by rule id; A-03 check 6 can be met"}
  - {component: 05-lexicon, field: "contract.record_fields.lexicon + L- records", ids: ["UNRESOLVED (assembly finding per RG-04)"], need: "L- ids for the stems this file uses in its paradigms (herd, winter shelter, high pasture, wind, ascend, descend, drive, stay, turn); only the PRE- refs below are used here"}
  - {component: 09-eras, field: "contract.era_tags (E0/E1/E2)", ids: ["E0", "E1", "E2"], need: "era tags are used as fixed by the contract; era names and dates belong to 09"}

phonology_interface:
  delivered_id: "P-D2-PHON, version 1.0.0-drill (examples/culture-d2/components/02-phonology.yml)"
  adoption: "ADOPTED with no deltas; this component consumes the interface and states no phonology of its own (RG-03)"
  inventory_used: "consonants p t k b d g m n s ʃ r l j w h; vowels a e i o u; template (C)V(C); coda set {n l r s}; no onset clusters, no geminates, no contrastive length; pitch accent, 2 levels, lexical tone 0"
  check_run: "all stems and suffixes in this file re-read against the delivered inventory and template on 2026-10-17: no violations. 02's own reconcile_for_03 note confirms the placeholder letters were legal, that adding p b d g ʃ j changes none of the listed stems (tamu, hani, iru, hewa, nera-), and that no structural rule here depends on a segment value"
  accent_usage: "this file uses only two accent facts, both licensed by 02: the inherited-noun plural rightward shift (AC-4, which names this rule as 03's N3/M-03) and the mirative rightward shift (AC-4, naming MIR1/SYN-16). Every other suffix is accent-transparent, exactly as AC-4 requires"
  id_alias: "02 cites this file's pre-contract ids: N3 = M-03 (inherited-noun plural, hani > haní) and MIR1 = SYN-16 (mirative). Old numbers map N-/V- -> M-, C-/EV- -> SYN-, F- -> CIT-; the M-/SYN- ids are the binding ones"
  romanization_policy: "RG-07 — one romanization, used consistently; acute marks only the contrastive accent, one mark per word, no other diacritics; 02's sample pair is sara [sára] valley-locus vs sara [sará] ridge-locus"
  structural_claim_only: "the claims that bind are structural: morpheme order, category values, which core term is unmarked in which clause type, the accent behaviour, and the clause-type inventory"

preview_stems:
  note: "PRE- refs are provisional handles for readability only; they are not L- records and claim no lexicon id (RG-03, RG-04). Each form was checked legal against the delivered P-D2-PHON inventory and template on 2026-10-17"
  stems:
  - {id: PRE-01, term: tamu, gloss: "herd (of animals)", class: "A (portable)"}
  - {id: PRE-02, term: hani, gloss: "winter valley shelter", class: "B (inherited: kin, shelters, pasture rights)"}
  - {id: PRE-03, term: iru, gloss: "summer high pasture", class: "B"}
  - {id: PRE-04, term: hewa, gloss: "wind", class: "A"}
  - {id: PRE-05, term: nera-, gloss: "go / move up", class: "fluid-S verb"}
  - {id: PRE-06, term: muka-, gloss: "go / move down", class: "fluid-S verb"}
  - {id: PRE-07, term: so-, gloss: "drive (livestock)", class: "causative base (V-rule M-20)"}
  - {id: PRE-08, term: kura-, gloss: "stay, remain", class: "posture verb"}
  - {id: PRE-09, term: weri-, gloss: "turn (of the wind)", class: "weather verb"}

follows:
  # The corpus decision tables this component is built on. Paths are repo-relative.
  - {id: CIT-01, cite: "corpus/knowledge/linguistics/morphological-typology.md §1 (the two axes)", use: "synthesis and fusion are stated separately, as gradients, not as one type label"}
  - {id: CIT-02, cite: "corpus/knowledge/linguistics/morphological-typology.md §3 (typology cost sheet; marking locus corollary)", use: "agglutinative commitments accepted (suffix chains, droppable arguments, lay word-coinage); marking locus set with typology"}
  - {id: CIT-03, cite: "corpus/knowledge/linguistics/morphological-typology.md §4 (process catalog)", use: "suffixing dominance (WALS 26A), reduplication, grammatical accent (Somali ínan/inán, Saeed 1999), fossil alternation as a lost suffix"}
  - {id: CIT-04, cite: "corpus/knowledge/linguistics/morphological-typology.md §9 (diachrony: the typology wheel)", use: "the language is placed at a dated wheel position; today's morphology is yesterday's syntax (Givón 1971; Hopper & Traugott 2003)"}
  - {id: CIT-05, cite: "corpus/knowledge/linguistics/morphological-typology.md §10 (calibration)", use: "no typology-to-culture ranking; no pure types; complexity written consciously, not compensated (McWhorter 2001)"}
  - {id: CIT-06, cite: "corpus/knowledge/linguistics/morphological-typology.md §11 (application protocol, steps 1–6)", use: "index numbers, 3–5 processes with ≥1 non-affixal, mechanical consequences, full paradigm + sentence family, incantation register note"}
  - {id: CIT-07, cite: "corpus/knowledge/linguistics/syntax-typology.md §1 (order + companions)", use: "one dominant order + harmonic sweep (Greenberg U2/U5; adjective position weakest); no free order with thin morphology (Comrie 1989)"}
  - {id: CIT-08, cite: "corpus/knowledge/linguistics/syntax-typology.md §2 (alignment)", use: "aspect split as trigger (Dixon 1994: Hindi-Urdu, Georgian, Tibetan); fluid-S volition split (Merlan 1985: Lakhota, Guaraní, Choctaw); pivot stated apart from case"}
  - {id: CIT-09, cite: "corpus/knowledge/linguistics/syntax-typology.md §3 (relatives and embedding)", use: "internally-headed relatives for a testimony-driven oral culture (Navajo, Lakhota; Williamson 1987); center-embedding ceiling (Karlsson 2007)"}
  - {id: CIT-10, cite: "corpus/knowledge/linguistics/syntax-typology.md §4 (what syntax betrays)", use: "evidential sizing 2–5 terms against the information economy (Willett 1988; Aikhenvald 2004; Faller 2002; Fleck 2007); mirativity (DeLancey 1997); prophecy as marked reported speech"}
  - {id: CIT-11, cite: "corpus/knowledge/linguistics/syntax-typology.md §6 (consistency checklist 1–8)", use: "build order and review axes: order/sweep, order-vs-morphology trade-off, alignment+split+pivot, RC strategy+ceiling, evidential sizing, social deixis, areal layer, handoff note"}
  - {id: CIT-12, cite: "corpus/knowledge/linguistics/phonetics-phonology.md §6 (prosody typology)", use: "pitch accent distinguished from tone and stress (Hyman 2006); grammar may ride accent"}
  - {id: CIT-13, cite: "corpus/knowledge/synthesis/conlang-blueprint-template.md §3–§4 (fill-in contract)", use: "synthesis/segmentation/processes/alignment/marking locus/categories filled; paradigms and the ten test situations; Leipzig-style glossing, `-` morphemes, `=` clitics (Bickel, Comrie & Haspelmath 2015)"}

morphology:
  type: "agglutinative, predominantly suffixing; transparent one-function-per-affix chains, with two along-side processes (accent shift, reduplication)"
  alignment: "aspect-split: ergative-absolutive in the perfective (agent M-05), nominative-accusative in the imperfective (patient M-06); plus a fluid-S micro-class in vertical-motion verbs (SYN-05)"
  word_order: SOV
  synthesis_index: {value: "target 2.0–2.5 morphemes per word on running text", method: "Greenberg 1960 counting method (CIT-01); provisional figure from the chains below (verbs average ~4 morphemes, nouns ~2)", status: "design target, not a measurement (CIT-05)"}
  fusion_index: {value: "0 portmanteau exponents: one function per form across the 26 paradigm forms and the 56 M-/SYN- records of this file", exception: "the accent-shift plural (M-03) is a residual fusion, labelled a fossil (CIT-03)", status: "counted over this file only; not a whole-language index"}
  wheel_position: {label: "early agglutinative; postpositional relators still recognizable as former landscape nouns in the sacred register (M-11 note)", era: "E0 (pre-script) into the E0/E1 seam (script arrives by adaptation from the lowland trade partner); tags fixed by contract, names/dates owned by component 09", follows: [CIT-04]}
  marking_locus: {primary: "dependent (case and relator suffixes on nominals)", secondary: "one topic-person index on the verb (head-marking-lite); no object agreement, no noun-class agreement", note: "locus set with the typology corollary, not left random (CIT-02)"}
  derivation_contract:
    source: "05-lexicon.yml constructions and derivation_tests; 13-naming.yml names[].formation; these construction IDs are spelling adapters, not additional M-/SYN- records"
    input_templates: {unary: "{B1}", binary: "{B1}+{B2}"}
    serialization: "B1 and B2 are the ordered citation spellings in bases; a unary input is bases[0], a binary input is '+'.join(bases). The plus is analysis only, never part of the derived word. A gate-facing formation.stem must contain that complete serialized input."
    replay: "Use Python re.fullmatch(rule.pattern, input), reject a non-match, then rule.output.format(**match.groupdict()). Input spellings are NFC lowercase; output preserves the captured letters, including written accent, without deletion, assimilation or a hidden linking segment."
    domain: "Apply only to bases licensed by 05's noun classes, selection restrictions, productivity and available_from stage; spelling regexes do not replace those checks. 02 retains authority over phonotactics and accent. The current derivation witnesses have no accent-marked bases; combining two contrastive accent peaks is not specified by these adapters."
    ordering: "A derived noun becomes STEM in M-01 before plural and case. Lexical LOC -ra is homophonous with PL M-02, not a replacement for it; SPIRIT -ir is distinct from the summer locative M-10. Rule IDs, not suffix shape alone, distinguish these functions."
    excluded_routes: "05's gas > kas and bher > per are loan-layer substitutions, not these derivations; L-32 tolsa is explicitly lexicalized/noncompositional, so no productive -sa is invented."
    unresolved:
    - "13 currently supplies only B1 as formation.stem for NM-01..NM-08, although bases contains both inputs. Gate C reads stem only, so the unchanged naming records remain DERIV-REPLAY findings with the binary rule below. In particular, the same stem su cannot yield both sunel and sulas under one deterministic UP-COMPOUND rule; both bases must reach the applier."
    - "05's AGENT description excludes mass bases, while its held-out pal > palin test admits the salt base. The spelling pair below reproduces the prediction but does not decide that eligibility discrepancy; lexical-owner review remains required."
  derivation_rules:
  - id: LOC
    kind: suffix
    affix: "-ra"
    gloss: "place or span of B1"
    base_classes: [noun]
    output_class: noun
    productivity: productive
    available_from: E0
    selection: "05 LOC: exclude r-final bases; the regex enforces that boundary exclusion rather than generating rr or deleting a consonant"
    pattern: "^(?!.*r$)(?P<B1>[a-záéíóú]+)$"
    output: "{B1}ra"
    source: "05-lexicon.yml constructions.LOC; L-11 sin > sinra, L-39 gen > genra"
  - id: AGENT
    kind: suffix
    affix: "-in"
    gloss: "keeper or taker of B1"
    base_classes: [noun]
    output_class: noun
    productivity: restricted
    available_from: E0
    selection: "05 AGENT: herd, pasture, land, war-band and lineage bases; ir, su and wal excluded; the pal diagnostic discrepancy is retained in derivation_contract.unresolved"
    pattern: "^(?P<B1>[a-záéíóú]+)$"
    output: "{B1}in"
    source: "05-lexicon.yml constructions.AGENT; L-23 ral > ralin, L-36 las > lasin, L-37 bel > belin, L-40 gen > genin"
  - id: SPIRIT
    kind: suffix
    affix: "-ir"
    gloss: "breath of B1"
    base_classes: [noun]
    output_class: noun
    productivity: restricted
    available_from: E0
    selection: "05 SPIRIT: wind-working terms of the sacred stratum only"
    pattern: "^(?P<B1>[a-záéíóú]+)$"
    output: "{B1}ir"
    source: "05-lexicon.yml constructions.SPIRIT; L-30 bel > belir, L-31 hur > hurir"
  - id: WIND
    kind: suffix
    affix: "-su"
    gloss: "wind associated with place or slope B1"
    base_classes: [noun]
    output_class: noun
    productivity: productive
    available_from: E1
    selection: "05 WIND: place and slope bases, not abstract ir; available only from the E1 standardization"
    pattern: "^(?P<B1>[a-záéíóú]+)$"
    output: "{B1}su"
    source: "05-lexicon.yml constructions.WIND and derivation_tests; L-12 bel > belsu"
  - id: MATRI-SIDE
    kind: suffix
    affix: "-ter"
    gloss: "opposite-sex sibling of parent B1"
    base_classes: [noun]
    output_class: noun
    productivity: restricted
    available_from: E0
    selection: "05 MATRI-SIDE: parent kin bases nen and wen only; both are captured without truncation"
    pattern: "^(?P<B1>nen|wen)$"
    output: "{B1}ter"
    source: "05-lexicon.yml constructions.MATRI-SIDE and derivation_tests; L-07 nen > nenter"
  - id: UP-COMPOUND
    kind: compound
    gloss: "B1 qualifies B2; modifier before head"
    base_classes: [noun, noun]
    output_class: noun
    productivity: productive
    available_from: E0
    selection: "05 UP-COMPOUND: two noun bases in their recorded order; no inference of B2 from B1 or from the target name"
    pattern: "^(?P<B1>[a-záéíóú]+)[+](?P<B2>[a-záéíóú]+)$"
    output: "{B1}{B2}"
    source: "05-lexicon.yml constructions.UP-COMPOUND: L-28 pal+kor > palkor, L-33 su+wal > suwal; 13-naming.yml NM-01..NM-08"
  - id: PROCESS
    kind: suffix
    affix: "-ur"
    gloss: "work B1 into keepable form"
    base_classes: [noun]
    output_class: verb
    productivity: restricted
    available_from: E0
    selection: "05 PROCESS: foodstuff and material bases only; kin and abstract bases excluded"
    pattern: "^(?P<B1>[a-záéíóú]+)$"
    output: "{B1}ur"
    source: "05-lexicon.yml constructions.PROCESS and derivation_tests; L-24 tas > tasur"
  - id: GARMENT
    kind: suffix
    affix: "-ken"
    gloss: "wrap made of material B1"
    base_classes: [noun]
    output_class: noun
    productivity: restricted
    available_from: E0
    selection: "05 GARMENT: fiber and hide bases only"
    pattern: "^(?P<B1>[a-záéíóú]+)$"
    output: "{B1}ken"
    source: "05-lexicon.yml constructions.GARMENT; L-35 mir > mirken"
  records:
  - {id: M-01, form: "STEM(-PL)(-CASE)", gloss: "noun chain: stem, then number, then case", function: "the only nominal order; number inside case", stage: "E0", axis: neutral, coupling_note: "chain order is structural machinery; it carries no spine content", evidence: "design-choice", follows: [CIT-02, CIT-03]}
  - {id: M-02, form: "-ra", gloss: "PL (Class A: animals, portable things, all loans)", function: "general plural", stage: "E0", axis: neutral, coupling_note: "number marking is not spine-bearing by design", evidence: "design-choice", follows: [CIT-03]}
  - {id: M-03, form: "hani > haní (accent shifts right, no suffix)", gloss: "PL (Class B: kin terms, shelters, pasture rights)", function: "inherited-class plural; fossil of a lost plural suffix; licensed as a rightward accent shift by 02's AC-4, which names this rule (hani to haní)", stage: "E0", axis: neutral, coupling_note: "pitch-coupled, not spine-coupled: it belongs to 02's accent system (A-03 non-affixal requirement met here)", evidence: "design-choice (umlaut-type fossil per CIT-03); interface: P-D2-PHON AC-4", follows: [CIT-03, CIT-12]}
  - {id: M-04, form: "-ni", gloss: "GEN / affiliation (prenominal)", function: "possessor or affiliation, incl. affiliation to a lineage or pasture", stage: "E0", axis: verticality, evidence: "design-choice", follows: [CIT-07]}
  - {id: M-05, form: "-si", gloss: "AGT/ERG: A of a perfective clause", function: "names the responsible party in closed events", stage: "E0", axis: neutral, coupling_note: "alignment machinery; its split trigger (aspect) is the spine-laden part (M-18, M-19)", evidence: "design-choice (aspect-split ergative per CIT-08)", follows: [CIT-08]}
  - {id: M-06, form: "-tu", gloss: "ACC: P of an imperfective clause", function: "marks the affected object of open events", stage: "E0", axis: neutral, coupling_note: "alignment machinery (see M-05)", evidence: "design-choice", follows: [CIT-08]}
  - {id: M-07, form: "-ku", gloss: "ALL: goal, and the UNSLOPE term", function: "unmarked direction, generalized from the ascent route; any upland goal", stage: "E0", axis: verticality, evidence: "design-choice", follows: [CIT-06, CIT-08]}
  - {id: M-08, form: "-mu", gloss: "ALL: goal, and the DOWNSLOPE term", function: "downhill goal must be marked; the marked direction", stage: "E0", axis: verticality, evidence: "design-choice", follows: [CIT-06]}
  - {id: M-09, form: "-an", gloss: "LOC: winter valley shelter (down, enclosed)", function: "locative sited by the winter pole", stage: "E0", axis: verticality, evidence: "design-choice", follows: [CIT-06]}
  - {id: M-10, form: "-ir", gloss: "LOC: summer high pasture (up, open)", function: "locative sited by the summer pole", stage: "E0", axis: verticality, evidence: "design-choice", follows: [CIT-06]}
  - {id: M-11, form: "-wa", gloss: "TRAVERSE: along a contour, keeping altitude", function: "the sidehill route; also a meeting between camps that keeps neither party uphill; its shape is a former landscape noun retained in the sacred register", stage: "E0", axis: verticality, evidence: "design-choice (grammaticalization from a landscape noun per CIT-04)", follows: [CIT-04, CIT-06]}
  - {id: M-12, form: "-na", gloss: "INALIENABLE possessive: kin, body, breath, pasture right", function: "what cannot be sold out of the line", stage: "E0", axis: neutral, coupling_note: "possession classes are institutional machinery; WHAT is inalienable (pasture right, shelter) is the spine's doing", evidence: "design-choice", follows: [CIT-03]}
  - {id: M-13, form: "-ha", gloss: "ALIENABLE possessive: herd, gear, trade goods", function: "what can be sold or given; the suffix that drops in fast speech", stage: "E0", axis: neutral, coupling_note: "see M-12", evidence: "design-choice", follows: [CIT-03]}
  - {id: M-14, form: "na- (1sg), sa- (2sg), zero (3sg)", gloss: "bound pronouns, possessive and person", function: "no free possessive pronouns exist", stage: "E0", axis: neutral, coupling_note: "person machinery; the inclusive/exclusive split (M-15) carries the institutional content", evidence: "design-choice", follows: [CIT-02]}
  - {id: M-15, form: "1pl inclusive -ra (lineage) vs 1pl exclusive (camp)", gloss: "we-of-the-pasture-right vs we-here-now", function: "the inclusive set is the lineage that holds the pasture right; the exclusive set is whoever is present", stage: "E0", axis: verticality, evidence: "design-choice", follows: [CIT-02]}
  - {id: M-16, form: "su-", gloss: "logophoric 'the person whose speech is reported'", function: "keeps a quoted speaker distinct from the reporter (Culy 1994 pattern)", stage: "E0", axis: wind, evidence: "design-choice (logophor per CIT-10)", follows: [CIT-10]}
  - {id: M-17, form: "STEM(-DERIV)(-ASPECT)(-PERSON)(-EVID)", gloss: "verb chain; evidential outermost", function: "the last sound of the clause carries how it was known", stage: "E0", axis: wind, evidence: "design-choice", follows: [CIT-02, CIT-10]}
  - {id: M-18, form: "-ka", gloss: "PERF: a closed, counted event", function: "pasture year tallied, drive finished, trade closed; the winter count seals it", stage: "E0", axis: both, evidence: "design-choice", follows: [CIT-08, CIT-04]}
  - {id: M-19, form: "-ne", gloss: "IPFV: an open, ongoing or habitual event", function: "moving, grazing, a route in progress; the ascent opens the year", stage: "E0", axis: both, evidence: "design-choice", follows: [CIT-08]}
  - {id: M-20, form: "-so", gloss: "CAUS / LEAD (so- 'drive' + nera- 'go up' > nera-so- 'drive up')", function: "the herding derivation", stage: "E0", axis: verticality, evidence: "design-choice", follows: [CIT-03]}
  - {id: M-21, form: "-li", gloss: "MIDDLE (the subject acts on itself or its own herd)", function: "self-directed action; preferred in oath and incantation", stage: "E0", axis: neutral, coupling_note: "voice machinery; its ritual preference is a register fact (R-01), not a spine claim", evidence: "design-choice", follows: [CIT-03]}
  - {id: M-22, form: "-na (1), -sa (2), zero (3); plural -ra", gloss: "one person index on the verb", function: "drops with a full topic noun present", stage: "E0", axis: neutral, coupling_note: "person machinery", evidence: "design-choice", follows: [CIT-02]}
  - {id: M-23, form: "-lu", gloss: "NEG (in the aspect slot)", function: "declarative negation scoping over the event; the evidential still says how the negated event was known", stage: "E0", axis: neutral, coupling_note: "polarity machinery", evidence: "design-choice", follows: [CIT-10]}
  - {id: M-24, form: "ma=", gloss: "PROHIBITIVE proclitic + imperative form", function: "prohibition is formally distinct from assertion negation (blueprint test T7)", stage: "E0", axis: neutral, coupling_note: "polarity machinery; note the clitic/suffix contrast with M-23", evidence: "design-choice", follows: [CIT-13]}
  - {id: M-25, form: "-hi", gloss: "medial verb: SAME BREATH (next clause, same actor)", function: "scene hand-off without changing actor", stage: "E0", axis: wind, evidence: "design-choice (switch-reference per CIT-09)", follows: [CIT-09, CIT-10]}
  - {id: M-26, form: "-ha", gloss: "medial verb: OTHER BREATH (next clause, different actor)", function: "scene hand-off with a new actor", stage: "E0", axis: wind, evidence: "design-choice", follows: [CIT-09]}
  - {id: M-27, form: "-nu", gloss: "nominalizer for internally-headed relatives", function: "makes the clause a noun ('the one who / that')", stage: "E0", axis: neutral, coupling_note: "relative-clause machinery; the strategy choice (SYN-23) is the genre-facing part", evidence: "design-choice", follows: [CIT-09]}

syntax:
  order_rules:
  - {id: SYN-01, construction: "neutral main clause", order: "SOV, verb final", example: "Tamu nera-ka-se.", gloss: "herd go.up-PFV-SEEN 'the herd went up — I saw it'", stage: "E0", axis: neutral, coupling_note: "constituent order is structural; the spine is carried by case and evidentials, not by order", evidence: "design-choice", follows: [CIT-07]}
  - {id: SYN-02, construction: "harmonic sweep of the verb-final package", order: "postpositions; GEN before N; RC before N; adjective before N (weakest correlation, noted); numeral before N; manner adverb before V; auxiliary final", example: "iru-ni hewa", gloss: "high.pasture-GEN wind 'the wind of the high pasture'", stage: "E0", axis: neutral, coupling_note: "order machinery", evidence: "design-choice (Greenberg U2/U5 per CIT-07)", follows: [CIT-07, CIT-11]}
  - {id: SYN-03, construction: "topic fronting", order: "topic before S, unmarked", example: "Tamu, iru-ku nera-ka-se.", gloss: "herd high.pasture-ALL.UP go.up-PFV-SEEN 'the herd — it went up to the pasture, I saw'", stage: "E0", axis: neutral, coupling_note: "information structure; licensed by context, never free scrambling — the language may not have both free order and thin morphology (Comrie 1989)", evidence: "design-choice", follows: [CIT-07, CIT-11]}
  - {id: SYN-04, construction: "alignment: aspect split", order: "perfective marks A with -si (M-05), P bare; imperfective marks P with -tu (M-06), A bare; S is not core-marked, except inside the fluid-S micro-class (SYN-05)", example: "nera-ka-si tamu muka-ka.", gloss: "go.up-PFV-AGT herd go.down-PFV 'the one who went up brought the herd down'", stage: "E0", axis: neutral, coupling_note: "the trigger (closed vs open event) is the spine-laden part: see M-18/M-19", evidence: "design-choice (aspect-split ergative per CIT-08)", follows: [CIT-08]}
  - {id: SYN-05, construction: "fluid-S micro-class on vertical-motion and storm-driven verbs", order: "inside this micro-class only, S takes the agentive -si or the patientive -tu (the M-05/M-06 markers reused) by the speaker's choice", example: "nera-ka-si vs nera-ka-tu", gloss: "go.up-PFV-AGENTIVE.S 'she climbed (her own decision)' vs go.up-PFV-PATIENTIVE.S 'she was carried up (storm-driven)'", stage: "E0", axis: both, evidence: "design-choice (fluid-S per CIT-08)", follows: [CIT-08]}
  - {id: SYN-06, construction: "ellipsis pivot", order: "omitted argument tracks S/A across medial runs and coordination", example: "Nera-so-ka-hi, kura-ka-se.", gloss: "go.up-CAUS-PFV-SS.SAME stay-PFV-SEEN 'she drove them up, and [she] stayed'", stage: "E0", axis: neutral, coupling_note: "pivot machinery; stated apart from case marking as the checklist requires", evidence: "design-choice: morphologically ergative, syntactically accusative (S/A pivot) — flagged, not presented as a default", follows: [CIT-08, CIT-11]}
  evidentials:
  - {id: SYN-07, construction: "evidence slot", order: "outermost verb suffix in every declarative; obligatorily chosen; absent in imperative and prohibitive", example: "nera-ka-ti", gloss: "go.up-PFV-TRACED 'by the tracks, it went up'", stage: "E0", axis: wind, evidence: "design-choice; the imperative gap is (to-verify) against Aikhenvald 2004 (CIT-10)", follows: [CIT-10]}
  - {id: SYN-08, construction: "EV1 -se: seen", order: "evidence gathered by the speaker's own eyes, typically from open high ground", example: "nera-ka-se", gloss: "go.up-PFV-SEEN", stage: "E0", axis: verticality, evidence: "attested-comparator (the 'visual' term; Tariana, CIT-10)", follows: [CIT-10]}
  - {id: SYN-09, construction: "EV2 -he: felt on the air", order: "heard, smelled or felt through the wind", example: "muka-ka-he", gloss: "go.down-PFV-AIR 'I heard/felt them come down'", stage: "E0", axis: wind, evidence: "attested-comparator (the 'nonvisual' term covers hearing/smell in Tariana, CIT-10); the wind framing is D2 design", follows: [CIT-10]}
  - {id: SYN-10, construction: "EV3 -ti: traced", order: "inferred from physical signs the speaker examined (tracks, droppings, bent grass, salt crust, smoke)", example: "nera-ka-ti", gloss: "go.up-PFV-TRACED", stage: "E0", axis: verticality, evidence: "attested-comparator (the 'inferred' term; Willett 1988, CIT-10)", follows: [CIT-10]}
  - {id: SYN-11, construction: "EV4 -mo: carried by breath", order: "reported speech; the claim reached the speaker as another person's utterance", example: "nera-ka-mo", gloss: "go.up-PFV-REPORTED 'they say it went up'", stage: "E0", axis: wind, evidence: "attested-comparator (the 'reported' term; Turkish -mIş, CIT-10)", follows: [CIT-10]}
  - {id: SYN-12, construction: "EV5 -no: star-witnessed (ritual register only)", order: "available to authorized sky-readers, in oath and incantation; never in ordinary speech", example: "Tamu-na nera-ka-no.", gloss: "herd-1SG.INAL go.up-PFV-STAR 'by the star-witness: my herd went up'", stage: "E0", axis: both, evidence: "design-choice; register-restricted fifth term at the ceiling of Aikhenvald 2004's 2–5 scale — (to-verify)", follows: [CIT-10]}
  - {id: SYN-13, construction: "testimony norm", order: "assembly and hearing statements require a source-marked verb; a wrong evidential is treated as lying", example: "reported claim with -se is challenged as false witness", gloss: "—", stage: "E0", axis: wind, evidence: "attested-comparator (Tariana sanction; Matses, CIT-10)", follows: [CIT-10]}
  - {id: SYN-14, construction: "trade-register price formula", order: "salt and dried-meat prices stay EV4 for a year: a home speaker cannot have seen the lowland price", example: "saka ... -mo", gloss: "the salt [price] is carried by breath (reported)", stage: "E0", axis: neutral, coupling_note: "trade institution; the evidential choice is the mechanism, the economy is not spine-bearing", evidence: "design-choice", follows: [CIT-10]}
  - {id: SYN-15, construction: "prophecy", order: "ritual-register reported speech: the sky-reader reports what the sky says; the claim never takes EV1", example: "—", gloss: "—", stage: "E0", axis: wind, evidence: "attested-comparator pattern (prophecy as marked reported speech, CIT-10)", follows: [CIT-10]}
  - {id: SYN-16, construction: "mirative contour (prosodic only)", order: "the licensed rightward accent shift of 02's AC-4 (naming this rule as MIR1/SYN-16), realised as the final rise; no separate mirative suffix exists, so nothing is double-marked against 02", example: "nera-ka-sé", gloss: "go.up-PFV-SEEN 'it went up! (astonishment; the speaker was not watching the signs)'", stage: "E0", axis: wind, evidence: "design-choice: DeLancey 1997 documents mirativity as a grammatical category; the prosodic realisation is D2 design, licensed by interface P-D2-PHON AC-4 — (to-verify)", follows: [CIT-10, CIT-12]}
  clause_types:
  - {id: SYN-17, construction: "declarative", order: "SOV, evidential obligatory", example: "Tamu nera-ka-se.", gloss: "herd go.up-PFV-SEEN", stage: "E0", axis: neutral, coupling_note: "clause-type machinery", evidence: "design-choice", follows: [CIT-11]}
  - {id: SYN-18, construction: "yes-no question", order: "clause-final clitic =le; order unchanged", example: "Tamu nera-ka-se=le?", gloss: "herd go.up-PFV-SEEN=Q 'did the herd go up, as you saw?'", stage: "E0", axis: neutral, coupling_note: "clause-type machinery", evidence: "design-choice", follows: [CIT-11]}
  - {id: SYN-19, construction: "content question", order: "question word in situ; the questioned constituent may be fronted by the SYN-03 machinery, but its lexical accent does not move — 02's AC-7 permits no peak movement outside AC-4; no =le", example: "Tamu nera-ka-se ... ?", gloss: "herd go.up-PFV-SEEN 'the herd went up — WHEN?' (question word, peak unmoved)", stage: "E0", axis: neutral, coupling_note: "clause-type machinery", evidence: "design-choice; constrained by interface P-D2-PHON AC-7", follows: [CIT-11, CIT-12]}
  - {id: SYN-20, construction: "echo question", order: "the clause is repeated; the disbelief reading uses the mirative shift (AC-4, SYN-16), never an independent accent rule; evidential copied from the quoted clause", example: "Nera-ka-sé?", gloss: "go.up-PFV-SEEN 'it went up?! (quoting, mirative shift)'", stage: "E0", axis: neutral, coupling_note: "clause-type machinery", evidence: "design-choice; constrained by interface P-D2-PHON AC-7", follows: [CIT-12]}
  - {id: SYN-21, construction: "imperative", order: "bare stem + person, no evidential", example: "Iru-ku nera-sa!", gloss: "high.pasture-ALL.UP go.up-2 'go up to the pasture!'", stage: "E0", axis: neutral, coupling_note: "clause-type machinery", evidence: "design-choice", follows: [CIT-13]}
  - {id: SYN-22, construction: "prohibitive", order: "ma= + imperative form", example: "Ma muka-sa!", gloss: "PROHIB go.down-2 'do not go down!'", stage: "E0", axis: neutral, coupling_note: "clause-type machinery; formally distinct from assertion negation (T7)", evidence: "design-choice", follows: [CIT-13]}
  - {id: SYN-23, construction: "conditional", order: "medial perfective + other-breath -ha, then main clause; no subordinating conjunction", example: "Hewa weri-ka-ha, tamu nera-so-ka-se.", gloss: "wind turn-PFV-DS herd go.up-CAUS-PFV-SEEN 'the wind turned, and then she drove the herd up — I saw it'", stage: "E0", axis: wind, evidence: "design-choice", follows: [CIT-09, CIT-10]}
  - {id: SYN-24, construction: "reported speech / complement", order: "quotative clitic =ko on the quoted clause; logophoric su- (M-16) for the quoted speaker; outer verb takes EV4", example: "su-nera-ka=ko ... -mo", gloss: "'that he went up' — quoted with the logophoric, reported with EV4", stage: "E0", axis: wind, evidence: "design-choice (logophor per Culy 1994, CIT-10)", follows: [CIT-10]}
  - {id: SYN-25, construction: "relative clause", order: "internally-headed is the primary strategy: the head noun stays inside the clause and the clause is nominalized with -nu (M-27); a prenominal gapped relative is licensed for subjects only (highest position on the Keenan–Comrie hierarchy)", example: "tamu nera-ka-nu", gloss: "herd go.up-PFV-NMLZ 'the one who took the herd up'", stage: "E0", axis: neutral, coupling_note: "the strategy is chosen for a testimony-driven oral genre, which is the coupling; the machinery itself is neutral", evidence: "design-choice (internally-headed relatives per Williamson 1987, CIT-09)", follows: [CIT-09]}
  - {id: SYN-26, construction: "clause chaining", order: "medial verbs mark same-breath -hi / other-breath -ha; recitation marks every scene hand-off", example: "Nera-so-ka-hi, kura-ka-se.", gloss: "go.up-CAUS-PFV-SS stay-PFV-SEEN", stage: "E0", axis: wind, evidence: "design-choice (switch-reference per Stirling 1993, CIT-09)", follows: [CIT-09]}
  - {id: SYN-27, construction: "existential and possession predicate", order: "zero copula; existence and possession are one construction, the possessed noun taking -ha (M-13) or -na (M-12); negation via M-23", example: "Hani-na=... -lu-se", gloss: "winter.shelter-1SG.INAL NEG-SEEN 'I have no shelter — I saw there is none'", stage: "E0", axis: neutral, coupling_note: "predicate machinery", evidence: "design-choice", follows: [CIT-13]}
  - {id: SYN-28, construction: "embedding ceiling", order: "constraint, not a construction: no order of its own", example: "—", gloss: "—", rule: "one level of center-embedding in ordinary speech; two only in the incantation register, where it is flagged as artificial (Karlsson 2007 ceiling)", stage: "E0", axis: neutral, coupling_note: "processing limit, not a spine claim", evidence: "attested-comparator (CIT-09)", follows: [CIT-09]}
  - {id: SYN-29, construction: "social deixis", order: "constraint, not a construction: no order of its own", example: "—", gloss: "—", rule: "no grammatical honorific system is designed in the core morphology; deference runs through address terms (component 14), register recitation (component 15) and the rank rules (component 12). The only rank-sensitive morphology here is the ritual evidential EV5 (SYN-12) and the person privilege in fluid-S (SYN-05, first and second person are presumed to have chosen the route)", stage: "E0", axis: verticality, evidence: "design-choice; social deixis must be aligned with the costume/rank system per CIT-11 item 6", follows: [CIT-11]}

alignment_block:
  system: "aspect split + fluid-S micro-class"
  split_trigger: "clause aspect: perfective vs imperfective (M-18, M-19, SYN-04)"
  fluid_s_meaning: "agentive = the subject moved by its own decision; patientive = the subject was moved, carried or driven"
  legal_note: "a hearing about a winter loss asks the fluid-S pair: did she go down (agentive) or was she brought down (patientive)? Negligence and storm-drift are formally distinct"
  pivot: "S/A (SYN-06); morphologically ergative in the perfective, syntactically accusative"

paradigm:
  noun_worked:
    lexeme: "tamu 'herd' (Class A, PRE-01)"
    forms:
    - {form: tamu, gloss: "herd-SG (citation; absolutive/nominative)"}
    - {form: tamura, gloss: "herd-PL"}
    - {form: tamusi, gloss: "herd-AGT (A of a perfective clause)"}
    - {form: tamurasi, gloss: "herd-PL-AGT"}
    - {form: tamutu, gloss: "herd-ACC (P of an imperfective clause)"}
    - {form: tamuratu, gloss: "herd-PL-ACC"}
    - {form: tamuni, gloss: "herd-GEN (a lineage's herd)"}
    - {form: tamuku, gloss: "herd-ALL.UP"}
    - {form: tamumu, gloss: "herd-ALL.DOWN"}
    - {form: tamuan, gloss: "herd-LOC.WINTER (with the herd at the shelter)"}
    - {form: tamuir, gloss: "herd-LOC.SUMMER (with the herd on the pasture)"}
    - {form: tamuwa, gloss: "herd-TRAVERSE (along the contour, keeping altitude)"}
    check: "12 forms; one function per suffix; PL before CASE in every row (M-01)"
  verb_worked:
    lexeme: "nera- 'go up' (fluid-S, PRE-05)"
    forms:
    - {form: nera-ka-se, gloss: "go.up-PFV-SEEN"}
    - {form: nera-ka-he, gloss: "go.up-PFV-AIR"}
    - {form: nera-ka-ti, gloss: "go.up-PFV-TRACED"}
    - {form: nera-ka-mo, gloss: "go.up-PFV-REPORTED"}
    - {form: nera-ne-se, gloss: "go.up-IPFV-SEEN"}
    - {form: nera-ne-na, gloss: "go.up-IPFV-1"}
    - {form: nera-ka-na-se, gloss: "go.up-PFV-1-SEEN (the 1sg witness form used in oaths about one's own acts)"}
    - {form: nera-lu-ne, gloss: "go.up-NEG-IPFV"}
    - {form: nera-sa, gloss: "go.up-2 (imperative, no evidential)"}
    - {form: ma nera-sa, gloss: "PROHIB go.up-2"}
    - {form: nera-so-ka-hi, gloss: "go.up-CAUS-PFV-SS"}
    - {form: nera-ka-ha, gloss: "go.up-PFV-DS"}
    check: "12 forms; PFV/IPFV, four core evidentials, negation, imperative, prohibitive, both switch-reference markers"
  accent_shift_worked:
    forms: [{sg: hani, gloss: "winter shelter (Class B)"}, {pl: haní, gloss: "winter shelters — accent shift only (M-03)"}]
    caution: "accent placement follows the delivered P-D2-PHON rules: hani is a valley-locus stem (default initial peak, AC-2) and AC-4 moves the peak right for the inherited plural (haní). Display only — the accent class lists belong to the lexicon component (AC-3), and 02 notes that a ridge-locus stem shows no distinct plural form, an accidental gap stated there"

sentence_family:
- {id: S-01, text: "Tamu nera-ka-se.", gloss: "herd go.up-PFV-SEEN", free: "The herd went up — I saw it.", type: "declarative (SYN-17)"}
- {id: S-02, text: "Tamu nera-lu-ti.", gloss: "herd go.up-NEG-TRACED", free: "The herd did not go up — the grass shows it.", type: "negative declarative (M-23; T5 existential shares the construction)"}
- {id: S-03, text: "Hani-mu muka-ka-mo.", gloss: "winter.shelter-ALL.DOWN go.down-PFV-REPORTED", free: "They came down to the winter shelter, they say.", type: "past/report (SYN-11)"}
- {id: S-04, text: "Iru-ku nera-sa!", gloss: "high.pasture-ALL.UP go.up-2", free: "Go up to the high pasture!", type: "imperative (SYN-21)"}
- {id: S-05, text: "Tamu-na nera-ka-no.", gloss: "herd-1SG.INAL go.up-PFV-STAR", free: "By the star-witness: my herd went up. (oath register)", type: "oath (SYN-12, EV5; misuse outside ritual is the sacrilege case)"}
- {id: S-06, text: "Hewa weri-ka-ha, tamu nera-so-ka-se.", gloss: "wind turn-PFV-DS herd go.up-CAUS-PFV-SEEN", free: "The wind turned, and then she drove the herd up — I saw it.", type: "conditional/sequence with a scene hand-off (SYN-23, SYN-26)"}
- {id: S-07, text: "Iru-ni hewa nera-ka-ha, tamu kura-ka-mo.", gloss: "high.pasture-GEN wind go.up-PFV-DS herd stay-PFV-REPORTED", free: "The pasture's wind rose, and (then) the herd stayed, they say.", type: "chained narration, two scene hand-offs (SYN-26)"}

register_notes:
- {id: R-01, register: "incantation / oath", rule: "uses EV5 (SYN-12), the middle -li (M-21) instead of the active, archaic full reduplication of the verb root, and tolerates two levels of embedding; laypeople mispronounce the archaic reduplicated form and are corrected only by the sky-readers", axis: both, evidence: "design-choice", follows: [CIT-06]}
- {id: R-02, register: "lament / chant (licensed disharmony)", rule: "modifiers may be postposed to the noun in lament and praise recitation; the one licensed deviation from head-final modifier order, genre-bound", axis: neutral, coupling_note: "the licensed deviation is a genre fact, not a spine claim; it exists because adjective position is the weakest harmonic correlation", evidence: "design-choice", follows: [CIT-07, CIT-11]}
- {id: R-03, register: "trade register", rule: "lowland-partner loans are Class A nouns with -ra (M-02); prices stay EV4 for a year (SYN-14); lowland counting words appear only in the market", axis: neutral, coupling_note: "contact institution, governed by the brief's contact discipline; no donor religion or costume is imported", evidence: "design-choice", follows: [CIT-13]}
- {id: R-04, register: "everyday speech", rule: "fast-speech loss of the alienable possessive -ha (M-13); evidentials are never dropped — dropping the source marker is not a register, it is a lie (SYN-13)", axis: wind, evidence: "design-choice", follows: [CIT-10]}

calibration:
- {id: CAL-01, claim: "aspect-split ergativity with an S/A pivot", status: "contested/partial: the split is documented (Dixon 1994) and S/A pivots are common, but this exact pairing in one language is D2 design", follows: [CIT-08], handling: "labelled design-choice; not to be cited to any real people"}
- {id: CAL-02, claim: "fluid-S volition marking", status: "attested-comparator (Lakhota, Guaraní, Choctaw; Merlan 1985); its legal reading is D2 design", follows: [CIT-08]}
- {id: CAL-03, claim: "internally-headed relatives for an oral testimony genre", status: "attested-comparator (Navajo, Lakhota; Williamson 1987); the genre preference is a design choice, not a law", follows: [CIT-09]}
- {id: CAL-04, claim: "evidentials absent in imperatives; 5-term ceiling", status: "(to-verify): Aikhenvald 2004 reports 2–5-term systems and typical restrictions; the exact imperative gap needs a checked page reference before it is stated as attested", follows: [CIT-10]}
- {id: CAL-05, claim: "mirativity carried by prosody alone", status: "(to-verify): mirativity is documented as a grammatical category (DeLancey 1997); the prosodic realisation is D2 design", follows: [CIT-10, CIT-12]}
- {id: CAL-06, claim: "accent-shift plural as a fossil", status: "attested-comparator for the fossil pattern (umlaut-type; CIT-03); assigning it to a pitch-accent isolate is D2 design", follows: [CIT-03]}
- {id: CAL-07, claim: "typology carries no cultural ranking", status: "calibration enforced: no ladder, no 'primitive' reading, no complexity compensation (McWhorter 2001 flagged in CIT-05)", follows: [CIT-05]}
- {id: CAL-08, claim: "all forms buildable from 02's inventory", status: "RESOLVED 2026-10-17 — every stem and suffix re-checked legal against the delivered P-D2-PHON inventory, template and coda set; 02's reconcile_for_03 note confirms no listed stem changes; A-03 check 6 met", follows: [CIT-12]}

