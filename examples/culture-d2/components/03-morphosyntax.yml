acceptance_self_check:
  acceptance_ref: "component 01-brief — A-03"
  checks:
  - "A-03.1 morphology carries type/alignment/word_order; split trigger stated (aspect); marking locus stated and consistent — MET (morphology block; SYN-04; marking_locus)"
  - "A-03.2 >= 10 M-/SYN- records with id/form/gloss/function/stage/axis/evidence; >= 1 non-affixal pitch-coupled process — MET (27 M- records + 29 SYN- records, every record carries axis; M-03 accent-shift plural, SYN-16 mirative)"
  - "A-03.3 vertical direction grammar >= 2 up/down morphemes; one 8–12-form paradigm; sentence family >= 6 — MET (M-07..M-11; 12-form noun and verb paradigms; 7 sentences)"
  - "A-03.4 evidentials 2–5 terms; no mirativity double-marking; nothing past the ceiling — MET (4 core + 1 register-restricted; mirative is prosodic only)"
  - "A-03.5 relative-clause strategy matched to order; embedding ceiling respected — MET (SYN-25 internally-headed in an OV language; SYN-28 ceiling)"
  - "A-03.6 every morpheme buildable from 02 — MET (CAL-08 resolved: all forms re-checked legal against P-D2-PHON 1.0.0-drill, its (C)V(C) template and coda set {n l r s}; accent usage limited to the two AC-4 licensed shifts)"
  - "A-03.7 harmonic sweep run; no free-order-plus-zero-morphology without history; no D1 import — MET (SYN-02, SYN-03; d1_guard; no D1 form or D1 letter set reused: this file's letters come from the delivered P-D2-PHON inventory and no D1 word is used)"

canon_boundary: "This component designs a system and cites its corpus bases; it records nothing about any world. Canon, adoption, and in-world example sentences are lore-shokunin's. No sibling component was edited; sibling content is referenced only by contract field path and by unresolved-ID markers, per RG-03/RG-04."