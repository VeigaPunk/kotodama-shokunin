materials:
  - id: MAT-01
    material: ewe-fleece
    composition: "animal fibre — wool of the wool-bearer flock; grades separated by pasture pole and animal age"
    ecology: "the flock grazes the summer pasture above the shepherds' line and folds on the valley floor in winter; the clip is sorted by pole, and the fleece is aired on the ridge racks"
    verticality: "shearing and plucking at the low camp before the ascent; combing at the summer camp; the clip climbs and descends with the household it belongs to"
    wind: "drying and airing are wind work; a wet fleece is never baled"
    routes:
      - {id: RT-m01a, name: "hand-plucking at the moult, low camp", kind: local, stage: fiber, eras: [E1]}
      - {id: RT-m01b, name: "shearing at the low camp (shears arrive by road)", kind: import, stage: fiber, eras: [E2, E3, E4]}
      - {id: RT-m01c, name: "combing on the summer racks", kind: local, stage: yarn, eras: [E2, E3, E4]}
      - {id: RT-m01d, name: "carding at the winter shelters", kind: local, stage: yarn, eras: [E1, E2, E3, E4]}
    supply_state: "regional network (CG §8) from E1; the plucked-to-shorn switch is the era's real fiber break"
    export_flow: "grease wool goes down the road (BULK-05) while the fine combed clip stays for felt grades G2-G3"
    follows: [TT §2.wool, TT §2.fleece-chronology, TT §7.1, MC §4.seasonality]
  - id: MAT-02
    material: felt
    composition: "nonwoven animal-fibre mat — wool, carded; hair-blended for the coarse grades"
    ecology: "matting happens at the summer seeps with meltwater and warmth and at the winter shelters with hearth heat; it needs no loom"
    verticality: "the shelter material of both poles — wall, floor, and bale; felt is why a camp can sit above the tree line"
    wind: "the wall that stops the wind; finished bales are aired on the racks before the gales"
    note_grade_ladder: "G1-G3 below; a felt bale is a supply unit (see measures ME-02, the felt-day)"
    routes:
      - {id: RT-m02a, name: "seep-edge felt work, summer camp", kind: local, stage: cloth, eras: [E1, E2, E3, E4]}
      - {id: RT-m02b, name: "hearth-side felt work, winter shelter", kind: local, stage: cloth, eras: [E1, E2, E3, E4]}
    supply_state: "regional network (CG §8); felt is the bulk cloth export down the road"
    export_flow: "felt bales down-trail (RT-1)"
    follows: [TT §1.fiber-gate, TT §5.fulling-physics, TT §7.4, CG §5.felt-not-woven]
  - id: MAT-03
    material: ox-hair cordage
    composition: "animal fibre — long coarse hair of the pack-ox, hand-twisted cord and rope, S-ply"
    ecology: "gathered at the spring shedding; twisted by hand at the shelters; no loom"
    verticality: "harness cord goes up with the load and down with the salt; storm bands hold the high camp"
    wind: "guy-lines and storm bands are chosen for the gale, not for looks; a cord that has held a storm is a cord worth counting"
    note: "also the stock for record cords and hem cords (record hardware only — see spine_boundary)"
    routes:
      - {id: RT-m03a, name: "hand-twisting at the winter shelter", kind: local, stage: yarn, eras: [E1, E2, E3, E4]}
    supply_state: "local throughout (CG §8)"
    follows: [TT §2.minor-animal-fibres, TT §4.spin-forensic, CG §4.MAT-07]
  - id: MAT-04
    material: nettle-bast
    composition: "bast fibre — high-scrub nettle, retted and hackled (botanical identification to-verify; no Linum-analog on the plateau)"
    ecology: "cut at the scrub line above the valley farms; retted in the winter pools; the poor's fibre and the sack fibre"
    verticality: "grows between the two poles, used at both"
    wind: "sacks and bale wraps for the road; a bad-weather fibre, not a display fibre"
    routes:
      - {id: RT-m04a, name: "scrub-line cutting and pond retting", kind: local, stage: fiber, eras: [E1, E2, E3, E4]}
    supply_state: "local throughout (CG §8)"
    follows: [TT §2.minor-fibres, MC §4.seasonality]
  - id: MAT-05
    material: lowland-plant-cloth
    composition: "bast-fibre cloth of the lowland partner's weave (flax analog), imported as finished cloth"
    ecology: "not growable above the valley farms — closed inventory at home"
    imported_stage: "cloth (bottleneck: the pass window and the pack loads, not the market)"
    verticality: "a lowland-made good, lawful only low on the road and at the gate market (sibling 12's sell-line is the costume component's rule, not decided here)"
