# ---------------------------------------------------------------------------
# costume_interface — the contract surface a costume component consumes. It
# names material identifiers, widths, and thread; it decides NO rank rules.
# ---------------------------------------------------------------------------
costume_interface:
  material_names_to_use:
    - "ewe-fleece | felt | ox-hair cordage | nettle-bast | lowland-plant-cloth | lowland-plant-cord | lowland-broadcloth | traded-indigo | wool-black | hearth-dark | traded-madder-root | weld-plot | alum | traded-pink | sky-iron | trail-iron | bronze | weighed-silver | smith-scale | herd-hide | sinew-thread | horn-and-bone"
  dye_names_to_use: "traded-indigo | wool-black | hearth-dark | traded-madder-root | weld-plot | traded-pink (the `dye:` field of a costume record should use exactly these strings; MAT-04 in the gate matches them)"
  width_cap: "local cloth: 1.4 m seamless (LM-01); felt: 1.6 m (LM-03); imported lowland cloth: 1.6 m (LM-04, E4). Any seamless panel above the declared source width must be declared as pieced, felted, or imported (CG §5.T-01)."
  thread_and_closures: "garment thread = sinew-thread (MAT-21); toggles, pins, strap-ends = horn-and-bone (MAT-22); lowland cloth brings its own thread (declare it) — this closes the gate's MAT-07 loop for the highland wardrobe"
  era_map_for_costume_records:
    E1: "ewe-fleece (plucked), felt G1-G2, ox-hair cordage, nettle-bast, herd-hide, sinew-thread, horn-and-bone, sky-iron, salt; no dyed cloth, no imported anything"
    E2: "+ lowland-plant-cloth and lowland-plant-cord, traded-indigo (licensed), wool-black, trail-iron (shears, combs), charcoal; felt G3 becomes possible"
    E3: "+ traded-madder-root, alum, weld seed, bronze, weighed-silver, smith-scale reuse"
    E4: "+ lowland-broadcloth, traded-pink, imported-paper; writing media (not worn)"
  rank_hooks_not_decided_here: "the G1-G3 rank assignment, the sell-line rule, the licensed-blue rule, the covenant sash, the mourning dress rules, and every penalty are the rank-rules/costume components' business; this file only asserts what exists, where it comes from, and when it is reachable"
  provenance_values_expected: "local-production | import | reuse | alternative (the gate's vocabulary); a costume with no matching material route is a HOLD, not an assumption (CG §4.MAT-02)"

# ---------------------------------------------------------------------------
# gates_interface — how this component plugs into the executable gate.
# ---------------------------------------------------------------------------
gates_interface:
  splice_blocks: "a costume packet can splice `eras:`, `era_slots:` (labels only), `materials:`, `cloth_sources:` and `grade_ladder:` from this file unchanged; the gate reads material/material-composition/routes[kind,stage,eras]/excluded_eras and cloth_sources[name,max_width_m,eras] and ignores the extra keys"
  enum_conformance: "routes[].kind in {local, import, reuse, alternative, excluded}; routes[].stage in {fiber, yarn, cloth, garment, dye, trim}; bulks and writing media live outside `materials:` because their stages are not in the enum"
  self_run_note: "run as a packet this file exits 2 by design (the kernel needs a `costumes` block to review); the costume component supplies it, and the gate then reads this substrate — no waiver, a declared boundary"
  closed_inventory_rule: "every excluded_eras row above is a declared closed inventory. If a costume from a later component claims the excluded good in that era, the finding is a real contradiction (reject), not a missing datum — repair it by moving the claim or by amending this file, and log which"
  reuse_rule: "smith-scale (MAT-19) is declared `reuse`; a costume claiming reused iron trim in E2+ can cite it, and the gate's MAT-06 will find the route instead of a HOLD"

# ---------------------------------------------------------------------------
# spine_check — the two-axis audit the round requires, plus the D1 scan.
# ---------------------------------------------------------------------------
spine_check:
  verticality:
    - "two pasture poles set the fiber calendar: pluck/shear at the low camp, comb and felt at the high one (MAT-01, MAT-02)"
    - "production splits by altitude: salt from the high pans, dye vats and plots at the valley floor, the forge at the winter camp (BULK-01, MAT-08, MAT-12, MAT-16)"
    - "the loom is upright and its weights are scree stone: cloth descends the frame from the sky-edge to the floor (LM-01)"
    - "the only import seam is a pass; all imported material is a gate good (RT-1)"
    - "sky-iron is found only above the shepherds' line (MAT-15)"
    - "the administrative year is a vertical event: pass-clearing to closing storm (ME-04)"
  wind:
    - "felt is the wall against the wind; the high camp exists because of it (MAT-02)"
    - "finishing is gale work: wind-racking replaces the tenter ground, and no fulling mill exists (grade_ladder.finishing_capacity; TT §5)"
    - "every stink trade is sited downwind: the vat house, the tanning pits, the retting pools (MAT-08, MAT-20, MAT-04; TT §5)"
    - "hearth-dark is a smoke process: the colour that goes up with the smoke (MAT-10)"
    - "drying is wind work throughout: fleece, felt bales, dried meat, salt pans, hides (MAT-01, BULK-01, BULK-02)"
    - "the gate bell is heard across the pass when the wind runs right (MAT-17; sound as a route fact)"
    - "storm-triggered scheduling: the road closes at the first gale, and the closing storm is the year's seam (RT-1, ME-04)"
  d1_import_scan:
    - "no river, watercourse, ford, bank, or flood imagery anywhere in this file; trade runs on a pass and drying on the wind"
