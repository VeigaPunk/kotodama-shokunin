  - {id: LR-02, gloss_slot: "felt", field: material, layer: native, form: "(to-verify)", note: "the culture's default cloth noun; sparse-morphology languages often use one noun for cloth and felt"}
  - {id: LR-03, gloss_slot: "cord (harness, record, hem)", field: material, layer: native, form: "(to-verify)", note: "record senses belong to the tally component; the material sense belongs here"}
