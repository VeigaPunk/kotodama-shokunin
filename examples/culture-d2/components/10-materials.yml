    follows: [CG §4.MAT-03, MC §4.transport]
  - id: MAT-18
    material: weighed-silver
    composition: "silver by weight — ingot, hack-silver, and (E4) the partner's coin as metal"
    note: "the weighing drift: weight-words become money-words; the measure used for buying is not the one used for selling (TE §1, §4)"
    routes:
      - {id: RT-m18a, name: "road lots, weighed at the gate market", kind: import, stage: trim, eras: [E3, E4]}
    excluded_eras: [E1, E2]
    supply_state: "external curiosity (CG §8)"
    follows: [TE §4.money-words, TE §1.weighing-drift, TE §10.lever-2]
  - id: MAT-19
    material: smith-scale
    composition: "hammer-scale and spent iron, reused as the iron mordant that saddens tannin and madder (reuse, not a primary material)"
    routes:
      - {id: RT-m19a, name: "forge-floor collection to the dye pots", kind: reuse, stage: dye, eras: [E2, E3, E4]}
    excluded_eras: [E1]
    supply_state: "specialist enclave (CG §8)"
    follows: [TT §3.iron-saddens, CG §4.MAT-06]
  - id: MAT-20
    material: herd-hide
    composition: "animal hide of the herd, tannin-tanned; leather for the wind-facing outer layer, harness, bags, boot stock"
    ecology: "the autumn kill and the fallen animals; tanning pits sit downwind of the camp"
    wind: "leather is the outer layer against weather; the pits are sited by wind, not by water (spine_boundary)"
    routes:
      - {id: RT-m20a, name: "camp tanning, downwind pits", kind: local, stage: garment, eras: [E1, E2, E3, E4]}
      - {id: RT-m20b, name: "hide-parchment preparation (E4 writing medium)", kind: local, stage: trim, eras: [E4]}
    supply_state: "local throughout (CG §8)"
    follows: [TT §5.stink-trades, MC §4.seasonality, CG §4.MAT-07]
  - id: MAT-21
    material: sinew-thread
    composition: "animal sinew and gut thread — the garment thread of the highland wardrobe"
    note: "declared so a costume claim's closures, seams, and pads resolve (CG §4.MAT-07); the lowland cloth brings its own thread"
    routes:
      - {id: RT-m21a, name: "camp thread work", kind: local, stage: yarn, eras: [E1, E2, E3, E4]}
    supply_state: "local throughout (CG §8)"
    follows: [CG §4.MAT-07, TT §7.3]
  - id: MAT-22
    material: horn-and-bone
    composition: "horn, bone, and antler: toggles, pins, harness rings, belt ends, awl handles"
    note: "closures and strap-ends are bone and horn before they are metal, and remain so after it (CG §4.MAT-07)"
    routes:
      - {id: RT-m22a, name: "camp bone work", kind: local, stage: trim, eras: [E1, E2, E3, E4]}
    supply_state: "local throughout (CG §8)"
    follows: [CG §4.MAT-07, MC §4.transport]# ---------------------------------------------------------------------------
# bulk_materials — economy-facing goods that never appear on a costume record.
# Same route shape as `materials`, deliberately kept out of the gate-read block
# because the gate's stage enum does not model food, fuel, or export stock.
# ---------------------------------------------------------------------------
bulk_materials:
  - id: BULK-01
    material: salt
    composition: "rock and pan salt; the trade good that names the road"
    ecology: "high pans and licks above the summer pasture, dried by sun and wind; the pan season is the high season"
    verticality: "taken from the top and carried down — the road's down-cargo is heavy, which is why the up-cargo is priced against it"
    routes:
      - {id: RT-b01a, name: "high pan harvest, summer", kind: local, era_scope: [E1, E2, E3, E4]}
      - {id: RT-b01b, name: "down-trail packs to the lowland fair", kind: local, era_scope: [E2, E3, E4]}
    measure_note: "the salt-cake is unit and good at once (ME-01); the measure you sell with is not the measure you buy with (TE §1)"
    follows: [TE §1, TE §2.substance-unit, MC §4.scarcity]
  - id: BULK-02
    material: dried-meat
    composition: "air- and wind-dried herd meat; the road's second down-cargo"
    ecology: "the autumn kill after the descent; drying is wind work at the shelters"
    verticality: "made at the low station from herd raised at the high one"
    routes:
      - {id: RT-b02a, name: "autumn drying, winter stores and road lots", kind: local, era_scope: [E1, E2, E3, E4]}
    follows: [MC §4.seasonality, MC §4.perishability]
  - id: BULK-03
    material: dung-fuel
    composition: "dried herd dung — the household fuel of a treeless plateau"
    energy_note: "the energy gate behind every dye pot and hearth at the high camp; charcoal is for the forge only"
    routes:
      - {id: RT-b03a, name: "camp collection and drying", kind: local, era_scope: [E1, E2, E3, E4]}
    follows: [MC §4.energy-and-fuel]
  - id: BULK-04
    material: charcoal
    composition: "charcoal, imported from below the tree line; the forge's fuel and therefore the tool ceiling"
    bottleneck: "all metalwork scales with this import, not with ore supply"
    routes:
      - {id: RT-b04a, name: "up the road, sacks to the forge", kind: import, era_scope: [E2, E3, E4]}
    excluded_eras: [E1]
    follows: [MC §4.energy-and-fuel, TT §5]
  - id: BULK-05
    material: grease-wool
    composition: "raw fleece in the grease, exported as bulk stock"
    note: "the fine combed clip is kept home for grades G2-G3; the grease wool pays for the grain (MAT-01)"
    routes:
      - {id: RT-b05a, name: "down the road by the pack-load", kind: local, era_scope: [E2, E3, E4]}
    follows: [TT §2.wool, TE §1]
  - id: BULK-06
    material: grain
    composition: "lowland grain, imported food; the up-cargo's ballast"
    routes:
      - {id: RT-b06a, name: "up the road, bulk sacks", kind: import, era_scope: [E2, E3, E4]}
    excluded_eras: [E1]
    follows: [MC §4.transport, MC §4.seasonality]

# ---------------------------------------------------------------------------
# dye_palette — the TT §7.2 card: 4 fast + 2 fugitive + 1 monopoly, and the
# no-dye palette that E1 actually lives in. Hue words are not coined here.
# ---------------------------------------------------------------------------
dye_palette:
  monopoly:
    dye_id: MAT-08
    name: traded-indigo
    chain: "lowland plant -> lowland cake processing -> the road -> gate toll and licensed vat"
    why_monopoly: "imported fast dye under a treaty licence: the gate, not the dye pot, is what a rival must break (TT §1, §3; TT §7.2)"
  fast:
    - {id: DP-01, color_slot: "the licensed blue of the assembly", dye: traded-indigo, class: vat, route: import, eras: [E2, E3, E4], follows: "TT §3.vat-class"}
    - {id: DP-02, color_slot: "the working black", dye: wool-black, class: tannin + iron mordant, route: local, eras: [E2, E3, E4], follows: "TT §3.tannin-row; TT §3.iron-saddens"}
    - {id: DP-03, color_slot: "the imported red", dye: traded-madder-root, class: mordant, route: import, eras: [E3, E4], follows: "TT §3.madder-row"}
    - {id: DP-04, color_slot: "the fast yellow (and the overdye green)", dye: weld-plot, class: mordant, route: import then local plot, eras: [E3, E4], follows: "TT §3.weld-row"}
  fugitive:
    - {id: DP-05, color_slot: "the shelter dark", dye: hearth-dark, class: process darkening (soot and heat), route: local, eras: [E1, E2, E3, E4], failure: "abrades and lightens; a working colour", follows: "TT §3.direct-class-fugitive"}
    - {id: DP-06, color_slot: "the luxury pink", dye: traded-pink, class: direct, route: import, eras: [E4], failure: "fades in light; a fair-day colour", follows: "TT §3.safflower-row"}
  no_dye_palette:
    id: DP-07
    content: "E1 cloth is undyed: natural fleece colours (white, grey, the dark of dark-fleeced animals) plus smoke darkening. This is a real palette, not an absence — the fleece carries the colour (TT §2; sibling 08's fleece-white slot)."
  register_boundary: "This block is a material-versus-hue fact sheet only. Symbolic register assignments for colours belong to sibling 08; the red and yellow above are NOT claimed as signs, and integration must score them against 08's register list before any symbol use."

# ---------------------------------------------------------------------------
# cloth_sources — gate-read width bound (TT §4: cloth width = loom width; a
# seamless panel wider than every source is a contradiction unless piecing or
# stretching is declared). Extra keys carry the forensic signature.
# ---------------------------------------------------------------------------
cloth_sources:
  - id: LM-01
    name: "upright warp-weighted loom, scree-stone weights"
    max_width_m: 1.4
    eras: [E1, E2, E3, E4]
    tension: "stone loomweights hang the warp; the beam sits at the top of the frame"
    signature: "woven top-down from a starting border at the top; doubled weight-bearing selvedge warps; slate weights in pits are the archaeological tell; the loom itself is the vertical axis of the shelter, cloth descending from the sky-edge of the frame to the floor"
    follows: [TT §4.warp-weighted, TT §4.width-breeds-architecture, TT §7.3]
  - id: LM-02
    name: "narrow band frame"
    max_width_m: 0.12
    eras: [E1, E2, E3, E4]
    signature: "bands for hems, harness, girths, hem cords; selvedge-heavy, no pattern"
    follows: [TT §4.forensics]
  - id: LM-03
    name: "felt mat work (no loom)"
    max_width_m: 1.6
    eras: [E1, E2, E3, E4]
    signature: "nonwoven: no warp, no selvedge, no spin direction in the finished face; edges are rubbed, not cut clean; felt is never called woven (CG §5)"
    follows: [TT §5.fulling-physics, CG §5.felt-not-woven]
  - id: LM-04
    name: "imported lowland treadle-loom cloth"
    max_width_m: 1.6
    eras: [E4]
    signature: "regular twill repeat and machine-even weft — the provenance tell of a lowland loom; the cloth carries its maker's width, not ours"
    follows: [TT §4.treadle-signature, CG §5.T-01, CG §4.MAT-03]

# ---------------------------------------------------------------------------
# grade_ladder — the three-rung ladder TT §7.4 asks for, mapped to the G1-G3
# slots sibling 12 already uses. Finishing here is wind work, not mill work:
# no fulling mill, no tenter frames; the gale does the drying and the shear
# does the rest (TT §5).
# ---------------------------------------------------------------------------
grade_ladder:
  rung_count: 3
  finishing_capacity: "washing and rinsing at the valley pools, fulling by foot at the seeps and hearths, nap raising by hand, shearing with imported shears (E2+), and gale-racking on frames — no water-powered fulling mill and no tenter ground (TT §5)"
  rungs:
    - id: G1
      working_label: "day felt"
      fibre_basis: "carded winter-clip fleece, hair-blended; plucked fleece only in E1"
      era: [E1, E2, E3, E4]
      finish: "rubbed and felted; left shaggy or shear-touched"
      use_scope: "shelter and work grade; the floor of the ladder"
      follows: [TT §5.grade-words, TT §7.4]
    - id: G2
      working_label: "fold felt"
      fibre_basis: "carded summer-clip fleece from the high pasture; no combed content"
      era: [E1, E2, E3, E4]
      finish: "fully felted at the seeps, then nap-raised and sheared"
      use_scope: "the household's ordinary coat grade; export bales are G2"
      follows: [TT §5.fulling, TT §2.wool-fork]
    - id: G3
      working_label: "white felt"
      fibre_basis: "combed first-shear undercoat from the high-pasture clip — combing requires imported wool combs, so the grade is E2 onward"
      era: [E2, E3, E4]
      finish: "fine fulling, careful nap, wind-racked white; no overdye by preference"
      use_scope: "the top of the ladder; the rank assignment of G1-G3 belongs to the rank-rules component, not here"
      follows: [TT §2.wool-fork, TT §4.forensics, TT §5.grade-words]
  era_break_note: "the plucked-to-shorn switch (E1 -> E2) is what creates the ladder's top rung: without shears there is no clean fleece and without combs there is no combed grade. This is the single most checkable material claim in the file."

# ---------------------------------------------------------------------------
# trade_routes — every import is a gate good; there is no second seam.
# ---------------------------------------------------------------------------
trade_routes:
  - id: RT-1
    name_candidate: "the road (salt and dried-meat trail)"
    spine: "a pass, not a river: the route is vertical and seasonal"
    season: "opens when the pass is fit and closes at the first gale of the closing storm; over-winter traffic does not exist in the design"
    endpoints: "the gate market (high, on our side) <-> the lowland partner's fair (below)"
    down_cargo: [BULK-01, BULK-02, BULK-05, felt bales (MAT-02)]
    up_cargo: [MAT-05, MAT-06, MAT-08, MAT-13, MAT-16, MAT-11, MAT-12, MAT-07, MAT-14, MAT-17, MAT-18, BULK-04, BULK-06]
    imported_stage_rule: "cloth arrives as cloth, dye as dye cake, iron as stock, castings as castings; D2 never claims the partner's production stages (CG §4.MAT-03)"
    risk_grammar: "the pass bears the risk, not a hull: lost loads are shared by pack-owner and merchant according to the load agreement sworn at the gate (instrument naming belongs to the trade component; TE §8 supplies the grammar)"
    bargain_register: "market barter under an inspector at the gate; the lowland fair keeps its own register; no posted prices in the design (TE §5)"
    follows: [TE §5, TE §8, MC §4.transport, MC §4.seasonality, CG §4.MAT-03]
  - id: RT-2
    name_candidate: "the pan path"
    kind: internal
    season: "summer only, while the high pans are reachable"
    flow: "salt from the pans down to the shelters; no imported good travels this path"
    follows: [MC §4.transport, TT §7.3]
  - id: RT-3
    name_candidate: "the scrub run"
    kind: internal
    flow: "tannin bark and galls, nettle bast, and (E3+) the valley dye plot harvest move between the mid-slope and the camps on foot"
    follows: [MC §4.seasonality, TT §3.tannin-row]

# ---------------------------------------------------------------------------
# measures — slots only; no unit word is coined here (lexicon_requests LR-05).
# ---------------------------------------------------------------------------
measures:
  - {id: ME-01, unit_slot: "the salt-cake", source: substance (TE §2), note: "unit and good coincide; selling measure differs from buying measure (TE §1)", era: [E1, E2, E3, E4]}
  - {id: ME-02, unit_slot: "the felt-day", source: "action (TE §2) — a work-unit like the acre-as-a-day's-plowing", note: "felt is counted in bales and bales are counted in felt-days; the slot is already used by sibling 12 (referenced, not designed here)", era: [E1, E2, E3, E4]}
  - {id: ME-03, unit_slot: "the pack-load", source: container/vehicle (TE §2), note: "the road's freight unit; the up-cargo is priced against the down-cargo", era: [E2, E3, E4]}
  - {id: ME-04, unit_slot: "the pass-year", source: action/season (TE §2), note: "the administrative year runs from pass-clearing to closing storm; era seams are recut on the record cords (EP §4: what breaks at a seam)", era: [E1, E2, E3, E4]}
  - {id: ME-05, unit_slot: "the vat-lot", source: counting technology of the dye house (TE §2), note: "one licensed vat's worth of dyestuff; the licence is the institution, the lot is the material count", era: [E2, E3, E4]}
  - {id: ME-06, unit_slot: "the cord", source: "record hardware (TE §2, §7)", note: "the tally unit — sibling 08 declares the arithmetic (five stations, two crossings, ten knots); this file only supplies the cord stock (MAT-03) and never designs the record", era: [E1, E2, E3, E4]}

# ---------------------------------------------------------------------------
# writing_media — the E4 material line. The script itself, its orthography and
# its register belong to other components; this block supplies the substrate
# only, on the LM §2 rule that material, lexical, and documentary clocks are
# separate.
# ---------------------------------------------------------------------------
writing_media:
  - id: WM-01
    medium: gall-iron-ink
    composition: "tannin from the scrub galls + iron from smith scale — the black dye's own chemistry, shared with the dye house (TT §3: a culture's ink and black dye may share a supply chain)"
    route: local
    eras: [E4]
    bottleneck: "shares the tannin gather and the forge's iron; an ink shortage is a dye-house shortage"
    follows: [TT §3.tannin-row, LM §2.material-clock, MAT-09, MAT-19]
  - id: WM-02
    medium: hide-parchment
    composition: "prepared herd hide (MAT-20), rubbed smooth; the local writing surface"
    route: local
    eras: [E4]
    note: "ink + hide keeps the whole ledger inside the herd economy; the partner's script written on the herd's own skin is a designed irony, not a symbolic claim"
    follows: [LM §2.documentary-clock, MAT-20]
  - id: WM-03
    medium: imported-paper
    composition: "paper sheets from the lowland partner"
    route: import
    eras: [E4]
    bottleneck: "pack loads; a paper sheet is a load-fraction, which keeps paper scarce and official"
    excluded_eras: [E1, E2, E3]
    follows: [CG §4.MAT-03, LM §2]

# ---------------------------------------------------------------------------
