  - {id: LR-05, gloss_slot: "salt-cake (measure)", field: measure, layer: native, form: "(to-verify)", note: "unit and good; the measure vow and inspector office are elsewhere (TE §3)"}
  - {id: LR-06, gloss_slot: "indigo; the dyestuff cake", field: material, layer: loan, form: "(to-verify)", note: "loan along RT-1 with the E2 road; the HUE word may remain native while the dyestuff noun is loaned (LM §3: separate strata)"}
  - {id: LR-07, gloss_slot: "alum; the dyers' salt", field: material, layer: loan, form: "(to-verify)", note: "collides semantically with LR-04 — the buying measure differs from the selling measure (TE §1) and the two salts may share a word with a qualifier"}
