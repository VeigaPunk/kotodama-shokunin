component: 10-materials
culture: D2
component_title: "Material inventory — fibers, dyes, metals, leather, fuel, and the route that carries them"
canon: not canonized (D2 design drill)
status: "PROPOSED — non-canon sample design; no real culture is described; comparators cite repository corpus entries only; handoff is reference-only (AGENTS.md; QUALITY.md 5)"
rev: "round-3 drill, 2026-10-17, worker W10"
spine: "verticality (high/low, ascent/descent, seasonal poles) + wind (breath, soul-carrier, storm law)"
spine_boundary: "D1 imagery excluded by construction: no river or watercourse imagery in any record; no binding/tying/knot imagery in the finish, loom, or dress vocabulary. Record cords appear ONLY as seed-granted record hardware (tally and hem cords) — they count, they do not bind; their design belongs to the tally/script components. No ochre (D1's ranu pigment); D2's poor-black is tannin-and-iron, not ochre."

# ---------------------------------------------------------------------------
# interface facts assumed from the round-3 D2 tree (read 2026-10-17). They are
# contract-level only — no sibling file content is copied; if a sibling revises
# them, map by slot id (E1-E4, G1-G3) rather than by label.
interface_facts:
  strapline: "Era slots E1-E4 (shelter / road / assembly / script) and the felt-grade ladder G1-G3 are already used by sibling components; traded indigo is already the era-2 dyestuff. This component supplies their material substrate and does not rename them."
  era_slots_assumed: [E1, E2, E3, E4]
  grade_slots_assumed: [G1, G2, G3]
  open_interface_tension: "(to-verify) sibling 12-rank-rules dates the lowland-script caravan register to era-2 onward, while sibling 08-symbols places the script era at E4; this file follows E4 for script-era media and flags the seam for integration (see open_handoffs OH-03)."
  reconciliation_after_siblings_landed: "checked at round-3 close (2026-10-17): 05-lexicon has already coined mir (fleece, wool), pal (salt), kor (tally-cord) and the kol/kól pitch pair (the pass vs the toll taken there) — lexicon_requests LR-01/LR-03/LR-04 must be answered against those forms, not re-coined; 05 also carries measure ladders as a declared gap, which is what ME-01..ME-06 fill at slot level. 09-eras-calendar owns the in-world era-name series (Open Grazing, First Ascent, Salt Turn, ...), so the E1-E4 tags here are slot ids for staging only and must be mapped to 09's names at integration, never treated as era names in their own right."
  do_not_depend_on: "term ids, garment ids, or institution ids are NOT read from sibling files; they are referenced by contract field only (lexicon [{term, gloss, field, etymology, layer}]; costumes [{garment, material, wearer_rank, rite, era}])."

contract_note: "Shared culture-packet keys used here: eras [names], materials [], cloth_sources []. Added component-local blocks: era_slots, bulk_materials, dye_palette, looms (inside cloth_sources), grade_ladder, trade_routes, measures, writing_media, lexicon_requests, costume_interface, gates_interface, spine_check, calibration, open_handoffs, canon_boundary. Every record carries a short id. Term forms are never coined here — lexicon_requests (LR-xx) pins the slots the lexicon component must fill; the page-name forms stay (to-verify) until then."

ref_tags:
  TT: "corpus/knowledge/culture-material/textile-technology.md — §1 four gates; §2 fiber hierarchy (worsted/woolen fork; minor fibers; linen whiteness); §3 dye chemistry, alum, monopoly template; §4 loom types + S/Z forensics; §5 fulling, grade words, stink trades; §6 lexical bounds; §7 checklist steps 1-3, 4, 5, 8, 9"
  MC: "corpus/knowledge/culture-material/material-culture-inference-method.md — §2 inference ladder and canon tags; §4 constraint table (seasonality; energy and fuel; transport; scarcity and source distance; perishability); §5 failure modes"
  TE: "corpus/knowledge/culture-material/trade-economy-lexicon.md — §1 Kula's law and the weighing drift; §2 measure sources (body / substance / action / container); §4 money-words that are weighings; §5 bargain registers; §7 split-object authentication; §8 risk grammar for instruments; §10 design levers"
  EP: "corpus/knowledge/culture-material/era-periodization-models.md — §1 emic vs etic periodization and the two-layer model; §2 the typology table; §4 logistics and vocabulary of the era seam; §8 the metal-age ladder is an etic museum schema"
  LM: "corpus/knowledge/synthesis/loanword-material-dating.md — §2 the six clocks and TPQ/TAQ; §3 loanword strata (immediate donor vs carrier; craft-domain clustering)"
  CG: "corpus/knowledge/verification/costume-era-consistency-gate.md — §2 freeze the claim; §4 MAT-01..08 route tracing; §5 textile-tech bounds T-01..T-03; §7 first surviving example is not the invention date; §8 supply states; §9 lexical access"
  QQ: "corpus/QUALITY.md — provenance, calibration, coupling, usability, canon hygiene"

follows:
  - "TT §1 — the four gates framework (fiber, dye, loom, finish) sets the block order of this file and the demand that each material name a gate"
  - "TT §2 — fiber hierarchy: wool as the state fiber, the worsted/woolen fork, linen's prestige as whiteness and thread count, nettle as a minor bast; minor fibers used here as plot seams"
  - "TT §3 — dye classes (vat, mordant, direct), fastness, alum as the trade's salt, the purple case study as the monopoly template"
  - "TT §4 — loom typology with the warp-weighted upright loom and its forensic signatures; width sets garment architecture; S/Z spin as the cheapest single forensic"
  - "TT §5 — fulling and finishing as the expensive half; grade words; the stink trades sit downstream of taboo"
  - "TT §6 — the binding rule: a culture cannot have a basic costume term for a cloth or color its four gates cannot make"
  - "TT §7 — application checklist: fiber suite (1), dye palette + monopoly chain (2), loom set and width (3), three-rung grade ladder (4), forensics paragraph (8), contrast drill (9)"
  - "MC §2 — inference ladder: local/import route claims are L4 (provenance and exchange) and carry the HARD tag only when a route is actually declared"
  - "MC §4 — constraint table rows used: seasonality, energy and fuel, transport and draft animals, scarcity and source distance, perishability"
  - "MC §5 — failure modes avoided: no ritually-explained trade without a route; no constraint chain without a stated culture choice"
  - "TE §1 — Kula's law: the selling measure and the buying measure differ; the weighing drift ingot-name to coin-name to account-name"
  - "TE §2 — measures come from the body, the substance, the action, or the counting technology (the salt-cake and the felt-day are substance- and action-units)"
  - "TE §4 — money-words begin as weighings; silver arrives by weight, not as coin, inside this window"
  - "TE §5 — bargain registers: the gate market's register is law-visible barter under an inspector, not posted price"
  - "TE §7 — split-object authentication: tally halves and cut objects are the contract's teeth (record hardware only; the design is the tally component's)"
  - "TE §8 — risk grammar: name the instrument after the body that bears the loss (here the load and the pass, not a hull)"
  - "TE §10 — design levers 1-3 and 6 applied: a guarantor for the measure, the drift written into the words, a measure vow, a market bargain grammar"
  - "EP §1 — emic and etic cuts are separated; era labels below are working handles, and the cosmic layer stays a separate attributed layer"
  - "EP §2 — era typology: the D2 count is a seasonal station count (an eponym-style administrative layer), not a dynastic cycle"
  - "EP §4 — the era seam has logistics: what breaks and what is recut when a count changes"
  - "EP §8 — no Stone/Bronze/Iron ladder: D2's eras are social and seasonal, and imported metal does not make an 'age'"
  - "LM §2 — every import claim is dated to a clock: material import, lexical loan, and documentary use are separate events"
  - "LM §3 — craft-domain loan clustering: the dyer's, trader's, and scribe's vocabularies are separate loan strata"
  - "CG §2 — freeze the claim before reviewing it: this file fixes the substrate so a costume claim can be frozen against it"
  - "CG §4 — MAT-01..08: market name separated from identification; import stage named; dye auxiliaries tracked; reuse declared; thread and closures declared"
  - "CG §5 — technique bounds: cloth width, spun vs reeled, felt is not woven, sheep are plucked before shears"
  - "CG §7 — first surviving example is not the invention date; late arrivals are staged as arrivals here"
  - "CG §8 — supply states (external curiosity / specialist enclave / regional network) are the era vocabulary used per material"
  - "CG §9 — lexical access: a language may name an imported or prohibited cloth it cannot make; lexicon_requests uses this licence"
  - "QQ 1-5 — provenance, calibration, coupling, usability, and canon hygiene are the admission bar this file is measured against"

eras: [E1, E2, E3, E4]
era_slots:
  - id: E1
    label_candidate: "shelter era"
    regime: "local-only highland year; no road, no imports, no traded dyestuff; cords are the only record (seed); the camp uses both poles but trades with nobody"
    fiber_regime: "plucked fleece (no shears yet), ox-hair cordage, nettle bast, hide; felt carded only (no wool combs, so no combed grades)"
    dye_regime: "no dyed cloth; natural fleece colors (white, grey, dark) and hearth-smoke darkening; tannin darkens leather only"
    metal_regime: "sky-iron only — rare meteoritic iron cold-worked into awls and small blades; no smelting, no shears, no combs"
    energy_regime: "dung fuel; no charcoal (charcoal is a below-the-line import)"
    trade_regime: "closed inventory — every import route is explicitly excluded in this era (not unknown: excluded)"
  - id: E2
    label_candidate: "road era"
    regime: "the salt-and-dried-meat road opens with the lowland partner; the gate market formalizes; traded indigo arrives (sibling 08 registers it as the era-2 dyestuff)"
    fiber_regime: "iron shears and wool combs arrive as imports, so the clip is shorn and the combed grades (and first-shear) become possible; lowland plant-thread cloth and cord arrive as finished goods"
    dye_regime: "traded indigo at valley vats (fuel + lichen-free alkali + imported dyestuff); local wool-black from tannin and smith scale"
    metal_regime: "bloom iron in small lots (shears, combs, awls, knife stock); reforging at the winter camp; smith fuel is imported charcoal"
    energy_regime: "dung fuel for households; imported charcoal reserved for the forge"
    trade_regime: "external curiosity then specialist enclave (CG §8): one register, one vat, one forge"
  - id: E3
    label_candidate: "assembly era"
    regime: "the gate market becomes the open-sky assembly; the road's second generation of imports"
    fiber_regime: "lowland cloth widens from curiosity to a licensed category; madder and weld enter as dyestuffs and seed; a valley dye plot exists"
    dye_regime: "madder red and weld yellow with alum mordant; overdye green (indigo over weld) possible; the valley vat serves the licensed blues"
    metal_regime: "bronze (bells for the gate, harness studs), more iron (tools, fittings), silver by weight as stored value"
    energy_regime: "charcoal imports grow with the forge; dung fuel still the household norm"
    trade_regime: "regional network (CG §8) inside the road's season window"
  - id: E4
    label_candidate: "script era"
    regime: "script adapted late from the lowland trade partner (seed); trade accounts begin to leave the cord (sibling 08: the cord's meanings become ceremonial and fossil)"
    fiber_regime: "as E3, with the fuller grades of lowland cloth entering as luxury categories; the broadcloth trade"
    dye_regime: "as E3 plus the fugitive luxury pink; the licensed indigo remains the prestige hue"
    metal_regime: "as E3, plus writing metal (pen/knife stock) and finer trade weights"
    energy_regime: "as E3; the forge's charcoal demand is the standing constraint on all metalwork"
    trade_regime: "regional network; the register is written, the cord is ceremonial"
    media_regime: "writing media become a material line (see writing_media): hide parchment locally prepared, gall-and-iron ink from the tannin chain, imported paper late"
mythic_layer:
  - id: E0
    label_candidate: "the Winnowing (mythic layer, attributed only)"
    note: "the cosmic layer of the two-layer model (EP §1-2): storm and ascent narratives. No administrative count and no material record; any E0 material statement is an in-world belief and is never a design fact (MC §2 ladder, DESIGN tag)."

# ---------------------------------------------------------------------------
# materials — gate-compatible records (kind: local|import|reuse|alternative|excluded;
# stage: fiber|yarn|cloth|garment|dye|trim). excluded_eras marks a CLOSED
# inventory: a costume claim inside an excluded era is a contradiction, not an
# open question (CG §4 MAT-02).
