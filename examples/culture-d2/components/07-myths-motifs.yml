    contact: the same plot circulates in the lowland trade tongue, the contact event is the autumn fair, and the D2 version substitutes flock animals and drops the market entirely
    stratum: E0 fireside fabulate, then in E1 and E2 a herd-handbook lesson about reading the wind as well as the words, while the winter camp keeps the dismissal that it is only a surak
