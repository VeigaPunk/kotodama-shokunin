# 07-myths-motifs.yml — D2 design-drill component. NON-CANON sample design.
# kotodama-shokunin lane. Honored D2 shared culture seed, as fixed by the round
# contract examples/culture-d2/components/01-brief.yml
#   highland-plateau pastoralists; vertical transhumance; sky and wind cosmology;
#   clan-segmentary lineages holding pasture rights; wool, milk, meat economy;
#   salt and dried-meat trade with lowland farmers; pitch-accent isolate;
#   tally-cord records before a late-adapted script.
# Spine this component couples to, and may not leave: VERTICALITY (high and low,
# ascent and descent, the seasonal poles) plus WIND (breath, soul-carrier,
# storm law). D1's river and tie-and-bind imagery is refused, see spine_guard.
component: 07-myths-motifs
culture: D2
name: D2 07-myths-motifs, three typed narrative records with ledgers
canon: not canonized (D2 design drill)
status: NON-CANON sample design, proposals only; canon decisions are lore-shokunin's
id_namespace: MYTH- is the contract narrative namespace; this file contributes MYTH-06, MYTH-07 and MYTH-08, continuing the series begun in 06-pantheon with MYTH-01 to MYTH-05; nothing is renumbered
declared_namespace: MOT- is this file's own motif-law ledger prefix, not a contract prefix; each MOT- entry carries the MYTH- record it belongs to, alias MOT-xx to its MYTH-xx at assembly per RCN-02
follows:
  - corpus/knowledge/myth-symbol/creation-myths-taxonomy.md §2 master typology table, §4 emergence, §5 world-parent, §10 creation-by-speech complex, §11 layering rule and application checklist, §13 era and handoff notes
  - corpus/knowledge/myth-symbol/myth-folktale-genres.md §1 Bascom axes and emic genre words, §3 ATU chapter ranges and the lane-internal type convention, §4 charter audit, §5 genre strata, §6 euhemerism and mythologization, §8 record-fields checklist
  - corpus/knowledge/myth-symbol/hero-journey-variants.md §2 Rank and Raglan hero-birth pattern family, §6 build order for a fictional culture
  - corpus/knowledge/myth-symbol/motif-index-usage.md §5 coherence audit, §6 orphan motifs, §7 notation and handoff protocol
  - corpus/knowledge/myth-symbol/pantheon-archetypes.md §2 recurrent roles, §5 how roles distribute, §7 pantheon build protocol
  - corpus/knowledge/myth-symbol/cosmology-cosmography.md §2 axis-mundi vehicles, mountain and pole-star rows, §3 layered cosmos
  - corpus/knowledge/myth-symbol/comparative-frameworks.md §1 emic versus etic rule, §7 calibration checklist
  - corpus/knowledge/synthesis/worldbible-integration-contract.md §3 ownership decision table, §6 keep claim kind and canon status separate, §8 transfer and receipt procedure
  - corpus/knowledge/synthesis/myth-to-language-derivation.md §2 keep the mechanisms distinct, §7 sacred lexicon and divine names
  - corpus/knowledge/synthesis/symbolism-consistency-rules.md §3 define the lookup key before assigning a meaning, §7 era drift
  - corpus/knowledge/verification/myth-consistency-gate.md §3 P, §4 M, §6 S via tools/gates/myth-consistency-gate.py
spine_guard:
  note: D1's declared spine is river and binding; D2 couples to verticality and wind only. Each refusal is deliberate design data.
  refusals:
    - refused_river_agency: no river, flood or flowing-water agent carries the D2 cosmos; the moving medium is rising air and the still air that can fail to turn.
    - refused_tie_as_cosmos: the tally-cord is a record device, and per RG-01 it encodes by vertical position on a hanging line, height equals magnitude, tying is a manufacturing act and never a metaphor for obligation or kinship. No myth action in this file is done by tying or knotting, and D2 oaths are spoken and smoke-tested, never knotted.
    - refused_alphabet_primordial: the script arrives late by adaptation from the lowland trade partner, the sacred register is pitch and measure, not letters.
    - refused_flood_eschatology: the D2 end-shape is a year that fails to turn, not an inundation.
