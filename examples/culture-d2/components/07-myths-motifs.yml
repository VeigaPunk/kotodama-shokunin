symbols:
    - sign: the gate, the pass, the fifth slot
      medium: the cairn field at the top of the route
      era: E0
      register: crossing the pass
      audience: any traveler
      domain: a count kept by walking
      exclusive: false
      notes: the first stone of a cairn is never taken away, added stones are the honest tally that replaced the first-step claim
      axis: verticality
      evidence: MYTH-06 beat six
    - sign: the turning wind of the descent opening
      medium: felt streamers and the smoke column read at dawn
      era: E0 and E1
      register: the contract day and the descent opening
      audience: the pass-watch and the watchers
      domain: the day is opened by the wind and not by a count
      exclusive: false
      notes: the ascent day and the descent opening are read, never computed, which is the calendar's own honesty check
      axis: wind
      evidence: MYTH-07 beat six
    - sign: the smoke test at the pass
      medium: the smoke column read against the bent wind
      era: E1
      register: oath taking
      audience: parties under oath
      domain: a spoken promise carries only while the smoke bends
      exclusive: false
      notes: the test is the institution that keeps the origin of the sealed hole live in ordinary law
      axis: wind
      evidence: MOT-01 variant var-a2
    - sign: the chough at the pass
      medium: the bird on the wind, never a killed body
      era: E0 onward
      register: the ascent
      audience: herders on the way up
      domain: the way is open and the trickster's body is not to be killed
      exclusive: false
      notes: the bird that rode the upslope wind through the last span, read from the air and never from a corpse
      axis: wind
      evidence: MYTH-06 beat four
motifs:
  - id: MOT-01
    record: MYTH-06
    tier: myth
    title: The Sealed Hole and the Held Breath
    code: KTD-M0001
    index_note: no ATU or FFC identifier claimed, so no entry check is required; the type claim is the emergence type with a world-parent parting and a creation-by-breath layer, per corpus/knowledge/myth-symbol/creation-myths-taxonomy.md §2 and §11
    axis: both
    evidence: design-choice
    law:
      rule: a held breath that refuses the smoke test returns as weather
      when: a shelter seals its smoke hole and refuses the count at the cairn
      then: the held breath breaks the seal as storm
    variants:
      - id: var-a1
        teller: the imtur reciters at the ascent
        register: the ascent opening, in open air
        asserts_law: true
        events:
          - actor: the hoarding line
            action: a shelter seals its smoke hole and refuses the count at the cairn
            effect: the held breath breaks the seal as storm
      - id: var-a2
        teller: the smoke testers at a contract day
        register: a hearing, smoke read against the wind
        asserts_law: true
        events:
          - actor: the record keepers of the upper lines
            action: keep the tally covered and answer no question at the hearing
            effect: the road keeper voids their market vow and the year is read against them
        exception: the testers use the fault as an accounting lesson and stop short of the weather clause
      - id: var-a3
        teller: a herder lineage at a winter telling
        register: fireside counter-reading
        asserts_law: false
        events:
          - actor: a grazing line
            action: seals the smoke hole and refuses the count at the cairn
            effect: nothing follows, and the herders say storms come with the season and not with a verdict
  - id: MOT-02
    record: MYTH-06 secondary and MYTH-07 etiology
    tier: myth-law carried into legend
    title: The Route Stays Open Only While It Is Walked
    code: KTD-M0002
    index_note: no ATU or FFC identifier claimed; the route-as-deed hook follows corpus/knowledge/myth-symbol/creation-myths-taxonomy.md §4
    axis: verticality
    evidence: design-choice
    law:
      rule: a route stays open only while it is walked
      when: a lineage skips the ascent for one season and stakes no cairn stone
      then: the path closes and the title lapses to the lines that walked
    variants:
      - id: var-recited
        teller: the ascent reciters and the pass-watch
        register: the cairn field at the top of the route
        asserts_law: true
        events:
          - actor: the upper line
            action: a lineage skips the ascent for one season and stakes no cairn stone
            effect: the path closes and the title lapses to the lines that walked
          - actor: Humweha
            action: counts the ended breath at the Still Camp below
            effect: the count of ended breaths is kept and no name is spoken once it is entered
      - id: var-clerk
        teller: the E1 pasture clerks
        register: a written clause read in the valley
        asserts_law: false
        events:
          - actor: a written line
            action: skips the ascent for one season and stakes no cairn stone
            effect: the clause still holds and the pasture is kept, since the slip says so and the slip is the deed
  - id: MOT-03
    record: MYTH-07
    tier: legend
    title: The Shared Pass of Imkora
    code: KTD-M0003
    index_note: no ATU or FFC identifier claimed; the pattern handling follows corpus/knowledge/myth-symbol/hero-journey-variants.md §2 and §6
    axis: verticality
    evidence: design-choice
    law:
      rule: the one who will not share the pass winters alone
      when: a line claims the first step and the private pasture
      then: the wind turns the claim back and the line winters alone
    variants:
      - id: var-ascent
        teller: the ascent recitation in its E0 form
        register: the cairn hearing at the pass
        asserts_law: true
        events:
          - actor: the rival line
            action: a line claims the first step and the private pasture
            effect: the wind turns the claim back and the line winters alone
          - actor: Imkora
            action: sings the count at the cairn and assigns the lower summer pasture to the rival line
            effect: the rotation holds and both lines climb together the next spring
      - id: var-court
        teller: the E1 shrine reciters
        register: a festival telling for the shrine keepers
        asserts_law: true
        events:
          - actor: Imkora
            action: sings the count at the cairn and assigns the lower summer pasture to the rival line
            effect: the keepers add that Kahatu turned the wind by his own hand
        exception: the divine hand and the writing slip in this telling are E1 insertions, recorded as seams and not as E0 content
      - id: var-lowland
        teller: the lowland market version
        register: a trading-season entertainment
        asserts_law: false
        events:
          - actor: Imkora
            action: takes the pass by force and drives the rival herd down the mountain
            effect: the lowland tellers make him a raider and a rain-bringer, and the D2 reciters reject this telling
  - id: MOT-04
    record: MYTH-08
    tier: folktale
    title: The Fool Who Carried the Wind
    code: KTD-T0001
    index_chapter_range_ref: ATU 1200 to 1999 anecdote and joke chapter range only, no type number claimed
    index_checked: true
    index_edition: Uther 2004 chapter ranges as tabulated in corpus/knowledge/myth-symbol/myth-folktale-genres.md §3
    index_witness: the D2 telling recorded as MYTH-08 in this file, a lane-internal KTD-T type id per the house convention for cultures outside the European analog zone
    axis: wind
    evidence: design-choice
    law:
      rule: the exact word without the turned wind is spent breath
      when: a reciter carries perfect words down and does not read the turning wind
      then: the herd is lost in the storm
    variants:
      - id: var-village
        teller: the small-line herders
        register: fireside entertainment, opened with surak surak
        asserts_law: true
        events:
          - actor: Korim the exact speaker
            action: carries perfect words down and does not read the turning wind
            effect: the herd is lost in the storm
          - actor: Toksu the lagging one
            action: brings the flock down slowly and reports the turned wind at the gate
            effect: his flock lives and so do the lines that waited for the wind
      - id: var-market
        teller: the lowland carters and market traders
        register: a market entertainment
        asserts_law: false
        events:
          - actor: the servant
            action: tells the master that a storm is coming and is beaten for idleness
            effect: the market version rewards a lucky bargain and drops the wind entirely
      - id: var-lodge
        teller: the winter camp reciters
        register: the winter telling season, an official dismissal
        asserts_law: false
        events:
          - actor: the winter camp reciters
            action: call the tale a surak and nothing more, wind-spent speech
            effect: the reciters keep their register and admit the tale only after the descent
records:
  - id: MYTH-06
    title: The Climb Out of the Low Rests
    form: myth
    type_tags:
      dominant: emergence, the lines climb out of the low dark rests into this world, per creation-myths-taxonomy.md §4
      secondary: world-parent parting, applied as the sky-holder stepping aside so breath and weight part, rather than the sky-father earth-mother couple, per §5
      ambient: creation by breath, the speech complex riding on the other type rather than an eighth type, per §10
      refused: creation by combat is absent by design, D2 has no dragon-slaying charter and no victor-king
    truth_claim: told as true and sacred, recited in the pitched imtur at the ascent opening
    von_sydow: neither memoral nor fabulate, the recitation is an office text and the teller is a licensed reciter
    emic_genre_word: imtur, the turning telling, the ascent recitation
    formula:
      open: the reciter holds one high note before the first word, the note is the genre boundary in performance
      close: the final line is repeated at a lower pitch, which marks the end of the telling
    setting: primordial, the low rests below, then the earth when it was still other
    cast: nonhuman, Halatu the sky-holder who appears in the formula only, the ancestor-powers who climbed, and the chough that rode the upslope wind
    context:
      teller_class: the imtur reciters, licensed at the ascent opening
      occasion: the ascent opening in open air and the cairn field at the gate
      venue: open ground above the shelters, never a roofed room
      forbidden_audiences: the third fault is never recited while people are inside a shelter, and children hear only the first two beats
      response_formula: the listeners answer each beat with the held note, no words
    charter:
      audit: recited by the imtur reciters to all lines at the ascent opening, to make herders walk the route, stake the cairn stones and speak at the smoke test
      status: charter, core of the system
      validates: the seasonal ascent, the route recitation as pasture title, the rule that no one may hold back the breath of an answer at a hearing, the kill-tabu on the chough, and the ban on graves in the high pasture
    functions: [validation, education, conformity]
    index: no ATU, motif or FFC identifier is claimed in world; the gate ledger entry is MOT-01, code KTD-M0001
    oicotype: D2 markers are the smoke hole, the tally-cord, the cairn field and the held note; a lowland telling of an equivalent creation would substitute carts, doors and bells
    contact: none claimed, the emergence layer is generated, not borrowed, and no shared type is attributed to the trade partner
    stratum: E0 recitation, unchanged in E1 and E2 except that the smoke testers added an accounting reading of the third fault, which is itself the interpretive seam
    variants:
      - the E0 ascent opening, beats one to six in open air
      - the smoke tester reading, the sealed hole told as an accounting lesson, recorded as a counter-reading and not as doctrine
    frame_tags: etic, emergence plus parting plus breath complex, per comparative-frameworks.md §1
    axis: both
    evidence: design-choice (to-verify against ER- and PAN- records)
    canon_status: proposal for lore-shokunin, the smoke tester reading is flagged and not resolved
    deps: [{component: 06-pantheon, ids: [PAN-01, PAN-02, PAN-03, PAN-04]}, {component: 05-lexicon, ids: [UNRESOLVED]}, {component: 08-symbols, ids: [UNRESOLVED]}, {component: 09-eras, ids: [UNRESOLVED]}]
    narrative:
      beat_1_the_low_rests: in the dark rests below, the lines kept their herds and the world had no height worth naming and no season between the two ends of the year
      beat_2_three_faults: the bad count, a line claimed more flock than the tally-cord showed, and the count no longer matched the herd; the first-step claim, a line claimed its foot had been first where another's had been, and a resting ground was taken unwalked; the sealed hole, the hoarding line covered its smoke hole to keep its warmth and refused to answer at the cairn
      beat_3_the_parting: the held breath of the refusers pressed upward against a sky that Halatu held off the peaks, and the pressed breath lifted it, so the reciters say the first wind is the sum of refused breath and the holder stepped aside
      beat_4_the_climb: while the sky lifted, the chough rode the upslope wind through the last span and the lines climbed with their herds, and the bird is not killed at the gate because the way was found on the wing
      beat_5_the_measure: the first thing heard in the opened space was not a name but one held note, and the reciters say the width of a pasture and the length of a season are that note held longer or shorter, which is why the imtur is sung rather than spoken and why the language carries pitch
      beat_6_the_debt: the route stays open only while it is walked, the high pasture stays clean of graves because the body is weight and is laid low while the ended breath is counted by Humweha at the Still Camp, and the year itself can fail to turn if the walking stops
    origin_of_evil: the wrong in the world began as a bad count, a false first step and a sealed hole, the first two made unequal herds and the third made weather
    eschatology_constraint: emergence type, the next world is another climb, and the end-shape is the Unturned Year, a year whose wind does not turn, since a turn that does not open cannot be climbed
    sacralized_profession: the imtur reciters who keep the pitch, and the pass-watch who read the turning wind and open the day
    language_behavior_package:
      sacred_register: the pitched recitation, distinct from herders' speech, with a fixed high note opening each beat
      taboo_lexicon: a dead person's personal name is not spoken once the count is entered, and the keeper's name is not said while a body lies unwashed
      oath_form: the spoken count at the cairn, tested by smoke against the wind, never a tied or knotted token
      recitation_genres: imtur for the myth register and kordul for the legend register as high-prestige speech, with surak as the marked low genre
      naming_power: to say a count aloud at the cairn is to fix the herd of the year, so reciting a false count is the cosmic crime class of this culture
      resistance: the reciters hold that translating the imtur breaks the pitch, so translation is treated as a form of lying rather than as loss
    couplings:
      - PAN-01 Halatu carries the incipient name of the sky-holder and PAN-02 Kahatu receives the oath, both by id, no agent is invented here
      - PAN-04 Kalweha counts the herd in and PAN-03 Humweha counts the ended breath, which is why the ascent and the burial are told in one breath in beat six
      - symbol_ref, the gate, the turning wind, the smoke test and the chough in the symbols block
    craft_hooks:
      - a sealed smoke hole in a shelter is a bad sign and an accusation waiting to be made
      - anyone who withholds an answer at a hearing can be charged with holding breath, which turns ordinary politics into a weather risk
      - the kill-tabu on the chough, the trickster's own body, gives a court case and a famine story from one line of the recitation
    friction_and_counter_readings:
      - the smoke testers read the sealed hole as storage and ventilation practice, a rationalizing drift the reciters do not answer
      - upland herders say storms come with the season and not with a verdict, recorded as an emerging doubt rather than as a denied law
    to_verify: the pitch inventory waits on 02-phonology; the count of three low rests and the counted faults is provisional and waits on 08-symbols
  - id: MYTH-07
    title: The Shared Pass of Imkora
    form: legend
    type_tags:
      bascom: legend, historical past, this world, told as true, human heroes without a divine birth
      von_sydow: fabulate, told in the third person as something that happened to the ancestors of the lines
