      - the cairn is a title deed anyone can read and a wager about stones removed
      - the tasul seam gives in world scholars a way to date the written copies, if lore wants a historical method in the valley
    friction_and_counter_readings:
      - the shrine reciters hold that the divine hand is the older layer and the small lines hold that it was added at the shrine, and the file records both tellings without choosing
      - the lowland telling is rejected by the reciters and still circulates at the fair, which is the contact seam in ordinary life
