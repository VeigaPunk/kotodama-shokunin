    narrative:
      beat_1_the_wager: at the summer pasture two herders wager on who can bring word of the cairn hearing down to the winter shelters by nightfall, the loser to give a lamb
      beat_2_the_exact_speaker: Korim learns every word of the hearing, runs down unencumbered and recites it perfectly, and the lines act by the words and drive their flocks through the gate
      beat_3_the_lagging_one: Toksu will not leave the flock, and he comes slowly, watching the smoke bend at the gate and the wet wind on his cheek
      beat_4_the_storm: the wind turns behind the words, the gate shuts, and the flocks that went through on the perfect words are caught
      beat_5_the_arrival: Toksu arrives late with his flock and with the news that the wind had turned before he left the cairn, and the lines that waited on the wind live, while the exact words are found to be perfect and useless
