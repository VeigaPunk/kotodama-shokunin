    form: folktale
    type_tags:
      bascom: folktale, no fixed time, told as fiction, ordinary human protagonists
      von_sydow: fabulate, third person, marked in performance by the opening formula
      atu_fit: the nearest chapter is the anecdote and joke range, the type id is lane-internal KTD-T0001 per the house convention for cultures outside the European analog zone
      teller_class: the winter telling season after the descent, which is where the trickster's tales and this tale both live
