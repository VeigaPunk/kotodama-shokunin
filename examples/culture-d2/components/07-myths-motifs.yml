    narrative:
      beat_1_the_still_winter: the wind failed to turn for a whole span of the cold season, all lines held the valley at once, the grazing failed early, and a big line claimed the best low ground on a count no one could check
      beat_2_the_young_herder: Imkora of a small line asked the pass-watch to open the ascent by the turning wind instead of by the count, and asked the three lines to drive their flocks up together on the first readable day
      beat_3_the_taken_flock: at the gate the rival head claimed the first step and drove off part of Imkora's flock, the old fault of MYTH-06 returning in the same shape
      beat_4_the_hearing_at_the_cairn: the parties sang their counts in turn, no one was allowed to hold back the breath of his answer, the smoke bent with the wind for the whole singing, and the pass-watch read the turn as the answer
      beat_5_the_shared_pass: Imkora had won the claim and still assigned the lower summer pasture to the rival line, and he fixed the rotation so that no line takes the same rest in two years, which is the rule the recitation still carries
      beat_6_the_etiology_set: each crossing stakes one cairn stone and the first stone is never taken; the day is opened by the turning wind and not by a count; salt is carried down and grain up on the same route, and the lowland receipts were refused at first and copied from in the end
      beat_7_the_end: Imkora died at the high pasture in his last summer, the body was carried down and laid low, the breath was counted at the Still Camp, and the stone heap at the gate is a lineage marker, not a divine shrine, which is the point the E1 reciters blur when they give him a divine hand
    charter_audit_note: the tale licenses pasture rights through the walked route rather than through descent, which fits a segmentary society that must give a reason why a small line can hold a high pasture
    vestigial_element: the first-step claim is no longer actionable once the cairn tally replaced it, so one of the tale's own conflicts is institutional rubble
