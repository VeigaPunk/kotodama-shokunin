era_tags: [E0, E1, E2]
era_note: E0 is pre-writing highland with tally-cords only, E1 is the trade-contact seam when the script is adapted, E2 is the literate anchor era; the era names and dates live in 09-eras and are not restated here
pantheon:
  - name: Halatu
    role: archaic sky-holder, demoted, formula only
    domain: holds the sky off the peaks, the world-axis as a standing figure
    era: E0 formula; demoted at the E1 charter
  - name: Kahatu
    role: storm-law and oath patron
    domain: thunder, hail, blizzard and thin air over the saddle; the wind that answers a false oath
    era: E0 ridge cult; confederation oath patron from E1
  - name: Humweha
    role: keeper of the ended breath
    domain: death, breath-souls, the tally of ended breaths, the Still Camp at the lowest shelter
    era: E0 onward
  - name: Kalweha
    role: the high pasture's power, herd increase and milk, the ascent
    domain: the summer pasture, milk, lambing, wool, the opening and closing of the high stay
    era: E0 onward
  - name: Seratu
    role: keeper of the salt road, strangers and trade vows
    domain: the down-road, the salt springs, the boundary stone, foreign names and the lowland receipts
    era: E1 with the opening of the road
  - name: Suweha
    role: trickster, the wrong-time wind
    domain: the wind that blows a round backward, the winter telling season, the one-day reversal at midwinter
    era: E0 tale figure; the reversal rite is attested from E1
  - name: Ula
    role: human founder of the salt road, deified in the later cult
    domain: the first descent with salt, the written receipt, the market vow from E2
    era: person in E1; cult from E2
pantheon_view_note: These seven entries restate the roles this file's records depend on and are a reference view of 06-pantheon; the PAN ids are PAN-01 Halatu, PAN-02 Kahatu, PAN-03 Humweha, PAN-04 Kalweha, PAN-05 Seratu, PAN-06 Suweha, PAN-07 Ula, and any rename or role change in 06 supersedes the wording here.
reconciliation_findings:
  - id: RC-1
    finding: 06-pantheon already carries MYTH-01 to MYTH-05, so the three narratives here take MYTH-06 to MYTH-08 and their overlaps are named rather than merged
    detail: MYTH-01 The pass-opening and MYTH-05 The holder steps aside overlap the opening and the demotion in MYTH-06; MYTH-04 The first descent with salt belongs to PAN-07 Ula and is not retold here; MYTH-06 to MYTH-08 add the creation climb, the ascent-rotation legend and the folktale, none of which 06 carries
    action: assembly finding for the integrator, not resolved by this file
  - id: RC-2
    finding: possible sibling tension about the direction of the dead, flagged not resolved
    detail: 06-pantheon PAN-03 carries the last breath below to the Still Camp, while the lexicon lines for the upper breath and the upslope wind read the soul as carried upward. This file follows 06 in its own records, since the pantheon owns the agent, and hands the tension to the integrator
  - id: RC-3
    finding: the myth-register terms in this file are proposals with no L- ids yet
    detail: imtur, kordul and surak are coined here for the recitation, legend and folktale registers and each carries a to-verify note; the lexicon component owns the final forms
  - id: RC-4
    finding: the folktale law invokes the wind-turn, which 09-eras-calendar fixes as the observation that opens the descent at GATE-TURN
    detail: the tale is consistent with that gate and adds no calendar machinery of its own
