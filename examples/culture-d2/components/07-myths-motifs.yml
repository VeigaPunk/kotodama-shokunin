  - the pantheon roles are a reference view of 06-pantheon, any rename or role change there supersedes this file
  - the ERA tags E0, E1 and E2 are contract-fixed and the names and dates belong to 09-eras
  - the four coined words imtur, kordul, surak and tasul wait on 04-lexicon or 05-lexicon for L- ids
  - the three names Imkora, Korim and Toksu wait on 08-names for NM- records
  - the symbol keys wait on 08-symbols, and the found sibling tension about the direction of the dead is handed over in reconciliation_findings RC-2
canon_boundary: Reference design and method only. Which telling a culture holds sacred, who is licensed to say it, whether the gods were men, and which variant is true in world are lore-shokunin's decisions. This lane delivers the typed records, the ledgers, the strata and the flagged seams above; every canonical question is handed over open, not resolved.