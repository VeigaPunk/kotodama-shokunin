      E1 promotion: the shrine reciters made the tale the second stanza of the imtur and added that Kahatu turned the wind by his own hand
      E1 and E2 demotion strand: the lowland telling recasts Imkora as a raider and a rain-bringer, which the D2 reciters reject
      seam_marker: the loanword tasul for the lowland receipt appears in the oldest written copies but cannot belong to the E0 events, so the copies carry their own dating evidence
