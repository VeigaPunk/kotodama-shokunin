  MYTH-06: dominant emergence, secondary parting, ambient creation by breath, time-shape a spiral of climbing worlds, sacralized profession the imtur reciters and the pass-watch, origin of evil the three faults, eschatology constraint the Unturned Year, language package the pitched recitation and the smoke-tested oath, open items the pitch inventory and the count of three
  MYTH-07: tier legend, charter the rotation and the cairn tally, strata seams the divine hand and the tasul loan, open items the E0 to E1 seams and the hero's name
  MYTH-08: tier folktale, functions entertainment with education and satire, register word surak, open items the handbook use and the two names
calibration:
  - Bascom's four forms are an etic idealization and boundary cases are expected; the promotion of a legend into a liturgy is exactly such a case and is recorded rather than smoothed, per myth-folktale-genres.md §7
  - Eliade's renewal-by-reenactment is used here as design language for the ascent and not as ethnographic fact, and the akitu-style performance link stays contested, per creation-myths-taxonomy.md §12
  - the emergence type is a sorting bin and type sharing does not imply relatedness, so no real tradition is claimed as the source of this cosmogony, per comparative-frameworks.md §7
  - the hero monomyth and Rank psychoanalysis are generation heuristics only, and the Rank pattern is recorded by its absence, per hero-journey-variants.md §2 and §7
  - charter theory is used as a use and not as an origin theory, and one element, the first-step claim, is deliberately tagged vestigial, per myth-folktale-genres.md §4
  - no invented scholarship is cited anywhere in this file, every citation is a path into this repo, and each unverified design item carries to-verify
