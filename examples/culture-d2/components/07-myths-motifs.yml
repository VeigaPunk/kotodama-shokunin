coherence_audit:
  basis: corpus/knowledge/myth-symbol/motif-index-usage.md §5, five checks, run as a designer audit and not as an index measurement
  negative_evidence: the inventory is cold in the captive and flight letters, which matches a pastoral society whose wars are boundary claims and flock raids, and that coldness is itself a belief, the lines say a taken flock can be counted back and a taken person cannot
  tabu_symmetry: each tabu in the tales maps to a rule, the unspoken name of the dead maps to the keeper's tabu, the chough maps to the kill-tabu, the withheld answer maps to the smoke test, and the high pasture grave ban maps to the grazing and milk law
  reward_economy: the tales run on measured rather than magical causality, the counted act is rewarded and the uncounted act is punished, which matches the tally-cord economy; there is no luck chapter and the absence is deliberate
  era_calibration: E0 stock is ascent and test heavy, E1 and E2 add the clerk, shrine and market tellings, which is the expected drift when a script and a fair enter
  contact_fingerprints: the lowland versions share the plot and drop the wind, which reads as a recent neighbour borrowing a shape without its climate, and no type is claimed as common inheritance
  orphan_motif_check: the three seeds around the cairn are planted as a family, the ascent legend, the surak and the clerk counter-reading, so the cairn is not an orphan motif but a family with its own parody
  distortion_log: the deliberate single distortion from the Earth-default palette is the near absence of a reward and fate chapter, recorded here so lore can pick it up or reject it
