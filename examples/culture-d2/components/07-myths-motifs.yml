    formula:
      open: surak surak
      close: the wind took the words
    setting: no fixed time, the gate and the low shelters, this world
    cast: two herders, Korim the exact speaker of a big line and Toksu the lagging one of a small line, with the pass-watch as a listening office
    context:
      teller_class: any adult teller, most often small-line herders, and the winter camp after the descent
      occasion: winter evenings and the stalled days after the descent
      venue: the low shelters and the fireside
      forbidden_audiences: not told while a hearing is in session, since a joke about the count inside a hearing is treated as contempt
      response_formula: the listeners answer surak surak at the close, and the teller is expected to add one animal to the flock count each retelling
    charter:
      audit: told by small-line herders to whoever sits at the fire, to make the camp laugh at the licensed reciters and to teach the turning wind without saying it as law
      status: entertainment first, education second, subversive third, explicitly not a charter
