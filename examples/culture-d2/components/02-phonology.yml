gate_run:
  tool: tools/gates/phonology-sanity-gate.py
  target: examples/culture-d2/components/02-phonology.yml
  command: "python3 tools/gates/phonology-sanity-gate.py examples/culture-d2/components/02-phonology.yml"
  expected: "exit 1 with REVIEW findings only, all of them A-NEUTRAL on the neutralizing rules AL-1, AL-2, and AL-7. No FAIL is expected and no finding is a contradiction"
  interpretation: "A-NEUTRAL is the gate's prompt that neutralization into another phoneme's phone needs a contrast witness or a reanalysis. Here the analysis is explicit — the nasal place assimilation neutralizes /n/ before labials (the contrast is witnessed in onset position, W-4 and W-5), and the final-breath rule cannot lose a contrast because /h/ is never licensed in a coda (P-3). Both are design intent, not defects"
  actual: "run at write time, 2026-10-17, on the delivered bytes — see gate_result. The three A-NEUTRAL findings are the only output; the run is reproducible with the command above"
  gate_result: "exit 1; three REVIEW findings, A-NEUTRAL on notable_rules[1] (n → m / _ p), notable_rules[2] (n → m / _ b), and notable_rules[7] (s → h / _ #); no FAIL, no G-DATA, no T-C, no T-V, no T-SYL, no P-* finding"
  parsed_check: "independent parse of the delivered bytes via the gate module — 15 consonants, all classified as IPA consonants; vowels a e i o u; tones 0; template (C)V(C) parses to onset 1, nucleus 1, coda 1; all nine notable_rules parse to a source, an output, and an environment"

pitfalls_check:
  PC-1: "§9.1 kitchen-sink — avoided. Fifteen consonants, every token inside a series (C-1 through C-6), no phoneme without a sibling"
  PC-2: "§9.2 orthography thinking — avoided. IPA tokens only in the inventory; the romanization is one symbol per phoneme and is declared once (WR-4)"
  PC-3: "§9.3 no phonotactics — avoided. Template, coda set, onset restriction, and negative controls (P-1 through P-5, W-21, W-22)"
  PC-4: "§9.4 uniform phoneme frequency — not claimed either way. Frequency skew is a corpus property and belongs to the lexicon component's word list, not to this chart"
  PC-5: "§9.5 tone as decoration — avoided. The accent is culminative, has a lexical class, a licensed shift, an origin, and a phrase layer (AC-1 through AC-7, CX-1 through CX-4)"
  PC-6: "§9.6 markedness inversion as politics — avoided. Size is justified from contact history (F-1), not from sophistication or virtue"
  PC-7: "§9.7 sound-symbolism dictionary-itis — avoided. §8 is not used to pick a single phoneme or vowel (F-7)"
  PC-8: "§9.8 pop-science determinism — avoided. Four contested seeds are declined with their citations (ENV-3 through ENV-6)"
  PC-9: "§9.9 one pronunciation per language — avoided. Four registers scoped (R-0 through R-3), with an invariant stated (R-4)"
  PC-10: "§9.10 achronic allophony — avoided. Every rule carries an origin, and one rule is specified as still in progress (P-5, AL-7)"
  PC-11: "§9.11 human anatomy for aliens — not applicable. The speakers are human; no articulatory spec sheet is needed"
  PC-12: "§9.12 inventory as complexity gauge — avoided. Complexity is budgeted in the accent system and the registers, and the size band is chosen, not scored"

