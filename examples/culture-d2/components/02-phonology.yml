canon_boundary: "This file is a non-canonized design drill for the D2 sample packet. It hands lore-shokunin a system specification with rule IDs, witnesses, and an explicit interface; it records no world-bible fact, assigns no canon population, dates no era, and rules on no script. Where a sibling component and this one disagree, the disagreement is reported in interface and open_questions rather than absorbed. Canon decisions remain lore-shokunin's, and the D1 contrast profile is honoured by construction — the design spine here is verticality and wind, and no river, tying, or binding material appears anywhere in the system."