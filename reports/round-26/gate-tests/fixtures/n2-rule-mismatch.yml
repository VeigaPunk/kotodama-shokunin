# negative N2 — a packet-declared derivation rule whose machine-readable
# pattern/output pair does not yield the delivered form. Fixture-only, NON-CANON.
name: "N2 declared rule does not derive its form (fixture-only)"
morphology:
  derivation_rules:
    - id: CX-99
      kind: suffix
      affix: "-ar"
      pattern: "^(?P<stem>.+)$"
      output: "{stem}ar"
      note: "fixture rule"
lexicon:
  - {id: N2-01, term: mesen, register: craft, derived_from: mes, derivation: CX-99}
