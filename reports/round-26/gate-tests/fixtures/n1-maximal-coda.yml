# negative N1 — the design's own named trap (design-language.md §5): the
# maximal-CODA reading of head2 gives `saalum`; the design fixes maximal-ONSET,
# so a form declared as head2(saalumi) but delivered as `saalum` must be
# D4L-ARGOT-DERIV. Fixture-only, NON-CANON.
name: "N1 maximal-coda head2 (fixture-only)"
phonology:
  consonants: [p, t, k, b, d, g, m, n, s, r, l, w, j, h]
  vowels: [a, e, i, o, u]
  phonotactics: "(C)V(V)(C)"
lexicon:
  - {id: N1-01, term: saalum, register: quote, derived_from: saalumi, derivation: head2}
