# positive control P1 for the negatives battery: the SAME shapes as N1/N2 with
# the form corrected, so the leg is shown discriminating rather than always-red.
name: "P1 corrected forms (fixture-only)"
morphology:
  derivation_rules:
    - id: CX-99
      kind: suffix
      affix: "-ar"
      pattern: "^(?P<stem>.+)$"
      output: "{stem}ar"
      note: "fixture rule"
lexicon:
  - {id: P1-01, term: saalu, register: quote, derived_from: saalumi, derivation: head2}
  - {id: P1-02, term: mesar, register: craft, derived_from: mes, derivation: CX-99}
