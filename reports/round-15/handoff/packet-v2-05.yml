coupling_edges:
  - edge_id: "BR01"
    source: "S01"
    relation: "method-transfer (asserted scope design-only, kind constructed-rule)"
    mechanism: "S01's retrieved lesson gloss marks a written Akkadogram (IS-BAT, romanized) whose explicitly stated Hittite reading differs (epta): one written citation form with a distinct spoken realization, declared inside a single clause. D3 copies only that separation as a constructed rule: U01/U02 both write lexeme L01's E0 citation spelling pina as written_form, while the market-ordinary reading (U01) uses the SC1-changed E1 spoken form and the hall-ritual reading (U02) is governed by the exactly matching avoidance rule AV1, which substitutes L02's E0 form. Written form and spoken form are therefore separable, declared slots rather than one identical string."
    limits: "Design-only: the written-layer-plus-register-reading coupling is a declared rule of a fictional language, not a claim about how Hittite or Hattic scribal practice worked, and no real-language genealogy is asserted. S01 is partial-support, mediated English teaching prose with tertiary corroborations; no cuneiform autograph or Hattic-language text was read; the Hattic non-IE and no-established-Caucasian-genealogy legs stay unsupported and the source stays partial."
    applicability: "design-only; eras and audiences as recorded on the target records"
    declared_in: "examples/culture-d3/packet.json"
    target_ids:
      - "U01"
      - "U02"
    claims:
      - "CL08"
  - edge_id: "BR02"
    source: "S02"
    relation: "method-transfer (asserted scope design-only, kind constructed-rule)"
    mechanism: "S02's museum record dates a pleated linen tunic to late Dynasty 11-early Dynasty 12, a garment feature attested before the period it is sometimes used to date, showing that one object-level trait cannot serve as an exclusive era marker. D3 transfers that caution: C01 (E0) and C02 (E1) keep the same M01 felt work-garment silhouette, so the two fictional eras are not distinguishable by a single decorative feature, and era assignment rides on declared material availability routes rather than on object appearance. No garment cut is reconstructed for either costume."
    limits: "Design-only construction on a fictional felt work garment; no real textile history is claimed and no statement is made about pleats, linen or felt in any real tradition. S02 is scoped-support from a museum object record carrying the museum's own dating caveat; findspot dating is catalogue attribution, not independent re-dating; record fields are transcriptions, not running prose; no cutting or pleating-set reconstruction exists here."
    applicability: "design-only; eras and audiences as recorded on the target records"
    declared_in: "examples/culture-d3/packet.json"
    target_ids:
      - "C01"
      - "C02"
    claims:
      - "CL09"
  - edge_id: "BR03"
    source: "S03"
    relation: "method-transfer (asserted scope design-only, kind constructed-rule)"
    mechanism: "S03 shows a naming-rite timing given as a discrete, school-specific set of named alternatives (ten nights, a hundred nights, or one year) inside one translated grihya prescription. D3 transfers the method, not the numbers: NR1 declares a closed discrete set allowed_offsets [2, 8, 20] with unit fictional-nights and chosen_offset 8, guard-checkable as a unique integer set. What transfers is the discipline of discrete, school-bound, named timing versus arbitrary or universal timing; the fictional numbers intentionally differ from the source's."
    limits: "Design-only: the offsets, unit and chosen value are invented; no claim that Gobhila or any school prescribed 2, 8 or 20 nights, and no universal ancient practice is asserted. S03 is translation-mediated English (Oldenberg 1892, including at least one conjectural emendation); the Sanskrit was not read; it is one school's domestic-rule text. The historical timings named there are 10 nights, 100 nights or one year and are deliberately not adopted as the fictional numbers."
    applicability: "design-only; eras and audiences as recorded on the target records"
    declared_in: "examples/culture-d3/packet.json"
    target_ids:
      - "NR1"
    claims:
      - "CL10"
  - edge_id: "BR04"
    source: "S04"
    relation: "analogy (asserted scope design-only, kind constructed-rule)"
    mechanism: "S04 distinguishes, inside one school's translated prescription, skins spread on the ground as a sitting surface (3.2.1.1-9) from a horn tied to the end of a garment as a worn attachment (3.2.1.18). D3 models that surface-versus-worn distinction as separate object slots: O01 is a ground-surface object with worn=false and O04 is a worn attachment with worn=true, and the object system forbids a ground surface from becoming a worn garment. The fictional hall system borrows only the abstract slot distinction, not the rite itself."
    limits: "Design-only: O01 and O04 belong to an invented office/display system, not a reconstruction of Vedic consecration; no rite, embryo or womb analogy, or world symbolism is copied. S04 is English translation only (Eggeling 1885); the Madhyandina/Kanva attachment difference is known through the translator's footnote, not first-hand Kanva Sanskrit; krsnajina denotes the skin, not the horn; one school's Soma-sacrifice prescription supports no pan-Vedic dress and no immutable black/white symbolism."
    applicability: "design-only; eras and audiences as recorded on the target records"
    declared_in: "examples/culture-d3/packet.json"
    target_ids:
      - "O01"
      - "O04"
    claims:
      - "CL11"
  - edge_id: "BR05"
    source: "S05"
    relation: "method-transfer (asserted scope design-only, kind constructed-rule)"
    mechanism: "S05 shows an archive in which daily records ran overwhelmingly in Elamite (about 15,000-18,000 documents) while a single Old Persian administrative tablet is explicitly described as an isolate that may not demonstrate general use: record languages are institution-specific, and one exceptional record does not universalize a medium. D3 transfers that separation: SY01's reading is scoped to a declared audience and era instead of a universal meaning key, and B01 is one attributed, disagreeing account of a record/voice institution whose truth status stays unresolved - an institution-specific record claim, never a universal speech power."
    limits: "Design-only: SY01 and B01 are constructed attributed fiction inside a fictional culture; nothing is asserted about real Persian religion, Achaemenid administration or subject populations' speech. S05 is partial-support: the Behistun cross-version leg and all-subject speech claims remain unverified, and the isolate tablet explicitly may not demonstrate general use; the secondary-scholarly ARTA article is mediation, not the archival documents themselves and not confirmation of any unread original."
    applicability: "design-only; eras and audiences as recorded on the target records"
