era_registry_ref: "09-eras-calendar.yml: eras, era_tag_map, named_eras, era_records"
era_aliases: {era-1: E0, era-2: E1, era-3: E2}
era_note: "A rule's era is its initial canonical stage; era_history preserves its full interval, renewals and transitions using the same tags. E0 covers ER-01..ER-06, not just Open Grazing; E1 is Marked Count (ER-07), E2 is Two Counts (ER-08), and E3 is the undated Still Air reservation (ER-09), unoccupied here. No finer founding date is inferred."

component: 12-rank-rules
culture: D2
canon: not canonized (D2 design drill)
title: "Rank rules — who may wear, say, and touch what (sumptuary law of D2)"
brief_ref: "examples/culture-d2/components/01-brief.yml (contract.rules RG-01..RG-08; contract.principles CP-07, CP-09, CP-11; contract.era_tags E0-E3)"
contract_conformance:
  rg_01_records: "Tally knots here are record geometry only - a count read by position on the hanging line (brief RG-01, D1B-02); tying appears once, as bale-cord manufacture, never as a figure for obligation or kinship. This file predates the brief and is conformed by declaration, not silently."
  rg_02_follows: "Every rule record carries `follows` (alias + section; each alias resolves to a corpus path + sections in the list below)."
  rg_03_ids_only: "Cross-component references use ids only: GAR-01..GAR-08 from 11-costumes (its ids match this file's `garment_refs`), LEX-DEG-1..7 and the packet `lexicon:` field for surface forms, the packet `eras:` for era names. No sibling file text is quoted."
  rg_05_axis: "This component predates the brief's axis rule; per-record axes are declared in `axis_by_record` below (neutral records carry a coupling_note there) rather than left implicit."
  cp_07_era_alias: "Pre-contract era handles are aliased in, never silently (CP-07): era-1 -> E0, era-2 -> E1, era-3 -> E2 (era_aliases). All record era values now use those canonical tags. Era names and dates belong to 09-eras-calendar: E0 covers Open Grazing through Bitter Smoke (ER-01..ER-06), E1 is Marked Count (ER-07), E2 is Two Counts (ER-08); E3 is reserved Still Air (ER-09)."
  cp_09_rank_basis: "Degree slots are pasture-right and office institutions (lineage head, wind-speaker, herd-master, herder household, shelter-kin, treaty stranger), never wealth grades."
  cp_11_status: "Every rule pairs `prescription` with `enforcement_reality`; the `calibration` block labels status; comparators cite corpus entries by path, and every unrouted item is marked (to-verify)."
