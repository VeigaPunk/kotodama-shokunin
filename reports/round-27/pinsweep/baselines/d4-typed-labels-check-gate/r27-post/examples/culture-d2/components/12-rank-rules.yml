scenes:
  - id: SC-1
    hook: "The winter cord check: a household head's coat is counted in public, and the count comes out one cord over."
    what_misfires: "the over-count belongs to a dead brother's ascents - the moot must decide whether the dead may lend their crossings"
    follows: [alias_sumptuary §4, alias_ritual §7.7]
  - id: SC-2
    hook: "A lowland trader in a bought D2 coat answers the summit greeting in the loan register."
    what_misfires: "the outfit passes, the speech fails; the fair court convicts on the formula and the traders' guild calls it a trap"
    follows: [alias_costume_semiotics §6]
  - id: SC-3
    hook: "Storm law on the high pasture: a stranger's coat is lifted to a herder who is not sworn to the mast, and the debt is reckoned after."
    what_misfires: "the coat belongs to another line; the storm-debt ledger must be read against the ascent cords"
    follows: [alias_ritual §7.2, alias_sumptuary §8.5]
  - id: SC-4
    hook: "A clergy of the lowland partner offers to write D2's law properly, with accents marked 'as best they can'."
    what_misfires: "a written clause without a tune is mute law - the moot must decide whether to recite the foreigner's vowel"
    follows: [alias_taboo §5, alias_registers §5]
  - id: SC-5
    hook: "A claimant takes the wind-standard's hem in the hand at the moot for a circuit she has not herded in ten years."
    what_misfires: "the hem has been taken twice this decade and shows; the felt remembers what the cord does not"
    follows: [alias_dress_eras §9, alias_ritual §7.5]
calibration:
  follows: [alias_mongol, alias_sami, alias_amazigh, alias_newar, alias_sumptuary, alias_coupling, alias_dress_eras, alias_taboo]
  status: "non-canon sample design for the D2 drill; nothing here is a claim about any real culture."
  real_world_precedent: "All precedent is cited through corpus entries, which carry their own sources and calibration labels; no new scholarship is invented here."
  contested_or_hedged:
    - "Sumptuary laws are not evidence of what people actually wore (dress-eras §12; sumptuary §1, §9) - hence the on-the-street column throughout."
    - "The 'four-class' style tidy pyramid is rejected; D2's degrees are a statute's grammar, not a social analysis (sumptuary §5 calibration)."
    - "Casta-style 'evidence mode' is used knowingly as a mode where the state lacks reach, not as a model of any society (sumptuary §7)."
    - "The wives-through-men clause is a legal-grammar artifact with plot consequences, not a claim about D2's lived gender order (sumptuary §6; amazigh dress-inversion caution)."
    - "Real comparators are used as single documented mechanisms, never as whole-culture templates (mongol dress-code worksheet; sami 'learned local reading, not a cryptographic table'; newar obligation needs a funded base)."
  design_flags:
    - "felt-days as a work-unit assay is this component's design choice; reconciled on landing: 10-materials.yml already works the felt-day as an action/substance measure (its measures block, citing trade-econ §2 with the salt-cake) and assumes the same G1-G3 grade slots this file uses."
    - "the ascent-cord count and the hem-claim are designed mechanics, not attested D2 facts; they exist to make the verticality spine enforceable"
open_checks:
  - "GAR-* ids reconciled with 11-costumes on delivery: its GAR-01..GAR-08 are declared to match this file's `garment_refs` ids and glosses (sibling scope note); its deps ids resolve here (17/17). GAR-09/GAR-10 are the sibling's own records and take no rules from this component."
  - "LEX-DEG-1..7 surface forms authored by the lexicon component; pitch-accent class is required on all of them (the tune is the law, SR-05)."
  - "era handles reconciled: legacy era-1/2/3 -> canonical tags E0/E1/E2 (see `contract_conformance.cp_07_era_alias`); record values use canonical tags directly, with rule intervals retained in era_history. Names and dates are 09-eras-calendar's: E0 Open Grazing through Bitter Smoke (ER-01..ER-06), E1 Marked Count (ER-07), E2 Two Counts (ER-08), E3 Still Air reserved (ER-09). Note for the integrator: 10-materials.yml works era slots E1-E4, which do not line up with the brief's fixed E0-E3 space; this file carries the brief tags and is not party to that mismatch."
  - "assay choice (felt-days) reconciled with 10-materials.yml, which uses the felt-day unit and the same G1-G3 grade slots (see `design_flags`)."
  - "corpus audit checklist (coupling §9) run at handoff: every row resolves garment <-> material <-> term <-> wearer <-> context <-> era, with explicit unknowns."
