stamp:
  lane: kotodama-shokunin
  round: 3
  date: 2026-10-17
  status: non-canon sample design
  one_line: "A knot-written sumptuary order for a vertical, wind-facing herding culture: rank is licensed by altitude band, enforced by felt-counters, and remembered in cords."
spine:
  verticality: "Every rule keys wear, speech, or touch to an altitude band (valley shelter / transit pass / high pasture) and to the seasonal pole the household currently occupies. The law is enacted low (winter moot in the valley) and its enforcement migrates with the herds."
  wind: "The storm is a legal person: storm law suspends some bans and creates others. Storm-names, the mast rope, and the recitation tune carry rules that are spoken, not knotted."
  anti_import: "No river, ferry, tying-of-knots-as-binding metaphor, or D1 alphabet imagery is used. Knots here are a counting/tally record (pre-writing), not D1's binding cosmology; the script arrives late from the lowland trade partner and is incomplete for law (it cannot write pitch accent)."
follows:
  - "alias_sumptuary = corpus/knowledge/culture-material/sumptuary-law-rank-display.md §1 (motives), §2 (six-axis typology + inspectorate table + craft rules 1-2), §4 (badge/office migration), §5 (hidden-luxury dialect), §6 (price-per-ell schedule; wives problem; informer moiety), §7 (dress-as-evidence mode), §8 (drafting formulae 1-10), §9 (calibration), §10 (build sequence 1-8)"
  - "alias_costume_semiotics = corpus/knowledge/culture-material/costume-semiotics.md §3 (channel grid; channel conflict), §4 (sumptuary display table; on-the-books vs on-the-street; display dial), §6 (legibility dial L3-L6; imposture theorem), §7 (signal drift)"
  - "alias_dress_eras = corpus/knowledge/culture-material/dress-through-eras.md §9 (garment-to-institution loans; hem as person-proxy), §10 (who-wears-what rule generator; two mechanisms minimum), §11 (staging protocol 1-8), §12 (debunk shelf: laws do not show what people wore)"
  - "alias_textile = corpus/knowledge/culture-material/textile-technology.md §2 (fiber hierarchy; fiber prestige), §3 (dye chemistry and monopoly design)"
  - "alias_trade_econ = corpus/knowledge/culture-material/trade-economy-lexicon.md §2 (measures incl. work-units and counting technology), §3 (sacred standardization; the inspector office)"
  - "alias_eras = corpus/knowledge/culture-material/era-periodization-models.md §11 (era-name semantic field), §12 (what to keep off the narrator's side), §13 (build order: era-change law before era names)"
  - "alias_coupling = corpus/knowledge/synthesis/costume-language-coupling-table.md §5 (design decision table), §6 (placeholder discipline), §7 (era staging of the relation), §8 (record shape: permission_basis, observed_departures), §9 (audit before handoff)"
  - "alias_taboo = corpus/knowledge/linguistics/politeness-taboo-euphemism.md §3 (taboo domains; sanction gradient), §5 (fossil strata: frozen euphemism, minced oath, legal fossil), §6 (construction procedure)"
  - "alias_registers = corpus/knowledge/linguistics/sociolinguistics-registers.md §5 (linguistic capital; courts as exchange counters), §8 (register mapped to era and social structure)"
  - "alias_ritual = corpus/knowledge/myth-symbol/ritual-liminality.md §7 (build order: rites, liminal medium, exchange grammar, calendar), §8 (calibration: rituals accrue false antiquity)"
  - "alias_cosmology = corpus/knowledge/myth-symbol/cosmology-cosmography.md §2 (axis mundi: built expression + ritual required before crediting a center), §9 (cosmography to language, names, costume couplings)"
  - "alias_mongol = corpus/knowledge/civilizations/mongol.md §'Deel and dress code — silhouette, occasion, entitlement' (court-issued clothing; dress-code worksheet; separate documented rule / observed preference / design inference)"
  - "alias_amazigh = corpus/knowledge/civilizations/amazigh-berber.md §'Tuareg matriliny and the apparent dress inversion' (write a dress rule as condition -> action -> audience interpretation -> exception)"
  - "alias_sami = corpus/knowledge/civilizations/finnic-sami.md §'Gákti: identity map with changing conventions' (dress as learned local reading, not a universal cryptographic table; maker/transmission network)"
  - "alias_newar = corpus/knowledge/civilizations/newar-nepal.md §6 ('Guthi: association, endowment, obligation' - recurring obligation needs a funded base and an accounted sanction)"
follows_note: "Per-record follows cite an alias plus a section (e.g. alias_sumptuary §8.4); the path for each alias is the corpus file named in the list above."
depends_on:
  - component: 11-costumes
    contract: "costumes: [{garment, material, wearer_rank, rite, era}] - each garment record carries a short id. This file consumes those ids; the `garment_refs` block below lists the ids this component requires with the gloss it assumes for each."
    status: "(to-verify) 11-costumes not on disk at write time; if its ids differ, remap by the gloss column - the rule text stays valid."
  - field: "culture-packet `lexicon:` [{term, gloss, field, etymology, layer}]"
    contract: "term ids referenced as LEX-*. This component does not coin surface forms; it pins the degree slots, their glosses, and the register/era distribution the lexicon component must satisfy."
    status: "(to-verify) form ownership stays with the lexicon component."
  - field: "culture-packet `eras:` [canonical short tags]"
    contract: "All record era values use E0 / E1 / E2 from 09-eras-calendar.era_tag_map; that component's named_eras and era_records own the nine names and ER-* ids, and its era_dates owns their dates."
    status: "round-4 alignment: tags and named-era coverage agree with 09; dates remain non-CE descent coordinates, and E3 is reserved."
