degree_slots_note: "The degree lexicon is the statute's real payload (sumptuary §10.3; §6 degree vocabulary). Slots below must be filled by the lexicon component at these ids and registers; surface forms are (to-verify)."
degree_slots:
  - id: DEG-1
    slot: "lineage head"
    rights: "moot seat; touch right on the lineage's own cord in the keeper's presence; may be appointed bearer of the lineage mast-sash; felt grades through G3"
    obligations: "answers for the lineage's bale audits; swears the knot-oath at every moot"
    required_term: {id: LEX-DEG-1, gloss: "lineage head (moot seat)", register: "legal/ritual", form: "(to-verify)"}
    follows: [alias_sumptuary §10.3, alias_sumptuary §6, alias_coupling §5]
  - id: DEG-2
    slot: "wind-speaker"
    rights: "may speak the storm-name above the snow-line; carries the mast rope under storm law; recites the moot tune that makes a written clause enforceable"
    obligations: "may wear no lowland thread above the pass; recites the dead-roll at the winter moot"
    required_term: {id: LEX-DEG-2, gloss: "wind-speaker (office)", register: "ritual/sacred", form: "(to-verify)"}
    follows: [alias_sumptuary §4, alias_registers §5, alias_taboo §3]
  - id: DEG-3
    slot: "herd-master, caravan-registered"
    rights: "may wear lowland cloth inside the fairgrounds; may tie bale seal-knots; votes second at the moot"
    obligations: "keeps the caravan register in the lowland script; answers for seal-knot counts"
    required_term: {id: LEX-DEG-3, gloss: "herd-master (registered)", register: "trade/legal", form: "(to-verify)"}
    follows: [alias_sumptuary §4, alias_sumptuary §7, alias_trade_econ §3]
  - id: DEG-4
    slot: "herder household"
    rights: "felt grades through G2; hem-cords up to recorded ascents; herds on the household's circuit"
    obligations: "passes the cord check at the winter moot; knots its own ascents"
    required_term: {id: LEX-DEG-4, gloss: "herder household", register: "everyday", form: "(to-verify)"}
    follows: [alias_sumptuary §2, alias_coupling §5, alias_textile §2]
  - id: DEG-5
    slot: "shelter-kin / attached client"
    rights: "felt grade G1 only; no hem-cords; may not wear combed white felt"
    obligations: "works the bales at shearing; recorded under a host lineage's cord, not its own"
    required_term: {id: LEX-DEG-5, gloss: "shelter-kin (client)", register: "everyday/legal", form: "(to-verify)"}
    follows: [alias_sumptuary §2, alias_newar §6, alias_costume_semiotics §3]
  - id: DEG-6
    slot: "fair-stranger (lowland trader under treaty)"
    rights: "may wear their own lowland cloth and fair coat; may count bale knots; may touch the salt-measure only through their own"
    obligations: "no felt above G1; no mast-sash; no storm-name; submits to the fair court"
    required_term: {id: LEX-DEG-6, gloss: "fair-stranger (treaty)", register: "legal/trade (loan layer)", form: "(to-verify)"}
    follows: [alias_sumptuary §7, alias_coupling §5, alias_costume_semiotics §6]
degree_gender_clause:
  rule: "A spouse takes the household's felt grade for the duration of the marriage; an appointed wind-speaker keeps the office sash regardless of household (office is not house degree)."
  caution: "This is the sumptuary 'wives problem' as legal grammar, not a claim about D2's lived gender order (sumptuary §6); write rules as condition -> action -> audience interpretation -> exception (amazigh, dress-inversion section)."
  required_term: {id: LEX-DEG-7, gloss: "spouse-of-household (grade-taker)", register: "legal", form: "(to-verify)"}
  follows: [alias_sumptuary §6, alias_sumptuary §8.6, alias_amazigh]
wear_rules:
  - id: WR-01
    sign_axis: "fiber/material - felt-day grade (felt-days per bale, G1-G3)"
    prescription: "No household under the degree of herd-master shall wear, nor take upon them to wear, a coat of felt finer than its recorded grade; a shelter-kin coat stays at G1; G3 is the summit grade, and no person shall wear above it. (Grades are read from felt-days, assayed below; the moot's habit of reciting the felt-day count aloud is the statute's real teeth.)"
    assay: "felt-days stamped at the bale seal-knot; the winter moot's cord check recomputes each household's grade from its own ascents and bales"
    authority: "Valley Moot statute; oldest cord in the archive"
    jurisdiction: "all circuits and all altitude bands (the only rule that follows the household everywhere)"
    era: "E0"
    era_history: "E0 (knot only) -> E1 (renewed in script) -> E2 (grade floors frozen, prices left to the fair)"
    enforcement_reality: "obeyed in the valley where the cord check runs; above the snow-line a household wears one grade up all summer and is not prosecuted, because no keeper is present and the claim is unassayable until winter"
    sanction: "knot cut (recorded ascents reduced), the coat's hem to the informing household, salt fine"
    follows: [alias_sumptuary §2, alias_sumptuary §10.1, alias_textile §2, alias_trade_econ §2]
    garment_refs: [GAR-01, GAR-02, GAR-03]
    precedent_via_corpus: "assayed material grades outlive price schedules (sumptuary §1, §9); felt-days is a work-unit measure on the model of acre-as-a-day's-plowing (trade-econ §2)"
  - id: WR-02
    sign_axis: "fiber/material - imported plant-thread cloth (the lowland partner's weave)"
    prescription: "None but a registered herd-master shall wear lowland-woven cloth, and none at all above the sell-line; lowland cloth is lawful dress only within the fairgrounds and on the valley road."
    assay: "the fair court reads the caravan register, kept in the lowland script, against the coat on the wearer; the cord archive records only who is registered, not what they wear"
    authority: "caravan treaty ratified at the winter moot"
    jurisdiction: "valley fairgrounds and valley road; void at transit and high pasture"
    era: "E1"
    era_history: "E1 onward (the treaty is the script's first D2 use)"
    enforcement_reality: "the fair court prosecutes strangers and the visibly overdressed, and almost never a registered herd-master's spouse, whose coat the register cannot name (the wives problem, sumptuary §6)"
    sanction: "forfeiture of the coat at the fair gate, half the coat's hem-value to whoever sues; at home, no sanction at all"
    follows: [alias_sumptuary §7, alias_sumptuary §6, alias_registers §5, alias_coupling §5]
    garment_refs: [GAR-04, GAR-06]
    precedent_via_corpus: "motive is read from the preamble, not the object, and this preamble is trade protection (sumptuary §1; §6 cap act); dress that must be assayed in a courtroom is the evidence mode (sumptuary §7)"
  - id: WR-03
    sign_axis: "trim/embellishment - hem fringe cords, one cord per recorded crossing of a named pass"
    prescription: "A coat shall carry no more hem-cords than the wearer's tally of recorded ascents; cords are knotted by the household and confirmed by the tally-warden at the winter moot."
    assay: "count of cords against the cord archive; a cord of the wrong twist marks an unconfirmed crossing"
    authority: "Valley Moot statute"
    jurisdiction: "all bands; the check itself happens only in the winter valley"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "the flagship counterfeit of D2 - over-fringed coats at the fair, cord-twist forgeries, and a summer trade in second-hand fringes; the moot prosecutes the forgers it can catch in the valley"
    sanction: "the over-count cords are cut at the moot in public; a forger's twist cord pays a bale"
    follows: [alias_sumptuary §8.3, alias_sumptuary §8.4, alias_dress_eras §10, alias_costume_semiotics §4]
    garment_refs: [GAR-03]
    precedent_via_corpus: "the regulated unit is a countable measure (stripe width, price per ell), never dignity in the abstract (sumptuary §2 craft rule 1)"
  - id: WR-04
    sign_axis: "garment-type/badge - the lineage mast-sash, issued annually to one bearer"
    prescription: "The mast-sash is worn by the lineage's appointed bearer alone, for the season of the mast's raising; no person shall wear another lineage's sash, nor a sash of their own making."
    assay: "the sash is issued and recalled at the moot; weights are tied into its end-cords and counted against the archive"
    authority: "lineage head with moot confirmation"
    jurisdiction: "all bands, because the mast travels with the herds"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "a forged sash is the only D2 dress crime that can end a family - it is read as a claim to the pasture right itself"
    sanction: "sash forfeited and burned; the wearer loses moot voice for a year; a repeated forgery ends the household's registration"
    follows: [alias_sumptuary §4, alias_coupling §5, alias_costume_semiotics §6]
    garment_refs: [GAR-05]
    precedent_via_corpus: "badge regimes are machine-readable rank that migrates from 'who you are' to 'what you hold' (sumptuary §4); forged badges are enough credential where the legibility dial is high (costume-semiotics §6)"
  - id: WR-05
    sign_axis: "rite/lifecycle - mourning finish (time-locked)"
    prescription: "For the year of a household's mourning, felt is worn shaggy and undyed, hem-cords are cut back by one, and lowland cloth is unlawful on the mourning body."
    assay: "the shaggy finish is visible; the cut-back cords are checked against the archive at the next moot"
    authority: "Valley Moot statute with the wind-speakers' recitation"
    jurisdiction: "all bands; suspended during storm law's first day (see TR-05)"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "observed hard - mourning is the one rule that is self-enforcing, because the shaggy coat is also the thing that shelters you from being spoken to"
    sanction: "none needed; the sanction is social, plus moot comment by the dead-roll reciter"
    follows: [alias_dress_eras §11.5, alias_costume_semiotics §3, alias_ritual §7]
    garment_refs: [GAR-07, GAR-04]
    precedent_via_corpus: "give the wardrobe a time-lock (season, rite, mourning) so choices read as literacy, not taste (dress-eras §11.5); mourning phases graded by kinship distance are a rite channel (costume-semiotics §3)"
  - id: WR-06
    sign_axis: "quantity/occasion - the wedding-day exemption"
    prescription: "Except on the day of her wedding, a spouse shall wear her household's grade and no other; on that day she may wear the grade of the household she enters, and its hem-cords for that day only."
    assay: "the exemption is recorded by the moot as a single-day entry; a second wearing is a knot cut"
    authority: "Valley Moot statute"
    jurisdiction: "any band, the day only"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "kept and even traded - families time weddings to the muster so the borrowed grade is seen by everyone; a wedding moved off-muster is read as a family hiding something"
    sanction: "for the second wearing - salt fine and the cords returned"
    follows: [alias_sumptuary §8.5, alias_sumptuary §6, alias_ritual §7.4]
    garment_refs: [GAR-01, GAR-03]
    precedent_via_corpus: "occasion exemptions license display in ritual time only (sumptuary §8.5); inalienable things (regalia, names, pasture) are the exchange grammar's fixed points (ritual §7.4)"
  - id: WR-07
    sign_axis: "regulated person - the treaty stranger (imposture edge)"
    prescription: "A fair-stranger shall wear their own fair coat; none shall wear a D2 coat of felt above G1, nor a hem-corded coat, nor feign ascent."
    assay: "at corridor distance a good imitation passes; the court's real test is speech - the greeting formula and the ascent recitation fail first"
    authority: "caravan treaty; enforced by the fair court"
    jurisdiction: "fairgrounds and valley road only"
    era: "E1"
    era_history: "E1 onward"
    enforcement_reality: "the fair court convicts on speech, not cloth; the classic case is a lowlander in a bought D2 coat who answers the greeting in the loan register"
    sanction: "coat forfeited; the trader's seal withdrawn for a season (a trade sanction, not a dress one)"
    follows: [alias_costume_semiotics §6, alias_sumptuary §7, alias_registers §5]
    garment_refs: [GAR-06, GAR-02]
    precedent_via_corpus: "write impostors whose outfit passes and whose speech register fails (costume-semiotics §6); dress read as evidence in a courtroom is the casta mode (sumptuary §7)"
  - id: WR-08
    sign_axis: "fiber/material - fossil law"
    prescription: "No herder shall wear plant-thread cloth woven off the loom of the lowland partner; plant-thread is lawful only as bale-tying cord and for repair patches smaller than a hand."
    assay: "none that works - the repair patch is the loophole written into the statute"
    authority: "an archaic cord in the archive; renewed twice in living memory"
    jurisdiction: "all bands, unenforced"
    era: "E0"
    era_history: "E0 (when the thread was rare) to E2 (when everyone wears it)"
    enforcement_reality: "dead letter; old herders still refuse the patch publicly and wear it under the placket. The renewal is the evidence of its weakness"
    sanction: "on paper, a salt fine; in practice, moot laughter"
    follows: [alias_sumptuary §10.6, alias_sumptuary §8.8, alias_costume_semiotics §4]
    garment_refs: [GAR-08, GAR-01, GAR-04]
    precedent_via_corpus: "plant one fossil law on a now-common material (sumptuary §10.6); a reissued ban is a chronic weakness marker in-world historians can read (sumptuary §8.8)"
  - id: WR-09
    sign_axis: "fiber/material - the low-door reform (a law that lowers the dial)"
    prescription: "In the E2 reform, lowland cloth is lawful for any household at the winter fair, and felt above G2 may be sold off the high households' bales by any registered seller; the felt-day grades survive on the coat, the monopoly dies on the price."
    assay: "the register keeps the seller's name, not the buyer's - the assay moves from person to bale"
    authority: "Valley Moot, after the storm-famine; opposed by the wind-speakers as a valley law pretending to be a pasture law"
    jurisdiction: "valley fairgrounds"
    era: "E2"
    era_history: "E2"
    enforcement_reality: "the reform passes and the fair booms; the old cords are kept as ceremony and read aloud annually, which is how the moot remembers what it gave up"
    sanction: "none (permissive statute)"
    follows: [alias_sumptuary §9, alias_costume_semiotics §4, alias_eras §13]
    garment_refs: [GAR-02, GAR-04, GAR-08]
    precedent_via_corpus: "dress law can also lower the dial as an equality or revenue policy (costume-semiotics §4 table: Tanzimat-era relaxation); era-change needs a trigger, an announcer, and what stays frozen (eras §13)"
speech_rules_note: "'Say what' rules are rank rules too: the same statute that names a coat grades a mouth. Sanction gradient follows taboo §3 (supernatural dread -> elder -> moot -> fair court)."
speech_rules:
  - id: SR-01
    sign_axis: "sacred speech - the storm-name"
    prescription: "Above the snow-line the storm may be named by a wind-speaker alone; below the snow-line no person shall speak the storm-name at all, but shall say the grandfather-name that the valley uses."
    assay: "the words themselves; a listener above or below the line"
    authority: "wind-speakers' Storm Seat, ratified at the moot"
    jurisdiction: "band-keyed - lawful-above / forbidden-below; the same sentence changes status when the herds descend"
    era: "E0"
    era_history: "E0 to E2 (the script cannot write the name, so the statute exists only as cord + recitation)"
    enforcement_reality: "the valley sanction bites (elder, salt, moot comment); the high-pasture sanction is believed, not enforced - and the belief is stronger there, since the wind is present"
    sanction: "first breach - a salt fine paid to the line's dead-roll; second - the speaker keeps silent for a moot cycle"
    follows: [alias_taboo §3, alias_taboo §5, alias_cosmology §9]
    precedent_via_corpus: "taboo is charged, not merely forbidden, and the sanction gradient exposes which institution backs each taboo (taboo §3); a live ladder plus a fossil replacement is one of the four strata to seed (taboo §5)"
  - id: SR-02
    sign_axis: "register - the greeting formula by band"
    prescription: "The summit greeting is lawful above the snow-line and presumptuous below it; the valley greeting is lawful everywhere, and above the line it marks the speaker as a guest."
    assay: "who spoke first, and with which formula; the moot can subpoena a witness to a greeting"
    authority: "moot statute; recited with the tune"
    jurisdiction: "band-keyed"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "asymmetric in practice - the high formula used low is prosecuted as presumption (the speech twin of wearing office dress); the low formula used high is only rudeness, and rudeness is not a crime"
    sanction: "presumption - moot comment and a knot cut; guest - explicit invitation before the next crossing"
    follows: [alias_sumptuary §4, alias_registers §5, alias_taboo §3]
    precedent_via_corpus: "unlawful assumption of official dress scaled by the rank of the thing assumed (sumptuary §4 Tang Code register); class registers live in low-frequency high-symbolic items, so 20-40 seeded words carry the system (registers §5)"
  - id: SR-03
    sign_axis: "name taboo - the dead of another lineage"
    prescription: "The dead of a lineage are named aloud only by that lineage, and only in the valley at the dead-roll; naming them in another mouth above the snow-line is not an offense, because the wind carries what the valley does not hear."
    assay: "testimony only; the offense is prosecuted when it happens in the moot's hearing"
    authority: "moot statute; the dead-roll reciter is the officer"
    jurisdiction: "valley moot only (the valley is the jurisdiction; the pasture is the exemption of fact)"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "prosecuted rarely and remembered long; families keep a list of mouths as other cultures keep a list of debts"
    sanction: "salt fine and a place in the next dead-roll recitation (the offender's own name read as a warning)"
    follows: [alias_taboo §3, alias_taboo §5, alias_ritual §7.1]
    precedent_via_corpus: "kin and dead-name avoidance is a standard taboo domain with its own owner and sanction (taboo §3); name your rites' stages in the culture's own language (ritual §7.1)"
  - id: SR-04
    sign_axis: "register - the oath (knot-oath vs lowland formula)"
    prescription: "Lineage oaths are sworn on the cord, in the household's own speech and the moot tune; trade oaths to the lowland partner are sworn in the loan formula, before the fair court, in the partner's script. No person shall swear one in the form of the other."
    assay: "the form itself (cord and tune vs written formula and clerk); a written lineage oath is void, a knotted trade oath unenforceable"
    authority: "Storm Seat and fair court jointly; the moot's archive holds the boundary"
    jurisdiction: "lineage oaths in the valley and at the camps; trade oaths in the fairgrounds"
    era: "E0"
    era_history: "E0 (cord only) -> E1 (both, and the argument about which binds)"
    enforcement_reality: "the 'borrowed mouth' offense is the most litigated in the fair court - a herder swearing the lowland formula over a pasture dispute is read as having sold the dispute to strangers"
    sanction: "the oath is voided, the swearer pays both the fine and the cost of the court's clerk"
    follows: [alias_registers §5, alias_taboo §5, alias_sumptuary §4]
    precedent_via_corpus: "the legitimate language is an asset whose exchange rate institutions set - courts are the exchange counters (registers §5); foreign legal register is a loan layer with its own marked donor (taboo §5 stratum 3)"
  - id: SR-05
    sign_axis: "the tune is the law - pitch accent vs the script"
    prescription: "A statute is law when it is recited in the moot tune; a written clause that no wind-speaker has recited is mute law and shall be enforced by no one."
    assay: "the recitation itself: the moot keeps a register of which clauses have tunes; the lowland script cannot mark the tune, so the clerk's page and the speaker's mouth disagree by construction"
    authority: "wind-speakers' Storm Seat over the moot's script register"
    jurisdiction: "everywhere the moot's law runs; the fair court treats untuned clauses as commercial terms only"
    era: "E1"
    era_history: "E1 onward - the arrival of the script creates this rule, and this rule is why the script never fully replaces the cords"
    enforcement_reality: "the best lawyers in D2 are reciters; the best fraud is a forged tune, and the moot's annulment ritual exists to unsing a clause that was recited to the wrong melody"
    sanction: "an untuned clause stays mute until recited; a forged tune annuls the clause and cuts the reciter's knots"
    follows: [alias_taboo §5, alias_registers §8, alias_coupling §7]
    precedent_via_corpus: "when pronunciation/register cannot be written, the unpronounceable name survives as a liturgical register rather than disappearing (taboo §5 stratum 4); era staging versions the relation, not the silhouette - the script changes permission and rite, not just the page (coupling §7)"
  - id: SR-06
    sign_axis: "who may teach - recitation rights"
    prescription: "No person shall teach the storm-law recitation to one who is not sworn, nor teach it outside the valley in the storm season; women and men are sworn alike, and the office is what is gated, not the sex."
    assay: "the moot's roll of sworn reciters"
    authority: "Storm Seat"
    jurisdiction: "valley, any season except the storm; camps, never"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "kept strictly; the teacher-pupil bond is the pastoralists' school, and the door is the only real admission exam the culture has"
    sanction: "both teacher and pupil lose the moot voice for a year"
    follows: [alias_taboo §6, alias_registers §5, alias_amazigh, alias_ritual §7.1, alias_ritual §8]
    precedent_via_corpus: "gating an office rather than a gender is a design that avoids inventing a role inversion the evidence cannot support (amazigh, dress-inversion section; ritual §8 on over-applied frameworks)"
touch_rules_note: "Touch is the enforcement surface where a knot record culture becomes physical: legal memory in D2 is an object, and who may handle it is a rank right."
touch_rules:
  - id: TR-01
    sign_axis: "legal record - the archive cords"
    prescription: "The archive cords are touched by the knot-keeper alone; a lineage head touches the lineage's own cord only, in the keeper's presence, when the moot calls the line. No person shall touch another line's cord, nor a cord's running end, at all."
    assay: "the keeper's count on the morning of the moot; a touched running end re-counts the line differently (a touched cord is presumed amended)"
    authority: "Valley Moot; the keeper is an office, not a lineage"
    jurisdiction: "the winter valley archive; movable only with the keeper and the mast"
    era: "E0"
    era_history: "E0 to E2 (in E1 a duplicate script register is kept by the herd-masters, which the moot does not read aloud)"
    enforcement_reality: "the offense is taken seriously because a cord that anyone may touch is a record that anyone may write; the worst D2 forgery is a false ascent knotted in the winter dark"
    sanction: "the offender's knot cut; a second offense - the line's cord is re-knotted from the dead-roll, annually, for a generation"
    follows: [alias_sumptuary §8.4, alias_trade_econ §2, alias_dress_eras §9]
    garment_refs: [GAR-03]
    precedent_via_corpus: "string/tally counting technology is one of the four natural sources of measures (trade-econ §2); the hem or its equivalent as identity-token in legal transactions is a portable scene device (dress-eras §9)"
  - id: TR-02
    sign_axis: "claim - the hem-knot of the lineage wind-standard"
    prescription: "A claim to pasture is made by taking the wind-standard's hem-knot in the hand at the winter moot, witnessed, and speaking the claim's season; no person shall take the hem on another's behalf, nor take it outside the moot."
    assay: "the witness roll; the hem's own wear - a hem taken twice in a decade shows in the felt"
    authority: "Valley Moot; witnessed by the line and the keeper"
    jurisdiction: "the moot only; the mast itself may travel but the hem-claim may not"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "the strong move of D2 law: the claim is a touch, so the record of who touched what - not a written title - is the title. Failed claims forfeit a bale, which is why the hem is taken rarely and by the old"
    sanction: "failed claim - a bale to the line whose circuit was claimed against; invalid touch - the claim is void and the toucher loses moot voice for a season"
    follows: [alias_dress_eras §9, alias_costume_semiotics §3, alias_ritual §7.4]
    garment_refs: [GAR-05, GAR-03, GAR-07]
    precedent_via_corpus: "what touching the hem means is a designed cultural fact, not a default (dress-eras §9: David's cut robe-corner, fringe-as-token in Mesopotamian sealing); the garment as inalienable regalia is an exchange-grammar fixed point (ritual §7.4)"
  - id: TR-03
    sign_axis: "market - the bale seal-knot"
    prescription: "Any person may count a bale's seal-knots; only the seller may untie them; a buyer who unties owes the knot-fee, and a refused offer pays it in kind."
    assay: "the knots are the assay: the count is the claim (see WR-01)"
    authority: "caravan treaty; enforced at the fair by the herd-masters"
    jurisdiction: "fairgrounds; the custom travels with the bales"
    era: "E1"
    era_history: "E1 onward"
    enforcement_reality: "the whole fair runs on counted knots; the standing crime is not the forgery of the cord but the forgery of the count, and the standing fix is to make the warden count aloud twice, once in each register"
    sanction: "knot-fee; a forged seal-knot - the bale is forfeit, half its hem-value to the informer"
    follows: [alias_sumptuary §8.3, alias_sumptuary §8.4, alias_trade_econ §2]
    garment_refs: [GAR-08]
    precedent_via_corpus: "forfeiture split with the informer manufactures a surveillance class of tailors, dyers, and dealers (sumptuary §6, §8.4); the assay clause names a measurable property, and unassayable bans die (sumptuary §8.3)"
  - id: TR-04
    sign_axis: "measure - the salt-measure"
    prescription: "No household shall use another's salt-measure, nor touch the measure rather than the salt; at the fair a stranger touches only their own."
    assay: "the measure's rim wear and the grain's ring; the fair's wardens compare against the standard held by the treaty council"
    authority: "treaty council (both partners), ratified at the moot"
    jurisdiction: "fairgrounds and valley stores"
    era: "E0"
    era_history: "E0 (salt by hand for kin) -> E1 (standard measure under treaty)"
    enforcement_reality: "the standard is sacred in speech and negotiable in practice; each partner suspects the other's standard of having been weighed wet"
    sanction: "measure seized, salt forfeit to the wardens' store; a repeated offense ends the household's fair standing"
    follows: [alias_trade_econ §3, alias_trade_econ §2, alias_newar §6]
    precedent_via_corpus: "every culture needs an office and a myth for its standard - a temple, a balance, an inspector's title, a founding edict (trade-econ §3); recurring obligations need a funded base and an accounted sanction (newar §6)"
  - id: TR-05
    sign_axis: "the storm-lift (necessity clause)"
    prescription: "While storm law holds, any person may handle the mast rope, take up any coat to hand, and speak plainly above the line without rank formula; the debt is reckoned after."
    assay: "the reciter's account at the storm's end: who was lifted, who was carried, whose coat was taken"
    authority: "Storm Seat; the wind-speakers are the officers and the witnesses"
    jurisdiction: "above the snow-line, during storm law only (the band and the weather are the jurisdiction)"
    era: "E0"
    era_history: "E0 to E2"
    enforcement_reality: "the one rule no one evades, because the alternative is a death the herd cannot afford; the storm-debt ledger is D2's only unconditional currency"
    sanction: "for the failure to lift - the herd's own judgment: a household that passed a neighbor in storm law is fed last at the next muster, for a year"
    follows: [alias_sumptuary §8.5, alias_ritual §7.2, alias_costume_semiotics §4]
    garment_refs: [GAR-01, GAR-02, GAR-05]
    precedent_via_corpus: "occasion exemptions license the forbidden in ritual or exceptional time only (sumptuary §8.5); pick one transgressive element per rite that liminality requires (ritual §7.2)"
  - id: TR-06
    sign_axis: "contract - the hem-and-measure handshake at the fair"
    prescription: "A sale is opened when the buyer touches the coat's hem and the seller touches the buyer's measure; a stranger under treaty may open a sale only in their own coat and with their own measure in hand."
    assay: "two touches, two witnesses' names written in the register"
    authority: "caravan treaty, fair court"
    jurisdiction: "fairgrounds"
    era: "E1"
    era_history: "E1 onward"
    enforcement_reality: "the ceremony is the contract's evidence; the disputes are almost never about whether the touch happened, but about which coat was touched"
    sanction: "a disputed touch - the sale is void and the bale returns to the seller's cord count"
    follows: [alias_dress_eras §9, alias_sumptuary §7, alias_coupling §8]
    garment_refs: [GAR-06, GAR-03]
    precedent_via_corpus: "documented practice treats the garment's fringe or hem as an identity-token in legal transactions (dress-eras §9); the record shape wants permission_basis and observed_departures laid out, not assumed (coupling §8)"
authority:
  - id: AU-1
    body: "Valley Moot"
    seat: "winter valley shelter grounds"
    power: "statutes, archive, cord checks, registrations, the reform"
    register: "knotted cord + moot tune recitation"
    weakness: "meets only in winter; two-thirds of the year its law is recited from memory"
    follows: [alias_sumptuary §10.3, alias_ritual §7.6]
  - id: AU-2
    body: "Storm Seat (wind-speakers)"
    seat: "the mast, wherever it stands"
    power: "emergency rulings, storm-law suspension and creation, recitation of clauses, the dead-roll"
    register: "spoken, sung, never written"
    weakness: "its rulings lapse when storm law ends unless the moot recites them; overreach is answered by an annulment ritual"
    follows: [alias_registers §5, alias_taboo §3]
  - id: AU-3
    body: "Caravan treaty council (herd-masters + lowland clerks)"
    seat: "the fairgrounds"
    power: "the register, fair jurisdiction, trade oaths, measures"
    register: "lowland script (loan layer) - the only written law in D2"
    weakness: "writes what it cannot say: the script marks no pitch accent, so every clause it records must still be recited to be law (see SR-05)"
    follows: [alias_sumptuary §4, alias_coupling §7, alias_taboo §5]
  - id: AU-4
    body: "felt-counters (household guilds)"
    seat: "the shearing grounds"
    power: "self-policing of grades and counts; informer moieties"
    register: "everyday speech"
    weakness: "the informers are also the forgers; the moot knows and uses it"
    follows: [alias_sumptuary §6, alias_sumptuary §2]
jurisdiction_note: "Jurisdiction in D2 is altitude and season, not a map line. The same body is lawful or unlawful depending on the band the herds stand in."
jurisdiction:
  - id: JU-1
    band: "winter valley (low)"
    season: "the cold season, herds in shelter"
    officers_present: "moot, keeper, wind-speakers, herd-masters, fair court"
    mode: "license (cord checks) and evidence (fair court) both available"
    dialect: "full law: cord, tune, and scripted register all active at once"
    follows: [alias_sumptuary §2, alias_costume_semiotics §6]
  - id: JU-2
    band: "transit passes (middle)"
    season: "ascent and descent weeks"
    officers_present: "tally-warden of the circuit; no court"
    mode: "license only, on the move"
    dialect: "counted cords; the scripted register is left in the valley"
    follows: [alias_sumptuary §2, alias_trade_econ §2]
  - id: JU-3
    band: "high pasture (high)"
    season: "the warm season"
    officers_present: "wind-speakers only; no keeper, no court"
    mode: "self-policing under informer moieties; storm law supersedes all"
    dialect: "spoken law and tune; the archive is a recitation, not an object"
    follows: [alias_sumptuary §7, alias_cosmology §2]
enforcement:
  - id: EN-1
    officer: "knot-keeper"
    modus: "keeps and reads the cord archive; runs the winter cord check"
    reach: "valley, moot season"
    known_failure: "cannot verify a summer claim until winter; the winter backlog is the moot's biggest caseload"
    follows: [alias_sumptuary §2, alias_trade_econ §3]
  - id: EN-2
    officer: "tally-warden (per pasture circuit)"
    modus: "counts cords and hems at transit and at the camps; records for the moot"
    reach: "circuit-wide, moving with the herds"
    known_failure: "is often a household head of the same circuit - prosecutes neighbors, rarely kin"
    follows: [alias_sumptuary §2, alias_sumptuary §6]
  - id: EN-3
    officer: "felt-counters (guild, unpaid, moiety-paid)"
    modus: "assay by hand and eye; report over-grades and over-counts to the moot"
    reach: "shearing grounds, markets"
    known_failure: "the informer's share makes tailors and fullers the surveillance class - and the forgery class (sumptuary §6, §8.4)"
    follows: [alias_sumptuary §6, alias_sumptuary §8.4]
  - id: EN-4
    officer: "fair court clerk (lowland partner's script)"
    modus: "writes the register, reads the coat against the register, convicts on speech"
    reach: "fairgrounds and valley road"
    known_failure: "convicts strangers readily and registered households almost never; the register knows sellers, not spouses"
    follows: [alias_sumptuary §7, alias_sumptuary §6]
sanctions:
  - id: SA-1
    name: "knot cut"
    what: "recorded ascents, moot voice, or stand are reduced in the archive"
    note: "the signature D2 penalty: it punishes in the record, which is where D2 lives (pre-writing memory)"
    follows: [alias_sumptuary §8.9, alias_trade_econ §2]
  - id: SA-2
    name: "salt fine"
    what: "set weight of salt to the wronged line or the wardens' store"
    note: "the lowland-traded mineral is D2's fine currency; the fine is also a trade statement"
    follows: [alias_sumptuary §6, alias_trade_econ §3]
  - id: SA-3
    name: "hem forfeiture with informer's moiety"
    what: "the garment's hem (the token piece) is cut away and given to the informer; the coat returns maimed"
    note: "lifted whole from the drafting formulae, and made D2 by the hem's legal value (TR-02)"
    follows: [alias_sumptuary §8.4, alias_dress_eras §9]
  - id: SA-4
    name: "moot silence"
    what: "loss of voice for a season or a year; the household is spoken for by its line"
    note: "the sanction for presumption offenses (SR-02, TR-02) - a segmentary society's real punishment is being unrepresented"
    follows: [alias_registers §5, alias_ritual §7.3]
  - id: SA-5
    name: "storm debt"
    what: "an obligation incurred in storm law, reckoned at the storm's end, unrateable and unconditional"
    note: "the only sanction that is a credit - D2's moral bookkeeping in a single institution"
    follows: [alias_ritual §7.4]
loopholes_note: "Each ban spawns the technique that evades it (sumptuary §5 craft note; §10.5 - write the patch notes)."
loopholes:
  - id: LO-01
    ban: "WR-03 hem-cord counts"
    dialect: "cords moved from the hem to the inner placket, shown only at the hearth; the 'hearth fringe' dialect"
    status: "tolerated; the moot calls it vanity, not forgery"
    follows: [alias_sumptuary §5]
  - id: LO-02
    ban: "WR-08 plant-thread weave"
    dialect: "the material is worn as bale-tying cord and re-sewn as repair patches under the placket"
    status: "written into the statute as an exception; the fossil law's own hole"
    follows: [alias_sumptuary §10.6]
  - id: LO-03
    ban: "WR-01 felt grades"
    dialect: "leased coats at the fair and gift bales that never enter the archive"
    status: "prosecuted once a decade; the lease market is otherwise invisible"
    follows: [alias_sumptuary §10.5]
  - id: LO-04
    ban: "WR-06 the household grade for spouses"
    dialect: "coats cut wide and placketed so both spouses can wear one garment legally"
    status: "not a crime; the reason D2 coats are cut wide is a legal fact, not a style"
    follows: [alias_sumptuary §6, alias_coupling §5]
  - id: LO-05
    ban: "WR-04 mast-sash"
    dialect: "the sash's tie-colors copied; the weights inside the end-cords forged separately from the sash"
    status: "the flagship prosecution - forged end-cord weights, real sash"
    follows: [alias_sumptuary §4, alias_costume_semiotics §6]
  - id: LO-06
    ban: "WR-02 lowland cloth"
    dialect: "the coat is worn inside out in the valley so the lining - legally a repair patch - shows plant-thread"
    status: "litigated; the fair court splits on whether a lining is a garment"
    follows: [alias_sumptuary §5, alias_coupling §7]
black_market_note: "Handoff artifact 4 of the build sequence (sumptuary §10.8): the price spread between the legal floor and what people actually wear, plus the enforcement-reality column, is the fiction's pulse."
black_market:
  - id: BM-1
    item: "G3 high-pasture felt coat"
    legal_floor: "lineage head only; a household coat at G3 is a crime"
    on_the_street: "one grade up in summer, G3 in winter among the richer household heads, mostly prosecuted when a grudge exists"
    moot_prosecutes: "rarely"
    price_note: "the spread is paid in gifts, not coin: a G3 coat is repaid in bales and in votes"
    garment_refs: [GAR-02]
    follows: [alias_sumptuary §10.8, alias_costume_semiotics §4]
  - id: BM-2
    item: "hem-cord above one's ascents"
    legal_floor: "cords only as many as recorded crossings"
    on_the_street: "routinely two to three cords over; cord-twist forgeries sold at fairs"
    moot_prosecutes: "selectively, at the winter check, when a line wants a rival's coat maimed"
    price_note: "a forged twist cord costs about a day's salt; the hem forfeiture costs a season's standing"
    garment_refs: [GAR-03]
    follows: [alias_sumptuary §8.4, alias_sumptuary §10.8]
  - id: BM-3
    item: "lowland cloth coat"
    legal_floor: "registered herd-masters inside the fairgrounds only"
    on_the_street: "worn by their spouses everywhere in the valley; strangers buy them for the road"
    moot_prosecutes: "strangers at the gate; almost never a household"
    price_note: "the fair court's seizure rate is the tax that the trade absorbs"
    garment_refs: [GAR-04]
    follows: [alias_sumptuary §7, alias_sumptuary §10.8]
  - id: BM-4
    item: "plant-thread repairs"
    legal_floor: "patch no larger than a hand; cord for bales"
    on_the_street: "patches of any size, under the placket, sewn in the winter dark"
    moot_prosecutes: "never; the fossil law is remembered in the renewal, not the fine"
    price_note: "the cheapest illegality in D2, which is why it is the one everyone confesses to"
    garment_refs: [GAR-01, GAR-08]
    follows: [alias_sumptuary §10.6, alias_sumptuary §10.8]
  - id: BM-5
    item: "the storm-debt coat never returned"
    legal_floor: "any coat may be lifted in storm law"
    on_the_street: "most lifted coats come home; the ones that do not are remembered as debts, not thefts"
    moot_prosecutes: "never - a storm-debt is a credit, and creditors collect in other coin"
    price_note: "the only market in D2 that is a ledger of obligations rather than salt"
    garment_refs: [GAR-01, GAR-02]
    follows: [alias_ritual §7.4, alias_sumptuary §10.8]
