    whats_changes: "lowland cloth spreads to all households at the fair; felt is sold off the high bales by any registered seller"
    whats_frozen: "the mast-sash, the hem-claim, the ascent cords, and the tune - the ceremonial corpse of the old order, read aloud annually"
