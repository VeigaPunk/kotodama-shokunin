# R27-D16 negative S3 — the design's own named trap, re-pinned for round 27.
# `design-language.md` §5: `saalum` is what head2 yields under the
# maximal-CODA reading of `saalumi`; the design fixes maximal-ONSET
# (`saa.lu.mi` -> `saalu`) precisely because the two readings disagree here.
# A form declared as head2(saalumi) but delivered `saalum` must read
# D4L-ARGOT-DERIV under EVERY reading of the algorithm, so this row is the
# reading-independent half of the D16 control. Fixture-only, NON-CANON.
name: "S3 maximal-coda head2 (fixture-only)"
phonology:
  consonants: [p, t, k, b, d, g, m, n, s, r, l, w, j, h]
  vowels: [a, e, i, o, u]
  phonotactics: "(C)V(V)(C)"
lexicon:
  - {id: S3-01, term: saalum, register: quote, derived_from: saalumi, derivation: head2}
