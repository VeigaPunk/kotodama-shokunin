morphology:
  derivation_rules:
    - {id: CX-01, kind: compound, pattern: "^(?P<a>.+)\\+(?P<b>.+)$", output: "{a}{b}", note: "STACK-COMPOUND: modifier root before head root, concatenated without deletion; the plus is analysis only and never part of the delivered spelling"}
    - {id: CX-02, kind: suffix, affix: "-ar", pattern: "^(?P<stem>.+)$", output: "{stem}ar", note: "CRAFT-AGENT: worker named from the material or tool"}
    - {id: CX-03, kind: suffix, affix: "-en", pattern: "^(?P<stem>.+)$", output: "{stem}en", note: "ATTRIBUTIVE: of-the-X; naming and epithets only"}
  derivation_note: "the three rules replay the four derived or compound records in this file and the eight names in 05-naming; rule ids match the constructions block"

coverage_notes:
  fields: {body: 4, kinship: 4, weather: 5, landscape: 5, subsistence: 6, war: 3, religion: 5, costume: 3, craft: 7, trade: 7}
  routes: {root: 44, compound: 2, derived: 2, borrowed: 6}
  layers: {native: 48, "Salt-road trade layer": 4, "North-road kin layer": 2}
  counting_note: "counts are of delivered records in this file, not of the language; command: python3 .scratch/d4-lint.py reports/round-17/d4/components/04-lexicon.yml (structural) and the round-17 validation runner's lexicon-gate leg (semantic)"
  declared_gaps: "no garment lexemes (LEX-GAR-01..06 stay unfilled by design — the six named holds); no war-field depth (the league is not a war culture); no measure words beyond the borrowed gul and the count-stamps of 03"

open_questions:
  - {id: OQ-L1, text: "The sister variety's own lexicon is unmodelled; only its two donor forms are recorded (to-verify)."}
  - {id: OQ-L2, text: "Whether E0 had a distinct word for the quench trough is left open; nes covers water generally (to-verify)."}
  - {id: OQ-L3, text: "The six garment form slots are unfilled by design; a later round filling them must respect 02's phonology and the CX- constructions."}

calibration:
  - {id: CAL-L1, status: design-choice, note: "field weights and the craft density are design choices calibrated to the spine, not frequency measurements"}
  - {id: CAL-L2, status: to-verify, note: "no frequency or corpus measurement exists for this lexicon; the audit gate's F leg is out of scope by its own declaration"}

canon_boundary: |
  This component designs a system and cites its corpus bases; it records nothing
  about any world. Canon, adoption, and in-world usage are lore-shokunin's. No
