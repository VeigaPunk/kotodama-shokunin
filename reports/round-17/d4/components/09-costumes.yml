# holds of contract.hold_set_declaration (01-brief.yml).
component: 09-costumes
culture: D4
canon: not canonized (D4 design drill)
title: "09-costumes — the two-wardrobe year: forge dress and league dress, and what may be worn at each"
status: "round-17 component write, 2026-10-18; supersede-by-new-file only"
packet_keys: [costumes, materials, cloth_sources, rank_rules, form_slots]
scope: >
  Six delivered garments (GAR-01..06), five materials (CMAT-01..05), two cloth
  sources (CS-01..02), four rank rules (RK-01..04), and the six owed form slots
  (LEX-GAR-01..06). This file coins no surface form: every garment carries an
  English translated label and an unfilled form slot, which is the named design
  debt. The garment set follows the cross-seat costume design's furnace-frame
  re-map (design-costume.md §9.3) so the slice agrees with the landed registry.
spine_coupling: "fire — the forge wardrobe is protection from heat and slag (hide apron, quench smock, kiln hood), and the materials are the furnace's own products and by-products (hide, wool, felt, charcoal pigment). mark — the league wardrobe carries attestation (the cloak's shoulder stamp, the stamp-belt's maker's mark), and rank rules are rights to wear a mark, not rights to a fabric"
spine_check: "no D1 or D2 imagery is imported. No bast/flax/reed fiber chain (D1B-03): the fiber chain is wool and hide with one declared import. No herd-pasture rank (D2B-01): rank here is furnace right and the league's charter. No knot or cord: the belt carries a stamp and tokens, never a tied obligation."

follows:
  - {id: F-1, path: "corpus/knowledge/culture-material/textile-technology.md", section: "§2 fiber hierarchy, §6 the vocabulary ceiling", use: "a culture cannot have a basic costume term for a cloth its four gates cannot make; the chain here is hide and wool, felt by fulling"}
  - {id: F-2, path: "corpus/knowledge/synthesis/costume-language-coupling-table.md", section: "§2 relation model, §8 blank template", use: "the term/wearer/era field model; the garment term is owed, the wearer relation is declared"}
  - {id: F-3, path: "corpus/knowledge/verification/costume-era-consistency-gate.md", section: "§4 material availability, §5 textile bounds, §6 rank rules, §7 anachronism sweep", use: "material routes carry eras; rank rules carry authority and effect; no process is dated past its era"}
  - {id: F-4, path: "corpus/knowledge/culture-material/sumptuary-law-rank-display.md", section: "§8 the language of regulation, §10 build sequence", use: "rank rules are written as license and prohibition with named authority, not as taste"}
  - {id: F-5, path: "corpus/knowledge/culture-material/dress-through-eras.md", section: "§1 the three-slot grammar, §10 enforcement mechanisms", use: "two enforcement mechanisms only: the council's fine and the stamp-holder's refusal to mark"}

