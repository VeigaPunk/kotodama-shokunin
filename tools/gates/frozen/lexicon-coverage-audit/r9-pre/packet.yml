  vowels: [a, e, i, o, u]
  phonotactics: (C)V(C)
  tones: 0
  notable_rules:
    - "word-final vowel loss before the suffix -k"
morphology:
  type: agglutinative
  alignment: nom-acc
  word_order: SOV
eras: [Old Veth, Middle Veth, Late Veth]
constructions:
