    pattern: "B1-sa"
    base_classes: [verb]
    output_class: noun
    productivity: productive
    description: "agent noun from a verb base"
  - name: PLANT
    pattern: "B1-ku"
    base_classes: [noun]
    output_class: noun
    base_eligibility: native-only
    available_from: Middle Veth
    productivity: restricted
    description: "plant or material part term from a noun base"
layers:
