# The `names` and `cross_culture_review` blocks below are the packet blocks the
# assembler extracts.
component: 05-naming
culture: D4
canon: not canonized (D4 design drill)
title: "05-naming — the stamped name. D4 name slots, formation, and the license to speak a name"
status: "round-17 component write, 2026-10-18; supersede-by-new-file only"
packet_keys: [names, cross_culture_review]
scope: >
  Eight delivered name records: four personal names, two lineage names, two
  place names. Theonyms are 06-myth's and are not renamed here; garment citation
  names are not coined (the six LEX-GAR slots stay unfilled by design).
spine_coupling: "mark — a name is attested, not merely spoken: the lineage keeps its roll of names in the furnace roll (03's LI-03), and a name enters the roll by stamp. fire — personal names are wishes for the child's relation to the furnace (breath, hand, charcoal, metal); lineage names bind a family to a hearth"
spine_check: "no D1 or D2 imagery is imported: no name uses a river, binding, knot, wind-law, ascent, or pasture element. All eight forms are built only from delivered 04 roots and respect 02's template, coda set, and stress rule."

follows:
  - {id: F-1, path: "corpus/knowledge/linguistics/naming-systems.md", section: "§2 slots and life stages, §3 descriptive places, §4 cult epithets, §6 taboo institutions, §7 derivation pipeline", use: "separate the bearer, the slot, the formation, and the license to speak; names below are design choices, not claims about a real culture"}
  - {id: F-2, path: "corpus/knowledge/verification/naming-collision-gate.md", section: "§2 required input records, §4 uniqueness, §6 pronounceability, §7 derivational validity", use: "record shape and the gate the names must survive; formation replays from delivered bases"}
  - {id: F-3, path: "reports/round-17/d4/components/02-phonology.yml", section: "PHON-01, STR-01, AL-1..AL-6", use: "no special name phonemes; the naming gate's profile is this component's phonology block"}
  - {id: F-4, path: "reports/round-17/d4/components/04-lexicon.yml", section: "L-01..L-54, CX-01..CX-03", use: "only delivered bases; STACK-COMPOUND concatenation without deletion"}
  - {id: F-5, path: "corpus/knowledge/culture-material/craft-artisan-lexicon.md", section: "§5 guild ranks and offices", use: "the lineage name is an affiliation, not an office; offices are held, not inherited"}

phonotactic_contract:
  consonants: [p, t, k, b, d, g, m, n, s, r, l, w, j, h]
  vowels: [a, e, i, o, u]
  syllable: "(C)V(V)(C); codas only n m s k l r t d; no clusters; no consonant geminates"
  roots: "delivered 04 roots only; a compound seam may not create a cluster; no root-internal vowel sequence beyond long vowels and ai/au"
  accent: "root-initial stress, fixed; names acquire no special accent"
  spelling: "lowercase ASCII; length as double vowels; no diacritics"

slots:
  personal: "Given at the first furnace turn after birth; the household stamps the name into the lineage's roll bar. No gender morphology. At the first turn of duty the bearer may ratify or replace it before the lineage's master; the old name stays in the roll as an alias, not a second person."
  lineage: "Hereditary furnace-holding affiliation; spoken independently of the given name and never used as a title of office. A lineage name may be adopted by a master's household on the council's stamp."
  place: "One descriptive compound, qualifier before head; a map may add an English gloss outside the D4 name. The two delivered place names are candidate sites of this drill, not names assigned to existing world entities."
  craft_office: "A guild office (furnace-master, mold-keeper) is an office, not a name; it is spoken before the lineage name in council and is never compounded into a person's name."

life_and_license:
  birth: "The household uses the given name quietly; the roll stamp waits until the child has survived one full furnace turn."
  majority: "Bearer ratifies the given name at the first turn of duty; the lineage name is spoken separately and confers no office."
  office: "A furnace-master is addressed by office plus lineage name in council; the office does not become part of the name."
  death: "After the death count, the name is read from the roll and then not spoken aloud for four furnace turns in council; kin use 'the mother of X' or the office. This is an invented institution of this drill, not a supernatural claim."
  sacred: "No power's name (06-myth) may be used as an infant's given name; a power is addressed by its title in rite. This is an in-world belief, not a claim that names cause anything."
  unresolved: "The four-turn avoidance's endpoint is declared here but not exercised by any delivered narrative (to-verify)."

formation_policy: "Each NM record exposes both bases and the complete formation.stem serialized as B1+B2; the plus is analysis only and never part of the delivered name. Opacity is not used to evade replay."

names:
  - id: NM-01
    name: tumhai
    type: person
    era: E0
    axis: fire
    evidence: design-choice
    etymology: "tum (L-02 breath, bellows-breath) + hai (L-28 fire): breath-of-fire, a wish that the child keep the furnace breathing."
    formation: {stem: "tum+hai", bases: [tum, hai], rule: CX-01, operation: concatenate, expected: tumhai}
    syllables: [tum, hai]
    license: "Living person's given name; household assignment, bearer ratification at the first turn of duty."
    follows: "naming-systems.md §2, §7; 04-lexicon CX-01"
  - id: NM-02
    name: kalker
    type: person
    era: E0
    axis: fire
    evidence: design-choice
    etymology: "kal (L-36 hearth, furnace) + ker (L-01 hand): hearth-hand, a wish for a sure hand at the charge."
    formation: {stem: "kal+ker", bases: [kal, ker], rule: CX-01, operation: concatenate, expected: kalker}
    syllables: [kal, ker]
    license: "Living person's given name; not an office claim (the hearth-keeper is appointed, not named)."
    follows: "naming-systems.md §2, §7; 04-lexicon CX-01"
  - id: NM-03
    name: samren
    type: person
    era: E0
    axis: fire
    evidence: design-choice
    etymology: "sam (L-39 charcoal) + ren (L-13 wind): charcoal-wind, a wish for a steady draught at the bellows — wind here is the bellows' condition, never an institution."
    formation: {stem: "sam+ren", bases: [sam, ren], rule: CX-01, operation: concatenate, expected: samren}
    syllables: [sam, ren]
    license: "Living person's given name."
    follows: "naming-systems.md §2, §7; 04-lexicon CX-01"
  - id: NM-04
    name: mestum
    type: person
    era: E0
    axis: fire
    evidence: design-choice
    etymology: "mes (L-43 metal) + tum (L-02 breath): metal-breath, a wish that the child's work hold its temper."
    formation: {stem: "mes+tum", bases: [mes, tum], rule: CX-01, operation: concatenate, expected: mestum}
    syllables: [mes, tum]
    license: "Living person's given name."
    follows: "naming-systems.md §2, §7; 04-lexicon CX-01"
  - id: NM-05
    name: haitik
    type: lineage
    era: E0
    axis: mark
    evidence: design-choice
    etymology: "hai (L-28 fire) + tik (L-42 mark): fire-mark, the stamp-makers' lineage whose roll the town's records are stamped into."
    formation: {stem: "hai+tik", bases: [hai, tik], rule: CX-01, operation: concatenate, expected: haitik}
    syllables: [hai, tik]
    license: "Hereditary affiliation with a furnace right; not a title and not a claim to the league's records office."
    follows: "naming-systems.md §2; 04-lexicon CX-01"
  - id: NM-06
    name: meslun
    type: lineage
    era: E0
    axis: fire
    evidence: design-choice
    etymology: "mes (L-43 metal) + lun (L-33 woven wool): metal-fleece, a lineage holding both a furnace right and a sheep run on the hill ground."
    formation: {stem: "mes+lun", bases: [mes, lun], rule: CX-01, operation: concatenate, expected: meslun}
    syllables: [mes, lun]
    license: "Hereditary affiliation; the flock is held with the furnace, never instead of it."
    follows: "naming-systems.md §2; 04-lexicon CX-01"
  - id: NM-07
    name: kalnes
    type: place
    era: E0
    axis: fire
    evidence: design-choice
    etymology: "kal (L-36 hearth) + nes (L-16 water, spring): hearth-spring, a candidate furnace town at a spring — the water is the quench supply, never the settlement's reason to exist."
    formation: {stem: "kal+nes", bases: [kal, nes], rule: CX-01, operation: concatenate, expected: kalnes}
    syllables: [kal, nes]
    license: "Route-users' descriptive endonym; no etymology from an unmodelled donor is claimed."
    follows: "naming-systems.md §3, §7; 04-lexicon CX-01"
  - id: NM-08
    name: salwer
    type: place
    era: E1
    axis: mark
    evidence: design-choice
    etymology: "sal (L-49 salt, borrowed) + wer (L-15 road): salt road, the road's name where it crosses the basin — a road name built on a trade loan, dated to the loan's entry stage."
    formation: {stem: "sal+wer", bases: [sal, wer], rule: CX-01, operation: concatenate, expected: salwer}
    syllables: [sal, wer]
    license: "Road-users' endonym; the borrowed element is declared (LY-01) and does not make the road a foreign institution."
    follows: "naming-systems.md §3; 04-lexicon CX-01"

rejected_candidates:
  - {id: RC-01, candidate: hainun, reason: "rejected as a person name: it would read as a claim on the kept fire (a power's domain), not a wish for the child", syllables: [hai, nun], status: "phonotactically legal, institutionally rejected"}
  - {id: RC-02, candidate: tikmes, reason: "rejected as a person name: tikmes is the account form (L-45), an object name; using it for a person would collide with the record register", syllables: [tik, mes], status: "phonotactically legal, register-rejected"}
  - {id: RC-03, candidate: kalhai, reason: "rejected as a lineage name: it duplicates the power title Haitir's domain in 06-myth; the council's stamp would read as a temple claim", syllables: [kal, hai], status: "phonotactically legal, institutionally rejected"}

