# reports/round-17/d4/components/02-phonology.yml
# D4 design drill — component 02 of the round-17 registry.
# NON-CANON: this file proposes a design; it records nothing about any world.
#
# Write seat: R17-D06 (D-components, seat 2 of 12). Round 17, 2026-10-18.
# The `phonology` block below is the packet block the assembler extracts.
component: 02-phonology
culture: D4
canon: not canonized (D4 design drill)
title: "02-phonology — the bellows rhythm. D4 inventory, fixed root-initial stress, length, allophony, and the ordered sound changes"
status: "round-17 component write, 2026-10-18; supersede-by-new-file only"
scope: >
  One variety per stage — the D4 basin speech, E0 pre-script stamp-era
  vernacular and the E1/E2 written vernacular. The northern hill sister variety
  is named as a donor in 11-contact-history and its donor forms appear in the
  borrow ledgers, but its own phonology is out of scope and not modelled here
  (to-verify). The salt-road towns' language is modelled only as a recipient-side
  loan filter, never as a donor inventory.
spine_coupling: "fire — the root-initial stress is the struck syllable, the word's first heat; breath is the bellows (wi- records), and smoke rises from the stressed root. mark — length is the mark's weight: a long stressed vowel is a heavy mark, a short one a light mark; the script's length notation is fixed by 03-orthography against this system"
spine_check: "no D1 or D2 imagery is imported. No tying, binding, river, wind-law, or ascent/descent material appears in any rule, witness, or register note. The stamp is a record technology owned by 03-orthography; nothing here treats a stamp as a phonological gesture."

follows:
  - id: F-1
    path: corpus/knowledge/linguistics/phonetics-phonology.md
    section: "§2 inventory design (WALS bands; size from contact history, not coolness)"
    decision_followed: "a guild-town league with regular trade contact takes the moderately small band (14 consonants); complexity is placed in stress and length, not in extra places of articulation; no ejective, no front rounded vowel, no implosive is admitted for flavor"
  - id: F-2
    path: corpus/knowledge/linguistics/phonetics-phonology.md
    section: "§3 phonotactics (write the template first; codas restricted)"
    decision_followed: "template written first: (C)V(V)(C); no onset clusters and no coda clusters; codas limited to four consonants; no word of identical CV syllables"
  - id: F-3
    path: corpus/knowledge/linguistics/phonetics-phonology.md
    section: "§4 markedness and implicational universals (generator, not law)"
    decision_followed: "the nasal series is filled at both places where orals exist; the velar nasal is an allophone, not a lone phoneme; no implication is broken for texture"
  - id: F-4
    path: corpus/knowledge/linguistics/phonetics-phonology.md
    section: "§5 allophony (5-8 rules; families; derive from plausible drift)"
    decision_followed: "five finite-context rules in three families (place assimilation, voicing, fronting); every rule carries a drift origin and a witness; every output is a non-phoneme allophone, so no rule merges two phonemes"
  - id: F-5
    path: corpus/knowledge/linguistics/phonetics-phonology.md
    section: "§6 prosody (Hyman 2006 type distinction; tonogenesis)"
    decision_followed: "stress accent chosen as a type distinct from tone and from D2's pitch accent: fixed root-initial stress, a length contrast, no culminative pitch movement; intonation is specified above word prosody; no tonogenesis is posited"
  - id: F-6
    path: corpus/knowledge/linguistics/phonetics-phonology.md
    section: "§7 environment, anatomy, society (solid couplings versus contested seeds)"
    decision_followed: "no environment warrant is used for any segment; the four contested claims (ejectives and altitude, tone and dry climate, diet and labiodentals, sonority and temperature) are declined as warrants and recorded in environment_analysis with their status"
  - id: F-7
    path: corpus/knowledge/linguistics/historical-linguistics.md
    section: "§6 dating language stages, §7 ordered law lists (feeding and bleeding)"
    decision_followed: "two ordered sound changes date the stage split E0→E1→E2; each change lists its input class, its context, and a witness; the changes are ordered and do not interact"
  - id: F-8
    path: corpus/knowledge/linguistics/language-contact.md
    section: "§6 loanword adaptation (recipient-side filters)"
    decision_followed: "deaspiration, final-vowel truncation and stress assignment for the two loan strata; the recipient's phonology does the filtering, and no claim is made about either donor's inventory"
  - id: F-9
    path: corpus/knowledge/verification/phonology-sanity-gate.md
    section: "§2 kernel boundary and §7 era staging"
    decision_followed: "the gate-facing rule list is written in finite symbol contexts so a finite-segment checker can run it; the era staging of the rules is recorded in sound_changes, and the gate's own findings are retained, never suppressed"

phonology:
  consonants:
    - "p"
    - "t"
    - "k"
    - "b"
    - "d"
    - "g"
    - "m"
    - "n"
    - "s"
    - "r"
    - "l"
    - "w"
    - "j"
    - "h"
  vowels:
    - "a"
    - "e"
    - "i"
    - "o"
    - "u"
  phonotactics: "(C)V(V)(C)"
  coda:
    - "n"
    - "m"
    - "s"
    - "k"
    - "l"
    - "r"
    - "t"
    - "d"
  onset_clusters: false
  tones: 0
  accent: "stress accent, fixed on the first syllable of the root; suffixes and compounds never move it. The tones field counts lexical tone categories and D4 has none: no syllable carries an independent pitch category, and stress is not culminative pitch movement but a fixed position. Vowel length is contrastive only on the stressed syllable and is written as a double vowel (aa ee ii oo uu); the falling diphthongs ai and au are the only other vowel sequences."
  accent_levels: 1
  notable_rules:
    - "n → ŋ / _ k"
    - "n → ŋ / _ g"
    - "s → z / V _ V"
    - "t → ts / _ i"
    - "k → c / _ i"
    - "h → ç / _ i"
  strata_note: "Two strata are declared: the native D4 lexicon across both stages, and the loan strata declared in 04-lexicon's layers block (the salt-road trade layer and the north-road kin layer). Loans are governed by loan_adaptation below; the E0 and E1/E2 vernaculars share this inventory. The gate-facing rule list is written in finite symbol contexts; every rule's output is an allophone outside the phoneme inventory, so no rule is stated as a phoneme merger."

inventory_record:
  id: INV-01
  consonants: 14
  vowels: 5
  vowel_sequences: "long vowels (identical VV) and the falling diphthongs ai, au; no other sequences"
  inventory_notes: "no voiced fricative phoneme; [z] is an allophone of /s/ between vowels; no velar nasal phoneme; [ŋ] is an allophone of /n/ before velars; no affricate phoneme; [ts] is an allophone of /t/ before /i/; no palatal stop phoneme; [c] and [ç] are allophones of /k/ and /h/ before /i/"
  gaps_declared: "no /f/ (the D1 fixture's sound law target), no /ʃ/ (a D2 inventory member), no /v/, no /z/, no /θ/; the gaps are design choices, not claims"
  axis: fire
  evidence: design-choice
  follows: [F-1, F-3]

phonotactics_record:
  id: PHON-01
  template: "(C)V(V)(C)"
  codas: [n, m, s, k, l, r, t, d]
  coda_note: "no coda cluster; a coda is a single consonant from the eight; word-final codas are the same eight"
  onsets: "single consonant or empty (empty onset only word-initially inside a root)"
  clusters: "no onset or coda clusters anywhere, including compound seams: a compound is legal only if its seam creates no cluster (kaltun is rejected, haitun accepted)"
  vowel_sequences: "long vowels and the diphthongs ai, au; no other vowel sequences; a compound seam may not create a third sequence type"
  identical_syllables: "no word of identical CV syllables (tata is not a D4 word)"
  axis: mark
  evidence: design-choice
  follows: [F-2]

stress_record:
  id: STR-01
  position: "first syllable of the root; suffixes do not attract stress; in compounds the first root keeps the stress and the second root's stress is reduced"
  length: "a stressed vowel may be short or long; length is contrastive only under stress; an unstressed vowel is always short"
  minimal_pairs: ["no delivered minimal pair contrasts length; length is a design contrast declared here for 04 to use, and a later round that delivers a length pair must record it (to-verify)", "the stress position itself is not contrastive: it is fixed by rule, so no stress minimal pair exists by construction"]
  contrast_witnesses: ["onset voicing: pa vs ba (W-01)", "nasal place: ma vs na (W-04)", "liquid: ra vs la (W-05)"]
  intonation: "phrase-final fall; a list is chanted on a level contour; no lexical pitch"
  axis: fire
  evidence: design-choice
  follows: [F-5]

allophony:
  - id: AL-1
    rule: "n → ŋ / _ k"
    family: place-assimilation
    output_status: "allophone [ŋ], not a phoneme"
    trigger_witness: "derived only: /n/ in a compound seam before k would surface [ŋ], e.g. a k-initial base after an n-final root; no delivered lexeme uses this seam"
    blocked_witness: "an /n/ before a vowel keeps [n]: nes, nun"
    drift_origin: "velar assimilation in the furnace compounds, where n-final roots meet k-initial roots"
    axis: fire
    evidence: design-choice
    follows: [F-4]
  - id: AL-2
    rule: "n → ŋ / _ g"
    family: place-assimilation
    output_status: "allophone [ŋ], not a phoneme"
    trigger_witness: "derived only: a name in -ga; no delivered lexeme has n before g"
    blocked_witness: "an /n/ before a vowel keeps [n]: nes, nun"
    drift_origin: "same compound pressure as AL-1, voiced series"
    axis: fire
    evidence: design-choice
    follows: [F-4]
  - id: AL-3
    rule: "s → z / V _ V"
    family: voicing
    output_status: "allophone [z], not a phoneme"
    trigger_witness: "derived only: /s/ between vowels in a compound seam, e.g. mes + -ar surfaces [mezar]; the delivered spelling keeps s"
    blocked_witness: "word-initial and word-final /s/ stay [s]: sal, nes"
    drift_origin: "intervocalic voicing, the same drift that voiced E0 stops (SC-1)"
    axis: mark
    evidence: design-choice
    follows: [F-4]
  - id: AL-4
    rule: "t → ts / _ i"
    family: fronting
    output_status: "allophone [ts], not a phoneme"
    trigger_witness: "derived only: the agent suffix -ir after a t-final base surfaces [tsir]; no delivered lexeme has t before i"
    blocked_witness: "/t/ before other vowels stays [t]: tat, tum"
    drift_origin: "fronting before high front vowels, shared with AL-5 and AL-6"
    axis: mark
    evidence: design-choice
    follows: [F-4]
  - id: AL-5
    rule: "k → c / _ i"
    family: fronting
    output_status: "allophone [c], not a phoneme"
    trigger_witness: "derived only: kal + -ir surfaces [kalcir]; no delivered lexeme has k before i"
    blocked_witness: "/k/ before other vowels stays [k]: kal, ker"
    drift_origin: "fronting before high front vowels"
    axis: fire
    evidence: design-choice
    follows: [F-4]
  - id: AL-6
    rule: "h → ç / _ i"
    family: fronting
    output_status: "allophone [ç], not a phoneme"
    trigger_witness: "derived only: hai + -ir surfaces [haçir]; no delivered lexeme has h before i"
    blocked_witness: "/h/ before other vowels stays [h]: hai, hum"
    drift_origin: "fronting before high front vowels"
    axis: fire
    evidence: design-choice
    follows: [F-4]

sound_changes:
  - id: SC-1
    order: 1
    stage: "E0 → E1"
    rule: "*p → b / V _ V"
    statement: "E0 intervocalic *p voiced to b by the E1 stage; E1 and E2 forms carry b in that position"
    witness: "E0 *sapa (a worked reconstruction, not a delivered form) → E1/E2 saba-shaped; no delivered lexeme keeps intervocalic p, and none needs the change to be derived from a live form"
    ordering_note: "feeds nothing and bleeds nothing; it is listed first because the voicing drift also licenses AL-3"
    axis: fire
    evidence: design-choice
    follows: [F-7]
  - id: SC-2
    order: 2
    stage: "E1 → E2"
    rule: "*h → ∅ / V _ V with lengthening of the first vowel"
    statement: "E1 intervocalic *h was lost by the E2 stage, leaving a long vowel (VhV → VV); E2 forms therefore have no intervocalic h, and their long vowels descend from the loss"
    witness: "E1 *kaha (worked reconstruction) → E2 kaa-shaped; the delivered lexeme kal 'hearth' descends from a different E1 form and is not affected"
    ordering_note: "counter-feeds nothing; the two changes never share an input"
    axis: mark
    evidence: design-choice
    follows: [F-7]

loan_adaptation:
  - id: LA-1
    layer_ref: "Salt-road trade layer"
    filter: "aspirate deaspiration: donor sh → s, kh → k, gh → g; final-vowel truncation is not applied (the donor forms are CVC)"
    stress: "root-initial stress is assigned on entry; the donor's own accent is not modelled"
    witness: "shal → sal; khar → kar; ghul → gul; resh → res (see 04-lexicon LA- rows)"
    axis: mark
    evidence: design-choice
    follows: [F-8]
  - id: LA-2
    layer_ref: "North-road kin layer"
    filter: "vowel lowering: the sister variety keeps *o where D4 has a; the donor o lowers to a on entry (a recipient-side filter, not a shared sound law)"
    stress: "root-initial stress is assigned on entry"
    witness: "gol → gal; mor → mar (see 04-lexicon L-53/L-54)"
    axis: fire
    evidence: design-choice
    follows: [F-8]

writing_interface:
  id: WI-01
  must_encode: ["the five vowels", "length on the stressed vowel", "the 14 consonants", "root boundaries in compounds (a seam mark or a space convention)", "no tone (nothing to encode)"]
  must_not_encode: ["letter IDs or an alphabet-first premise (D1B-04)", "case (the script is unicameral)", "pitch movement (D2's pitch accent is not imported)"]
  seam_rule: "the script's length notation is fixed by 03-orthography against STR-01; the sign inventory derives from 02's segment inventory, not from any donor script"
  axis: mark
  evidence: design-choice
  follows: [F-9, "corpus/knowledge/linguistics/writing-systems.md §6"]

environment_analysis:
  - {id: ENV-1, claim: "ejectives and altitude", status: declined-as-warrant, note: "contested seed; no ejective is admitted and no altitude warrant is used"}
  - {id: ENV-2, claim: "tone and dry climate", status: declined-as-warrant, note: "D4 has no tone; climate is not offered as a cause"}
  - {id: ENV-3, claim: "diet and labiodentals", status: declined-as-warrant, note: "no labiodental is admitted; diet is not offered as a cause"}
  - {id: ENV-4, claim: "sonority and temperature", status: declined-as-warrant, note: "not used"}

witnesses:
  - {id: W-01, pair: ["pa", "ba"], kind: "onset voicing contrast witness (syllables, not lexemes)", axis: mark, evidence: design-choice}
  - {id: W-02, pair: ["ta", "da"], kind: "onset voicing contrast witness", axis: mark, evidence: design-choice}
  - {id: W-03, pair: ["ka", "ga"], kind: "onset voicing contrast witness", axis: fire, evidence: design-choice}
  - {id: W-04, pair: ["ma", "na"], kind: "nasal place contrast witness", axis: fire, evidence: design-choice}
  - {id: W-05, pair: ["ra", "la"], kind: "liquid contrast witness", axis: mark, evidence: design-choice}
  - {id: W-06, pair: ["sal", "saal"], kind: "length notation witness: both strings are legal by the template; saal is not a delivered lexeme, and the pair fixes the double-vowel notation for length", axis: mark, evidence: design-choice}
  - {id: W-07, pair: ["nes", "nesk"], kind: "coda witness: the second form is illegal (sk cluster) and is shown to fix the coda rule", axis: fire, evidence: design-choice}

gate_run:
  id: GR-01
  gate: "tools/gates/phonology-sanity-gate.py"
  input: "the assembled packet.d4.yml"
  expected: "no FAIL; REVIEW findings, if any, are retained and reported, never suppressed"
  notes: "the gate reads phonology.consonants, vowels, phonotactics, coda, onset_clusters, tones, accent, notable_rules; the template (C)V(V)(C) parses as onset 1 / nucleus 2 / coda 1 and is not flagged as complex"
  axis: mark
  evidence: design-choice

cross_refs:
  - {id: XR-01, to: "04-lexicon", need: "all delivered forms respect PHON-01, STR-01 and the two sound changes; loan forms respect LA-1/LA-2"}
  - {id: XR-02, to: "03-orthography", need: "the sign inventory and length notation derive from this component's inventory and STR-01"}
  - {id: XR-03, to: "05-naming", need: "names are built only from delivered bases and the template; the naming gate's profile is this component's phonology block"}
  - {id: XR-04, to: "09-costumes", need: "the six unresolved garment form slots (LEX-GAR-01..06) stay unfilled; when a later round fills them, the forms must satisfy this component"}

open_questions:
  - {id: OQ-P1, text: "The northern sister variety's inventory is asserted only through donor forms; its own phonology is unmodelled (to-verify)."}
  - {id: OQ-P2, text: "Whether E0 had any consonant that E2 lost beyond the two changes is left open; no E0 lexeme is delivered to test it (to-verify)."}

calibration:
  - {id: CAL-P1, status: design-choice, note: "inventory size and template are design choices calibrated to the corpus's bands, not measurements"}
  - {id: CAL-P2, status: to-verify, note: "the two reconstructed E0/E1 witnesses (*sapa, *kaha) are internal reconstructions of this drill, not attested forms"}

canon_boundary: |
  This component designs a system and cites its corpus bases; it records nothing
  about any world. Canon, adoption, and in-world example sentences are
  lore-shokunin's. No sibling component was edited; sibling content is referenced
  only by contract field path and by unresolved-ID markers. No real-world
  language clearance or rights question is decided or implied here.
